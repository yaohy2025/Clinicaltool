otes":["适当的抗生素和支持治疗已使新生儿期后细菌性脑膜炎死亡率降至10%以下；肺炎球菌性脑膜炎死亡率最高","10-20%的患者出现严重神经发育后遗症，多达50%存在神经系统后遗症","感音神经性听力损失是最常见后遗症：肺炎球菌性脑膜炎约30%、脑膜炎球菌约10%、Hib 5-20%","其他后遗症：认知障碍、反复癫痫发作、语言习得延迟、视力障碍、行为问题","预后不良因素：6个月以下婴儿、脑脊液大量细菌、治疗开始后超过4天才出现癫痫发作、就诊时昏迷或局部神经症状","发热通常在治疗开始后5-7天消退；持续>10天提示并发病毒感染、继发细菌感染、血栓性静脉炎或药物反应","SIADH可致低钠血症和血清渗透压降低，加重脑水肿或诱发低钠血症性癫痫发作","硬膜下积液见于10-30%患者（85-90%无症状），婴儿尤为常见","头孢曲松可致可逆性胆囊假性结石（常无症状，可伴呕吐和右上腹痛）"],"emergency":["暴发型脑膜炎球菌血症：休克、紫癜、DIC、意识下降，24小时内进展为昏迷/死亡，需紧急复苏和抗菌治疗","发热+脑膜刺激征或颅内压增高表现（视乳头水肿、局灶体征、昏迷）需紧急评估并尽早开始抗菌治疗，不可因CT延迟用药","严重心肺衰竭、需紧急复苏者暂缓腰穿，先稳定生命体征并经验性抗生素","腰穿后脑脊液提示细菌性脑膜炎或高度疑似者应住院静脉抗菌治疗","脑疝征象（去皮质/去大脑姿势、昏迷、瞳孔异常）需紧急处理颅内压","局部神经症状、视乳头水肿或颅内压升高者：先抗生素并治疗颅内压，再行CT及腰椎穿刺"],"pinyin":"jxxjxnmy"},{"name":"热性惊厥","category":"儿科-神经","summary":"热性惊厥指发生于6-60个月龄、体温≥38℃时的癫痫发作，非中枢神经系统感染或代谢失衡所致，且无热性惊厥史；简单型为原发性全身性强直-阵挛发作、≤15分钟、24小时内不复发。2%-5%神经功能正常的儿童至少发生一次，简单型不增加死亡风险、无长期不良影响。治疗上一般不推荐持续或间歇抗癫痫治疗，发作>5分钟时予劳拉西泮、咪达唑仑或地西泮急性止惊。","symptoms":["发生于6-60个月龄（高峰12-18个月），体温≥38℃（100.4°F）时发作","简单型：原发性全身性强直-阵挛发作，持续≤15分钟，24小时内不复发，发作后数分钟内恢复正常","复杂型：持续>15分钟，或表现为局灶性发作，或24小时内复发","热性癫痫持续状态：持续时间超过30分钟","常发生于中耳炎、玫瑰疹、人类疱疹病毒6型感染等背景，诺如病毒、肠道病毒、志贺菌感染也可诱发","发作前常有发热数小时；部分患儿24小时内复发，低钠血症增加复发风险"],"diagnosis":["每个患儿均需详细病史记录及全面的全身和神经系统检查","6个月以下发热抽搐且病情未好转、或任何年龄有脑膜炎相关临床征象者，应行腰椎穿刺","6-12个月未接种b型流感嗜血杆菌和肺炎链球菌疫苗或免疫状况不明者，以及已接受过抗生素治疗者，可行腰椎穿刺","首次简单热性惊厥不推荐常规血液检查（电解质、钙、磷、镁、全血细胞计数）；应首先测血糖，发作后持续意识不清或摄入不足时再进一步检查","首次简单热性惊厥不建议CT或MRI评估；复杂型需个体化处理，可包括脑电图和神经影像，尤其存在神经系统异常时","复发风险因素：年龄<1岁、发热<24小时、发热38-39℃；次要因素包括热性惊厥或癫痫家族史、复杂型、入托、男性、血钠偏低","与热性惊厥相关基因：SCN1A、SCN1B、SCN9A、CPA6；促炎/抗炎细胞因子失衡与发热性惊厥持续状态相关"],"infusion":[],"oral_medication":["家庭急救（发作>5分钟）：地西泮（直肠）或颊部/鼻内咪达唑仑、地西泮","频繁热性惊厥时发热期间间歇用药：口服氯硝西泮（每8-12小时0.01mg/kg，最大1.5mg/天）或口服地西泮（每8小时0.33mg/kg）","解热药可减轻不适，但不能降低热性惊厥复发风险","缺铁与热性惊厥风险增加有关，应筛查并治疗缺铁"],"treatment":["对一次或多次简单热性惊厥，一般不建议持续性或间歇性抗癫痫治疗","惊厥持续超过5分钟，需使用劳拉西泮、咪达唑仑或地西泮急性治疗","历史上曾用苯巴比妥或丙戊酸持续预防，但因副作用风险及缺乏长期疗效证明，绝大多数情况下不值得采用","向家长说明复发风险及日后癫痫风险，教授急性发作急救方法，并提供情感支持","对未来癫痫高风险儿童可考虑长期抗癫痫治疗，但无论是否用药，将来患癫痫的可能性均不改变","大多数简单型热性惊厥患儿（低风险）无需治疗或进一步检查；高风险者考虑脑电图、影像及间歇口服地西泮"],"management":["家长教育：告知热性惊厥定义、临床诊断依据、复发风险及儿童长期护理建议","家长应避免与孩子同睡（有害且不能预防热性惊厥）","指导家长掌握急性发作急救方法及发热管理","解热药仅用于减轻不适，明确其不降低复发风险"],"notes":["简单热性惊厥不增加死亡风险；复杂型热性惊厥可能使未来2年长期死亡率增加约两倍（多因并存病理状况）","单次或多次简单热性惊厥无长期不良影响","约30%首次发作会复发，两次以上发作后升至50%，1岁以下首次发作复发率50%","热性惊厥后发展为癫痫：简单型约1%，复发型约4%，复杂型（>15分钟或24小时内复发）约6%，局灶复杂型约29%，神经发育异常者约33%","疫苗后持续热性惊厥伴脑病被疑为疫苗性脑病者，大多实际携带Dravet综合征致病基因变异（SCN1A约占80%）","低钠血症与24小时内热性惊厥复发风险增加相关","约10%发热性惊厥持续状态患儿急性期出现海马单侧或双侧肿胀，其中约71%远期出现海马萎缩"],"emergency":["惊厥持续时间超过5分钟：需使用劳拉西泮、咪达唑仑或地西泮急性处理，并建议家庭备用急救药物","热性癫痫持续状态（>30分钟）需急诊处理","6个月以下发热+抽搐且病情未好转，或任何年龄出现脑膜炎相关临床表现的儿童，应及时腰椎穿刺排除脑膜炎","发作后持续意识不清或摄入不足者，检查血糖并进一步评估"],"pinyin":"rxjj"},{"name":"脑性瘫痪","category":"儿科-神经","summary":"一组导致身体运动功能受损的永久性运动障碍，由胎儿或婴儿大脑发育过程中的非进行性障碍引起，影响肌肉张力、姿势和运动，是最常见的儿童神经运动障碍。","symptoms":["痉挛型占80%：肌张力增高、腱反射活跃、踝阵挛、巴宾斯基征、足尖行走","痉挛性偏瘫：一侧自发运动减少、手部操作困难、环行步态、肢体缩短及肌肉体积减少","痉挛性双瘫：双腿痉挛重于双臂，爬行时双腿拖后，行走延迟、马蹄足、剪刀状姿势","痉挛性四肢瘫：最严重形式，所有肢体运动障碍，常伴智力障碍、癫痫、沟通和视力障碍、进食困难","锥体外系型占20%：肌张力障碍/舞蹈手足徐动症（运动障碍型15%）及共济失调型（5%）","常见合并症：智力障碍、焦虑、抑郁、ADHD、慢性疼痛、睡眠困难、便秘、言语/沟通障碍、听力损失"],"diagnosis":["临床诊断，基于病史、体格检查及神经影像学等辅助检查结果","关注围产期或产后脑损伤史、发育轨迹（持续、停滞还是退化）以排除进行性病变","脑部MRI明确结构性病变位置及程度，怀疑脊髓病变时行脊髓MRI","听力与视力功能测试","无围产期危险因素、临床表现不符合脑瘫特征或足月儿应行遗传评估（如全基因组测序、代谢筛查）"],"infusion":[],"oral_medication":["巴氯芬（常用抗痉挛药）","替扎尼定、丹曲林、苯二氮卓类（其他抗痉挛药）","可乐定、加巴喷丁（二线，可兼治睡眠障碍、自主神经功能障碍、疼痛及神经易激性）","三己基苯胺（肌张力障碍）","左旋多巴（肌张力障碍）","泰巴那嗪（舞蹈病或手足徐动症等过度运动障碍）"],"treatment":["多学科、以患者为中心的框架：物理医学与康复、骨科、神经病学、神经外科、物理/言语治疗、教育等多团队协作","药物治疗：全身用药针对广泛痉挛和运动障碍，定向注射（肉毒杆菌毒素A、苯酚、乙醇）用于局部或节段性痉挛/肌张力障碍，每4-6个月重复注射","神经外科：鞘内巴氯芬治疗、选择性背侧根切断术（GMFCS I-III级且选择性运动控制良好者改善步态）、深部脑刺激（难治性肌张力障碍）","骨科干预：肌肉挛缩、长骨扭转、髋关节移位及脊柱畸形处理；6岁前以预防挛缩为主，扭转矫正骨切开术宜在6-12岁间进行","早期诊断有助于及时提供适当治疗护理并为家属提供明确诊断信息"],"management":["康复策略：矫形器、石膏固定、物理治疗","适应性设备：支架、轮椅、助行器可改善行动能力","家长应学习在日常活动中（喂养、携带、穿衣、洗澡、玩耍）与孩子合作以减少异常肌张力影响","监测和预防髋关节移位及神经肌肉脊柱侧弯（可随年龄增长恶化）"],"notes":["诊断应基于临床表现而非病因；约30%病例无明确围产期病因，约30%存在染色体拷贝数变异或单基因疾病","痉挛性四肢瘫因核上性延髓麻痹常致吞咽困难，可导致吸入性肺炎和生长迟缓","出现进行性肌张力障碍、昼夜节律波动或已获运动能力丧失时应重新评估脑瘫诊断","治疗目标除运动功能外还需关注生活质量、舒适度及社会污名化问题"],"emergency":[],"pinyin":"naoxingtanhuan"},{"name":"脑炎（病毒性脑膜脑炎）","category":"儿科-神经","summary":"涉及脑膜和/或脑实质组织的急性炎症过程，常见病因包括肠道病毒、虫媒病毒（西尼罗河病毒、日本脑炎病毒）、疱疹病毒（单纯疱疹病毒1型为严重散发性脑炎重要病因）等，预后因病原体而异。","symptoms":["急骤起病，中枢神经系统症状出现前常有数天非特异性发热","头痛（额部或全身性）、球后疼痛、恶心、呕吐、畏光，颈部、背部和腿部疼痛","婴儿表现为易怒和嗜睡，较大儿童以头痛和感觉过敏为主","发热时出现意识状态改变，可发展为脑病，伴无法控制的身体运动和癫痫发作","局部神经功能缺损可持续、波动或转移","皮疹可在中枢神经系统症状前后出现（肠道病毒、水痘-带状疱疹病毒、麻疹、风疹、西尼罗河病毒）","西尼罗河病毒及肠道病毒D68等可致前角细胞损伤和急性弛缓性麻痹"],"diagnosis":["脑脊液检查：白细胞增多（通常低于1000/mm³），初期可多形核细胞，后期以单核细胞为主；蛋白质升高，葡萄糖多正常","PCR检测脑脊液及血液中病原体；虫媒病毒首选血清学检测（血液及脑脊液），必要时2-3周后重复，滴度升高四倍提示感染","脑电图常示弥漫性慢波活动，HSV感染可见颞叶局部变化","脑MRI：颞叶受累提示HSV-1感染，T2及FLAIR可见高信号病变","少数中心提供脑脊液宏基因组测序；需与细菌性脑膜炎、脑脓肿、自身免疫性脑炎等鉴别"],"infusion":["阿昔洛韦（HSV相关脑膜脑炎可显著降低发病率和死亡率）","更昔洛韦、西多福韦、福西卡宁（对疱疹病毒家族疗效各异）","静脉输液（因患者难以经口摄入水分）","怀疑感染后或自身免疫性病因时可行静脉注射免疫球蛋白"],"oral_medication":[],"treatment":["大多数病毒性脑膜脑炎病因无特效抗病毒药，治疗以支持性护理为主","非甾体抗炎药常用于缓解头痛","疱疹病毒家族感染使用抗病毒药物（阿昔洛韦等）","病原体不明且怀疑感染后或自身免疫性病因时，有时需类固醇、静脉注射免疫球蛋白和血浆置换联合治疗"],"management":["严重脑炎患者需密切监测癫痫发作、脑水肿、体液和电解质平衡失调、吸入性肺炎、呼吸衰竭及心脏骤停等并发症","急性期恢复后行支持性和康复性治疗","康复患儿应定期进行神经学、发育学和听觉评估","预防：脊髓灰质炎、麻疹、腮腺炎、风疹、水痘疫苗；控制蚊虫等传播媒介、使用驱虫剂"],"notes":["单纯疱疹病毒1型未抗病毒治疗时70%病例进展为昏迷甚至死亡","预后取决于疾病严重程度、具体病原体及患儿年龄；孩子病情严重且脑实质受累明显者预后较差","多数患儿在确诊多年后仍存在持续症状（可能因诊断不准确及多数病毒缺乏有效治疗）","后遗症可包括运动不协调、癫痫发作、听力丧失、行为障碍、视觉障碍","高达63%的病例即使广泛检测仍无法识别具体病原体"],"emergency":["严重脑炎需监测并处理：癫痫发作（难治性）、脑水肿、呼吸衰竭、心脏骤停","未治疗的HSV脑炎可迅速发展为昏迷甚至死亡"],"pinyin":"naoyan（bingduxingnaomonaoyan）"},{"name":"脑积水","category":"儿科-神经","summary":"并非一种特定疾病，而是一组由脑脊液循环和/或吸收障碍引起的多种病症，分为梗阻性（非交通性）和交通性（非梗阻性）两大类，极少数由脉络丛乳头状瘤致脑脊液分泌过多引起。","symptoms":["婴儿期最明显症状为头部快速增大，前囟门扩大且隆起、头皮静脉扩张、额部变宽","眼睛向下偏移（日落眼征）","长束征、腱反射亢进、痉挛性运动、阵挛（尤其下肢）、巴宾斯基征","易怒、嗜睡、食欲不振、呕吐；头痛为较大儿童主要症状","叩击颅骨可闻及锅裂声或马塞文征（提示颅缝分离）","视乳头水肿、外展神经麻痹及锥体束征常见（下肢最明显）","性格逐渐变化及学业能力下降提示缓慢进展型脑积水"],"diagnosis":["病史：家族性病例提示X连锁或常染色体性脑积水，询问早产史、颅内出血、脑膜炎或腮腺炎性脑炎史","体格检查：定期测量并对比枕额部头围、检查前囟大小形状、眼底检查、颅骨透照、背部中线皮肤病变（毛发丛、脂肪瘤、血管瘤）","超声检查适用于囟门开放的婴儿，用于识别并监测脑积水进展","脑部MRI可评估脑脊液流动情况及病因；CT仅用于评估急性症状性脑积水以避免辐射","鉴别脑室扩大（脑萎缩伴脑室扩张）与真性脑积水需结合临床背景、眼底、腰椎穿刺及压力测量"],"infusion":[],"oral_medication":[],"treatment":["大多数脑积水病例需颅外分流术，尤其是脑室腹腔分流术","内窥镜第三脑室造口术：适用于年龄超过6个月的非交通性脑积水患者，常同时行脉络丛烧灼，可避免脑室分流","药物（乙酰唑胺和呋塞米）仅暂时降低脑脊液产生速率，长期效果不理想","胎儿脑积水宫内手术治疗效果较差（脑部畸形发生率高），伴胎儿脑膜脊髓瘤者有所改善"],"management":["定期测量头围并注意其增长速度，以识别脑积水并监测病情恢复","脑积水儿童需在多学科环境中进行长期随访","监测分流术并发症（阻塞：头痛、视乳头水肿、呕吐、精神状态改变；感染：发热、头痛、脑膜刺激征，常由表皮葡萄球菌引起）"],"notes":["预后取决于心室扩张的原因而非手术时皮质层大小","脑积水患儿平均智商低于普通人群，语言能力尤甚，多有记忆功能异常","常见视力问题：斜视、视空间障碍、视野缺陷及颅内压升高所致视力减退","分流性脑积水或脊髓脊膜膨出患儿可出现青春期加速发育（可能与颅内压升高致促性腺激素分泌增加有关）","通过严格术前准备，分流术感染率可降至5%以下"],"emergency":["分流术阻塞或感染需紧急评估处理（阻塞：头痛、视乳头水肿、呕吐、精神状态改变；感染：发热、头痛、脑膜刺激征）"],"pinyin":"naojishui"},{"name":"IgA肾病","category":"儿科-肾脏","summary":"IgA肾病是儿童中最常见的慢性肾小球疾病，特征是肾小球系膜区存在以IgA为主的沉积物，且无全身性疾病，诊断需肾活检。儿童期临床表现通常比成人温和，是美国和欧洲儿童最常见表现为感染后1-2天出现的肉眼血尿。","symptoms":["肉眼血尿，通常在上呼吸道或胃肠道感染发生后1-2天内出现（与急性感染后肾小球肾炎的较长潜伏期不同）","显微镜下血尿和/或蛋白尿","急性肾炎综合征、肾病综合征或肾炎-肾病综合征的综合表现","肉眼血尿发作可伴腹部疼痛","轻度至中度高血压常见，但很少引发高血压急症","无症状显微镜下血尿患者的蛋白尿通常低于1000 mg/24小时"],"diagnosis":["肾活检确认诊断并了解组织学严重程度（系膜区颗粒状IgA沉积，常伴C3补体成分）","血清C3水平正常（有助于与感染后肾小球肾炎鉴别）","血清IgA水平诊断价值有限（仅约50%儿童升高）","监测血压、尿常规、肾功能、蛋白尿水平"],"infusion":[],"oral_medication":["血管紧张素转换酶抑制剂（ACEI）","血管紧张素II受体拮抗剂（ARB）","皮质类固醇（肾素-血管紧张素系统阻断无效且严重蛋白尿持续时；GFR>60 mL/min/m2时减少蛋白尿并改善肾功能）","富含欧米伽-3多不饱和脂肪酸的鱼油（可能降低成人疾病进展速度）","靶向释放型布德森奈德（FDA批准用于减少成年IgA肾病患者的蛋白尿）"],"treatment":["主要治疗为控制适当血压和管理严重蛋白尿","ACEI和ARB单独或联合使用，有效减少蛋白尿并减缓疾病进展","肾素-血管紧张素系统阻断无效且严重蛋白尿持续时建议皮质类固醇免疫抑制治疗","环磷酰胺或硫唑嘌呤的额外免疫抑制治疗似乎并不有效","无严重扁桃体炎时不建议扁桃体切除术","IgA肾病患者可能成功接受肾脏移植（复发较常见，但同种异体移植失败仅15-30%）"],"management":["需要长期密切监测（大多数儿童直到成年期才出现进行性肾功能障碍）","监测血压、肾功能、蛋白尿变化","关注预后不良指标：持续高血压、肾功能下降、显著且持续增加的蛋白尿"],"notes":["发病15-20年后20-30%的成人患者出现进行性疾病进展","是儿童时期导致终末期肾功能衰竭的不常见原因","更严重预后与弥漫性系膜细胞增生、广泛新月体形成、肾小球硬化、弥漫性肾小管间质改变有关"],"emergency":[],"pinyin":"igashenbing"},{"name":"急性肾损伤","category":"儿科-肾脏","summary":"急性肾损伤（AKI）是肾脏功能的突然丧失，导致肾小球滤过率迅速下降、尿素氮和肌酐等废物物质积累，以及细胞外液量和电解质平衡的失调。涵盖从血清肌酐轻微升高到完全无尿性肾衰竭的各种肾功能障碍，住院患儿中发病率5-10%，重症婴儿和儿童中超过25%。","symptoms":["少尿或无尿","肾前性表现：心动过速、黏膜干燥、外周灌注不良（血容量不足）","内在性表现：高血压、外周水肿、哮鸣音、心脏杂音（容量过载）","皮疹和关节炎（SLE或IgA血管炎性肾炎可能）","贫血、低钠血症、代谢性酸中毒","神经系统症状：头痛、癫痫发作、嗜睡、意识混乱（脑病）","胃肠道出血（尿毒症性血小板功能障碍所致）"],"diagnosis":["KDIGO标准：48小时内血清肌酐较基线升高≥0.3 mg/dL，或7天内升至基线的≥1.5倍，或尿量≤0.5 mL/kg·h持续6小时","尿液指标鉴别肾前性（尿比重>1.020、尿渗透压>500 mOsm/kg、尿钠<20 mEq/L、钠排泄分数<1%）与内在性（尿比重<1.010、尿渗透压<350 mOsm/kg、尿钠>40 mEq/L、钠排泄分数>2%）","尿沉渣：红细胞及红细胞管型提示肾小球疾病；白细胞及白细胞管型提示肾小管间质疾病","血尿、蛋白尿提示内源性肾损伤","肾脏超声：肾积水或输尿管积水提示梗阻；肾肿大提示内在性疾病","胸部X线：心脏肥大、肺部充血或胸腔积液","无明确前肾性或后肾性原因时可能需肾活检","血清C3降低、针对链球菌/核抗原/中性粒细胞胞质/肾小球基底膜抗体检测有助于病因诊断"],"infusion":["无容量过载或心衰时静脉注射等渗生理盐水20 mL/kg，持续30分钟","呋塞米2-4 mg/kg静脉注射（循环容量充足后使用）","布美他尼0.1 mg/kg作为呋塞米替代","多巴胺2-3 μg/kg/min联合利尿剂（无对照数据支持）","严重高钾血症（>7 mEq/L）：葡萄糖酸钙10%溶液100 mg/kg（日最大3000 mg）、碳酸氢钠1-2 mEq/kg、正规胰岛素0.1单位/kg+50%葡萄糖1 mL/kg","高血压急症持续输注：尼卡地平0.5-5.0 μg/kg/min、硝普钠0.5-10.0 μg/kg/min、拉贝洛尔0.25-3.0 mg/kg/h或艾司洛尔150-300 μg/kg/min","血红蛋白低于7 g/dL时缓慢输注浓缩红细胞10 mL/kg持续4-6小时（严重容量过载/高钾时在透析或超滤过程中输血最安全）","静脉必需氨基酸营养支持（病情严重者）"],"oral_medication":["聚苯乙烯磺酸钠树脂（Kayexalate）1 g/kg口服或保留灌肠（高钾血症，每2小时可重复）","口服碳酸氢钠（血清钙磷恢复正常后纠正酸中毒）","磷酸盐结合剂：司维拉姆、碳酸钙、醋酸钙（铝基结合剂应避免使用）","伊西拉普利0.05-0.15 mg/kg（快速降压，日4次最大5 mg）","长效口服降压药：氨氯地平0.1-0.6 mg/kg/日，或拉贝洛尔4-40 mg/kg/24小时分2-3次","H2受体阻滞剂如雷尼替丁（预防胃肠道出血）"],"treatment":["先确定血容量状况，血容量恢复后低血容量患者通常2小时内排尿","利尿剂仅在确认循环容量充足后考虑使用，无效时应停用","液体限制：初始400 mL/m2/24h（不显性失水）加上当天尿量","高钾血症处理：停用外源性钾来源，树脂治疗，必要时紧急措施及透析","严重酸中毒（动脉pH<7.15或碳酸氢盐<8 mEq/L）需静脉部分纠正","低钙血症主要通过降低血清磷治疗；低磷饮食","限制钠、钾、磷摄入，适度减少蛋白质并增加热量摄入","透析适应症：无尿/少尿伴液体过载、肺水肿、持续性高钾血症、严重酸中毒药物无效、尿毒症、低钙性抽搐等","透析方式：腹膜透析（新生儿/婴儿）、间歇性血液透析（血流动力学稳定者）、持续肾脏替代治疗（血流动力学不稳、颅内压高、多器官衰竭者）"],"management":["每日监测液体摄入量、尿量和粪便排出量、体重及血清生化指标","限制盐和水摄入，使用利尿剂控制高血压","营养支持：限制钠钾磷，控制蛋白质摄入","长期随访并发症：慢性肾功能不全、高血压、肾小管酸中毒、尿浓缩缺陷"],"notes":["预后完全取决于潜在疾病性质而非肾功能衰竭本身","肾脏局限性疾病（如感染后肾小球肾炎）引起的AKI死亡率非常低（<1%）","多器官衰竭引起的AKI死亡率非常高（>50%）","肾前性原因、急性肾小管坏死、急性间质性肾炎、肿瘤溶解综合征恢复可能性较大","快速进展性肾小球肾炎、双侧肾静脉血栓形成、双侧皮质坏死时肾功能完全恢复不常见","高钾血症最早心电图变化为T波尖峰，随后QRS间期延长、室性心律失常、心脏骤停","使用静脉碳酸氢盐纠正酸中毒可诱发手足搐搦（快速纠正降低离子化钙浓度）"],"emergency":["血清钾>6.0 mEq/L启动降钾；>7.0 mEq/L伴心电图变化需紧急措施（钙剂、碳酸氢钠、胰岛素+葡萄糖）并考虑透析","无尿/少尿伴液体过载、高血压和/或肺水肿且利尿剂无效","持续性高钾血症、严重代谢性酸中毒经药物治疗无效","尿毒症（脑病、心包炎、神经病变）","症状性低钠血症（抽搐、嗜睡）或血清钠低于120 mEq/L时限制性使用高渗3%盐水","疑似后尿道瓣膜等尿路梗阻新生儿应立即放置导尿管引流"],"pinyin":"jixingshensunshang"},{"name":"溶血性尿毒症综合征","category":"儿科-肾脏","summary":"溶血性尿毒症综合征（HUS）是幼儿社区获得性急性肾损伤的常见原因，也是儿童中血栓性微血管病最常见的形式，以微血管性溶血性贫血、血小板减少症和肾功能不全三联征为特征。最常见的类型是由产志贺毒素大肠杆菌（STEC）引起的腹泻相关HUS，约占儿童HUS病例的90%。","symptoms":["前驱期：发热、呕吐、腹痛、腹泻，多在感染后5-7天出现，腹泻常伴血便","前驱期后突然出现面色苍白、虚弱、嗜睡（微血管性溶血性贫血表现）","少尿或无尿，可表现为严重脱水或液体过载","中枢神经系统受累：易怒、嗜睡、非特异性脑病；严重者（≤20%）癫痫发作、严重脑病","高血压、容量过载、严重贫血，可共同导致心力衰竭","肺炎球菌相关HUS：起病时伴严重肺炎、脓胸、菌血症","肠道并发症：炎症性结肠炎、缺血性肠炎、肠穿孔、肠套叠、胰腺炎","可出现瘀点，但严重出血罕见"],"diagnosis":["诊断基于微血管性溶血性贫血、红细胞碎片、血小板减少及一定程度的肾脏受累","血小板计数通常介于20,000-100,000/mm3；白细胞计数常明显升高","部分凝血活酶时间及凝血酶原时间通常正常","Coombs试验阴性，但肺炎链球菌引起的HUS通常为阳性","尿液分析显示镜下血尿和低度蛋白尿","粪便培养可阴性（仅约10%感染STEC者发展为HUS，病原体可能已清除）","无腹泻前兆或肺炎球菌感染史者考虑遗传性HUS评估","排除SLE、恶性高血压、双侧肾静脉血栓形成等其他急性肾损伤原因；极少需要肾活检"],"infusion":["静脉补液纠正体液不足；少尿或无尿出现前早期静脉输液可能具有保护肾脏作用","输注红细胞纠正贫血（溶血剧烈且反复发生）","肺炎球菌相关HUS必须输注清洗红细胞去除残留血浆（抗T抗原内源性IgM可加速病情）","通常不应输注血小板（会被活跃凝血过程迅速消耗，理论上加重病情）"],"oral_medication":["依库珠单抗（抗C5抗体，FDA批准用于非典型HUS，用药前建议接种脑膜炎疫苗）","阿奇霉素（E. coli O104:H4感染的成人患者可加快病原清除）","抗生素治疗肺部感染对肺炎球菌相关HUS重要；E. coli O157:H7相关HUS抗生素视为禁忌"],"treatment":["早期识别、监测并发症、细致支持性治疗（精细管理液体和电解质、控制高血压）","严重少尿或无尿伴高钾血症者尽早开始透析治疗","抗凝、抗血小板、纤维蛋白溶解疗法禁忌（增加严重出血风险）","不推荐抗生素清除肠道产毒菌（STEC），可能增加毒素释放加重病情","严重中枢神经系统受累者可采用血浆输注或血浆置换（肺炎球菌相关HUS禁忌）","已知ADAMTS13或因子H缺陷者血浆疗法可能显著有效","依库珠单抗治疗非典型HUS（包括肾移植后HUS）","肾脏活检很少进行，活动期活检风险较高"],"management":["腹泻阳性HUS发作后1年内仍伴高血压、肾功能衰竭或持续尿异常者需密切监测","每年与主治医生复查，警惕后期后遗症","随访慢性肾脏病、蛋白尿、高血压等肾脏相关并发症"],"notes":["通过早期识别和强化支持治疗，腹泻相关HUS死亡率低于5%","急性期多达一半患者需透析治疗，约需2周","存活者中5%仍需依赖透析，高达30%留有不同程度的慢性肾脏病","肺炎链球菌相关HUS：超过80%需透析，死亡率约20%","家族性、遗传性HUS可能隐匿进展或复发，预后较差","白细胞增多、严重前驱肠炎、低钠血症、抗生素使用提示病情较重","多中心汇总分析（3476例，平均随访4.4年）：死亡率和终末期肾病发生率各为12%，肾脏相关并发症平均发生率25%"],"emergency":["快速进展的少尿或无尿性肾衰竭，伴危及生命的高钾血症","容量过载、高血压和严重贫血所致心力衰竭","癫痫发作、严重脑病等严重中枢神经系统受累","肠穿孔、肠套叠等严重肠道并发症","严重高钾血症需紧急处理（必要时透析）"],"pinyin":"rongxuexingniaoduzhengzonghezheng"},{"name":"肾小管酸中毒","category":"儿科-肾脏","summary":"肾小管酸中毒（RTA）是在肾小球滤过率正常或接近正常时出现非阴离子间隙型（高氯性）代谢性酸中毒的一组疾病，主要有四种类型：近端型（II型，碳酸氢盐重吸收障碍）、经典远端型（I型，酸分泌功能受损）、高钾型（IV型）及近端和远端混合型（III型）。缺陷可先天性也可后天获得。","symptoms":["生长障碍/生长迟缓（各类型RTA共同表现）","多尿、多饮、脱水（钠丢失所致）","食欲不振、呕吐、便秘、肌张力低下（pRTA）","佝偻病（原发性Fanconi综合征因磷酸盐丢失）","肾钙沉着症和高钙尿症（dRTA特有表现）","危及生命的严重高钾血症（IV型RTA，尤其1型假低醛固酮血症）","梗阻性尿路疾病患者可突然出现肾盂肾炎症状：发热、呕吐、尿液异味","胱氨酸病：多尿多饮、生长迟缓、佝偻病、畏光、皮肤白皙金发、甲状腺功能减退"],"diagnosis":["确认正常阴离子间隙代谢性酸中毒，识别电解质异常，评估肾功能，排除腹泻等其他碳酸氢盐丢失原因","血液阴离子间隙公式[Na+]−[Cl−+HCO3−]，<12提示无阴离子间隙；>20需排查其他原因","血清钾：高钾性酸中毒提示IV型；正常或低钾提示I型或II型","尿pH：酸中毒时<5.5提示pRTA；dRTA通常>6.0","尿液阴离子间隙（[尿Na+ + 尿K+] − 尿Cl−]）：阳性提示氨生成不足，可能存在dRTA","尿液分析排查糖尿、蛋白尿、血尿（提示更广泛的肾小管损伤）","随机或24小时尿液钙和肌酐测定识别高钙尿症","肾脏超声识别梗阻性尿路疾病、肾结石、肾钙质沉着症","详细病史：生长发育、腹泻史、家族中发育迟缓/终末期肾病/婴儿死亡史"],"infusion":[],"oral_medication":["碳酸氢钠或柠檬酸钠溶液（Bicitra或Shohl溶液）：pRTA通常需大剂量，最高20 mEq/kg/24小时；dRTA基础需求2-4 mEq/kg/24小时","磷酸盐补充剂（Fanconi综合征、pRTA伴佝偻病者）","维生素D（抵消口服磷酸盐治疗引发的继发性甲状旁腺功能亢进）","噻嗪类利尿剂（症状性高钙尿症、肾钙质沉着症或肾结石的dRTA患者，减少尿钙排泄）","钠钾交换树脂：聚苯乙烯磺酸钠或patiromer（IV型RTA高钾血症，长期使用）","胱氨酸病：口服胱胺（终生，将胱氨酸转化为半胱氨酸）、胱胺眼药水、必要时生长激素"],"treatment":["所有类型RTA治疗的主要手段是碳酸氢盐替代疗法","pRTA需要大量碳酸氢盐（最高20 mEq/kg/24小时）","dRTA基础需求通常2-4 mEq/kg/24小时，个体化调整","Fanconi综合征通常需要磷酸盐补充剂","IV型RTA用钠钾交换树脂治疗高钾血症","dRTA伴肾钙质沉着/肾结石者使用噻嗪类利尿剂","补充足量碳酸氢盐可逆转酸中毒并缓解dRTA常见骨溶解和高钙尿症","胱氨酸病：终生胱胺治疗+眼药水，早期治疗可预防或延缓肾功能恶化","肾功能衰竭的胱氨酸病患者肾移植是可行选择"],"management":["维持血清碳酸氢盐在正常范围，改善生长","监测高钙尿症（dRTA患者）","随访基础疾病及并发症"],"notes":["RTA预后很大程度上取决于潜在疾病","单纯pRTA或dRTA在碳酸氢盐正常时生长通常改善","全身性疾病或Fanconi综合征患者可有持续生长障碍、佝偻病","胱氨酸病严重肾性患者不治疗会在十岁前发展为终末期肾脏疾病","治疗可逆转酸中毒并缓解骨溶解和高钙尿症"],"emergency":[],"pinyin":"shenxiaoguansuanzhongdu"},{"name":"儿童急性淋巴细胞白血病","category":"儿科-肿瘤","summary":"急性淋巴细胞白血病（ALL）是儿童最常见的恶性肿瘤，约占儿童白血病77%，由造血细胞遗传异常致克隆性增殖和骨髓衰竭。首个被证实可治愈的弥漫性癌症，现多药化疗后整体5年生存率约90%。","symptoms":["非特异起病：食欲不振、疲劳、不适、易激惹、间歇性低热","骨/关节疼痛（下肢为主、夜间痛醒），可伴关节肿胀","骨髓衰竭表现：苍白、乏力、瘀伤、口腔黏膜出血或鼻出血、感染性发热","器官浸润：淋巴结肿大、肝脾肿大、睾丸增大、中枢神经系统受累（颅神经麻痹、头痛、癫痫）","严重贫血或前纵隔巨大肿块（T-ALL青少年男性多见）致呼吸窘迫","约5%患者发病时即有中枢神经系统受累表现（视乳头水肿、视网膜出血）"],"diagnosis":["骨髓检查确诊：超过25%骨髓细胞为均一淋巴母细胞","流式细胞术分型：B淋巴母细胞约85%、T淋巴母细胞约15%、成熟B细胞（伯基特）约1%","细胞遗传学/分子生物学分型：高二倍体、ETV6-RUNX1预后好；低二倍体、BCR-ABL1、KMT2A重排预后差","脑脊液检查评估中枢神经系统受累（脑脊液见原始细胞且WBC升高提示脑膜白血病）","外周血常见贫血和血小板减少；LDH升高是重要线索","微小残留病（MRD）检测用于风险分层和随访（诱导后第29天MRD>0.01%提示预后差）"],"infusion":["缓解诱导（约4周）：每周长春新碱+皮质类固醇（地塞米松/泼尼松）+一次长效聚乙二醇天冬酰胺酶，高风险加柔红霉素","鞘内化疗（腰椎穿刺给药）用于中枢神经系统预防和巩固期强化","Ph+ ALL在密集化疗中加入伊马替尼（BCR-ABL酪氨酸激酶抑制剂）","复发/难治患者可使用blinatumomab（双特异性T细胞衔接抗体）、CAR-T细胞治疗、酪氨酸激酶抑制剂","肿瘤溶解综合征预防：拉斯布瑞克（重组尿酸氧化酶）每日静脉0.2 mg/kg，最多5天"],"oral_medication":["维持治疗2-3年：每日巯嘌呤+每周口服甲氨蝶呤，偶尔联用长春新碱和皮质类固醇","别嘌醇用于肿瘤溶解综合征预防（高尿酸血症、肾衰竭防治）","化疗期间及结束后数月接受肺孢子菌肺炎预防性治疗"],"treatment":["分层风险治疗：依据年龄、初始白细胞计数、免疫表型、细胞遗传学、早期治疗反应及诱导结束时MRD","标准方案为2-3年多药化疗（诱导-巩固-强化-维持），98%患者诱导期达缓解","鞘内化疗将中枢神经系统复发率降至5%以下（历史复发率高达60%）","少数极高风险患者（化疗失败、极度低二倍体）在首次缓解期接受骨髓移植","青少年按儿科方案并在儿童癌症中心治疗（优于成人方案）"],"management":["支持治疗：中性粒细胞减少性发热立即抗菌治疗，红细胞/血小板输注支持","高白细胞患者开始治疗时重点防治肿瘤溶解综合征：充分水化、监测电解质、别嘌醇/拉斯布瑞克","TPMT基因型检测指导巯嘌呤剂量（酶活性降低者避免严重骨髓抑制）","长期随访需多学科监测慢性疾病（肌肉骨骼、心脏、神经系统）"],"notes":["诱导后MRD高水平提示预后差、复发风险增加，需加强治疗","15-20%患者发生骨髓复发，复发间隔和部位是最重要预后指标","肿瘤溶解综合征（高尿酸、高钾、高磷致肾衰和心律失常）为起始治疗的主要危险","密集治疗带来学业、发展、心理社会及经济负担，急性与长期毒性并存","5年总生存率约90%，但幸存者慢性疾病风险增加"],"emergency":["高白细胞血症起始治疗时警惕肿瘤溶解综合征（肾功能衰竭、心律失常）","中性粒细胞减少发热需立即经验性抗菌治疗以防败血症","前纵隔巨大肿块致气道受压、呼吸窘迫需紧急处理"],"pinyin":"ertongjixinglinbaxibaobaixuebing"},{"name":"儿童淋巴瘤（霍奇金与非霍奇金）","category":"儿科-肿瘤","summary":"淋巴瘤是美国14岁以下儿童第三大常见癌症，是青少年最常见癌症。分霍奇金淋巴瘤（HL，特征性Reed-Sternberg细胞）和非霍奇金淋巴瘤（NHL，儿童多为高级别），以多药化疗±放疗/免疫治疗为主，儿童预后良好。","symptoms":["HL：无痛、无压痛、坚硬橡胶状颈部/锁骨上淋巴结肿大，常伴纵隔受累","B症状：不明原因发热>38°C、6个月内体重下降>10%、夜间大量出汗（HL中具分期意义）","肝脾肿大、气道阻塞（呼吸困难、缺氧、咳嗽）、胸腔/心包积液、骨髓浸润（血细胞减少）","NHL：快速无痛淋巴结增大、胸内受累咳嗽/呼吸困难、腹部肿块/肠梗阻/腹水、鼻塞/扁桃体增大、局部骨痛","NHL常见B症状（发热、体重下降、盗汗），但不具预后意义","NHL可表现为肿瘤急症：上纵隔综合征、脊髓受压致急性截瘫、肿瘤溶解综合征（BL尤甚）"],"diagnosis":["切除淋巴结活检（优于针吸活检），光学显微镜+免疫组化/分子检测（RS细胞、CD30、CD20）","HL分期：病史、体格检查、胸部X线（纵隔肿块大小）、颈胸腹盆CT、PET扫描、全血细胞计数、血沉、血清铁蛋白","骨痛和/或碱性磷酸酶升高者行骨髓穿刺/活检及骨扫描","NHL：流式细胞术检测免疫表型（T/B/null）及细胞遗传学，FISH/PCR检测基因重排（MYC、t(2;5)等）","NHL分期：国际儿童NHL分期系统（IPNHLSS），需腰椎穿刺+脑脊液检查评估中枢神经系统","实验室：全血细胞计数、电解质、LDH、尿酸、钙磷、BUN、肌酐、肝功能"],"infusion":["HL化疗方案：ABVD（多柔比星、博莱霉素、长春碱、达卡巴嗪）或COPP等，按风险调整","HL靶向：布伦妥昔单抗维多汀（抗CD30抗体-药物偶联物）、利妥昔单抗（抗CD20，NLPHL总体缓解率94%）","NHL成熟B细胞：COPAD方案（环磷酰胺、长春新碱、泼尼松、多柔比星）联合利妥昔单抗，晚期4-6个月疗程","NHL中枢预防：鞘内化疗；可用高剂量甲氨蝶呤替代（ALCL）","ALCL靶向：布伦妥昔单抗、克唑替尼（口服ALK抑制剂）","复发NHL：再化疗+异体或自体干细胞移植；CAR-T细胞治疗（Tisagenlecleucel）","肿瘤溶解预防：拉斯布瑞克每日静脉0.2 mg/kg，最多5天（G6PD缺乏者禁用）"],"oral_medication":["别嘌醇（肿瘤溶解综合征预防）：每日口服10 mg/kg，分三次服用","复发ALCL可长期低剂量长春碱类化疗","克唑替尼（ALK抑制剂）用于复发性ALCL"],"treatment":["HL：风险调整联合化疗，可选择性低剂量局部放疗；完全缓解率70-80%（晚期）","HL早期患者无病生存率85-90%、5年总生存率>95%；晚期略低（80-85%/90%）","NHL以多药系统性化疗±免疫治疗（利妥昔单抗）为主，手术主要用于诊断","局部NHL完全切除者短程化疗（如两周期COPAD）即可，4年无病生存率99%","放射治疗仅用于特殊情形：LBL中枢受累、急性上纵隔综合征或截瘫","复发性NHL：再化疗±异体/自体干细胞移植；ALCL可单用低剂量化疗方案","NHL新药：奥比努妥单抗、伊布替尼、艾德利萨比及CAR-T细胞在研究中"],"management":["新诊断BL/LBL患者肿瘤溶解风险高：充分水化、频繁监测电解质，使用黄嘌呤氧化酶抑制剂或拉斯布瑞克","治疗期支持：处理黏膜炎、感染、红细胞和血小板输注、电解质失衡和营养不良","长期随访监测生长迟缓、心脏毒性、性腺毒性（不孕）及继发性恶性肿瘤","HL治疗反应评估采用PET Deauville 5分量表，早期PET指导降级治疗"],"notes":["超过70%的NHL患儿诊断时已为晚期（III/IV期）","局部NHL生存率90-100%，晚期80-95%","EBV感染使HL风险增加4倍，HL组织中可检测到EBV抗原","复发性NHL难以治疗，MRD可作预后标志物；ALCL中产生抗ALK抗体者预后更好","严重黏膜炎、心脏毒性和继发肿瘤是治疗主要并发症"],"emergency":["上纵隔综合征（巨大纵隔肿块致气道/血流阻塞）为危及生命的肿瘤急症，需强化支持治疗","脊髓受压致急性截瘫需立即放射治疗","肿瘤溶解综合征可致高尿酸血症、高磷血症、高钾血症、低钙血症，进而肾功能衰竭和心律失常（BL尤甚）"],"pinyin":"ertonglinbaliu（huoqijinyufeihuoqijin）"},{"name":"神经母细胞瘤","category":"儿科-肿瘤","summary":"神经母细胞瘤是儿童最常见的颅外实性肿瘤，也是1岁以下最常见的恶性肿瘤，源于原始神经嵴细胞的外周交感神经系统肿瘤。临床异质性大，从自发消退到高度侵袭性不等，中位诊断年龄18个月。","symptoms":["无症状腹部肿块或局部压迫症状（脊髓受压、肠梗阻、上腔静脉综合征）","转移性疾病：发热、易怒、生长迟缓、骨痛、血细胞减少、皮下青紫色结节、眼眶瘀斑（熊猫眼）、眼球突出","上颈交感神经节肿瘤致霍纳综合征（单侧睑下垂、缩瞳、无汗）","副肿瘤综合征：眼阵挛-肌阵挛-共济失调综合征、肿瘤分泌VIP致严重分泌性腹泻","儿茶酚胺分泌致出汗增多和高血压","18个月以下婴儿MS期：广泛皮下结节、肝脏严重受累、骨髓病变有限、无骨骼受累，可自发消退"],"diagnosis":["尿儿茶酚胺代谢物高香草酸（HVA）和香草醛酸（VMA）升高（约95%病例）","CT/MRI示含钙化和出血的实性肿块；母体超声可诊断围产期肿瘤","活检病理确诊；骨髓见小型圆形蓝色肿瘤细胞且尿VMA/HVA升高时无需原发灶活检即可确诊","123I-MIBG显像精确评估疾病范围；骨扫描、双侧骨髓穿刺+活检评估转移","预后评估：MYCN扩增、DNA倍体、Shimada组织学分类、1p/11q/17q染色体异常","疑脊髓压迫时行脊柱MRI"],"infusion":["中风险化疗：中等剂量顺铂或卡铂+环磷酰胺+依托泊苷+多柔比星，持续数月","高风险诱导化疗：环磷酰胺、拓扑替康、多柔比星、长春新碱、顺铂和依托泊苷组合","高剂量化疗联合自体干细胞移植（巩固期），双重移植可能进一步改善预后","单克隆抗体迪努西单抗（ch14.18，抗GD2）用于自体干细胞移植后巩固治疗"],"oral_medication":["13-顺式维甲酸（分化诱导剂）在自体干细胞移植后使用，可进一步提高生存率"],"treatment":["低风险：手术切除（L1/L2期）；无症状MS期仅观察，治愈率通常>90%","中风险：手术+化疗±放疗，预后良好（存活率>90%）","高风险：诱导化疗→切除残留原发肿瘤→高剂量化疗+自体干细胞移植→局部放疗→13-顺式维甲酸+迪努西单抗","诊断时脊髓受压需紧急化疗、手术或放疗以避免神经损伤","复发高风险患儿探索新疗法：新型化疗、131I-MIBG放射性靶向治疗、免疫治疗、抗肿瘤疫苗"],"management":["按风险分层（年龄、分期、MYCN、倍体、Shimada组织学）个体化决定治疗强度","MS期婴儿肝脏严重受累伴呼吸功能障碍时用低剂量化疗或放疗缓解症状","获取足够诊断材料确定肿瘤生物学特征（Shimada分类、MYCN扩增）以指导治疗分层"],"notes":["高风险神经母细胞瘤强化治疗后长期生存率历史上仅25-35%","MYCN扩增与晚期和不良预后密切相关","复发性神经母细胞瘤对其他化疗方案响应率低于50%","眼阵挛-肌阵挛综合征多与生物学预后良好的肿瘤相关，但常留有进行性神经心理后遗症"],"emergency":["椎管内肿瘤侵犯神经孔致脊髓和神经根受压，需紧急处理避免永久神经损伤","大范围肿瘤可伴肿瘤溶解综合征和弥散性血管内凝血"],"pinyin":"shenjingmuxibaoliu"},{"name":"肾母细胞瘤（威尔姆斯瘤）","category":"儿科-肿瘤","summary":"肾母细胞瘤（Wilms瘤）是儿童最常见的原发性恶性肾肿瘤，占儿童恶性肿瘤6%、儿童肾脏肿瘤95%以上。多模式治疗后治愈率从不足30%提高到90%以上，发病高峰2-3岁，常表现为无症状腹部肿块。","symptoms":["最常见为洗澡/穿衣时偶然发现的无症状腹部肿块，质地坚硬、无压痛、光滑，很少跨越中线","高血压（约25%，肾素活性增加所致）","腹痛（40%）、无痛性肉眼血尿（18%）、发热、食欲不振、体重下降","肾实质或肾盂出血致腹部迅速增大和贫血","4-10%肿瘤血栓延伸至下腔静脉、极少数至右心房，血栓脱落可致致命肺栓塞"],"diagnosis":["腹部超声区分实性/囊性肿块，多普勒评估肾静脉/下腔静脉肿瘤血栓","腹部CT确定疾病范围、对侧肾脏完整性及转移灶；胸部CT筛查肺转移","不推荐术前活检（COG分期系统会升级分期）；临床表现或影像异常者行后侧针吸活检避免腹膜污染","组织学风险分层：无间变（良好）vs局灶/弥漫间变（不良）","评估伴发综合征（WAGR、Beckwith-Wiedemann、Denys-Drash等）及遗传风险","实验室可示血尿、红细胞增多症、血小板增多、部分凝血活酶时间延长"],"infusion":["I/II期良好组织学：长春新碱+放线菌素D，每1-3周，共18周（EE4A方案）","III/IV期：长春新碱+多柔比星+放线菌素D，共24周（DD4A方案），并联合放疗","高危（1p/16q LOH、肺转移反应差）：DD4A基础上加环磷酰胺/依托泊苷（M方案）","间变性（2-4期）：长春新碱、环磷酰胺、多柔比星、依托泊苷、卡铂、伊立替康联合放疗","复发性肿瘤：多柔比星、卡铂、环磷酰胺、异环磷酰胺、依托泊苷、伊立替康、托泊替康等"],"oral_medication":[],"treatment":["COG方案先行根治性肾切除术（仔细解剖避免包膜破裂，行淋巴结采样）；SIOP方案主张术前化疗","双侧病变或伴易感综合征（Denys-Drash、WAGR等）者行部分肾切除以保留肾功能","极低危（<2岁、I期、肿瘤<550 g）仅手术即可（4年EFS 90%、OS 100%）","III/IV期加侧腹/腹部或肺部放疗；肺转移对化疗反应迅速者可免肺放疗","双侧Wilms瘤采用三药术前化疗、12周内手术及基于组织学的术后治疗","复发者再次化疗±手术切除转移灶（原仅两种药治疗者4年生存率约80%）"],"management":["Wilms瘤相关综合征患儿定期腹部超声检查以早期发现肿瘤","体格检查时避免过度按压肿块以防肾包膜破裂","长期随访监测后期并发症：心脏毒性、肺病、生殖问题、肾功能障碍、继发恶性肿瘤"],"notes":["整体生存率超过90%，是儿童实体瘤中预后最好的肿瘤之一","弥漫性间变预后较差；1p和16q LOH及1q增益提示不良预后，需加强治疗","约15%（良好组织学）和50%（间变型）患者复发，大多发生在诊断后2年内","放疗和蒽环类药物治疗增加后期并发症（肌肉骨骼、心脏、继发肿瘤）风险"],"emergency":["肿瘤破裂或术中破裂致腹膜内播散者需全腹放射治疗（COG分期III期）"],"pinyin":"shenmuxibaoliu（weiermusiliu）"},{"name":"视网膜母细胞瘤","category":"儿科-肿瘤","summary":"视网膜母细胞瘤是视网膜的胚胎性恶性肿瘤，儿童最常见的眼内肿瘤，占儿童恶性肿瘤2%。遗传性（RB1胚系变异）多为双侧且发病早，发达国家治愈率约95%，需在保生命同时尽量保留视力和眼球。","symptoms":["白瞳症（瞳孔白色反光）为典型表现，常在健康检查或闪光照片发现无红光反射","斜视为早期表现之一","进展期出现视力下降、眼眶炎症、前房出血、瞳孔异常","继发性青光眼可致疼痛","可沿视神经、血液或淋巴系统向脉络膜、骨骼、骨髓和肺部扩散（眼外转移）"],"diagnosis":["间接检眼镜在全身麻醉下进行双眼检查为确诊手段，可全面观察并拍照绘图","眼眶超声、CT或MRI评估眼内疾病范围及眼外扩散（CT可见钙化）","活检属禁忌","RB1基因检测明确遗传性；遗传性病例的父母和兄弟姐妹应进行遗传咨询和检测","家族史阳性者出生早期即需全身麻醉下眼底检查筛查","白瞳鉴别诊断：持续增生性原发玻璃体、Coats病、白内障、眼内炎、早产儿视网膜病变等"],"infusion":["化学减容（双侧疾病）：静脉卡铂、长春新碱和依托泊苷多药化疗","眼动脉内化疗（经眼动脉给药）及玻璃体腔化疗日益常用","转移性疾病采用强化多药化疗联合自体干细胞移植"],"oral_medication":[],"treatment":["治疗目标：治愈为主，其次保护视力和眼球并降低继发恶性肿瘤风险","单侧大肿瘤无法保留有用视力时行眼球摘除","双侧疾病：化学减容联合局部治疗（激光光凝、冷冻疗法）替代传统摘除+放疗","小肿瘤可单用局部治疗并密切监测复发或新发肿瘤","较大肿瘤对静脉多药化疗反应好；局部治疗无效可考虑近距离放疗（眼周斑块）","外照射放疗用于难治病例，但增加眼眶变形和继发恶性肿瘤风险","无反应或复发肿瘤可行眼球摘除"],"management":["遗传性（RB1变异阳性）患儿需在7岁前定期进行眼科检查","有家族史婴儿出生早期行麻醉下眼底检查，直至基因检测结果确定","基因检测阴性者无需继续筛查","遗传性双侧患儿约5%伴松果体肿瘤（三侧性视网膜母细胞瘤），需相应影像学随访"],"notes":["携带RB1变异者第二恶性肿瘤（骨肉瘤、软组织肉瘤、恶性黑色素瘤）风险显著增加","三侧性视网膜母细胞瘤（双眼+松果体）几乎总是致命","外照射放疗增加第二肿瘤、白内障、眼眶生长畸形和视网膜血管损伤风险","约95%美国患儿经现代治疗可治愈；眼外扩散者预后差"],"emergency":[],"pinyin":"shiwangmomuxibaoliu"},{"name":"骨肿瘤（骨肉瘤与尤因肉瘤）","category":"儿科-肿瘤","summary":"骨肉瘤是儿童最常见的原发性恶性骨肿瘤，其次为尤因肉瘤，均好发于生命第二十年。骨肉瘤为产生恶性骨样组织的梭形细胞肿瘤，尤因肉瘤为小型圆形蓝细胞肿瘤（常含EWS融合基因），均以疼痛肿胀起病，需化疗+手术（±放疗）综合治疗。","symptoms":["疼痛、跛行和肿胀为最常见表现，青少年常被误认为运动损伤或扭伤","关节活动受限、关节积液、压痛、局部发热","病理性骨折","尤因肉瘤常伴发热、体重下降及炎症指标升高，可被当作骨髓炎或不明原因发热","胸壁巨大原发肿瘤致呼吸窘迫；椎旁或脊柱肿瘤致脊髓压迫","X线骨肉瘤呈成骨性'太阳风暴'样破坏；尤因肉瘤以溶骨为主伴'洋葱皮样'骨膜反应"],"diagnosis":["X线片：骨肉瘤经典'太阳风暴'表现；尤因肉瘤'洋葱皮样'骨膜反应","MRI评估原发灶与神经、血管、软组织和关节关系及整个受累骨骼","胸部CT、放射性核素骨扫描或PET-CT评估肺、骨、软组织转移","骨肉瘤活检：通常碱性磷酸酶或乳酸脱氢酶升高","尤因肉瘤：MIC-2（CD99）染色阳性，检测EWS/FLI1或EWS/ERG融合基因，骨髓穿刺活检评估骨髓受累","鉴别诊断：骨肉瘤需排除尤因肉瘤、骨髓炎、血肿；尤因肉瘤需排除骨髓炎、朗格汉斯细胞组织细胞增生症、淋巴瘤、转移性神经母细胞瘤"],"infusion":["骨肉瘤标准化疗MAP方案：甲氨蝶呤、多柔比星、顺铂","骨肉瘤多药方案活性药物另含异环磷酰胺","尤因肉瘤多药化疗：长春新碱、多柔比星、环磷酰胺、依托泊苷和异环磷酰胺（14天周期优于21天）"],"oral_medication":[],"treatment":["骨肉瘤：术前新辅助化疗→手术（保肢或截肢）→术后尽快恢复化疗","组织对化疗的反应是骨肉瘤最重要预后因素之一（切除组织坏死<90%即反应不佳）；反应不佳者加异环磷酰胺/依托泊苷未改善预后","肺转移者在治疗过程中经开胸手术切除转移灶；晚期孤立肺转移可仅手术切除治愈","尤因肉瘤：综合多学科治疗，化疗迅速缩小肿瘤，局部控制采用手术和/或放疗","保肢术后加强康复和物理治疗；截肢者早期安装假肢和步态训练","骨膜型骨肉瘤仅手术切除即可治愈（低级别、不侵骨髓腔）"],"management":["承重骨肿瘤在最终手术前使用拐杖，避免病理性骨折","活检和手术由同一位外科医生执行，确保切口不影响最终手术","可疑骨病变及早转诊至有骨肿瘤经验的医疗机构行活检","长期随访监测蒽环类心脏毒性、顺铂听力损失、不孕、继发恶性肿瘤（尤因肉瘤放疗区域）及晚期复发（可长达10年）"],"notes":["非转移性骨肉瘤5年无病生存率65-75%，约75%可治愈；诊断时已转移者生存率≤20%","尤因肉瘤非转移性治愈率65-75%；骨或骨髓转移者长期存活率低于30%","遗传性视网膜母细胞瘤、Li-Fraumeni综合征、Rothmund-Thomson综合征及放疗增加骨肉瘤风险","尤因肉瘤对放射敏感，但放疗增加继发性恶性肿瘤（尤其骨肉瘤）和骨骼生长受阻风险"],"emergency":["椎旁或脊柱尤因肉瘤致脊髓压迫需紧急评估处理"],"pinyin":"guzhongliu（gurouliuyuyouyinrouliu）"},{"name":"儿童肥胖症","category":"儿科-营养","summary":"肥胖由热量摄入与能量消耗失衡导致，受遗传、环境、睡眠、神经内分泌反馈回路共同调节；≥2岁儿童以BMI≥第95百分位为肥胖、第85-95百分位为超重。美国儿童肥胖患病率19.3%，需采用慢性病管理模式，以家庭为基础的多学科干预为主。","symptoms":["BMI≥第95百分位（肥胖）、第85-95百分位（超重）；2岁以下婴儿用体重/身高百分位","常见合并症：2型糖尿病（多尿、夜尿、口渴）、高血压、高脂血症、非酒精性脂肪肝病（34%，可致腹痛）","黑棘皮病提示胰岛素抵抗和2型糖尿病风险","睡眠打鼾、白天嗜睡提示阻塞性睡眠呼吸暂停","髋部或膝部疼痛：布伦特病（胫骨内翻）、股骨头骨骺滑脱","月经不规律提示多囊卵巢综合征；多毛症","心理问题：自尊心降低（尤其青春期女性）、抑郁、饮食障碍、被欺凌风险","肥胖女童青春期提前（Tanner分期提前）"],"diagnosis":["评估始于生长图表中体重、身高和BMI变化趋势，判断肥胖严重程度、持续时间及发病时间","BMI=体重(kg)/身高(m)²，对照年龄和性别百分位；肥胖为≥第95百分位","完整病史和家族史：其他家庭成员的肥胖、2型糖尿病、高血压、心血管疾病/代谢综合征","详查家庭饮食、营养和活动模式：24小时饮食记录（水果蔬菜水、高热量食物和含糖饮料）、屏幕时间、体力活动","体格检查：适当尺寸袖带测血压、皮肤查黑棘皮病和多毛、Tanner分期","初步实验室：空腹血浆葡萄糖、甘油三酯、LDL、HDL胆固醇及肝功能；超重者伴糖尿病家族史或胰岛素抵抗迹象也查空腹血糖","身高增长缓慢提示内分泌病因（生长激素缺乏、甲状腺功能减退、库欣综合征）；严重食欲亢进、畸形特征、认知障碍提示遗传性肥胖综合征","持续体重增长>6个月者评估遗传原因（Prader-Willi、MC4R、POMC、瘦素缺乏等，按图65.5流程）"],"infusion":[],"oral_medication":["奥利司他（胰脂肪酶抑制剂）：FDA批准用于<16岁儿童，减少脂肪吸收，适度减重；副作用胀气、油性便、少量出血","利拉鲁肽（Saxenda）和司美格鲁肽（GLP-1受体激动剂）：FDA批准用于12岁及以上肥胖儿童慢性体重管理，减重效果显著","以上药物均需结合行为干预，只能带来适度体重减轻或BMI改善；长期使用可能增加甲状腺髓样癌和胰腺炎风险"],"treatment":["以家庭为基础、考虑儿童发育阶段的多学科全面体重管理计划（证据显示效果最确定）","行为干预：明确目标行为、自我监测、目标设定、刺激控制、提升自我效能；有效行为包括减少含糖饮料、更高质量饮食、增加活动、减少屏幕时间、自我称重","饮食：以水果、蔬菜、全谷物、瘦肉、鱼类和禽肉为基础；WHO建议避免人工甜味剂（阿斯巴甜、甜菊糖等）；控制高热量低营养食品","'交通灯'饮食法：绿色（无限量，水果蔬菜）、黄色（限量，瘦肉奶制品淀粉）、红色（偶尔或避免，高糖高脂油炸）；动机访谈评估改变意愿","体力活动：每天60分钟；不减少热量摄入而仅增加活动难以减重，但有氧运动改善代谢状况","限制屏幕时间：AAP建议≥2岁儿童每天看电视<2小时，<2岁不看电视；禁止看电视时进食","药物：奥利司他（<16岁）、利拉鲁肽/司美格鲁肽（12岁+），均需与行为干预结合","减重手术评估：骨骼发育完全或接近完全、BMI≥40且因肥胖伴医疗并发症、已尝试6个月多学科体重管理失败者（Roux-en-Y、可调节胃束带、袖状胃切除等）"],"management":["采用慢性病管理模式，建立良好治疗关系；帮助家庭理解健康体重的重要性，全家庭共同改变饮食和活动习惯","设定现实目标：勿期待BMI百分位立即下降，而是先增速减缓、稳定再缓慢下降","预防（从受孕到2岁1000天窗口）：孕期健康饮食、6个月纯母乳喂养、及时安全辅食、避免婴儿期含糖饮料和食物","鼓励定期家庭聚餐、权威型养育方式；父母多活动、限屏幕时间、禁止看电视时吃零食","减重手术后注意营养并发症：吸收不良致维生素（A、B族、D、E、K）和矿物质（铜、铁）缺乏，需补充","定期医疗随访监测BMI百分位变化，早期识别脂肪堆积"],"notes":["现有减肥药物即使联合行为干预也仅带来适度减重；司美格鲁肽是减重效果最显著的药物类别","GLP-1受体激动剂长期使用可能增加甲状腺髓样癌和胰腺炎风险，需监测（头痛、腹痛、呕吐、腹泻为常见不良反应）","儿童肥胖并发症持续至成年；青春期肥胖男性死于心血管疾病的风险为体重正常男性2倍","34%儿童肥胖患者诊断非酒精性脂肪肝病，为美国儿童最常见的慢性肝病，可致纤维化、肝硬化、肝细胞癌","导致肥胖的药物：糖皮质激素、奥氮平/氯氮平/喹硫平/利培酮等非典型抗精神病药、三环类抗抑郁药、锂剂、丙戊酸、卡马西平、加巴喷丁、赛庚啶、β阻滞剂等","睡眠不足增加肥胖风险（瘦素下降、胃饥饿素上升、饥饿感和食欲增加）","含糖饮料与肥胖风险增加相关；高果糖玉米糖浆使廉价热量易于获得"],"emergency":[],"pinyin":"etfpz"},{"name":"维生素D缺乏性佝偻病","category":"儿科-营养","summary":"佝偻病是一种生长板骨样蛋白矿化不足的骨骼疾病，仅发生在生长板融合之前；主要由维生素D缺乏引起，也可由钙缺乏、磷缺乏及远端肾小管酸中毒等所致。在发达国家仍见于饮食受限（如自闭症）或特殊饮食的儿童，发展中国家仍是严重问题。","symptoms":["颅骨软化（按乒乓球感）、前囟闭合延迟、额部隆起、出牙延迟（10月龄无门齿、18月龄无臼齿）、龋齿","肋软骨连接处'念珠状'外观、哈里森沟（胸部前下水平凹陷），肋骨软化增加肺不张和肺炎风险","手腕、脚踝肿大（生长板扩大），下肢外翻或内翻畸形、风卷状畸形、胫骨和股骨前弯、髋内翻、腿痛","生长迟缓（营养不良）、肌无力（尤其近端）、行走延迟、步态异常","低钙血症症状：手足搐搦、惊厥、喉痉挛所致喘鸣（长时间喉痉挛有时致死）","腹部膨隆、精神萎靡；脱发提示维生素D依赖性佝偻病2型","可有低钙血症性扩张型心肌病、病理性（轻微外伤）骨折、颅内压增高"],"diagnosis":["诊断基于典型放射学异常：腕部前后位X光显示生长板增厚、干骺端边缘模糊、杯状变形、增宽、骨干粗颗粒状稀疏","初步实验室：血清钙、磷、碱性磷酸酶（ALP）、甲状旁腺激素（PTH）、25-羟基维生素D、1,25-二羟维生素D、肌酐及电解质","营养性维生素D缺乏典型模式：25-D降低、PTH升高、ALP升高、尿钙降低、尿磷升高（表69.4）","尿分析有助于检测Fanconi综合征糖尿；疑遗传性低磷伴高钙尿或Dent病时评估24小时尿钙或钙/肌酐比","重点询问饮食史（维生素D和钙摄入）、配方奶/牛奶成分、阳光暴露（季节、防晒、肤色）、药物史（抗惊厥药、含铝抗酸药）","鉴别病因：营养性缺乏、钙缺乏、磷缺乏、X连锁低磷血症性佝偻病、远端肾小管酸中毒等（结合实验室模式）"],"infusion":["症状性低钙血症：静脉快速给予钙剂（20mg/kg氯化钙或100mg/kg葡萄糖酸钙），随后口服钙","部分患者需持续静脉输注钙剂以维持理想血清钙水平","急性阶段可静脉或口服骨化三醇（1,25-D，约0.05μg/kg/天）逆转低钙血症"],"oral_medication":["维生素D补充：口服300,000-600,000IU（或1天内分2-4次肌注，D3因半衰期长更优）","替代方案：每日至少2,000IU维生素D持续至少3个月；维持量<1岁每日400IU、>1岁每日600IU","保证膳食钙（每日至少500mg）和磷，不足时补充钙剂（婴儿大多需约1,000mg元素钙）","维生素D吸收不良者用25-D 25-50μg/天或5-7μg/kg/天（吸收更好）；或肠外维生素D","CYP系统降解增加者（抗惊厥药等）急性治疗后长期高剂量维生素D（约每日1,000IU，部分需4,000IU/天）"],"treatment":["补充维生素D并保证充足钙和磷摄入；症状性低钙血症先静脉钙后口服钙（膳食充足者2-6周内渐减停）","VDDR 1A型用骨化三醇长期治疗（初始0.25-2μg/天），维持低正常钙、正常磷、高正常PTH，监测尿钙<4mg/kg/天防肾钙化","VDDR 1B型可试维生素D2 3,000U/天；VDDR 2型需极高剂量维生素D（1,25-D初始2μg/天，可高达50-60μg/天）+口服钙1,000-3,000mg/天","钙缺乏性佝偻病以补钙为主（1-3岁700mg/天、4-8岁1,000mg/天、9-18岁1,300mg/天），伴VitD缺乏者同时补维生素D","慢性肾病（1α-羟化酶降低）需用无需肾脏1-羟化的活性维生素D（骨化醇）+限磷及口服磷酸盐结合剂","X连锁低磷血症性佝偻病：Burosumab（抗FGF-23单抗，≥1岁）或常规口服磷1-3g元素磷/天分4-5次+骨化三醇30-70ng/kg/天分2次","严重腿部畸形在代谢性骨病治愈后、畸形不自行缓解且导致功能问题时考虑骨科手术"],"management":["预防：<1岁婴儿普遍补充400IU维生素D/天；有摄入不足风险的大龄儿童每日600IU","母乳喂养婴儿依靠皮肤合成或补充剂；母亲严重维生素D缺乏者可致先天性佝偻病，产前维生素含600IU可预防","深肤色、冬季末春季、完全遮盖者注意阳光（UVB）暴露受限","避免长期含铝抗酸药（磷吸收不良）；注意维生素D过量风险（<1岁上限1,000IU/天，较大儿童2,000IU/天）"],"notes":["大多数营养性维生素D缺乏患儿治疗反应良好，影像学几个月内改善，实验室迅速恢复正常","严重病例可遗留永久性畸形和身材矮小；少数需骨科手术","营养性缺乏最常见于母乳喂养且母亲缺乏、深肤色、冬季末或春季发病的婴儿","维生素D中毒表现：高钙血症（恶心呕吐、进食不良、高血压、QT间期延长、心律失常、多尿、肾结石、急性肾损伤），25-D>100ng/mL，PTH降低，可致命或致慢性肾病","维生素D中毒治疗：生理盐水+袢利尿剂、泼尼松1-2mg/kg/24h、双膦酸盐，严重者低钙/零钙透析液透析；停维生素D并限钙","维生素D储存在脂肪中，中毒后水平可持续数月，需定期监测25-D、血清钙和尿钙"],"emergency":["症状性低钙血症（手足搐搦、惊厥、喉痉挛）需立即静脉补钙","长时间喉痉挛可致死，需紧急处理","低钙血症性扩张型心肌病需紧急评估","肋骨软化增加肺不张和肺炎风险，注意呼吸系统症状"],"pinyin":"wssDqfxglb"},{"name":"缺铁性贫血","category":"儿科-血液","summary":"缺铁是全球最普遍且最常见的营养障碍，全球30-50%人口患缺铁性贫血；美国12-36月龄儿童8-14%存在缺铁，其中30%发展为缺铁性贫血。足月儿铁储备通常满足6-9个月造血需求，此后饮食铁来源和失血管理至关重要。","symptoms":["大多数缺铁性贫血儿童无症状，通常于9-12月龄常规实验室检测时被发现","面色苍白是缺铁性贫血的典型表现","营养性缺铁的婴幼儿常见饮食模式为过量饮用牛奶（牛奶铁含量低且牛奶蛋白致结肠炎引起血流失血），常超重或>12月龄仍用奶瓶喂养","大龄儿童和青少年失血来源可包括月经出血、反复鼻出血、血管内溶血致血红蛋白尿（疟疾、耐力运动）","隐匿性失血可由胃肠道病变引起：消化性溃疡、梅克尔憩室、息肉、血管瘤、炎症性肠病","高危人群：早产儿、低出生体重儿、围产期失血婴儿、孕期或曾怀孕的青少年女性（患病风险>30%）"],"diagnosis":["常在9-12月龄常规实验室检测中发现；正常血红蛋白值随年龄、性别、种族及检测方式（毛细血管血vs静脉血）而异","每一例缺铁性贫血都应考虑失血为可能原因（胃肠道、月经、鼻出血等）","婴儿期血便失血可通过母乳喂养、避免过早引入全脂牛奶并将摄入量限制在≤24盎司/24h来预防","吸收障碍因素：胃旁路手术、幽门螺杆菌感染、乳糜泻、贾第鞭毛虫病","对口服铁剂无反应的微细胞性贫血需考虑地中海贫血、慢性病性贫血等（第505章）"],"infusion":["重度贫血/不耐受口服：右旋糖酐铁静滴（需皮试、慢滴）","心衰：利尿、输血（极重度）"],"oral_medication":["元素铁4-6mg/kg/d（按元素铁计），分2-3次餐间服","常用：硫酸亚铁/富马酸亚铁/蛋白琥珀酸铁","维生素C同服促进吸收","疗程：Hb正常后继服2-3月补足储存铁"],"treatment":["口服铁剂+饮食补铁+去除病因","定期复査 Hb与铁蛋白","治疗原发病（如慢性失血）","（注：尼尔森22版中文版第504章治疗段落翻译错位，铁剂方案沿用原指南库内容）"],"management":["延迟（1-3分钟）剪断脐带以改善新生儿铁储备","母乳喂养或推迟在生命早期引入全脂牛奶，并将牛奶摄入量限制在每24小时24盎司以下","避免婴儿和幼儿大量摄入未补充铁的未经加工牛奶，保证铁含量丰富的食物摄入","针对失血、吸收不良及感染（钩虫、鞭虫、疟疾等）等病因进行处理"],"notes":["原文治疗章节内容明显错位（混入维生素B12/IRIDA内容），本条目未编造原文不存在的药物和剂量，建议以英文原版第504章为准","全球30-50%人口患有缺铁性贫血，大多数生活在发展中国家","美国12-36月龄儿童8-14%存在缺铁，其中30%发展为缺铁性贫血","足月儿铁储备满足6-9个月造血需求；早产儿、低出生体重儿铁储备耗尽更快","约2%青春期女性患缺铁性贫血，主要因快速生长和月经失血","发展中国家钩虫、鞭虫和疟原虫感染是常见缺铁原因"],"emergency":["重度贫血、心衰、晕厥、发育迟缓→血液科急诊/住院"],"pinyin":"qtxpx"},{"name":"蛋白质-能量营养不良","category":"儿科-营养","summary":"严重急性营养不良定义为严重消瘦（体重/身高<WHO标准-3SD）和/或双侧凹陷性水肿，包括严重消瘦（marasmus）、水肿性营养障碍（kwashiorkor）及消瘦伴水肿；本书建议避免'蛋白质-能量营养不良'这一过于简化多因素病因的术语。治疗遵循WHO 10步方案（稳定期+康复期）。","symptoms":["严重消瘦：大腿、臀部、上臂、肋骨和肩胛处脂肪与骨骼肌严重流失，皮肤松弛失去弹性，眼眶凹陷","水肿性营养不良：水肿先起于足部蔓延至小腿、手、臂、面部；'剥落性皮炎'样暗色裂纹脱皮斑块，其下皮肤苍白易感染","头发稀疏易脱落、失去卷曲、颜色变浅或发红；'旗征'（深浅相间发带）、扫帚样睫毛、脱发","月亮脸（kwashiorkor）、猿猴面容（marasmus）、腹部膨隆、肝大伴脂肪肝、可伴腹水","情绪不安、易怒或冷漠，常拒绝进食；行为懒散、无精打采","生长发育迟缓（体重增长减慢或下降）、肌肉消耗（尤其臀部大腿）、低体温、低血压、心动过缓、心输出量降低","口角炎、舌炎、牙龈出血（维C）、干眼/结膜苍白/毕脱斑（维A）、贫血、瘀点、出血倾向","小肠胃黏膜萎缩、乳糖酶缺乏常见；近端肌肉无力，低钙时可出现Chvostek或Trousseau征"],"diagnosis":["严重急性营养不良定义：体重/身高比低于WHO儿童生长标准-3SD，或6-59月龄上臂围（MUAC）<115mm","双侧凹陷性水肿：双手按压双足10秒留凹陷即诊断（无需其他指标），常伴低白蛋白","消瘦定义为体重/身高或BMI z评分<-2（急性营养不良）；发育迟缓为身高/年龄z评分<-2（慢性营养不良）","实验室：全血细胞计数、电解质、BUN/肌酐、血糖、白蛋白、微量营养素（钾、镁、锌、铜）；注意铁补充在感染消退后（成功恢复体重1-2周后）开始","评估病因：摄入不足（食物不安全、喂养困难、回避性限制性食物摄入障碍）与疾病相关原因（蛋白丢失性肠病、慢性腹泻、囊性纤维化、乳糜泻等）","脱水易误诊：皮肤弹性差、眼凹等在无脱水时也可见；血清电解质可能误导（钠渗入细胞、钾出细胞），保持摄入稳定优于按化验调整"],"infusion":["休克时：无菌10%葡萄糖5mL/kg快速静脉注射，随后静脉输液15mL/kg/1小时（5%葡萄糖林格乳酸盐或半强度Darrow液或半张盐水+5%葡萄糖）","若休克无改善（疑败血症休克）：维持液4mL/kg/hr，输新鲜全血10mL/kg缓慢3小时（心衰征象时给5-7mL/kg浓缩红细胞替代全血），输注开始给呋塞米1mg/kg IV","极重度贫血（Hgb<4g/dL）或Hgb 4-6g/dL伴呼吸窘迫：输全血10mL/kg缓慢3小时","再水化用ReSoMal口服或鼻胃管（5-10mL/kg，交替每小时），避免常规静脉输液（除休克外）"],"oral_medication":["抗生素：无并发症者阿莫西林25mg/kg PO每日两次共5天","有并发症（休克、低血糖、低体温、皮肤病变、呼吸道或泌尿道感染、嗜睡）者：庆大霉素7.5mg/kg IV/IM每日一次共7天+氨苄西林50mg/kg IV/IM每6小时共2天，后改阿莫西林25-40mg/kg PO每8小时共5天","确定性特定感染时加相应抗生素；持续性腹泻或小肠菌群失调可加口服抗生素（每8小时7.5mg/kg，7天）","补充钾、镁、锌、铜等电解质/矿物质（浓缩电解质/矿物质溶液加入ReSoMal和食物）及复合微量营养素；康复期加铁3mg/kg/天","需要时补充维生素A、维生素D等微量营养素；再喂养时注意硫胺素补充"],"treatment":["WHO 10步方案：稳定期（第1-7天）与康复期（第2-6周）；治疗必须有序，先修复代谢机制再促体重增长","1.预防/治疗低血糖 2.预防/治疗低体温 3.治疗/预防脱水 4.纠正电解质失衡 5.治疗感染","6.纠正微量营养素缺乏（稳定期不含铁，康复期加铁）7.谨慎喂养（F75）8.修复组织/追赶生长 9.提供关爱与游戏 10.准备随访","稳定期频繁给予少量F75（75kcal/100mL、0.9g蛋白、低乳糖、加钾镁微量营养素）；避免静脉给药，食欲差者用鼻胃管","进入康复期信号：水肿减轻或轻微、食欲恢复；经3天逐步过渡，随后给予无限量高能量高蛋白F100（100kcal/100mL、3g蛋白）或即用型治疗食品（RUTF）","康复期目标：150-220kcal/kg/天和4-6g蛋白/kg/天，继续补钾镁微量营养素并加铁","切勿用利尿剂治疗水肿、治疗初期勿给高蛋白饮食、避免过快再喂养（再喂养综合征可致命）","无并发症、食欲良好、临床状况好的儿童可社区为基础管理（RUTF），住院儿童完成步骤1-7后可转社区护理"],"management":["密切监测再水化时液体过载迹象（此类儿童可因液体过载迅速死亡）","母乳喂养者鼓励继续哺乳；治疗期间及之后给予关爱、有组织的游戏和感官刺激以促进大脑功能恢复","患儿应视为'严重营养不良伴并发症'，治疗遵循10步，勿按营养良好儿童方式处理","按年龄设定追赶生长目标（约为正常体重增长速度的150%）；定期随访和监测","针对心理社会因素干预（母亲抑郁、食物供应不足）；怀疑虐待或故意忽视时转儿童保护服务"],"notes":["再喂养综合征：再摄入营养时胰岛素激增引发电解质液体剧变，前7天风险最高，表现为低磷（<3.0mg/dL）、低钾、低镁、液体过载，可致昏迷、心衰、猝死","高热量再喂养可能致命，需低热量逐步增加；极度营养不良（BMI<中位值60%）或发展中国家儿童更需谨慎（每日1,000-1,200kcal以下起步）","低血糖、低体温、液体过载和感染是稳定期主要死因；肝功能下降致低血糖和低白蛋白","营养不良使感染死亡风险指数级上升，且感染反过来加重营养不良（反复感染-营养不良恶性循环）","低出生体重/胎儿生长受限与成人高血压、卒中、2型糖尿病风险增加相关（胎儿编程）","3岁前发育迟缓与较差运动和认知发展有关（发育商降低6-13分）"],"emergency":["低血糖（血糖<3mmol/L）需紧急处理（见表62.8步骤1）","低体温需保暖；休克（迟钝或昏迷+手脚冰冷+毛细血管再充盈>3秒或脉弱快）按表62.7紧急处理","角膜溃疡（维生素A缺乏）紧急处理：立即维生素A（<6月龄50,000IU；6-12月龄100,000IU；>12月龄200,000IU），阿托品1%滴眼","极重度贫血（Hgb<4g/dL）需输血","严重全身水肿伴血管内容量减少者需住院密切监护（避免液体过载和心衰）"],"pinyin":"dbz-nlyybl"},{"name":"免疫性血小板减少症（ITP）","category":"儿科-血液","summary":"免疫性血小板减少症是其他方面健康儿童急性血小板减少最常见原因，约1/20,000儿童在病毒感染后1-4周出现针对血小板的自身抗体导致血小板突然下降；70-80%急性患儿6个月内自行缓解，治疗不影响自然病程，以观察等待为主。","symptoms":["1-4岁之前身体健康的孩子突然出现全身瘀点及紫癜，发病前1-4周常有病毒感染史","可出现牙龈和黏膜出血，尤其当血小板计数<10×10^9/L时","体检通常正常，除瘀点紫癜外；脾肿大、淋巴结肿大、骨痛和面色苍白较罕见（出现提示其他疾病）","出血严重程度分级：无症状/轻度（瘀伤和点状出血）/中度（皮肤黏膜病变重、频繁鼻出血、月经过多）/重度（需要输血或住院的出血）","严重出血罕见（大型国际研究<3%），颅内出血不到1%","约20%急性ITP进展为慢性ITP（血小板持续低>12个月）","发病隐匿、尤其青少年时，更可能为慢性ITP或全身性疾病（如SLE）"],"diagnosis":["急性ITP中血红蛋白、白细胞计数及分类通常正常，血小板大小正常或增大（反映血小板更新增加）","骨髓检查并非常规必要；指征包括白细胞计数或分类异常、原因不明的贫血、病史和体检提示骨髓功能衰竭或恶性肿瘤","贫血原因不明时应行直接抗球蛋白试验（Coombs）排除Evans综合征","高危人群尤其是性活跃青少年应进行HIV检测；青少年伴SLE其他特征时考虑ANA检测","血小板抗体检测在急性ITP很少有用","需排除白血病、遗传综合征、2B型VWD、Wiskott-Aldrich综合征（小血小板伴湿疹感染史）等"],"infusion":["静脉注射免疫球蛋白（IVIG）0.8-1.0g/kg/d，连用1-2天，95%患者48小时内血小板快速上升（通常>20×10^9/L）","颅内出血特殊情况：血小板输注+IVIG+高剂量皮质类固醇联合治疗（血小板输注在其他出血表现中不推荐）"],"oral_medication":["泼尼松1-4mg/kg/d口服，通常短疗程（约5天）至血小板计数升至>20×10^9/L，以减少长期副作用（生长障碍、糖尿病、骨质疏松）","利妥昔单抗用于慢性ITP，30-40%儿童获得部分或完全缓解","血小板生成素受体激动剂（罗米司亭、艾曲波帕）已批准用于儿童慢性ITP，可提高血小板计数（非治愈性，通常需长期使用，可致肝酶升高）"],"treatment":["观察等待为首选：无出血症状或仅轻度症状（瘀伤、紫癜）的儿童仅需教育和咨询，强调ITP通常为良性疾病","出现黏膜皮肤出血症状的儿童可用IVIG或皮质类固醇治疗","治疗目标是将血小板计数提高到>20×10^9/L；无证据表明早期治疗可预防颅内出血或改变自然病程","严重出血患者（占ITP患儿<5%）应予治疗；黏膜出血在预测严重出血方面具有显著意义","脾切除限于两种情况：年龄较大（≥4岁）且慢性ITP（>1年）治疗难以控制症状，或危及生命出血（如ICH）时其他治疗无法迅速纠正血小板","慢性ITP治疗旨在控制症状并预防严重出血；脾切除可成功使64-88%慢性患儿完全缓解，但需权衡终身感染/血栓风险"],"management":["ITP中通常不宜进行血小板输注（除非危及生命的出血），因抗血小板抗体同样吸附输注的血小板","对家属和患者进行教育和咨询，强调疾病良性经过，避免不必要的介入","慢性ITP应仔细评估相关疾病：自身免疫性疾病（SLE）、慢性感染（HIV）、2B型VWD、X连锁血小板减少症、幽门螺杆菌和丙型肝炎感染","脾切除患者需关注包膜微生物所致终生感染风险、血栓形成风险及成年后肺动脉高压风险"],"notes":["70-80%急性ITP患儿6个月内自行缓解，治疗似乎不影响疾病的自然发展过程","严重出血罕见（<3%），颅内出血发生率不到1%","约20%急性ITP进展为慢性；预后与年龄有关，年幼患儿更可能缓解，青少年中慢性ITP约占50%","与EBV相关ITP通常持续时间较短；与HIV相关ITP通常为慢性","治疗促使血小板更快升至安全水平（>20×10^9/L），但无数据表明可预防颅内出血"],"emergency":["颅内出血（罕见但危急）：需血小板输注+IVIG+高剂量皮质类固醇，并及时请神经外科和普通外科会诊（脾切除术）","黏膜出血显著是预测严重出血的重要征象","需要输血或住院的重度出血症状（月经过多、鼻出血、黑便）应积极治疗"],"pinyin":"myxxxbjsz（"},{"name":"地中海贫血","category":"儿科-血液","summary":"地中海贫血是一组珠蛋白链生成失衡的遗传性疾病，β型因β-珠蛋白链减少致α链过剩，α型因α-珠蛋白基因缺失。临床从重型（依赖输血）到无症状携带者不等，重度β地中海贫血需早期规律输血和铁螯合治疗。","symptoms":["未治疗的重型β地中海贫血出现进行性贫血、虚弱、生长迟缓、生后6个月内心功能衰竭","严重病例出现地中海贫血面容（上颌骨增生、鼻梁扁平、额骨突出）、病理性骨折、明显肝脾肿大、消瘦","小细胞低色素性贫血、靶形红细胞、有核红细胞，网织红细胞计数相对偏低（<8%）","4个α基因缺失致胎儿水肿（宫内贫血，常致胎死腹中）；3个α基因缺失（HbH病）表现轻度贫血、脾肿大、间歇性黄疸","铁过载可致甲状腺功能减退、生长激素缺乏、糖尿病、性腺功能低下及心脏铁沉积（心衰、心律失常）","中间型患者可发生髓外造血（椎管内压迫脊髓）、肺动脉高压、腿部溃疡、血栓事件"],"diagnosis":["血红蛋白电泳/HPLC：重型β地中海贫血以HbF为主（约98%）、HbA2约2%","血常规示小细胞低色素性贫血，未经输血时Hb常降至<6 g/dL","对β地中海贫血致病变异进行DNA诊断，并检测α基因共缺失等遗传修饰因素","新生儿筛查仅检出HbF时提示诊断，需确认性检测并随访","铁过载评估：连续血清铁蛋白、肝脏MRI（R2/R2*）定量肝铁，10岁起心脏T2* MRI","β地中海贫血特征需与缺铁性贫血鉴别（RDW正常、HbA2升高，铁剂试验治疗无效）"],"infusion":["红细胞输注：去白细胞、D/C/c/E/e/Kell抗原匹配，间隔3-4周，维持输血前Hb 9.5-10.5 g/dL","去铁胺（Desferal）皮下或静脉注射25-40 mg/kg/天，持续8-12小时，每周5-7天；重度铁过载可增至50-60 mg/kg","卢斯帕特雷克特（Luspatercept）皮下注射1 mg/kg每3周，无效应增至1.25 mg/kg，可减少输血需求"],"oral_medication":["去铁斯若（Deferasirox）口服：分散片20-40 mg/kg/天，薄膜包衣片/颗粒14-28 mg/kg/天","去铁酮（Deferiprone）口服75-100 mg/kg/天分3次，或长效片每日2次（3岁及以上）","羟基脲用于中间型β地中海贫血：起始10 mg/kg/天，可渐增至20 mg/kg/天","大多数患者需补充维生素D、维生素C和锌"],"treatment":["重型（依赖输血型）需规律红细胞输注，目标维持输血前Hb 9.5-10.5 g/dL","出现明显铁过载（输血约1年后、铁蛋白>1000 ng/mL或肝铁>5000 μg/g干重）即开始铁螯合治疗","脾功能亢进时可考虑脾切除，术前接种荚膜细菌疫苗，术后青霉素预防","HLA匹配兄弟姐妹供体造血干细胞移植可治愈，存活率至少90%","基因治疗（基因添加/基因编辑）已获FDA批准用于依赖输血患者","中间型患者严重临床症状时需输血；椎管髓外造血压迫需局部放疗"],"management":["每半年监测身高、体重、青春期发育及坐姿高度","约5岁起或慢性输血3年后开始内分泌功能监测（甲减、生长、血糖、骨密度）","10岁起定期心脏T2* MRI及心电图监测心脏铁过载","输注期间持续监测输血相关感染（甲肝、乙肝、丙肝、HIV）、同种免疫和输血反应","提供文化敏感的心理社会咨询与社会服务支持"],"notes":["心脏疾病是地中海贫血的主要死因，铁螯合不足时因心衰或心律失常死亡","去铁胺有耳毒、视网膜改变、骨骼发育不良；去铁酮有1-2%粒细胞减少（发热时立即停药查血）；去铁斯若可致肾损伤","中间型患者脾切除后静脉血栓、肺动脉高压、腿部溃疡和隐匿性脑梗死风险增加","HbH病患者应避免铁剂补充和具有氧化作用的药物"],"emergency":["椎管内髓外造血压迫脊髓引起神经系统症状属医疗紧急情况，需立即局部放疗以停止红细胞生成"],"pinyin":"dizhonghaipinxue"},{"name":"获得性再生障碍性贫血","category":"儿科-血液","summary":"获得性再生障碍性贫血是骨髓造血衰竭导致外周血全血细胞减少的疾病，儿童多数为特发性免疫介导（细胞毒性T淋巴细胞抑制造血）。严重程度与骨髓抑制程度相关，治疗包括异基因造血干细胞移植和免疫抑制治疗。","symptoms":["全血细胞减少：贫血（疲劳、苍白、心衰）、中性粒细胞减少（感染）、血小板减少（出血）","出血倾向和感染风险增加","可伴随接触药物/毒素（苯、氯霉素、金、MDMA等）、病毒（细小病毒B19、肝炎、EBV、CMV、HIV）病史"],"diagnosis":["外周血全血细胞减少，至少2系细胞严重受损；重度：ANC<500/mm³、血小板<20,000/mm³、校正网织红细胞<1%","骨髓穿刺+活检示细胞比例低于30%（重度），评估形态、细胞组成和细胞遗传学异常","外周血涂片检查、网织红细胞计数评估红细胞生成活性","染色体断裂分析排查范科尼贫血，端粒长度评估端粒病变，排除遗传性骨髓衰竭","CD55/CD59流式细胞术检测红细胞和粒细胞以排查PNH","详询药物/环境暴露史，筛查肝炎、EBV、CMV、HIV等感染因素"],"infusion":["HLA匹配家族供体异基因造血干细胞移植：常用环磷酰胺、氟达拉滨、马抗胸腺细胞球蛋白预处理","无供体者免疫抑制治疗：马ATG+环孢素（疗效60-70%）","重度中性粒细胞减少（ANC<200/mm³）可联合粒细胞CSF/GM-CSF促进恢复","复发/难治患者可用阿来姆图苏单抗（抗CD52单抗）或匹配无关供体/脐血移植（存活率约90%）"],"oral_medication":["环孢素（口服，与ATG联合的免疫抑制方案，起效中位时间6个月）","艾曲波帕（口服促血小板生成素模拟剂，≥15岁研究显示改善血小板、中性粒细胞和Hb）"],"treatment":["有HLA匹配家族供体者首选异基因造血干细胞移植（长期生存约90%）","无兄弟姐妹供体者采用马ATG+环孢素免疫抑制治疗","复发者约50%对第二次ATG+环孢素有效；部分需持续服用环孢素数年","对免疫抑制无反应或复发者可考虑匹配无关供体移植","高剂量环磷酰胺用于不适合移植且免疫抑制无效者（注意长期严重全血细胞减少和真菌感染风险）","雄激素、皮质类固醇和血浆置换疗效不佳，已不常用"],"management":["全面支持治疗：红细胞/血小板输注、感染防治，参照化疗相关骨髓抑制支持原则","长期中性粒细胞减少患者警惕侵袭性真菌病","长期输血者监测异体抗体并考虑铁螯合治疗","免疫抑制停药后30-60%可能复发，需监测"],"notes":["未经治疗的重度再障6个月内总死亡率约50%，总体超过75%，主要死于感染和出血","约65%初诊中度再障仅观察者会进展为重度","获得性再障可携带与MDS/AML相关的体细胞变异，有进展风险，需长期监测","外周血原始网织红细胞计数高者免疫抑制治疗反应率和生存率更高"],"emergency":["严重血小板减少所致致命性出血、长期中性粒细胞减少所致严重细菌感染及侵袭性真菌病为主要危重并发症"],"pinyin":"huodexingzaishengzhangaixingpinxue"},{"name":"血友病A/B","category":"儿科-血液","summary":"血友病A（因子VIII缺乏）和血友病B（因子IX缺乏）是最常见的严重遗传性出血性疾病，X连锁遗传。出血严重程度与残留因子活性相关（重度<1%），以关节和肌肉出血为特征，需因子替代和预防治疗。","symptoms":["关节出血为特征（最早常在踝关节，大龄儿童多见于膝、肘），可自发或轻微创伤后发生","肌肉血肿；髂腰肌出血可致大量失血、低血容量休克，髋关节屈曲内旋","新生儿期1-4%颅内出血；包皮环切术后出血、口腔黏膜/舌系带损伤后持续出血","容易淤青；重度患者自发出血，中度（1-5%）轻微创伤过度出血，轻度（5-40%）重大创伤或手术后出血","同一关节反复出血可发展为靶关节和慢性关节病（滑膜增厚、软骨侵蚀、关节融合）"],"diagnosis":["PTT延长（重度为正常上限2-3倍），血小板计数、PT、出血时间正常","因子VIII/IX特异性活性测定确诊（1 IU/mL=100%正常活性）","正常血浆混合可纠正PTT（除非存在抑制剂）；Bethesda测定量化抑制剂滴度","X连锁遗传，基因检测（F8/F9位于X染色体长臂）有助于诊断、产前检测和携带者识别","新生儿期注意：因子VIII可因急性期反应人为升高，因子IX生理性偏低至约6个月"],"infusion":["血友病A关节出血：第1天因子VIII浓缩剂50-60 IU/kg，次日20 IU/kg，至关节功能恢复正常","血友病B关节出血：第1天因子IX浓缩剂80-100 IU/kg，次日40 IU/kg","危及生命/大手术：A型50-75 IU/kg后维持谷浓度>50 IU/dL；B型80-120 IU/kg后维持>40 IU/dL","因子IX剂量公式：剂量(IU)=期望提升量×体重(kg)×1.3","轻度A型可用去氨加压素0.3 μg/kg静脉或鼻内150-300 μg刺激自身因子VIII释放；B型无效","抑制物患者急性出血使用旁路剂：活化凝血酶原复合物浓缩物或重组活化因子VII","艾米珠单抗（A型预防）皮下注射，每周/每2周/每4周方案，模拟因子VIII功能","预防治疗（重度患者）：标准半衰期因子每周静脉注射2-4次，维持可测因子水平1-2%"],"oral_medication":["黏膜出血使用抗纤溶药：氨甲环酸或氨基己酸（可口服或静脉给药）","血尿：卧床休息、1.5倍维持液，控制不佳时可使用泼尼松（HIV阴性者）"],"treatment":["按需治疗：急性出血补充缺乏因子，轻中度出血提升至约50%活性，危及生命出血达100%","预防治疗为重度儿童常规方案，可减少灾难性出血并维护关节健康","延长半衰期因子产品可减少注射次数；非因子疗法（艾米珠单抗、费图西兰siRNA）促进止血","基因治疗（瓦洛克托科吉、埃特拉纳科吉）在成人重度患者中显示减少出血的疗效","支持性护理：避免阿司匹林及其他影响血小板功能的NSAIDs，避免高风险接触性运动","抑制物高滴度者行免疫耐受诱导（约2/3重度A型有效），低滴度可加大因子剂量克服"],"management":["由全面血友病护理中心多学科团队（医生、护士、骨科、理疗、社工）管理","年幼儿童预防治疗常需中心静脉导管，注意导管感染和血栓并发症","女性携带者因子水平<40%按血友病治疗；有症状携带者需评估","创伤预防教育：汽车安全座椅、安全带、自行车头盔","早期心理社会干预，帮助家庭在过度保护与放任之间平衡"],"notes":["20-30%重度A型、3-10%重度B型产生中和抗体（抑制剂），通常发生于约20次因子暴露后","慢性关节病是主要长期并发症；髋部关节积血建议骨科评估预防股骨头缺血性坏死","现代血浆衍生产品传播已知血源性病原体风险极低，但新兴病原体风险难完全排除","接受预防治疗的患者可能更不善于识别出血症状，教育至关重要"],"emergency":["生命威胁性出血（中枢神经系统、上呼吸道、消化道、髂腰肌出血）需立即因子替代至100%活性水平","头部创伤达到需放射学检查程度时，应在影像检查前先给予凝血因子替代治疗","髂腰肌出血可致低血容量性休克，疑诊时需超声、CT或MRI确认"],"pinyin":"xueyoubinga/b"},{"name":"镰状细胞病","category":"儿科-血液","summary":"镰状细胞病是β-珠蛋白基因第6密码子单碱基突变（HbS）导致的遗传性血红蛋白病，纯合子（HbSS）即镰状细胞贫血。表现为慢性溶血、血管阻塞性疼痛、感染风险增高及多器官损伤，由新生儿筛查早期发现并转诊至儿科血液专科管理。","symptoms":["急性血管阻塞性疼痛发作，常位于胸部、腹部、四肢，可因感染、脱水、缺氧、寒冷诱发","手足综合征（婴幼儿早期表现）：双手和/或双脚对称性或单侧肿胀","慢性溶血性贫血，HbS多聚化致红细胞镰变、寿命缩短，伴一氧化氮代谢异常和内皮功能障碍","急性胸部综合征：发热、胸痛、缺氧、咳嗽及胸部X线新发浸润影，可快速进展","急性脾隔离（多见于6月龄-2岁）：脾脏迅速肿大、腹痛、Hb骤降至<3 g/dL","神经系统并发症：缺血性卒中、无症状脑梗死（HbSS约35%）、头痛、癫痫、PRES","其他：阴茎异常勃起、血管性坏死（股骨头）、视网膜病变、肾损害、肺动脉高压、夜间遗尿"],"diagnosis":["新生儿筛查（等电聚焦/HPLC）可识别HbFS（提示HbSS、HbSβ0等）、FSA（HbSβ+）、FSC等表型","血红蛋白电泳：HbSS中HbS约占总Hb 90%；复合杂合子（HbSC、Sβ地中海贫血等）HbS占50%以上","全血细胞计数、网织红细胞、外周血涂片；疑似HPFH者行β-珠蛋白基因型分子检测","经颅多普勒超声筛查卒中风险：平均最大血流速度≥200 cm/s异常，≥220 cm/s需干预","MRI评估无症状脑梗死；肝铁MRI、血清铁蛋白评估输血相关铁过载"],"infusion":["发热/菌血症时静脉头孢曲松或第三代头孢菌素；重症（低血压、缺氧等）需住院评估","红细胞输注用于急性并发症（ACS、脾隔离、中风、再生障碍危象），目标Hb不超过10 g/dL","急性中风在发病2小时内输血或交换输血，目标将HbS降至30%以下","自动红细胞置换术用于长期输血（减少铁负荷），配型需C、E、Kell抗原匹配","克瑞赞利珠单抗（P-选择素抑制剂）每月静脉注射，用于16岁及以上患者减轻急性疼痛"],"oral_medication":["预防性青霉素VK：3岁以下125 mg每日2次，3岁以上250 mg每日2次，至少持续5年","羟基脲：起始15-20 mg/kg/天，无毒性时每8周增加5 mg/kg，最大35 mg/kg/天，推荐9个月起用","口服L-谷氨酰胺可减少5岁及以上儿童的住院次数和镰状细胞病发作","Voxelotor（镰状血红蛋白聚合抑制剂）获FDA批准用于4岁及以上，减少溶血","对青霉素过敏者以红霉素乙基琥珀酸酯替代"],"treatment":["所有HbSS患儿9个月起推荐羟基脲治疗，监测全血细胞计数（每4周/调整剂量后，后每8-12周）","发热时立即医学评估并给予抗生素（属医疗紧急情况）","急性疼痛：对乙酰氨基酚/NSAIDs起始，必要时口服或静脉阿片类，个体化疼痛管理计划","急性胸部综合征：补氧、经验性抗生素（第三代头孢菌素+大环内酯类）、激励式肺活量计、必要时输血","预防性青霉素+接种肺炎球菌、脑膜炎球菌疫苗及每年流感疫苗","异常TCD、复发性中风或ACS者长期输血/交换输血保持HbS<30%，可过渡至羟基脲","造血干细胞移植（HLA匹配兄弟姐妹供体）及基因治疗（Casgevy/Lyfgenia，12岁以上）为治愈性/根治手段","脾隔离缓解后预防性脾切除术可防止危及生命复发；术前接种脑膜炎球菌、肺炎球菌疫苗"],"management":["2-16岁每年TCD筛查；异常值1周内复测，临界值3个月内复测","家长每日脾脏触诊训练，发热立即就医；强调青霉素依从性和疫苗接种","学龄前HbSS患儿行无镇静MRI筛查脑缺血；有梗死需持续认知学业评估","10岁前开始每年眼科筛查视网膜病变（SC型风险更高）","长期输血者每年查乙肝、丙肝、HIV，每1-2年评估铁过载并开始螯合治疗","每年筛查哮喘及下呼吸道症状、夜间遗尿及行为健康问题（焦虑、抑郁）"],"notes":["发热合并严重细菌感染（肺炎链球菌、Hib、脑膜炎奈瑟菌、沙门氏菌）是主要死亡原因，脾功能于5岁前大多丧失","输血可致异体免疫和铁过载；近期输血后出现疼痛、尿色深、黄疸加重需排查延迟性溶血反应","羟基脲属妊娠D级药物，需告知避孕；主要副作用为可逆性骨髓抑制","无并发症急性疼痛不建议常规输血；积极静脉补液不能缓解或预防疼痛","基因治疗Lyfgenia存在脱靶编辑/急性髓系白血病风险的黑箱警告"],"emergency":["发热（尤其伴低血压、缺氧、体温>40℃、严重疼痛、贫血等高风险因素）需紧急评估并住院处理","急性脾隔离危及生命，需等渗液体和输血稳定，仅输5 mL/kg红细胞并防止高粘血症","急性局灶性神经功能缺损需立即神经科评估、给氧维持血氧>96%、2小时内输血","阴茎异常勃起持续>4小时需泌尿科介入（海绵体抽吸+稀释肾上腺素冲洗）","急性胸部综合征进展性缺氧、呼吸窘迫或Hb骤降者需输血/交换输血，严重者入住ICU"],"pinyin":"lianzhuangxibaobing"},{"name":"原发性免疫缺陷病（先天免疫缺陷）","category":"儿科-风湿免疫","summary":"原发性免疫缺陷病（PID）包括超过450种影响免疫系统发育或功能的疾病，多由单基因突变引起。先天免疫系统缺陷可导致对特定病原体（病毒、真菌、细菌、分枝杆菌）的易感性增加，是反复严重感染的重要原因。","symptoms":["反复或侵袭性细菌感染：脑膜炎、败血症、关节炎、骨髓炎、深部脓肿（常由肺炎链球菌、金黄色葡萄球菌、铜绿假单胞菌）","慢性黏膜皮肤念珠菌病（口腔、皮肤、指甲、生殖器黏膜持续或复发感染）","病毒感染易感：HPV疣、HSV脑炎、疱疹病毒、EBV严重感染","分枝杆菌病易感：非结核分枝杆菌（NTM）、BCG播散、沙门氏菌感染","侵袭性化脓菌感染可不伴发热及炎症标志物升高（如IRAK4/MYD88缺陷）"],"diagnosis":["基因测序（SCID基因检测或全面PID基因检测）","淋巴细胞表型分析：T/B/NK细胞计数（如X-SCID缺乏T和NK细胞、B细胞正常或升高）","免疫球蛋白水平检测（IgA、IgG、IgM）","感染类型提示缺陷部位：侵袭性化脓菌无发热提示TLR通路缺陷；分枝杆菌易感提示IL-12/IFNγ/STAT1通路缺陷","新生儿SCID筛查（干血斑TRECs检测）","特定检测：DHR（慢性肉芽肿病）、IL-17信号通路评估（慢性黏膜皮肤念珠菌病）"],"infusion":["静脉免疫球蛋白G替代治疗（严重抗体缺陷如无丙种球蛋白血症、CVID；IgG谷值维持在800mg/dL以上）","造血干细胞移植（SCID、完全DiGeorge等，可根治免疫缺陷）"],"oral_medication":["磺胺甲噁唑-甲氧苄啶（PJP预防，SCID、CD40LG缺陷、STAT3高IgE综合征、CGD等）","氟康唑/伊曲康唑（真菌预防：慢性黏膜皮肤念珠菌病、CGD）","阿昔洛韦/伐昔洛韦（病毒预防：HSV/VZV反复感染、NEMO缺陷）","阿奇霉素/克拉霉素（分枝杆菌预防及抗炎，IFNγ/IL-12通路缺陷、NEMO缺陷）","青霉素预防（补体末端通路缺陷预防奈瑟菌感染、脾切除后）"],"treatment":["抗菌预防是PID感染预防的主要手段，具体方案因PID类型而异","SCID需异基因造血干细胞移植，移植前严格防感染（限制接触、停母乳直至CMV状态明确）","严重抗体缺陷：终生免疫球蛋白替代治疗为主","反复呼吸道感染可加用预防性抗生素（如低剂量阿奇霉素）","IRAK4/MYD88缺陷：抗生素预防+疫苗接种（肺炎球菌、Hib、脑膜炎球菌），反应不佳考虑免疫球蛋白替代"],"management":["严格手部清洁；高传播感染流行期佩戴口罩","大多数PID禁用活疫苗（BCG、活流感疫苗、OPV等），密切接触者建议接种推荐疫苗","侵入性牙科手术前抗生素预防","SCID婴儿限制接触人数，监测胆红素（2月龄以下慎用SMZ-TMP）","帕利珠单抗用于2岁以下PID儿童RSV季节预防"],"notes":["SCID若不行移植通常致死；IRAK4缺陷侵袭性感染在青春期后多自行改善","STAT1 GOF可伴自身免疫、颅内动脉瘤、鳞状细胞癌，需前瞻性影像筛查","反复唑类抗真菌治疗可致耐药，需培养+药敏指导","补体缺陷（C5-C9）与反复奈瑟菌感染相关"],"emergency":["严重暴发性EB病毒感染伴HLH（发热、肝脾肿大、全血细胞减少、多器官衰竭）需紧急处理","侵袭性细菌感染（脑膜炎、败血症）需立即经验性抗生素并住院","播散性BCG/NTM感染需专科抗分枝杆菌治疗","严重病毒血症或疫苗株病毒病（IFN通路缺陷）需抗病毒治疗"],"pinyin":"yuanfaxingmianyiquexianbing（xiantianmianyiquexian）"},{"name":"幼年特发性关节炎","category":"儿科-风湿免疫","summary":"幼年特发性关节炎（JIA）是儿童最常见的风湿性疾病，是一组异质性慢性关节炎疾病（ILAR分类），诊断需关节炎≥6周；少关节型最常见（40-50%），其次多关节型（25-30%）和系统性JIA（5-15%）。治疗以NSAIDs、甲氨蝶呤及生物制剂（TNF-α、IL-1、IL-6抑制剂）为核心，需定期裂隙灯筛查葡萄膜炎。","symptoms":["关节炎诊断标准：关节内肿胀或存在活动范围受限、活动时疼痛或压痛、关节发热中两种以上表现；需持续≥6周","常见症状：早晨僵硬、活动后跛行或关节僵硬、易疲劳和睡眠质量差","少关节型：前6个月内≤4个关节受累，多累及下肢大关节（膝、踝），可发展为扩展型；ANA阳性增加无症状前葡萄膜炎风险","多关节型：上下肢≥5个关节炎症；RF阳性者呈对称性表现类似成人RA，可伴类风湿结节、小颌症、颈椎受累（寰枢椎半脱位风险）","系统性JIA：≥39°C弛张热每日/隔日出现持续至少2周，伴短暂鲑鱼色淡红斑疹（躯干四肢近端，<1小时）、肝脾淋巴结肿大、浆膜炎（心包炎）","受累关节肿胀、触暖、活动受限但通常无红斑；大关节炎症可致肢体长度差异，持续炎症使生长板提前闭合致骨骼缩短","骨密度降低（骨质减少）与疾病活动度增加有关","慢性前葡萄膜炎常无症状，可致后粘连、白内障、青光眼、带状角膜病变和失明"],"diagnosis":["JIA为临床诊断，无需实验室检测，但必须仔细排除其他疾病","实验室检查：ANA（40-85%少关节型或多关节型升高）、RF（5-15%多关节型阳性）、抗环瓜氨酸肽抗体（疾病进展标志）、ESR和CRP（可为正常）、铁蛋白","放射学：软组织肿胀、关节周围骨量减少、骨膜新生骨；持续活动性疾病致软骨下侵蚀和软骨丧失；MRI较X线更敏感","需排除感染（化脓性关节炎、莱姆病、Kingella kingae）、恶性肿瘤（白血病、神经母细胞瘤）、SLE、幼年皮肌炎、风湿热、血管炎、炎症性肠病等","MAS诊断标准：血清铁蛋白>684ng/mL+下列任意两项：血小板减少（≤181×10^9/L）、肝酶升高（AST>48U/L）、高甘油三酯血症（>156mg/dL）、低纤维蛋白原血症（≤360mg/dL）","系统性JIA发热需排除感染、自身炎症性疾病、恶性肿瘤及噬血细胞性淋巴组织细胞增生症"],"infusion":["英夫利昔单抗3-10mg/kg静脉输注q4-8周（抗TNF-α，治疗多关节炎和严重葡萄膜炎）","MAS紧急治疗：高剂量静脉注射甲基泼尼松龙","阿那白滞素（IL-1受体拮抗剂）：全身症状严重的sJIA可直接使用","托珠单抗（IL-6受体拮抗剂）已批准用于2岁以上sJIA"],"oral_medication":["萘普生15mg/kg/d分bid（最大500mg bid）","布洛芬40mg/kg/d分tid（最大800mg tid）","美洛昔康0.125mg/kg每日一次（最大15mg/d）","甲氨蝶呤0.5-1mg/kg每周一次口服或皮下（最大25mg/周），需6-12周起效","柳氮磺吡啶：起始12.5mg/kg/d，每增加10mg/kg/d至维持量40-50mg/kg/d分bid（最大2g/d）","来氟米特10-20mg/d口服","依那西普0.8mg/kg每周一次皮下（或0.4mg/kg每周两次，最大50mg/周）","阿达木单抗（抗TNF-α）治疗多关节炎和严重葡萄膜炎","阿巴西普（选择性抑制T细胞激活）、卡那奴单抗（IL-1β抑制剂）","托法替尼（JAK抑制剂）已批准用于2岁以上多关节JIA","全身性皮质类固醇（泼尼松/泼尼松龙）仅用于严重全身性疾病、DMARD起效前过渡及控制葡萄膜炎"],"treatment":["治疗目标：实现疾病缓解、预防或阻止关节损伤、促进正常生长发育；根据疾病类型、严重程度、不良预后指标和药物反应个体化治疗","寡关节炎：NSAIDs→4-6周无/部分反应或存在功能障碍（关节挛缩、腿长差异）者关节内皮质类固醇注射（曲安奈德长效）→DMARDs（甲氨蝶呤）→生物制剂（TNF抑制剂）","多关节炎：NSAIDs单用很少足够，甲氨蝶呤为毒性最低的辅助用药；单用甲氨蝶呤无效或病情严重者加用TNF-α拮抗剂等生物制剂，早期联合治疗有助于更早缓解","系统性JIA：全身症状占主导时用全身性皮质类固醇，随后IL-1或IL-6拮抗剂治疗（阿那白滞素、卡那奴单抗、托珠单抗），通常带来迅速且显著效果","全身性皮质类固醇存在严重副作用（库欣综合征、生长迟缓、骨量减少）且无法防止关节破坏，应尽量减少使用","JAK抑制剂（托法替尼）可作为csDMARDs和bDMARDs的替代选择"],"management":["定期裂隙灯眼科检查监测无症状葡萄膜炎（按发病年龄和亚型确定筛查频率，如少关节型ANA阳性且<3岁发病者筛查8年）","葡萄膜炎治疗需眼科与风湿科合作：扩瞳药和皮质类固醇（局部、全身或眼周注射），甲氨蝶呤和TNF-α抑制剂（阿达木单抗、英夫利昔单抗）对严重葡萄膜炎有效","饮食评估确保适当的钙、维生素D、蛋白质和热量摄入","物理治疗和职业治疗是治疗计划的宝贵辅助","社会工作者和护士协助家庭应对慢性疾病压力、寻找社区资源并帮助依从治疗","腿长差异可在较短一侧使用鞋垫防止继发性脊柱侧弯；关节挛缩需积极控制关节炎并配合拉伸治疗"],"notes":["未使用TNF-α治疗时代的研究显示高达50%JIA患者疾病持续到成年早期并常致严重功能受限","慢性前葡萄膜炎可导致失明，通过早期诊断和系统性治疗可避免；少关节型（ANA阳性、6岁前发病女性）葡萄膜炎风险最高","SJIA可并发MAS（罕见但可能致命），可在发病时、换药时或缓解期发生，需紧急识别和治疗","JIA相关肺部疾病（肺泡蛋白沉积症和/或内源性脂质性肺炎）罕见但危及生命，可几乎无呼吸症状，急性杵状指可能为早期预警","骨密度降低与疾病活动度增加有关，骨骼成熟异常在青春期生长高峰最明显","预后不良因素：发病年龄小、RF或抗CCP抗体阳性、受累关节多、髋及手/腕受累；SJIA中发热>3个月、炎症指标持续升高>6个月提示预后差","心理并发症（上学和社交问题）可通过心理健康专业人员咨询缓解"],"emergency":["MAS紧急表现：急性高发热、淋巴结肿大、肝脾肿大、脑病、血细胞减少、肝酶/LDH/铁蛋白/甘油三酯升高，需紧急大剂量甲泼尼龙、环孢素或阿那白滞素治疗","疑似JIA相关肺部疾病（即使无呼吸症状）需高度警惕并迅速评估","颈椎受累出现神经功能损害征象需警惕寰枢椎半脱位","JIA诊断或怀疑时应立即转诊儿科风湿病专家（最迟不超过6周）；有症状的眼部症状应于转诊后一周内检查"],"pinyin":"yntfxgjy"},{"name":"幼年皮肌炎","category":"儿科-风湿免疫","summary":"青少年特发性炎症性肌病中最常见类型（占85%），特征为近端肌肉无力及面部和伸肌表面的特征性皮疹，发病高峰年龄7岁。","symptoms":["典型皮疹：眼睑紫红色向阳疹、Gottron丘疹（掌指及指间关节背侧鲜红/苍白增厚斑块）","光敏性皮疹（披肩征）、甲周及牙龈毛细血管扩张","对称性近端肌无力（颈部屈肌、肩带、髋屈肌），戈威征（手撑大腿站起）","疲劳、肌肉压痛、发热","吞咽困难、声音嘶哑、鼻音，有吸入性肺炎风险","关节炎/关节痛、钙化症、脂营养不良"],"diagnosis":["诊断标准：典型皮疹+至少3项（对称近端肌无力、肌酶升高、肌电图异常、肌活检示坏死/炎症）","肌酶升高：肌酸激酶、醛缩酶、AST、ALT、LDH","肌炎特异性抗体：抗Mi2、抗TIF1γ、抗NXP2、抗MDA5、抗合成酶抗体（Jo-1等）","MRI（T2加权+脂肪抑制）识别活动性炎症部位、指导活检","ANA阳性（80%）；ESR多正常、RF多阴性","对比剂吞咽检查评估腭部功能与吸入风险；肺功能测试评估限制性缺陷"],"infusion":["重症（呼吸/口咽无力）：高剂量脉冲甲基泼尼松龙30mg/kg/日×3天（最大日剂量1g），每周或每月一次","静脉免疫球蛋白2g/kg（最高70g），每2周一次×3次，之后每4周一次（重症/难治性）","甲氨蝶呤可静脉给药（1mg/kg或15mg/m²，取较低者，每周）"],"oral_medication":["泼尼松2mg/kg/日（每日最大60mg），12个月内逐渐减量","甲氨蝶呤1mg/kg或15mg/m²每周，同时予叶酸每日1mg减轻毒性","羟氯喹4-6mg/kg/日（辅助控制皮疹、维持缓解）","难治性：霉酚酸酯、环孢素、环磷酰胺、JAK抑制剂（托法替尼、巴瑞克替尼、鲁索替尼）","所有患者补充维生素D和钙"],"treatment":["皮质类固醇是主要治疗，显著降低死亡率和发病率","甲氨蝶呤缩短皮质类固醇使用时间（可减少约一半类固醇用量）","IVIG用于重症初始治疗和难治性疾病，可减少类固醇使用","避免阳光照射，每日使用高SPF防晒霜（即使冬季或阴天）","物理治疗和职业治疗：早期被动拉伸，之后直接肌肉锻炼恢复力量和活动范围；不需卧床休息"],"management":["服用羟氯喹者每年眼科检查监测罕见视网膜毒性","服用免疫抑制剂时避免活疫苗，建议每年灭活流感疫苗","监测吞咽功能和呼吸功能（持续测量肺活量、负吸气力）","家属了解皮质类固醇副作用，佩戴医疗警示标识，营养师咨询低盐低脂饮食","社会工作及心理服务支持"],"notes":["皮质类固醇应用后死亡率从33%降至约1%","并发症：钙化症（结节性肌炎儿童高达40%）、脂营养不良（10-40%）、胃肠道血管炎","成人皮肌炎与恶性肿瘤相关，儿童中极罕见","7年随访75%几乎无残留残疾，25%持续慢性虚弱，40%慢性皮疹"],"emergency":["呼吸肌无力可致呼吸衰竭（高碳酸血症为主），需紧急评估并可能需要机械通气","吞咽困难/咽部无力需鼻胃管或胃造口喂养，防止吸入性肺炎","剧烈腹痛和隐匿性消化道出血提示肠壁血管炎，需完全肠道休息，可能缺血、出血、穿孔"],"pinyin":"younianpijiyan"},{"name":"系统性红斑狼疮","category":"儿科-风湿免疫","summary":"慢性自身免疫性疾病，以多系统炎症及循环中存在针对自身抗原的自身抗体为特征。儿童和青少年发病者病情更重、器官受累范围更广，最常见受累部位为皮肤、关节、肾脏、造血细胞、血管及中枢神经系统。","symptoms":["儿童最常见症状：发热、疲劳、血液系统异常、关节疼痛及关节炎","颧部（蝶形）皮疹、盘状皮疹、光敏性皮疹、口腔及鼻腔溃疡、脱发、雷诺现象","肾脏受累常无症状，可表现为高血压、蛋白尿、血尿、水肿、肾病综合征甚至肾衰竭","神经精神症状：癫痫发作、精神病、卒中、横贯性脊髓炎、认知障碍、头痛","浆膜炎（心包炎、胸膜炎）、溶血性贫血、白细胞/血小板减少、淋巴结肿大"],"diagnosis":["抗核抗体（ANA）敏感性95-99%，2019 EULAR/ACR标准要求滴度≥1:80","抗dsDNA和抗Sm抗体对SLE特异性约98%；抗dsDNA与疾病活动度尤其肾炎相关","活动期补体（CH50、C3、C4）降低","分类标准：1997 ACR、2012 SLICC、2019 EULAR/ACR","肾活检确诊狼疮性肾炎并评估严重程度（ISN分级）","抗磷脂抗体检测（狼疮抗凝物、抗心磷脂、抗β2糖蛋白抗体）"],"infusion":["重症：静脉甲基泼尼松龙30mg/kg/日×3天（每次最高1000mg）","狼疮性肾炎诱导：环磷酰胺静脉（NIH方案每月500-1000mg/m²）或霉酚酸酯600mg/m²每日两次（最高1500mg/日）","贝利木单抗静脉10mg/kg（≥5岁儿童SLE）"],"oral_medication":["羟氯喹≤5mg/kg/日（每日最大400mg），所有SLE患者推荐使用","泼尼松口服（重症起始1mg/kg/日）","甲氨蝶呤、来氟米特、硫唑嘌呤（中度持续疾病：关节炎、严重皮肤/血液受累、胸膜疾病）","霉酚酸酯、硫唑嘌呤（狼疮性肾炎维持治疗≥30个月）","无血栓史但抗磷脂抗体阳性者：阿司匹林每日81mg","所有患者补充钙和维生素D"],"treatment":["防晒霜及避免紫外线暴露，每次就诊确认","羟氯喹可防止发作、改善血脂及预后","皮质类固醇用于严重症状并尽快减量，辅以类固醇替代免疫抑制剂","狼疮性肾炎：6个月诱导治疗（环磷酰胺或霉酚酸酯+标准化糖皮质激素方案），缓解不佳者更换药物","贝利木单抗联合标准治疗改善肾性及非肾性狼疮指标","环磷酰胺用于危及生命表现（肾脏、神经系统、心肺），注意水化防出血性膀胱炎"],"management":["服用羟氯喹者每年眼科检查（自动视野测试、光谱域OCT）筛查视网膜毒性","筛查心血管风险因素（胆固醇、血压、吸烟、BMI），可考虑他汀类","常规免疫接种：每年流感疫苗、SARS-CoV-2疫苗、HPV疫苗；6岁以上者接种PPSV23","抑郁症筛查、同伴支持和认知行为治疗","青春期女孩妊娠咨询，孕期全程使用羟氯喹","多学科团队随访，平稳过渡至成人风湿科"],"notes":["高收入国家5年/10年生存率99%/97%","早期死亡原因：感染、狼疮性肾炎、神经精神并发症；远期：动脉粥样硬化、恶性肿瘤","感染尤其肺炎球菌性疾病常见，发热需迅速评估排查严重感染","ANA滴度不反映疾病活动度，重复检测无实际意义"],"emergency":["发热需评估感染、疾病发作或巨噬细胞活化综合征","血栓或咯血：评估抗磷脂综合征（动静脉血栓）","胸痛、呼吸困难：胸膜炎、心包炎、肺泡出血、肺梗死/栓塞","意识改变、新发癫痫、高血压危象、卒中征象","瘀点：血栓性血小板减少性紫癜（TTP）"],"pinyin":"xitongxinghongbanlangchuang"}];
const PED_SYMPTOMS_RAW = [{"symptom":"休克","department":"其他科","summary":"休克是组织灌注不足导致氧输送不能满足机体代谢需求的状态，取决于心输出量（心率×每搏量）。儿童最常见为低血容量性休克（胃肠炎所致），失代偿性休克（血压异常）死亡率高。评估与处理的关键是先稳定气道-呼吸-循环（ABCs），再确定休克类型以指导治疗。","approach":["先评估 ABCs（气道、呼吸、循环）及 DE（残疾、暴露），识别需紧急复苏的休克","持续监测生命体征（心率、血压、氧合），迅速建立血管通路（骨内通路可在2分钟内建立）","20 mL/kg 等渗晶体液快速扩容；根据液体反应判断休克类型（无反应提示心源性/梗阻性）","识别可逆病因：创伤活动性出血、张力性气胸、心脏压塞、过敏性休克、心律失常、出生后1月内导管依赖型先心病（启动 PGE）","脓毒性休克第一小时给予广谱抗生素，目标导向液体复苏+血管活性药","详细病史与体格检查定位病因（胃肠炎、感染、创伤、皮疹、过敏等）"],"causes":[{"group":"常见","items":["低血容量性休克（胃肠炎/创伤失血）","脓毒性休克（感染性）","过敏性休克","神经源性休克（脊髓损伤）"]},{"group":"少见","items":["心源性休克（心肌病、心肌炎、心律失常、左心梗阻性病变）","梗阻性休克（张力性气胸、心脏压塞、肺栓塞）","分离性休克（严重贫血、一氧化碳中毒、高铁血红蛋白血症、氰化物中毒）"]}],"red_flags":["失代偿性休克（出现低血压）—死亡率显著升高","对液体复苏无反应的休克","过敏性休克伴喉头/气道肿胀、支气管痉挛、低血压（可迅速致命）","张力性气胸、心脏压塞、活动性出血（需立即引流/止血的可逆病因）","液体复苏中出现呼吸急促、心动过速、肺水肿或低氧血症","脓毒性休克（尤其<1岁或免疫抑制儿童）","新生儿/婴儿心率代偿空间有限，易快速进展"],"key_history":["末梢器官灌注减少证据：行为/活动改变、意识改变、肌张力低下、尿量减少","感染线索：高热/低热、免疫功能低下、近期患病","液体丢失：口服摄入减少、尿量/粪量增加（低血容量）","创伤机制（含非故意伤害）；过敏原暴露（喘鸣、哮鸣）","毒物摄入；胸痛、心悸（心律失常）；腹痛（创伤/感染）","末次月经（中毒性休克/妊娠）；虚弱、麻木、运动困难（神经源性）","皮疹（过敏、免疫、感染）；家族史（遗传性心肌病、代谢病）、手术史、出生史"],"key_exam":["ABCs+DE 初步评估；评估气道保护能力与意识状态","呼吸：呼吸急促、不对称呼吸音（气胸/胸腔积液）、喘息（过敏）","循环：心率/心律、中心及外周脉搏、毛细血管再充盈时间、心音（杂音/心音低钝）","生命体征（低血压为晚期表现；1岁以上最低 SBP≈年龄×2+70）","从头到脚查体：瞳孔、黏膜（苍白/干燥）、颈静脉怒张、肝大、皮肤（皮疹/紫癜/皮皱）、股骨骨折、神经学（脊髓损伤征）","暴露找活动性出血，注意避免低体温"]},{"symptom":"关节过度活动症（高活动度综合征）","department":"其他科","summary":"约25%人群报告关节过度活动，多数并非健康隐患，但可与结缔组织疾病相关。评估需从头到脚详细排查综合征性疾病、原发性神经肌肉疾病及其他'模仿者'。诊断主要基于Beighton评分及系统表现/家族史，高活动型Ehlers-Danlos综合征（hEDS）为最常见临床表型。","approach":["用Beighton评分（青春期前≥6、青春期-50岁≥5、>50岁≥4）确认全身性关节过度活动","评估超出关节——从头到脚排查综合征性特征（皮肤、心血管自主神经、肌肉骨骼、神经、胃肠、泌尿生殖）","区分良性家族性过度活动与严重结缔组织病（hEDS、Marfan、各型EDS等）","有学习困难/畸形/重大畸形或疑肌无力/骨发育不良者转诊遗传学/专科","用5项过度活动问卷及hEDS 2017标准综合判断","排除替代诊断（肌张力低下、获得性结缔组织病）"],"causes":[{"group":"常见","items":["良性家族性关节过度活动","高活动型Ehlers-Danlos综合征（hEDS）","高活动度谱系障碍（HSD）"]},{"group":"综合征性/少见","items":["Marfan综合征","同型半胱氨酸尿症","Stickler综合征","经典型/血管型/脊柱侧弯型Ehlers-Danlos综合征","成骨不全症","Williams综合征","21-三体 ,"淋巴组织/扁桃体缺失（B细胞缺陷）、胸腺缺失（T细胞缺陷）","右位心（纤毛异常/无脾）"]},{"symptom":"头痛","department":"其他科","summary":"头痛分为原发性（偏头痛、紧张型头痛、三叉神经自主性神经痛，良性）与继发性（感染、肿瘤、出血、血管病等，部分严重甚至危及生命）。绝大多数儿童头痛为原发性或良性继发性。评估核心是详细病史与体格检查以识别原发头痛并发现提示继发性头痛的红旗征象；神经影像学仅用于特定指征。","approach":["明确头痛表型：偏侧性、部位、时间模式（急性/急性复发性/慢性非进展/慢性进展）、频率、持续时间、性质、严重度、伴随症状、加重/缓解因素","筛查继发性头痛红旗（突发霹雳样、枕部慢性、从睡眠中唤醒、平卧/咳嗽加重、神经功能缺损、视乳头水肿等）","系统回顾既往史（镰状细胞、高血压、肿瘤、先心、自身免疫）与家族史（偏头痛、动脉瘤、脑肿瘤）","全面体格检查，重点生命体征、生长参数、头围、眼底（视乳头水肿）、神经学检查","对存在红旗或检查异常者行神经影像学（MRI 优先，CT 查急性出血）","必要时针对性实验室（CBC、CSF、毒理、ESR/ANA/ANCA、高凝、EEG 等）"],"causes":[{"group":"常见","items":["偏头痛","紧张型头痛（TTH）","病毒感染/上呼吸道感染相关头痛","鼻窦炎","外伤后/脑震荡后头痛","药物过度使用性头痛"]},{"group":"少见/严重","items":["脑肿瘤/占位病变","颅内压增高（特发性颅内高压、脑积水）","蛛网膜下腔出血/动脉瘤","脑膜炎/脑炎","硬膜下/硬膜外血肿","静脉窦血栓","偏头痛变异型（偏瘫型、基底动脉型）"]}],"red_flags":["霹雳样/此生最痛突发头痛（提示蛛网膜下腔出血、动脉夹层、静脉窦血栓）","从睡眠中唤醒、晨起发作或伴晨起呕吐（颅内压增高）","平卧或弯腰/Valsalva 加重","慢性/复发性枕部头痛；单侧无侧别交替","神经功能缺损（局灶性、癫痫、晕厥、视力下降、步态/协调异常、发育倒退）","视乳头水肿、颅高压征象、头围增大/囟门隆起、颈强直","新发无热惊厥/惊厥改变；年龄<6岁或无法描述头痛","肿瘤性头痛（频率/强度逐渐加重）"],"key_history":["偏侧性、部位、时间模式、频率、持续、性质、严重度","伴随症状（恶心、呕吐、畏光畏声、局灶神经症状、发热、晕厥）","夜间痛醒、晨起/平卧加重、Valsalva 相关","诱发因素（创伤、食物、活动、月经）；药物史（含过量）","既往史（镰状细胞、高血压、恶性肿瘤、先心、自身免疫）、家族史、心理社会因素","头痛日记评估频率/诱因/残疾"],"key_exam":["生命体征（高血压提示颅高压/肾性）、生长参数、头围","眼底（视乳头水肿）、颅神经、眼球运动、视野","神经系统（意识、共济失调、步态、协调、反射、运动/感觉、发育倒退）","头颈（鼻塞、鼻窦压痛、颞下颌关节、额骨压痛）、皮肤（咖啡斑、紫癜）","全面淋巴/呼吸/心脏/腹部/泌尿生殖（内分泌）检查"]},{"symptom":"慢性疼痛","department":"其他科","summary":"慢性疼痛定义为持续≥3个月的反复或持续性疼痛，可为明确病因的医学状况或原发性/中枢性疼痛综合征（痛觉过敏、痛觉超敏）。常与其他慢性重叠性疼痛状况共存，与生物-心理-社会因素相关。管理需多学科团队，核心是相信患者、生物-行为模型、逐步增加活动与认知行为疗法；阿片类药物绝对禁用。","approach":["详细家庭/个人史+系统回顾（睡眠、疲劳、焦虑、抑郁、PTSD），识别红旗与潜在器质病因（表33.2）","详细体格检查，评估疼痛信念、灾难化思维、恐惧回避","评估患者及家庭改变准备阶段（前沉思/沉思/行动），决定管理策略","疼痛日记记录疼痛及加重因素（压力、学校等）","多学科团队：药物（辅助）、物理治疗/锻炼、CBT、必要时心理干预","以生物-行为模型为核心，运动激活+CBT，药物仅作临时机会窗口"],"causes":[{"group":"常见","items":["纤维肌痛（FM）","紧张型头痛/偏头痛","功能性腹痛","肌痛性脑脊髓炎/慢性疲劳综合征","颞下颌关节紊乱（TMJ）","肠易激综合征（IBS）"]},{"group":"少见/需排查","items":["小纤维神经病变","复杂区域疼痛综合征","埃勒斯-当洛斯综合征/马凡综合征","系统性红斑狼疮、结节病、幼年特发性关节炎","法布里病、戈谢病、卟啉症、线粒体神经病变","吉兰-巴雷综合征、多发性硬化、 状腺功能减退）","有无头痛、呕吐、视觉障碍（颅内病变/垂体功能减退）","药物史（糖皮质激素）与慢性疾病史","家族史：父母身高、青春期启动时间、有无青春期延迟或生长迟缓家族史"],"key_exam":["精确测量身高体重并绘制生长曲线，计算生长速度","评估身体比例（上段/下段比、臂展）判断是否骨骼发育不良","观察畸形特征（特纳综合征蹼颈、后发际低、淋巴水肿；中线面部缺陷提示垂体功能减退）","甲状腺肿、心动过缓、毛发皮肤干燥、反射迟钝（甲状腺功能减退）","娃娃脸/尖细嗓音、牙齿萌出延迟、相对肥胖（生长激素缺乏）","双颞侧偏盲、视乳头水肿、视神经萎缩、头围加速增大（颅咽管瘤等）","Tanner 青春期分期"]},{"symptom":"酸碱平衡与电解质紊乱","department":"内分泌科","summary":"酸碱或电解质紊乱可解释患者症状，也可能指向特定诊断。正常酸碱平衡由肺（CO₂排出）和肾脏（H⁺排泄与碳酸氢盐重吸收）共同维持；pH<7.35 为酸中毒、>7.45 为碱中毒。代谢性酸中毒按阴离子间隙分类可简化鉴别诊断；钾、钠、钙紊乱均可能导致危及生命的后果。","approach":["获取动脉血气与基础生化（pH、HCO₃⁻、PCO₂、Na⁺、K⁺、Cl⁻），判断原发失衡类型并对照预期代偿值识别混合性失衡","计算阴离子间隙（Na⁺-Cl⁻-HCO₃⁻）：正常间隙（高氯性）代谢性酸中毒考虑腹泻、肾小管性酸中毒；高间隙考虑 DKA、乳酸酸中毒、尿毒症、毒物（水杨酸、乙二醇、甲醇）","代谢性碱中毒按尿氯分型：尿氯<15 mEq/L 为氯敏感型（呕吐、胃引流、利尿剂、低氯配方），补充氯化钠钾可纠正；尿氯>20 mEq/L 为氯抵抗型，再按血压判断（高血压：盐皮质激素过量；正常血压：Bartter/Gitelman 综合征）","低钾血症结合血压、酸碱状态、尿钾（TTKG）与肾素-醛固酮轴评估；高钾血症按 TTKG 分类（<5 提示尿排钾减少，>10 提示摄入增加或组织释放）并查 ECG","低钠血症按容量状态（低/等/高容量）分类：低容量考虑胃肠炎及肾丢失，等容量考虑 SIADH、甲状腺/肾上腺功能减退，高容量考虑心衰、肝硬化、肾病综合征","高钠血症同样按容量分类：等容量最常见病因为尿崩症，评估多尿烦渴史并考虑禁水试验+加压素试验"],"causes":[{"group":"常见","items":["代谢性酸中毒-正常间隙：腹泻、肾小管性酸中毒","代谢性酸中毒-高间隙：糖尿病酮症酸中毒、乳酸酸中毒、慢性肾衰竭","代谢性碱中毒：呕吐、鼻胃管引流、利尿剂","低钾血症：腹泻、呕吐、利尿剂、DKA 恢复期","高钾血症：肾功能衰竭、药物（ACEI、保钾利尿剂）、肿瘤溶解/横纹肌溶解","低钠血症：胃肠炎（低容量）、SIADH、心衰肝硬化肾病综合征（高容量）","高钠血症：腹泻/喂养不良（低容量）、尿崩症（等容量）、医源性/盐中毒（高容量）"]},{"group":"少见","items":["肾小管性酸中毒 I/II/IV 型（含遗传性、继发于两性霉素B、顺铂、自身免疫病）","Bartter 综合征与 Gitelman 综合征","先天性肾上腺增生/Addison 病（醛固酮缺乏）","家族性低钾周期性麻痹","假性醛固酮增多症（Liddle 综合征）","脑性盐耗综合征","中毒（水杨酸、乙二醇、甲醇、丙泊酚输注综合征）","先天性代谢缺陷（GRACILE 综合征等）","低钙血症/高钙血症及佝偻病（维生素 D 缺乏）"]}],"red_flags":["严重酸中毒（pH<7.20）可致低血压、肺水肿和心室停搏，缺氧可加重","严重碱中毒（pH>7.55）可致组织缺氧、手足搐搦、惊厥和心律失常","高钾血症 >7.0 mEq/L 或出现高尖 T 波、QRS 增宽、正弦波等 ECG 改变需立即治疗（钙剂保护心肌、葡萄糖+胰岛素转钾、排钾措施，必要时透析）","严重低钾血症可致致命性室性心律失常，服用地高辛者尤危","低钠血症 <120 mEq/L 可致脑水肿、惊厥、昏迷","高钠血症反复脱水可致永久性神经系统后遗症；纠正过慢为宜（<1 mEq/L/hr）以防脑水肿"],"key_history":["呕吐、腹泻、胃管引流史（代谢性碱中毒、低钾、低氯）","用药史（利尿剂、ACEI、保钾利尿剂、碳酸酐酶抑制剂、两性霉素B、锂盐等）","饮食与配方奶史（低氯配方、过量饮水致水中毒）","慢性肺病史（CO₂潴留、支气管肺发育不良、囊性纤维化）","多尿烦渴夜尿史（尿崩症）、口渴缺失","家族史（Bartter/Gitelman、家族性周期性麻痹、肾小管酸中毒）","新生儿羊水过多、早产史（Bartte ","指端杵状指（提示慢性破坏性肺病如CF、支气管扩张）"]},{"symptom":"咽喉痛","department":"呼吸科","summary":"咽喉痛可由感染（病毒/细菌/真菌）、刺激物、肿瘤及多种全身性疾病引起。评估重点是在常见病毒性或A组链球菌（GAS）咽炎中识别危重病因（会厌炎、咽旁/咽后脓肿、Lemierre综合征），并规范评估GAS以预防急性风湿热。","approach":["先评估气道危重征象（流涎、喘鸣、tripod体位、声音改变），疑会厌炎/咽后脓肿者立即请耳鼻喉科并保持气道","详细病史：起病缓急、持续时间、病毒 vs 细菌症状、接触史、免疫状态","体格检查：咽部充血/渗出、扁桃体大小与对称性、颈淋巴结、皮疹、腹肝脾大","鉴别GAS与病毒：结合临床特征（Centor/McIsaac），以RADT/咽培养/NAAT确诊","识别警示征象及化脓性并发症（扁桃体周围脓肿、咽后间隙脓肿）"],"causes":[{"group":"常见","items":["病毒性咽炎（腺病毒、肠病毒/疱疹性咽峡炎、手足口病、HSV龈口炎、EBV传染性单核细胞增多症）","A组β溶血性链球菌（GAS）咽炎","猩红热","复发性阿弗他溃疡","刺激物/反流（烟雾、GERD、过敏性鼻炎、化学毒素）"]},{"group":"少见/危重","items":["会厌炎","扁桃体周围脓肿（quinsy）","咽后间隙脓肿","颈下（Ludwig）间隙感染","Lemierre综合征（坏死梭杆菌）","白喉","川崎病","PFAPA综合征","贝赫切特病","系统性红斑狼疮","文森咽峡炎","肉芽肿性多血管炎","异物、茎突综合征","肿瘤（白血病、卡波西肉瘤）"]}],"by_age":[{"age":"幼儿（<4岁）","common":["疱疹性咽峡炎/手足口病（3-10岁）","疱疹性龈口炎（<5岁）"],"uncommon":["咽后间隙脓肿（4岁以下最常有）","会厌炎（2-5岁）"]},{"age":"学龄儿童（3-15岁）","common":["A组链球菌（GAS）咽炎（高峰5-11岁）","猩红热"],"uncommon":["川崎病（通常<5岁）"]},{"age":"青少年","common":["传染性单核细胞增多症（EBV）","GAS咽炎"],"uncommon":["扁桃体周围脓肿（年长儿及青少年）","Lemierre综合征（teens）"]}],"red_flags":["中毒外观、休克","发热>2周或咽痛>2周","吞咽困难、牙关紧闭（锁颌）","喘鸣音、流涎、声音嘶哑","发绀、出血、扁桃体或颈部淋巴结不对称肿大","呼吸困难（气道梗阻或肺炎）、怀疑咽旁间隙感染","怀疑白喉（牛颈、软腭麻痹、厚膜）","呼吸停止、剧烈且无法缓解的疼痛","tripod体位（端坐呼吸）、热土豆音/闷哑嗓音、胸骨或颈部痛、体重减轻"],"key_history":["起病缓急与咽痛持续时间","病毒症状（咳嗽、流涕、结膜炎、腹泻）vs 细菌症状（突发高热、腹痛、呕吐）","GAS接触史；免疫状态（中性粒细胞减少等）","吞咽/流涎/张口困难","既往史（川崎病、PFAPA、复发性阿弗他溃疡）"],"key_exam":["咽部充血与扁桃体渗出、对称性及大小","颈淋巴结（前/后组）肿大与压痛","皮疹：猩红热砂纸样疹、Pastia线、草莓舌、口周苍白","软腭瘀点（GAS提示）","声音改变（热土豆音）、流涎、tripod体位","牙关紧闭、咽后壁肿块"]},{"symptom":"右向左分流伴发绀性病变的杂音","department":"心血管科","summary":"青紫型先天性心脏病（右向左分流）的杂音多源于右心室流出道梗阻等湍流。识别发绀、心力衰竭、依赖动脉导管（PDA）病变及杂音动态变化等警示征象，并依靠彩色多普勒超声心动图确诊，是评估核心。","approach":["评估危重征象：发绀、心力衰竭、依赖PDA病变（导管关闭致突然恶化）","分析杂音特征（听诊部位、时相、性质、强度及P2）以定位梗阻水平","鉴别各青紫型畸形（法洛四联症、三尖瓣闭锁、肺动脉闭锁、大动脉转位、左心发育不良）","超声心动图（彩色多普勒）为主要诊断手段；胸片、心电图辅助","识别获得性/症状性杂音改变，提示急性风湿热或感染性心内膜炎"],"causes":[{"group":"常见右向左分流青紫型病变","items":["法洛四联症","三尖瓣闭锁","伴完整室间隔的肺动脉闭锁","大动脉转位","发育不良左心综合征"]},{"group":"伴梗阻的心脏病变（杂音来源）","items":["肺动脉 p":"常见","items":["睾丸扭转","附睾附件扭转","附睾炎/睾丸炎","鞘膜积液","精索静脉曲张"]},{"group":"少见","items":["嵌顿疝","阴囊外伤/血肿","Henoch-Schönlein紫癜阴囊受累","睾丸肿瘤","Fournier坏疽"]}],"by_age":[{"age":"新生儿/婴儿","common":["鞘膜积液、腹股沟疝"],"uncommon":[]},{"age":"儿童/青少年","common":["睾丸扭转、附睾附件扭转、附睾炎、精索静脉曲张"],"uncommon":[]}],"red_flags":["睾丸扭转需立即手术（急性疼痛、肿胀、提睾反射消失、彩超血流缺失）","Fournier坏疽（坏死性筋膜炎）危及生命","嵌顿疝绞窄"],"key_history":["起病急缓、疼痛性质与部位","外伤、感染、近期手术史","既往阴囊疾病、疝史"],"key_exam":["阴囊视触诊（提睾反射、透光试验）","阴囊超声（血流评估）","血常规、炎症指标"]},{"symptom":"性发育障碍（DSD）","department":"泌尿科","summary":"性发育障碍（DSD）指出生外生殖器性别不明确或染色体、性腺、表型性别不一致。分为46,XX DSD（如先天性肾上腺皮质增生CAH）、46,XY DSD（如雄激素不敏感AIS、性腺发育不全）、卵睾DSD。需紧急评估盐丢失型CAH与肾上腺危象。","approach":["按核型分类：46,XX DSD重点排查CAH（17α-羟化酶/21-羟化酶缺陷）；46,XY DSD排查雄激素合成/作用障碍、性腺发育不全；结合查体（生殖器畸形、可触及性腺）、激素（性激素、ACTH、电解质）、影像与基因。"],"causes":[{"group":"常见","items":["46,XX DSD：先天性肾上腺皮质增生（CAH）","46,XY DSD：雄激素不敏感综合征（AIS）、性腺发育不全","卵睾DSD"]},{"group":"少见","items":["5α-还原酶缺陷","雄激素合成酶缺陷","苗勒管永存综合征","染色体异常相关DSD"]}],"by_age":[{"age":"新生儿","common":["外生殖器模糊、盐丢失型CAH（21-羟化酶缺乏）"],"uncommon":[]},{"age":"青春期","common":["第二性征不发育、原发性闭经提示AIS/性腺发育不全"],"uncommon":[]}],"red_flags":["肾上腺功能减退、盐丢失型CAH危及生命（低钠、高钾、低血压、休克）","阴囊内无睾丸可触及的男性表型（需警惕性腺肿瘤、肾上腺危象）","皮肤色素沉着增加（ACTH增多，提示CAH）","高血压（11β/17α-羟化酶缺陷）"],"key_history":["新生儿外生殖器外观、产前史","生长、青春期发育、高血压/低血压史","家族史（CAH、DSD、不孕）"],"key_exam":["核型分析、性激素、ACTH、电解质、肾素","盆腔/腹部超声（性腺、子宫）","基因检测"]},{"symptom":"月经问题与阴道出血","department":"泌尿科","summary":"涵盖青春期前阴道出血、性早熟、青少年异常子宫出血（PALM-COEIN分类）、闭经等。需区分生殖道与非生殖道出血，识别结构性（息肉、肌瘤、腺癌）与无结构性（凝血病、排卵障碍、内分泌）病因，以及PCOS、凝血功能障碍等。","approach":["青春期前出血排查异物、外伤、性虐待、肿瘤、激素暴露；青少年异常出血按PALM-COEIN评估（息肉、腺瘤样增生、平滑肌瘤、恶变、凝血病、排卵障碍、子宫内膜、医源、未分类）；评估妊娠、内分泌与凝血。"],"causes":[{"group":"常见","items":["青春期功能失调性子宫出血（无排卵）","凝血病（如vWD、血小板减少）所致月经过多","多囊卵巢综合征（PCOS）","性早熟","闭经（下丘脑性、垂体性、卵巢性）"]},{"group":"少见","items":["生殖道息肉、肌瘤、腺瘤样增生、腺癌（PALM）"," thyroid/高泌乳素血症","青春期前器质性出血（肿瘤、异物、性虐待）"]}],"by_age":[{"age":"青春期前","common":["性早熟、外阴阴道炎、异物、外伤、肿瘤"],"uncommon":[]},{"age":"青少年","common":["无排卵性出血、PCOS、凝血病、妊娠相关、结构性病变"],"uncommon":[]}],"red_flags":["可触及肿块、非生殖道出血（血尿、便血混淆）","贫血、阳性出血家族史（凝血病）","异常或盆腔肿块、发热","头痛、视觉障碍、溢乳（垂体病变）","异常妊娠、出血时间延长"],"key_history":["出血时间、量、周期、初潮年龄","妊娠、避孕、用药史","月经家族史、出血性疾病史","头痛、溢乳、体重变化"],"key_exam":["盆腔/腹部查体、青春期发育分期","妊娠试验、HCG、激素（TSH、泌乳素、雄激素）","凝血功能、超声","必要时宫腔镜/内膜活检"]},{"symptom":"肉眼血尿","department":"泌尿科","summary":"肉眼血尿指尿液肉眼可见发红。需先区分真性血尿（尿中有红细胞）与血红蛋白/肌红蛋白尿（尿中无红细胞）。按来源分为肾小球性（如感染后肾小球肾炎PIGN、IgA肾病、Alport综合征）与非肾小球性（结石、肿瘤、泌尿系畸形、外伤）。显著蛋白尿提示肾小球疾病。","approach":["尿镜检确认红细胞；结合红细胞形态（变形红细胞提示肾小球来源）、蛋白尿、高血压、肾功能；行超声、尿培养、补体/抗链O、肾活检（必要时）；排除血红蛋白/肌红蛋白尿及月经污染。"],"causes":[{"group":"常见","items":["感染后肾小球肾炎（PIGN）","IgA肾病","泌尿系结石","泌尿系感染","Alport综合征（遗传性）"]},{"group":"少见","items":["泌尿系肿瘤","薄基底膜肾病","高钙尿症/胡桃夹现象","凝血障碍、外伤"]}],"by_age":[{"age":"儿童","common":["PIGN、IgA肾病、结石、感染、Alport综合征"],"uncommon":[]},{"age":"各年龄","common":["肿瘤、畸形、外伤（少见）"],"uncommon":[]}],"red_flags":["尿中无红细胞（提示血红蛋白/肌红蛋白尿，如溶血、横纹肌溶解）","高血压、氮质血症（肾功能受损）","疼痛、体重减轻、发热或可触及肿块（提示肿瘤/梗阻/感染）","显著蛋白尿（提示肾小球疾病）"],"key_history":["血尿发作（全程/初段/终末）、凝块、疼痛","前驱感染、咽痛、皮疹史","家族史（Alport、多囊肾、结石）、用药、运动"],"key_exam":["尿镜检（红细胞形态）、尿蛋白/肌酐","尿培养、补体C3、抗链O、肾功能","泌尿系超声、必要时CT/肾活检"]},{"symptom":"儿童期获得性皮疹","department":"皮肤科","summary":"儿童期许多皮肤表现良性自限，但部分可能是系统性疾病或相关状况的首发表现，识别这些有助于适当评估与治疗。精确的形态学描述（识别原发与继发皮损，描述大小、颜色、分布及形态）是建立鉴别诊断的基础，辅以 KOH 试验、Tzanck 涂片、Wood 灯、革兰染色、疥疮刮取及皮肤活检等诊断技术。","approach":["采集针对性病史：皮疹起病时间、演变过程、瘙痒/疼痛、既往类似发作、全身症状、加重缓解因素、治疗反应、家庭成员或密切接触者受累、家族史","识别并描述原发皮损（斑疹、丘疹、斑块、结节、水疱大疱、脓疱、风团、毛细血管扩张）与继发皮损（鳞屑、痂皮、糜烂、溃疡、苔藓样变、萎缩、皲裂）","按皮损形态分类鉴别：鳞屑性皮肤病（银屑病、玫瑰糠疹、苔藓样糠疹、扁平苔藓、脂溢性皮炎）、湿疹（特应性皮炎及其鉴别诊断）、反应性红斑与药物反应（荨麻疹、多形红斑、药疹）、大疱性疾病、紫癜、脱发、感染与寄生虫病（脓疱疮、疣、HSV、水痘、疥疮、虱、皮肤癣菌病、念珠菌病）","应用床旁诊断技术：KOH 涂片（皮肤癣菌/念珠菌/花斑癣）、Tzanck 涂片（HSV/VZV）、Wood 灯（真菌、色素改变）、疥疮刮取物镜检、革兰染色","评估与全身性疾病及免疫缺陷的关联（如湿疹样皮炎伴反复感染提示原发性免疫缺陷、咖啡牛奶斑提示神经纤维瘤病）","诊断不明或怀疑恶性/严重全身疾病时行皮肤活检（HE 染色及直接免疫荧光，用于大疱病、胶原血管病）","识别需紧急评估的危及生命实体：SJS/TEN、DRESS 与 SSSS、HSV、脑膜炎球菌血症的鉴别"],"causes":[{"group":"常见","items":["特应性皮炎（湿疹）","脂溢性皮炎","银屑病（含点滴状银屑病）","玫瑰糠疹","荨麻疹（急性/慢性、物理性）","麻疹样药疹","固定性药疹","传染性软疣","寻常疣/扁平疣/跖疣/生殖器疣","脓疱疮（非大疱性/大疱性）","疥疮、头虱","皮肤癣菌病（体癣、足癣、股癣、面部癣菌病）、花斑癣","痤疮","斑秃、头癣、牵拉性脱发、拔毛癖、休止期脱发","单纯疱疹病毒（HSV）、水痘、带状疱疹","白色糠疹、炎症后色素减退/沉着、雀斑样痣"]},{"group":"少见","items":["Stevens-Johnson 综合征（SJS）/中毒性表皮坏死松解症（TEN）","药物反应伴嗜酸性粒细胞增多及系统症状（DRESS）","急性泛发性脓疱型药疹（AGEP）","多形红斑（HSV 相关为主）","IgA 血管炎（Henoch-Schönlein 紫癜）","金黄色葡萄球菌烫伤样皮肤综合征（SSSS）","大疱性表皮松解症（单纯型/交界型/营养不良型）","儿童线性 IgA 大疱性皮肤病","白癜风、黑色素瘤","朗格汉斯细胞组织细胞增生症","皮肤 T 细胞淋巴瘤（蕈样肉芽肿，慢性苔藓样糠疹背景下）","结节性红斑、幼年黄色肉芽肿、结节性痒疹","与湿疹样皮炎相关的原发性免疫缺陷（AD-HIES、DOCK8、WAS、SCID、IPEX 等）"]}],"by_age":[{"age":"婴儿/幼儿","common":["特应性皮炎（面颊、躯干、四肢伸侧分布）","脂溢性皮炎","脓疱疮","念珠菌病（鹅口疮、尿布皮炎）","疥疮（泛发分布，累及躯干头皮面部及掌跖）","大疱性脓疱疮"],"uncommon":["SSSS（多见于 5 岁以下）","湿疹型疱疹（特应性皮炎合并 HSV）","LCH","大疱性表皮松解症","肠病性肢端皮炎（锌缺乏）"]},{"age":"儿童/青少年","common":["特应性皮炎（屈侧分布）","银屑病（含点滴状）","玫瑰糠疹","痤疮","荨麻疹","皮肤癣菌病、花斑癣","疣（寻常疣/跖疣）","斑秃、头癣","传染性软疣","接触性皮炎（毒藤、镍）"],"uncommon":["SJS/TEN/DRESS（年长儿童及青少年多见）","扁平苔藓","白癜风","黑色素瘤（罕见但发病率上升）","IgA 血管炎（HSP，3-10 岁高发）","皮肤 T 细胞淋巴瘤"]}],"red_flags":["急性皮肤损害伴全身症状且外观不佳的儿童，需紧急鉴别 SJS/TEN、DRESS 与感染（SSSS、HSV、脑膜炎球菌血症）","SJS/TEN：皮肤触痛、黏膜受累、水疱及表皮剥脱（TEN 死亡率可达 20%），需按严重烧伤患者护理，多在 PICU/烧伤中心管理","湿疹型疱疹（特应性皮炎患者突发大量脐凹状水疱脓疱伴发热）需及时阿昔洛韦治疗","荨麻疹伴气道受累或过敏性休克需紧急处理","疑似黑色素瘤（皮损快速生长、质地改变、色素异常、边界不规则、瘙痒触痛，ABCDE 标准）应及时转诊皮肤科","生殖器疣需考虑性虐待可能","带状疱疹眼周/鼻部/前额受累需及时眼科评估（约 50% 眼部受累可致失明）","广泛水疱伴免疫功能低下需排查潜在免疫缺陷"],"key_history":["皮疹何时开始、如何演变（分布、扩散、单个皮损结构变化）","是否瘙痒或疼痛、有无既往类似发作","伴随的全身症状","加重或缓解因素、是否接受过治疗及效果","家庭成员或密切接触者是否受累（疥疮、头虱、脓疱疮、头癣传染性）","皮肤病及特应性疾病家族史","药物暴露史（致敏药物：抗生素、抗癫痫药、NSAIDs、别嘌醇等）","护发习惯、脱发持续时间及用药创伤史（脱发评估）"],"key_exam":["精确形态学描述：原发与继发皮损、大小、颜色、分布（对称性、皮节、屈曲/伸侧、掌跖、黏膜）","触诊：硬度、压痛、活动度、温度、按压后是否褪色（紫癜不褪色）","毛发、指甲（甲点/甲剥离等）及黏膜表面检查","淋巴结与肝脾检查（LCH、TEN、免疫缺陷）","床旁诊断：KOH 涂片、Tzanck 涂片、Wood 灯、疥疮刮取物、革兰染色","Nikolsky 征（SSSS、SJS/TEN）、Darier 征（色素性荨麻疹）","必要时皮肤活检（HE 及直接免疫荧光）"]},{"symptom":"先天性皮肤病变与婴儿皮疹","department":"皮肤科","summary":"新生儿和婴儿可出现多种先天性胎记及暂时性皮疹。必须识别原发皮损、继发皮损改变及皮损的大小、颜色、分布和形态特征，以建立恰当的鉴别诊断。许多新生儿皮肤病为良性自限性，仅需安慰家长，但须警惕与 HSV、金黄色葡萄球菌、朗格汉斯细胞组织细胞增生症（LCH）感染及神经皮肤综合征、脊髓发育异常相关的皮疹。","approach":["识别原发皮损形态（丘疹/脓疱、斑片/斑块、固定性皮损、血管性、色素性）及分布（弥漫/散在/特定区域）","对丘疹脓疱类皮疹行皮损内容物 Giemsa/Wright 染色：毒性红斑以嗜酸性粒细胞为主，暂时性新生儿脓疱黑变病以中 "symptom":"发热和皮疹","department":"皮肤科","summary":"发热合并皮疹提示广泛的病理实体：微生物引起的局部或全身感染、毒素介导疾病（细菌超抗原相关）、炎症性疾病（血管炎和风湿病）及变态反应性疾病。大多数良性自限，但彻底评估对识别危及生命的疾病（脑膜炎球菌血症、落基山斑疹热、川崎病、SJS/TEN、MIS-C、TSS、DRESS）至关重要。详细病史采集和全面体格检查、尤其评估中毒程度是诊断的关键。","approach":["评估生命体征与中毒程度：嗜睡、易激惹、意识改变、灌注不足、苍白、皮肤花斑、发绀提示严重病情，应立即复苏并针对最可能诊断治疗","识别皮疹形态（斑丘疹、瘀点紫癜、水疱大疱、弥漫/局限性红斑、结节、溃疡）及分布（含手掌足底、黏膜、屈曲皱褶）","瘀点紫癜尤其 24 个月以下儿童需警惕严重细菌感染（脑膜炎球菌血症、心内膜炎、落基山斑疹热），行血常规、凝血及血培养；乳头线以上局限瘀点多为咳嗽呕吐所致良性","识别中毒性/综合征性表现：川崎病黏膜皮肤淋巴结簇、TSS（发热+弥漫红斑+低血压+脱屑+多器官受累）、SJS/TEN（水疱+Nikolsky 征+黏膜受累）、DRESS、MIS-C","结合病史（季节、地理、接触、旅行、免疫接种、药物）与特征性皮疹（游走性红斑→莱姆病）缩小范围","病情不佳者行实验室检查（血常规、CRP、ESR、降钙素原、生化、血培养、必要时 CSF）；皮损行革兰染色、Tzanck 涂片、培养、PCR"],"causes":[{"group":"常见","items":["病毒性出疹性疾病（麻疹、风疹、幼儿急疹 HHV-6/7、传染性红斑 B19、肠道病毒、EBV、水痘）","A 组链球菌咽炎/猩红热","麻疹样药物疹（氨基青霉素、头孢菌素、抗癫痫药、磺胺类）","幼儿急疹、手足口病","病毒性上呼吸道感染相关皮疹"]},{"group":"少见","items":["脑膜炎球菌血症","落基山斑疹热及其他立克次体病","川崎病","儿童多系统炎症综合征（MIS-C）","中毒性休克综合征（金黄色葡萄球菌/A 组链球菌）","史蒂文斯-约翰逊综合征（SJS）/中毒性表皮坏死松解症（TEN）","药物反应伴嗜酸性粒细胞增多及系统症状（DRESS）","急性风湿热（环状红斑、皮下结节）","全身型幼年特发性关节炎（Still 病）","Henoch-Schönlein 紫癜（IgA 血管炎）","噬血细胞性淋巴组织细胞增生症（HLH）","莱姆病（游走性红斑）、恙虫病","金黄色葡萄球菌烫伤样皮肤综合征（SSSS）","多形红斑、血清病样反应","系统性红斑狼疮、皮肌炎"]}],"by_age":[{"age":"婴儿/幼儿","common":["幼儿急疹（HHV-6/7）","肠道病毒感染（手足口病）","猩红热样皮疹","SSSS","A 组链球菌咽炎"],"uncommon":["脑膜炎球菌血症","川崎病（6 个月以下婴儿持续发热且无其他标准时冠脉风险最高）","MIS-C","HSV 感染","肺炎球菌/流感嗜血杆菌菌血症性蜂窝织炎"]},{"age":"学龄儿童/青少年","common":["猩红热","传染性红斑（细小病毒 B19）","传染性单核细胞增多症（EBV）","麻疹/风疹（未接种者）","莱姆病","药物疹"],"uncommon":["川崎病","MIS-C","脑膜炎球菌血症","急性风湿热","落基山斑疹热","SJS/TEN/DRESS","中毒性休克综合征（经期少女）"]}],"red_flags":["全身中毒貌、生命体征不稳定、脑膜刺激征，或伴瘀点/瘀斑的发热——需紧急评估脑膜炎球菌血症等","低血压提示感染性休克、TSS、登革出血热休克综合征、川崎病休克综合征、MIS-C","意识状态改变提示脓毒症或原发性脑膜脑炎","发热+皮疹伴休克/中毒貌/生命体征不稳/意识改变者必须全面评估并尽快确诊","SJS/TEN：皮肤触痛、手掌足底早期受累、黏膜糜烂、水疱（Nikolsky 征阳性）——需烧伤中心级护理","DRESS：高热、面部水肿、显著淋巴结肿大、嗜酸性粒细胞增多、转氨酶升高","川崎病：持续高热≥5 天+黏膜皮肤淋巴结簇，早期诊治可显著降低冠状动脉瘤风险","血小板减少伴凝血异常提示 DIC，应收治入院","可能模拟良性过程的危及生命疾病：DRESS、SJS/TEN、RMSF、脑膜炎球菌血症、川崎病、TSS、坏死性筋膜炎（见表 53.7）"],"key_history":["皮疹与发热的时间关系、演变进展、解剖分布、是否瘙痒或疼痛","疾病严重程度评估：口服摄入量、活动水平、尿量","免疫接种状态（麻疹、水痘等 ent":"神经科","summary":"运动障碍是一组以过度运动或随意运动减少为特征的疾患，评估的核心是现象学描述（先于并指导定位）。临床按表现分为高运动性（肌张力障碍、共济失调、震颤、舞蹈症、手足徐动症、抽动、肌阵挛）与低运动性（运动减少、迟缓、运动丧失，如帕金森综合征）。重点不是“病灶在神经轴何处”，而是“存在何种异常运动”。","approach":["采取分步评估：(1)明确临床表现特征（现象学）；(2)区分急性或慢性；(3)制定鉴别诊断；(4)根据鉴别决定评估与治疗的紧迫性；(5)对慢性运动障碍儿童分层检测，重点筛查可治疗病因。急性肌张力障碍或急性舞蹈症提示急性脑过程，须紧急评估；若伴发热或全身症状，提示原发性CNS感染或炎症，亦须紧急评估。睡眠中或伴意识改变的阵发性运动应怀疑癫痫。"],"causes":[{"group":"病因谱","items":["急性肌张力障碍：药物（左旋多巴、多巴胺拮抗剂、抗精神病药、止吐药、抗癫痫药）、毒素（CO、氰化物、甲醇等）、累及基底节的卒中/病灶、脑炎或感染性疾病","慢性肌张力障碍：原发性（DYT1扭转性肌张力障碍、多巴反应性肌张力障碍/Segawa综合征）、继发性（脑肿瘤、卒中、感染、炎症、药物毒素、缺氧缺血性脑病）、遗传退行/代谢病（Wilson病、Lesch-Nyhan、神经棘层红细胞增多症、NBIA、线粒体病、溶酶体贮积病）","舞蹈-手足徐动症：Sydenham舞蹈症、NMDAR脑炎、SLE/抗磷脂综合征、ADEM、药物/毒素、全身病（甲亢、甲旁减、低血糖/高血糖）","阵发性运动障碍：PKD（运动诱发，PRRT2）、PNKD、PED（SLC2A1）、Sandifer综合征、良性阵发性斜颈、小儿交替性瘫痪（ATP1A3）","代谢性病（IEM）：按发病年龄分布于婴儿-儿童期，如GLUT-1缺乏、线粒体病、Leigh综合征、戊二酸血症I型、生物素酶缺乏、锰代谢病等","药物与毒素：抗精神病药/止吐药致急性肌张力障碍反应；苯丙胺、可卡因等"]}],"by_age":[{"age":"新生儿/婴儿","common":["过度惊跳或高兴奋性（亚硫酸盐氧化酶缺乏）、无自主运动或HRS（3-甲基戊二酸血症等）、肌阵挛（GLDC等）；良性阵发性斜颈、Sandifer综合征"],"uncommon":[]},{"age":"婴儿期和儿童期","common":["大多数以运动障碍为表现的代谢性病在此期发病（2岁前：嘌呤/肌酸代谢、神经递质代谢、丙酸/甲基丙二酸血症、戊二酸血症I型、钴胺素病、生物素酶缺乏、GLUT-1缺乏、线粒体病）"],"uncommon":[]},{"age":"1-20岁","common":["PKD（阵发性运动诱发性肌张力障碍）起病年龄区间"],"uncommon":[]},{"age":"青春期/成年期","common":["成人起病共济失调、β-磷酸谷氨酸脱氢酶缺乏等少数类型"],"uncommon":[]}],"red_flags":["慢性病程","发育倒退","智力障碍","癫痫发作","综合征表型","全身脏器受累","急性起病的肌张力障碍/舞蹈症（提示急性脑过程，须紧急评估）"],"key_history":["病程（急性/亚急性/慢性/阵发性）及发作诱因（运动启动、情绪、睡眠、特定任务）","受累部位、严重程度与功能受损","伴随神经系统症状（无力、视觉障碍、抽搐、意识改变）","出生及发育史、发病年龄","家族史（类似症状或变异表现）","近期开始或停止的药物及慢性病史","学术、行为及精神共病"],"key_exam":["现象学观察：仰卧位、坐位、直立双臂下垂位、站立双臂伸展位下的姿势与异常运动","步态（宽基底、冲撞样、扭转、慌张等）、言语质量（舌/腭/下颌异常运动）","肌张力、肌力、深反射评估，并专门分配时间观察不自主运动","诱发性检查（握持维持、伸舌维持、倒水、书写、任务中观察）","门诊未观察到的阵发性发作可用录像回放辅助","颅神经（眼震、眼球运动受限、面舌下颌无力）、精神状态"]},{"symptom":"发育迟缓","department":"神经科","summary":"发育迟缓（GDD）用于描述年幼儿童在运动、认知、语言、社交等发育领域未达到预期里程碑，是病因未明前的描述性诊断。早期识别与干预可改善结局；需区分暂时性发育平台/停滞与真正技能倒退，并尽可能明确病因（染色体、遗传综合征、代谢、围产期、社会文化等因素）。","approach":["常规发育监测，并在 9、18、30 个月进行标准化筛查（如 ASQ、PEDS）","重视家长/教师担忧作为线索，但须结合正式筛查工具","对可疑儿童转诊全面多学科
