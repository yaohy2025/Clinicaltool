小下颌）","眼科（上睑下垂、视网膜变性、视神经萎缩、樱桃红斑）","神经（长束征、肌张力异常、运动障碍）","皮肤（咖啡斑、色素脱失、卷发、难治性湿疹）","肝脾肿大（贮积病）"]},{"symptom":"肌张力低下与无力","department":"神经科","summary":"肌张力低下指肌肉全活动范围被动运动阻力降低；无力指主动肌肉收缩最大力量减少。低张可伴或不伴无力，无力亦可伴低张/高张/无肌张力改变。可发生于各年龄，先天或获得、急性或慢性、进行或静止、孤立或复杂。婴儿期约80-90%源于中枢性，其余为周围性；大多数急性单侧无力由CNS部分供血异常引起。","approach":["评估结合病史、临床观察、全身体格与神经检查以将病变定位于神经轴（图35.1）。先识别全身性疾病，再定位CNS或PNS。低张力婴儿流程：先找CNS功能障碍体征（癫痫、脑病、发育倒退、病理反射、后续高张）；若MRI/EEG/代谢筛查正常→考虑综合征性遗传病因（Prader-Willi、SMA、1型肌强直营养不良等靶向检测）；若持续且中枢阴性→运动神经元/神经/肌肉/NMJ疾病（CK、TSH、EMG/NCS、RNS）。急性无力见流程图35.9。"],"causes":[{"group":"病因谱","items":["全身性：败血症、心力衰竭、酸中毒、缺氧、肾衰、低血糖、21三体、Prader-Willi、Fragile X、甲减、母胎药物影响、代谢紊乱（氨基酸/有机酸/尿素循环/过氧化物酶体病）","脑：缺氧-缺血性脑损伤、颅内出血、脑畸形、宫内/产后感染","脊髓：发育不良、肿瘤、硬膜外脓肿、横贯性脊髓炎、急性弛缓性脊髓炎、创伤、AVM","前角细胞：脊髓性肌萎缩症（SMA）、GBS、毒性神经病","周围神经：CIDP、CMT、遗传性感觉自主神经病","神经肌肉接头：肉毒中毒、先天性/获得性新生儿重症肌无力、CMS","肌肉：Duchenne/Becker肌营养不良、强直性肌营养不良、庞贝病、先天性肌营养不良、先天性肌病、代谢性/线粒体肌病、皮肌炎","结缔组织病（模拟）：Marfan、Ehlers-Danlos、软骨发育不全、Stickler、22q11.2缺失等"]}],"by_age":[{"age":"婴儿（尤其新生儿）","common":["多为中枢性；周围性提示智力正常+严重持续低张（SMA、CMT、CMS、肌营养不良）；Prader-Willi/SMA/1型肌强直营养不良可仅以低张为表现"],"uncommon":[]},{"age":"儿童","common":["急性无力优先排查全身病、CNS（卒中/脊髓）或PNS；周围性神经/肌肉/NMJ疾病在智力正常时典型"],"uncommon":[]},{"age":"先天vs获得/进行vs静止","common":["病史与病程及是否伴发育倒退决定（倒退高度提示代谢/贮积/线粒体/神经退行性疾病）"],"uncommon":[]}],"red_flags":["弥漫性脑病","癫痫发作","代谢危象","呼吸衰竭体征（即使极度虚弱者可无外部呼吸困难表现，仍面临呼衰风险）"],"key_history":["产科史（胎动、羊水量、宫内生长受限）、围产期事件、毒物暴露、家族史","发育里程碑（延迟或倒退）、病程（先天/急性/慢性/进行）","全身病症状、喂养与呼吸问题","近亲结婚、母体疾病/用药","药物或毒素暴露史"],"key_exam":["肌张力：姿势性与相性、被动张力、关节伸展性（围巾征）、姿势反射（拉坐试验头后仰、腋悬吊滑脱、腹侧悬吊倒置U）","肌力分级（0-5级）、肌量","中枢vs周围鉴别（表35.4：癫痫、认知延迟、Babinski、反射、舌肌纤颤、眼肌麻痹、上睑下垂、萎缩）","筛查：CK、TSH、EMG/NCS、3Hz RNS（NMJ）、代谢筛查（氨基酸、有机酸、氨、酰基肉碱、乳酸/丙酮酸、GDF-15、VLCFA、溶酶体酶）、脑/全脊柱MRI、遗传检测"]},{"symptom":"肌张力增高症","department":"神经科","summary":"肌张力增高（hypertonia）指异常升高的肌张力，通常是上运动神经元疾病的后果。临床分三种亚型，可单独或并存：痉挛性（速度依赖性阻力增高）、扭转性（肌张力障碍成分，任务/情绪诱发不自主收缩）、强直性（等阻双方向，无速度阈值）。儿童最常见病因为脑性瘫痪（2岁前损伤）与舞蹈样运动障碍综合征。注：本文件名为“高渗性.md”，实际内容为“肌张力增高症（Hypertonia）”，按实际内容抽取。","approach":["评估须全面检查整个骨骼肌肉系统（含据报未受累部位）。以极慢/中/快三速测量被动活动阻力，记录起始阻力与“卡住”现象及关节角度；突然反向运动观察协同收缩（即痉挛性卡住 vs 扭转性立即阻力）；观察目的性运动或远隔关节活动是否诱发不自主运动（肌张力增高评估工具HAT）。区分痉挛/扭转/强直。先排除遗传代谢性脑瘫假象（表38.5/38.6）及结构性病变（肿瘤、卒中、Chiari等）。管理依临床类型，由多学科团队（儿科、神经、康复、骨科）进行。"],"causes":[{"group":"病因谱","items":["脑性瘫痪（最常见）：痉挛型双瘫、偏瘫、四肢瘫等（表38.4）","上运动神经元通路病变：皮质、基底节、丘脑、小脑、脑干、白质或脊髓","遗传代谢性脑瘫假象（表38.5/38.6）：leucodystrophy（Krabbe、异染性脑白质营养不良）、NBIA、H-ABC、Wilson病、痉挛性截瘫、多巴反应性肌张力障碍","急性肌张力障碍：药物/毒素、感染（脑炎）、炎症（ADEM）、急性缺血、结构性基底节病变（表40.5）","破伤风、血清素综合征、神经阻滞剂恶性综合征（NMS）、恶性高热","肌源性：先天性肌强直（Thomsen/Becker型，CLCN1）、先天性副肌强直（PMC，SCN4A）","遗传性惊跳症（HPX，GLRA1/GLRB/SLC6A5）、僵人综合征（抗GAD/甘氨酸受体抗体）","角弓反张：破伤风、脑膜炎、代谢病（戈谢、Krabbe、核黄疸、NBIA、戊二酸尿症、多巴反应性肌张力障碍）、毒素/药物、解剖异常（Chiari、肿瘤、出血、脑积水）、脑瘫、转换障碍"]}],"by_age":[{"age":"2岁前","common":["损伤所致运动综合征多标记为脑性瘫痪（CP）"],"uncommon":[]},{"age":"婴儿期起病且看似非进展性","common":["按通用诊断流程（图38.2）分组排查（代谢、遗传、结构）"],"uncommon":[]},{"age":"急性偏身扭转痉挛","common":["提示对侧基底节占位（肿瘤或卒中）"],"uncommon":[]},{"age":"多巴反应性肌张力障碍","common":["约6岁起病，足部肌张力障碍首发，左旋多巴显著有效"],"uncommon":[]}],"red_flags":["发育倒退或已获得里程碑丧失","出现并加重的局灶性缺损","进行性神经疾病的家族史","神经系统外系统受累（肝或肾病、进行性皮肤病疹）","明显颅神经受累","无力、痉挛、视力或听力障碍"],"key_history":["肌张力增高起病时间、前驱疾病/创伤/手术","病程（急性/亚急性/慢性/阵发）及昼夜波动","受累肢体/部位、异常姿势或运动、步态","加重/缓解因素、脑或脊髓损伤史","药物或毒素暴露、妊娠分娩情况","家族神经肌肉疾病史"],"key_exam":["肌力、肌量、肌张力（三速被动运动、反向阻力、固定姿势倾向）","反射（肱二/三头肌、桡骨膜、踝/膝）、步态","眼底（视网膜异常提示遗传/全身病或ICP增高）","HAT评估：扭转性（触觉/目的性运动诱发不自主运动）、痉挛性（速度依赖阻力、痉挛性折返）、强直性（等阻双方向、姿势维持）","颅神经（瞳孔、眼球运动、面型对称、舌/软腭）"]},{"symptom":"脑炎","department":"神经科","summary":"脑炎（大脑炎症）与脊髓炎引发多样症状和体征，因炎症部位与表型而异，且常难以分类、量化或活检。诊断通常需发热或客观神经系统体征启动调查（表42.1）。发病率低（0.3-0.5/10万），仅为意识改变众多病因之一。可为感染性、后感染性、自炎症性或自身免疫性（含NMDAR抗体、ADEM、NMOSD等）。","approach":["评估伴发热或局灶神经体征的脑炎/脑病。客观运动体征包括肌阵挛、震颤、舞蹈、肌张力障碍、共济失调；常伴自主神经功能紊乱。头CT除检测明显脑水肿/中线移位/梗阻性脑积水/出血/钙化外用处有限；MRI更优（含T2/FLAIR、DWI、静脉造影）。EEG常异常。初始评估按诊断算法采集CSF（HSV/肠道病毒PCR等）、血清、影像、EEG；切勿因等待自身抗体结果而延误治疗（表42.4-42.7）。"],"causes":[{"group":"病因谱","items":["感染性：HSV（最重要可治疗地方病因）、肠道病毒、VZV、流感病毒、EBV、腺病毒、支原体、巴通体、虫媒病毒（WNV、东方/西方马脑炎、拉克罗塞等）、立克次体、莱姆病、狂犬病","自身免疫性/炎症性：NMDAR脑炎、ADEM、NMOSD、SLE相关、Bickerstaff脑干脑炎、风湿性（SLE、干燥、白塞、结节病）","先天感染（0-24月）、补体失调、Cryopyrin相关病、Aicardi-Goutières、干扰素病","代谢/中毒拟似症：尿素循环障碍、枫糖尿病、Reye综合征、急性肾上腺危象、中毒、线粒体病（MELAS）","亚急性/慢性（免疫抑制者）：麻疹包涵体脑炎、VZV多灶白质脑病、CMV、HHV-6、HIV、PML（JC/BK）、结核、梅毒、莱姆、Whipple病","其他拟似（表42.9）：肿瘤、卒中、假性脑瘤、精神病、癫痫脑病、细菌性脑膜炎、脓肿、静脉窦血栓、硬膜下/外血肿、颅脑创伤"]}],"by_age":[{"age":"0-24个月","common":["先天感染、HSV、肠道病毒、虫媒病毒（含WNV）、Cryopyrin相关病、Aicardi-Goutières、补体失调、尿素循环障碍/枫糖尿病/Reye/干扰素病、中毒、癫痫性脑病（Dravet等）、HIV、脑积水、胶质瘤"],"uncommon":[]},{"age":"2-5岁","common":["HSV、肠道病毒、VZV、流感、ADEM、NMOSD、支原体、巴通体、狂犬病、细菌性（HUS/TTP）、中毒、Reye（MCAD缺乏）、Dravet、线粒体病、胶质瘤/CNS淋巴瘤"],"uncommon":[]},{"age":"学龄期","common":["ADEM、HSV、NMDAR抗体脑炎、NMOSD、肠道病毒、流感、EBV、支原体、巴通体、莱姆、狂犬病"],"uncommon":[]},{"age":"青年成人/成人","common":["NMDAR、NMOSD、SLE、副肿瘤性、WNV、狂犬病、中毒、精神病、Wilson病、HLH、结节性动脉炎、多发性硬化、线粒体病、血管炎、肿瘤转移、胶质瘤/CNS淋巴瘤"],"uncommon":[]}],"red_flags":["昏迷","视乳头水肿或提示脑疝形成的体征","偏瘫","自主神经功能障碍","明确的脊髓节段水平","接触高风险媒介（如狂犬病病毒等）","免疫功能低下","前往流行地区旅行史"],"key_history":["发热、神经精神症状、癫痫发作、病程","暴露史：昆虫（蚊/蜱）、动物（蝙蝠/狗/猫/浣熊）、经口或吸入（水/土壤/食物）、季节、旅行史","免疫状态","疫苗/前驱感染（ADEM常在感染或接种后2-4周）"],"key_exam":["表42.11：气道/呼吸/循环、认知与行为、既往癫痫证据（舌咬伤等）、细微运动性癫痫、脑膜刺激征、局灶神经体征、视乳头水肿、弛缓性瘫痪（前角细胞）、皮疹、动物/昆虫咬伤、运动障碍（含帕金森综合征）","CSF分析（细胞/蛋白/糖、PCR）、MRI（含DWI）、EEG","紧急排除：细菌性脑膜炎（血/CSF培养、NAAT）、HSV脑炎（CSF PCR，症状>4天敏感性93%）"]},{"symptom":"自闭症样行为","department":"神经科","summary":"自闭症谱系障碍（ASD）以社交沟通障碍及受限重复行为为核心，常早期起病。须与沟通障碍、智力障碍及可模仿 ASD 的综合征/代谢病鉴别；约半数共患智力发育障碍，常共病癫痫、胃肠、睡眠、焦虑等。","approach":["18、24 月龄常规筛查（如 M-CHAT-R）","听力与视力筛查（排除模仿 ASD 的感官问题）","伍德灯查皮肤（结节性硬化、NF1 等神经皮肤病）","形态学评估识别共患综合征，指导遗传检测","神经心理/ADOS、ADI-R、CARS-2 确诊","所有 ASD/IDD 儿童行染色体微阵列；考虑脆性 X、外显子组测序"],"causes":[{"group":"综合征性（常见相关）","items":["脆性 X 综合征","Rett/MECP2 相关","结节性硬化症","22q11.2 缺失（DiGeorge/VCFS）","Angelman 综合征","Prader-Willi 综合征","15q11-13 重复","16p11.2 缺失/重复","PTEN 相关错构瘤综合征","Phelan-McDermid（SHANK3）","Timothy 综合征","CHARGE 综合征","Cornelia de Lange 综合征","Noonan 综合征","神经纤维瘤病","Williams 综合征","Cohen 综合征","Joubert 综合征","Kleefstra 综合征","Pitt-Hopkins 综合征","Potocki-Lupski 综合征","CNTNAP2 相关"]},{"group":"代谢性","items":["苯丙酮尿症（未治疗）","黏多糖贮积病","线粒体疾病","生物素酶缺乏症","脑叶酸缺乏症","同型半胱氨酸尿症","Lesch-Nyhan 综合征","腺苷酸琥珀酸裂解酶缺乏症","CDKL5 相关","FOXG1 相关"]}],"red_flags":["单发或多发先天性异常","畸形特征","巨颅症或微头症","癫痫脑病综合征、新发惊厥","退行性变（发育里程碑丧失）","神经皮肤病变","家族遗传病史","木僵（Catatonia）"],"key_history":["发育早期社交/沟通缺陷、眼神接触/指点减少","语言倒退（约 10-20% 在 18-24 月丧失里程碑）","受限重复行为、感觉异常","共病：癫痫、胃肠问题、睡眠障碍、焦虑","家族史与发育倒退"],"key_exam":["面部不对称、多旋涡发型、前额突出、婴儿期头快速生长","伍德灯皮肤检查（结节性硬化、NF1）","听力与视力筛查","发育与神经评估、畸形特征"]},{"symptom":"横纹肌溶解症","department":"系统科","summary":"横纹肌溶解症是急性肌肉损伤导致肌细胞死亡、释放有毒胞内物质，引起肌肉与全身症状的病理过程；与高肌酸激酶血症（仅CK升高、无肌肉破坏）不同。诊断在急性肌无力/肌痛/肿胀背景下CK>1000 IU/L或>5倍正常上限，难点在于区分二者——前者常需住院，后者多仅需支持治疗。","approach":["先评估危及生命并发症（急性肾损伤、心律失常、脑病、筋膜室综合征）并立即处理","确认诊断：急性症状背景下CK>1000 IU/L或>5倍正常上限，尿肌红蛋白升高支持","评估急性发作史与诱因（运动/感染/创伤/药物毒素），区分横纹肌溶解与高CK血症","深入神经肌肉体格检查与徒手肌力（MMT）评分；急性期不以无力定病因，重点查慢性改变与并发症","病因评估：首次孤立运动性发作无需进一步检查；复发者查基线CK及遗传/代谢检测；不明病因者行药物筛查","治疗以充分液体复苏促进毒素排泄为主，监测CK半衰期与尿肌红蛋白，出院前达标准"],"causes":[{"group":"常见","items":["运动诱发（>2岁主要始动事件，有氧与无氧运动区别）","感染性疾病（<2岁最常见，尤其流感病毒、肠道病毒等病毒感染）"]},{"group":"少见","items":["创伤（挤压伤、电击、缺血、长期制动）","药物/毒素（可卡因、他汀类、抗精神病药、蛇毒、一氧化碳等）","自身免疫性肌炎（儿童最常见为皮肌炎）","肌肉疾病（杜氏/贝克肌营养不良、RYR1相关肌病、McArdle病、CPT2缺乏）","全身性疾病（甲状腺功能亢进危象、甲状腺功能减退、低钾血症）","线粒体与脂肪酸氧化缺陷","遗传性神经肌肉疾病（多种基因缺陷，见遗传表）"]}],"by_age":[{"age":"婴幼儿（<2岁）","common":["感染性病因（尤其病毒感染）"],"uncommon":["创伤、药物/毒素、遗传性/代谢性肌肉病"]},{"age":"儿童/青少年（≥2岁）","common":["运动诱发（劳力性）"],"uncommon":["遗传性神经肌肉疾病、自身免疫性肌炎、药物/毒素"]}],"red_flags":["急性肾损伤/肾衰竭（尿血红蛋白试带≥2+者约18%发生）","筋膜室综合征（与检查程度不成比例的疼痛、被动肢体运动诱发痛）","心律失常","脑病（抽搐、嗜睡、认知障碍）","局部肌肉肿胀进展伴神经血管改变"],"key_history":["急性发作史（时间窗、CK/肌红蛋白峰值时机）","诱因：剧烈运动类型（有氧vs无氧）、感染、创伤、药物/毒素摄入","有无深色/红色尿（肌红蛋白尿）","肌力/痉挛/疼痛模式（静息vs活动、近端vs远端）","家族史（肌肉疾病、恶性高热、运动性肌痛）及既往类似发作"],"key_exam":["深入神经肌肉检查与徒手肌力（MMT）评分，定位损伤","评估慢性改变（萎缩、假性肥大）以提示潜在病因","监测筋膜室综合征：远端灌注、外周神经血管征象","生命体征与容量状态（低血容量、肾血管收缩）","皮肤/甲床等营养不良体征"]},{"symptom":"生长迟缓（Failure to Thrive）","department":"系统科","summary":"FTT是一种体征而非诊断，描述伴病理及心理社会因素的生长障碍。2-3岁以下符合体重/身长低于第3百分位、向下跨越两条主要百分位或生长速度低下等标准。区分器质性与非器质性意义有限，二者常并存。最佳诊断工具是全面病史、系统回顾与彻底体格检查，过度化验常收益甚微。","approach":["准确测量并绘制体重、身长/身高、头围于标准曲线（WHO 0-2岁，CDC >2岁），评估成比例性与模式（体重先降→身长→头围）","全面病史：喂养史、饮食回顾（24h或3天日记）、现病史、产前围产史、家族史、社会史","系统回顾与彻底体格检查，寻找器质性疾病线索（如上腹痛压痛提示胃肠病因）","功能学/系统学方法区分：热量摄入不足、需求/消耗增加、吸收/丢失过多（表12.2、12.3）","针对性筛查试验（CBC、UA、ESR/CRP、乳糜泻、铅、代谢、遗传等）依病史查体而定，避免盲目全面化验","提供提高热量摄入的具体喂养建议与营养康复，建立家庭治疗联盟；必要时多学科团队或住院"],"causes":[{"group":"常见","items":["热量摄入不足（喂养互动问题、食物选择不良、食物不安全）","心理社会/行为因素（亲子互动、父母心理健康、忽视）","胃肠道疾病（胃食管反流、乳糜泻、吸收不良、胰腺功能不全）","内分泌（生长激素缺乏、甲状腺疾病、糖尿病）","遗传/代谢/先天性（囊性纤维化、先天代谢错误、染色体异常、骨骼发育异常）","慢性感染/炎症（隐匿感染、TB、HIV、复发性发热综合征）","心肺疾病（先心、CF、哮喘、支气管肺发育不良）","神经/口咽运动障碍（脑瘫、发育迟缓）"]},{"group":"少见","items":["恶性肿瘤","原发性免疫缺陷","自身免疫性疾病（SLE、JIA）","蛋白丢失性肠病","肾小管酸中毒/肾衰竭"]}],"red_flags":["体重下降致身长/体重低于-3 SD（严重营养不良，需住院）","头围过小（小头畸形）提示神经发育/遗传疾病","反复呕吐、意识状态改变、代谢性酸中毒、低血糖（提示先天代谢错误）","小头畸形、抽搐、发育倒退、肌张力异常（慢性神经问题）","怀疑代理人伪装障碍（Munchausen syndrome by proxy）","虐待或忽视"],"key_history":["详细喂养史与饮食回顾（24小时或3天日记），评估热量摄入","生长模式随时间变化（绘制曲线，识别向下跨越百分位）","产前/围产史、出生体重（SGA/IUGR/AGA）","家族史（身材、遗传/代谢病、近亲结婚、婴儿死亡）","社会史（食物不安全、家庭结构、父母心理健康/物质滥用）","异食癖、喂养困难/吞咽障碍、反复呕吐腹泻便秘"],"key_exam":["准确测量体重、身长/身高、头围并绘于曲线","评估消瘦程度、脂肪分布、肌肉量、畸形特征","皮肤/毛发/指甲营养不良体征（Bitot斑、匙状甲、油漆剥落样皮炎）","腹部脏器肿大、腹胀；心肺杂音/呼吸努力","神经发育评估（肌张力、肌力、协调性、发育迟缓）","口腔（口角炎、腮腺肿大）、牙齿、淋巴结肿大"]},{"symptom":"疾病拟态：未确诊疾病的诊断思路","department":"系统科","summary":"诊断始于症状，是一个复杂、迭代且协作的过程，旨在揭示症状/体征的潜在原因。诊断错误比例高达15%，多源于认知偏差。临床医生需识别“模仿者”（不同疾病相似表现）与“变色龙”（同一疾病多样表现），建立涵盖常见病、非典型表现、拟态及罕见“斑马病”的鉴别诊断。","approach":["从主诉出发系统收集病史与体格检查，界定患者表型（主观+客观信息的独特组合）","运用似然比等循证工具，关注高价值特征（高似然比的红旗征象），而非低权重症状","迭代评估：根据新数据回溯重估原始假设，避免诊断惯性与过早下结论","采用团队/集体智慧诊断，纳入多学科技角，生成多个诊断假设与检测策略","警惕认知偏差（锚定、确认偏误、框架效应、可得性偏差等），必要时实施“诊断暂停”重新审查","在鉴别诊断中纳入罕见病与遗传性疾病，区分“模仿者”与“变色龙”"],"red_flags":["MRI软脑膜强化（提示血管炎/恶性肿瘤而非成人型MS）","连续影像病灶扩大（提示肿瘤/PML等）","可见出血（提示小血管CNS血管炎、ANE、AHLE等）","临床表现与初始工作诊断不符或新发现与之矛盾时，必须重新评估（诊断暂停）"],"key_history":["以患者为中心+临床医生为中心+循证结合的病史采集","运用关键引导性问题挖掘高似然比特征，加速鉴别诊断细化","核实电子病历既有诊断标签，避免错误信息延续增加误诊风险","关注非语言线索与医患关系建立，为诊断提供高价值信息"],"key_exam":["全面体格检查识别关键表型特征，阳性/阴性发现均赋权（应用先验概率、灵敏度、特异度、似然比）","门诊snapshot未必捕捉全部动态表现，家中发现的发热/皮疹仍纳入诊断考量","结合高级检测（影像、分子遗传学、AI辅助）综合表型，避免仅依赖临床发现"]},{"symptom":"胸痛","department":"系统科","summary":"儿童胸痛常见但极少由心脏疾病引起（仅约6%有心脏病因），多为良性；但需警惕危及生命的心源性病因。病因频率依次为特发性、肌肉骨骼、心理、胃肠、肺、心脏。评估高度依赖详尽病史与体格检查，识别红旗征优先排查心脏病因，避免过度检查同时给予充分安抚。","approach":["先识别红旗征（表8.2）优先排查危及生命的心脏/肺病因（突发剧痛、放射、劳力性、晕厥、家族史等），必要时急诊/心内科","详细病史：疼痛性质、持续时间、放射、加重/缓解因素、伴随症状，按年龄解读（年幼多心肺，青少年多肌骨/心因）","全面体格检查：生命体征（四肢血压差、缺氧、低血压）、胸壁触诊压痛（肌骨特征）、心肺听诊（杂音、摩擦音、奔马律）、腹部","若红旗或可疑则行心电图；超声心动图用于阳性筛查或心脏压塞征象","非心源性按系统治疗（肌骨热敷抗炎、GERD用PPI/H2RA、哮喘按气道高反应、心因性转行为健康）","心脏病因存疑转诊心内科；审慎提供安抚与随访，避免转为慢性"],"causes":[{"group":"常见","items":["特发性","肌肉骨骼性（创伤、肋软骨炎、Tietze综合征、滑肋综合征、肌肉拉伤、纤维肌痛）","心因性（过度通气、焦虑、惊恐障碍、神经性厌食）","胃肠道（胃食管反流/食管炎、食管痉挛、贲门失弛缓、消化性溃疡）","肺部（哮喘、肺炎伴胸膜炎、气胸、咳嗽）"]},{"group":"少见","items":["心脏结构性（肥厚型心肌病、主动脉瓣狭窄、肺动脉高压、主动脉夹层、二尖瓣脱垂）","心律失常（室上速、室速、Wolff-Parkinson-White综合征）","心包炎、心肌炎","缺血（异常冠状动脉、川崎病/MIS-C、SLE、拟交感药物）","肺栓塞","其他（带状疱疹、肿瘤、镰状细胞血管阻塞危象、药物/可卡因/vaping相关）"]}],"by_age":[{"age":"年幼儿童（<12岁）","common":["呼吸系统疾病、模糊主诉、心肺系统病因"],"uncommon":["肌肉骨骼/心因性相对少见"]},{"age":"青少年","common":["肌肉骨骼性、心因性（焦虑、过度通气）"],"uncommon":["心脏结构性/心律失常（猝死最大风险群体）"]}],"red_flags":["突发剧烈疼痛","疼痛放射至左/右臂或肩部","运动时出现疼痛","描述为压迫感","劳力性晕厥","将患者从睡眠中唤醒的疼痛","心悸和/或心律失常","家族猝死史、青年缺血性心脏病、长QT/Brugada等遗传性心律失常史","发绀、多汗","先天性心脏病个人史","结缔组织病/高凝/高胆固醇史（SLE、马凡、Ehlers-Danlos、川崎、镰状细胞）","可卡因/huffing/vaping/苯丙胺滥用史"],"key_history":["疼痛持续时间、性质、放射、严重程度、加重/缓解因素","红旗征（表8.2）及针对性家族史（肥厚型心肌病、马凡、家族性高胆固醇）","药物史（四环素→食管炎、避孕药→肺栓塞、可卡因/vaping）","已知疾病（哮喘、CF、SLE、镰状细胞、川崎）及系统回顾","心理社会评估（焦虑、应激、学校缺勤），单独访谈青少年","疼痛是否影响活动"],"key_exam":["生命体征（四肢血压差、心动过速、低氧、低血压）","胸壁触诊压痛（肌骨性特征）、胸壁手法诱发","心肺听诊（杂音、心包摩擦音、奔马律、S4异常）","腹部触诊压痛（上腹痛提示胃肠病因）","四肢脉搏与水肿；叩诊浊音/鼓音（实变/气胸）","必要时心电图、超声心动图（红旗或可疑时）"]},{"symptom":"便秘","department":"胃肠科","summary":"便秘在儿科分为功能性便秘与由解剖异常、代谢紊乱、神经功能障碍或药物效应引起的器质性便秘。绝大多数儿童便秘为功能性。评估首先需判断排便频率或性状的改变源于功能性还是潜在器质性疾病，依据病史特征与体格检查识别提示器质性病变的征象。","approach":["先评估是否存在危重征象（如严重腹胀、胆汁性呕吐、肠梗阻/中毒性巨结肠），必要时紧急处理并稳定生命体征。","判断功能性 vs 器质性：采集症状起始年龄、粪便性状及是否伴便血、泌尿系统症状。","识别器质性红旗：新生儿期发病、生长迟缓、长黄疸史、梗阻症状。","体格检查重点：脊柱/骶部（毛发簇、凹陷、脂肪瘤）、肛门位置（前移位）、直肠指检（肛门张力、直肠壶腹空虚或粪块嵌塞）。","针对性检查：疑内分泌/代谢查甲功、乳糜泻抗体；疑先天巨结肠行直肠吸引活检/肛直肠测压/造影灌肠；疑脊髓病变行MRI。"],"causes":[{"group":"功能性","items":["饮食不当（膳食纤维不足、过量牛奶）","液体摄入不足","情境性因素（抑郁、家族-体质性便秘）"]},{"group":"解剖性","items":["直肠前突","肛门狭窄","结肠畸形（直肠膨出、重复畸形）","狭窄（术后或炎症后遗症，含NEC）","疼痛性肛周病变（裂口、皮炎、脓肿）","腹部肌肉异常（prune belly、腹裂）","肠肿瘤、盆腔外肿块（畸胎瘤）"]},{"group":"内分泌系统","items":["甲状腺功能减退","全垂体功能减退症","甲状旁腺功能减退症","糖尿病","尿崩症（脱水引起）"]},{"group":"遗传/代谢性疾病","items":["高钙血症","金属中毒（铅、砷、汞）","脱水","囊性纤维病：DIOS","低钾血症","急性间歇性卟啉症","威廉姆斯综合征（伴高钙血症）"]},{"group":"感染性疾病","items":["伤寒","婴儿肉毒中毒","恰加斯病"]},{"group":"固有肠神经或运动功能障碍","items":["先天性巨结肠","肠神经元发育不良","少节细胞症"]},{"group":"神经系统/脊髓疾病","items":["脊柱裂及隐性脊柱裂","脊髓拴系","脊髓肿瘤","创伤性病变","脑瘫","肌营养不良症","肌强直营养不良"]},{"group":"心理因素","items":["神经性厌食","抑郁症","肠道运动综合征"]},{"group":"药物/毒素","items":["抗惊厥药","抗酸药（铝、钙）","铁","铅","阿片类药物","抗抑郁药","抗胆碱能药物","钙通道阻滞剂","长春新碱","维生素D中毒","可乐定","抗组胺药","利尿剂"]},{"group":"其他","items":["牛奶蛋白诱导的肛门炎症和裂口","乳糜泻","结缔组织病（SLE、混合性结缔组织病、硬皮病）","淀粉样变性","儿童肠假性梗阻","肠道括约肌失弛缓症","巨膀胱-巨输尿管伴肠低张力"]}],"by_age":[{"age":"新生儿期（出生1个月内）","common":["胎粪栓","胎粪性肠梗阻","肛门闭锁/前移肛门/异位肛门/肛狭窄","脊柱裂","甲状腺功能减退症","高钙血症","神经元性肠发育不良A/B型","巨膀胱-巨输尿管-肠道低蠕动综合征"],"uncommon":["药物（阿片类、麻痹剂、镁）"]},{"age":"婴儿期后起病","common":["功能性便秘（后天获得性）"],"uncommon":["器质性病因（先天巨结肠等）"]}],"red_flags":["新生儿期（出生48小时后）胎便排出延迟","严重腹胀、胆汁性呕吐（提示肠梗阻/先天巨结肠）","生长迟缓或体重增长不良","新生儿期黄疸持续时间长","自出生或婴儿早期出现的便秘、带状（极窄）粪便","尿失禁或膀胱疾病","腰骶部毛发簇、凹陷、脂肪瘤（提示脊髓拴系/隐性脊柱裂）"],"key_history":["症状起始年龄（新生儿期/婴儿早期提示器质性疾病）","粪便性状（功能性：疼痛性、体积大、疏松；先天巨结肠：硬、颗粒状或条索状）","伴随便血（肛裂）或泌尿系统症状（尿潴留/失禁）","用药史及环境毒素暴露史","家族史（先天巨结肠、代谢/神经疾病）"],"key_exam":["腹部检查：左下腹轻压痛、触及粪块","脊柱/骶部：毛发簇、凹陷、脂肪瘤、臀沟偏斜","肛门位置（前移位肛门，API）","直肠指检：肛门张力（高张力+空虚壶腹提示先天巨结肠；松弛+粪块提示功能性）","肛门反射、提睾反射评估腰骶神经支配","生长参数（生长迟缓提示器质性疾病）"]},{"symptom":"呕吐","department":"胃肠科","summary":"呕吐是对多种刺激的保护性反射，可由胃肠道、中枢神经、代谢、中毒等多系统病因引起。儿童年龄是判断病因的重要线索：新生儿以先天性畸形、代谢缺陷、败血症为主；婴儿期常见胃食管反流、幽门狭窄、肠旋转不良；年长儿需考虑感染、食物/毒物摄入、妊娠、进食障碍等。评估先稳定气道、呼吸、循环与水合，再依年龄、时间模式、呕吐物性状及伴随症状定位病因。","approach":["评估气道、呼吸、循环及水合状态，识别休克/脱水等危重征象，先稳定再检查。","识别红旗：意识改变、胆汁性或血性呕吐、无腹泻的呕吐、严重脱水、腹膜炎体征。","依据年龄分层病因：新生儿→先天畸形/代谢/败血症；婴儿→反流、幽门狭窄、肠旋转不良；儿童/青少年→感染、梗阻、毒物、妊娠等。","分析时间模式（急性/慢性/周期性）与呕吐物性状（胆汁性、血性、胃内容物、透明—提示代谢病）。","结合伴随症状（腹痛部位、腹泻/便秘、头痛、黄疸）及体格检查（腹胀、肠鸣音、腹部包块、腹膜刺激征）。","针对性检查：代谢筛查（发作期采血尿）、内镜/影像（平片、超声、上消化道造影）排查梗阻与黏膜病变。"],"causes":[{"group":"先天性/解剖性梗阻","items":["食管闭锁/狭窄","气管食管瘘","幽门狭窄（肥厚性）","肠旋转伴扭转","肠套叠","腹股沟疝嵌顿","胎粪性肠梗阻/DIOS","肛门闭锁","肠重复畸形","肠系膜上动脉综合征（SMA综合征）","贲门失弛缓症"]},{"group":"感染","items":["胃肠炎","中耳炎","链球菌性咽炎","肺炎","肾盂肾炎","脑膜炎","败血症","肝炎","肝脓肿","幽门螺杆菌胃炎","寄生虫感染"]},{"group":"胃肠道黏膜/炎症","items":["GERD/反流性食管炎","嗜酸性食管炎/嗜酸性胃炎","胃炎±幽门螺杆菌","消化性溃疡/十二指肠炎","乳糜泻","炎症性肠病","克罗恩病"]},{"group":"代谢/内分泌/中毒","items":["糖尿病酮症酸中毒","先天性肾上腺皮质增生/艾迪生病","尿毒症","毒物摄入","药物诱导（阿片类、化疗药、丙戊酸等）","代谢性疾病（有机酸血症、脂肪酸氧化缺陷）"]},{"group":"神经/中枢性","items":["偏头痛/腹型偏头痛","颅内压增高（肿瘤、假性脑瘤）","脑炎","脑震荡/硬膜下血肿","周期性呕吐综合征"]},{"group":"其他","items":["反刍","功能性呕吐","进食障碍（暴食症）","妊娠","食物中毒","肾盂输尿管连接部梗阻（急性肾积水）"]}],"by_age":[{"age":"新生儿（<1月）","common":["食管闭锁/狭窄","气管食管瘘","幽门前区蹼","肠狭窄/闭锁","肛门闭锁","胎粪性肠梗阻","肠旋转伴扭转","嵌顿疝","先天性代谢缺陷","败血症"],"uncommon":["胃食管反流"]},{"age":"婴儿（1-12月）","common":["胃食管反流/反流性食管炎","肥厚性幽门狭窄","肠套叠","肠旋转伴扭转","嵌顿疝","尿路感染","肺炎"],"uncommon":["周期性呕吐综合征","肠重复畸形"]},{"age":"儿童（1-11岁）","common":["胃肠炎","阑尾炎","链球菌性咽炎","肺炎","消化性溃疡","腹型偏头痛","肠系膜淋巴结炎","糖尿病酮症酸中毒"],"uncommon":["炎症性肠病","胆囊炎","SMA综合征"]},{"age":"青少年（>11岁）","common":["胃肠炎","阑尾炎","盆腔炎性疾病","妊娠","药物/毒物摄入","进食障碍","克罗恩病","偏头痛"],"uncommon":["卵巢囊肿扭转","附睾炎","大网膜扭转"]}],"red_flags":["意识水平或精神状态改变","中毒外观（休克、败血症）","胆汁样或血性呕吐","无腹泻的呕吐","伴有精神状态改变的反复呕吐发作","发育迟缓、巨头畸形或小头畸形","可疑毒物摄入、创伤/虐待迹象","便血或呕血","严重脱水、严重营养不良或生长停滞","腹膜炎体征（弯腰屈膝体位、回避动作、静默腹部、压痛性腹部）"],"key_history":["呕吐起病年龄与模式（急性/慢性/周期性）","呕吐物性状：胆汁性、血性、胃内容物或透明（代谢病）","与进食/特定食物关系（果糖、半乳糖、牛奶、麸质）","伴随症状：头痛、腹痛部位、腹泻/便秘、黄疸","用药史、毒物摄入、旅行史、妊娠（性活跃女性）","家族史（代谢病、偏头痛）"],"key_exam":["生命体征（发热、心动过速、呼吸急促—代谢性酸中毒）","腹部：腹胀、肠鸣音（亢进提示梗阻/胃肠炎，消失提示麻痹性肠梗阻）、压痛、腹膜刺激征","腹部包块、肝脾肿大","神经系统检查（眼底、囟门隆起—颅内高压）","外生殖器与疝部位（睾丸/卵巢扭转、绞窄疝）","直肠检查：粪块嵌塞、盆腔包块"]},{"symptom":"肝肿大","department":"胃肠科","summary":"肝肿大可表现为原发性肝脏疾病，也可由先天性异常、代谢性疾病及围生期/出生后感染等全身性疾病所致。肝功能常见症状（疲劳、发热、瘙痒、生长迟缓、意识改变、腹泻）缺乏特异性，伴黄疸的肝肿大常提示肝病评估。评估首要识别危及生命状况（如急性肝衰竭、代谢危象），再定位可治疗慢性病。","approach":["先识别危重/紧急征象：急性肝衰竭（昏迷、出血）、高氨血症、低血糖、凝血障碍，立即稳定。","准确评估肝脏大小、质地、边缘及表面（叩诊、触诊、超声），排除Riedel叶等变异与肥胖/腹水干扰。","系统回顾病史：生长发育、黄疸、喂养困难、呕吐、腹泻、皮肤瘙痒、易瘀斑、旅行/家族史、用药及草药补充剂。","全面体格检查：黄疸、脾大、腹水、神经异常、肝掌/蜘蛛痣、Kayser-Fleischer环、淋巴结肿大等。","实验室检查：全套代谢面板、肝合成/外分泌/代谢功能、凝血、血糖、氨、乳酸、铜蓝蛋白等。","影像与活检：超声首选，CT/MRI/核素显像，必要时肝活检明确代谢/浸润性病变。"],"causes":[{"group":"感染与炎症","items":["病毒性肝炎（甲、乙、丙、丁、戊、EBV、腺病毒、肠道病毒）","自身免疫性肝炎","败血症","围产期感染","原发性硬化性胆管炎","系统性红斑狼疮","幼年特发性关节炎","结节病、结核","肝脏脓肿（细菌性、寄生虫性）","寄生虫（血吸虫、利什曼病、肝吸虫）","巨噬细胞活化综合征"]},{"group":"储存/代谢性疾病","items":["α1-抗胰蛋白酶缺乏症","威尔逊病","糖原累积病","半乳糖血症","酪氨酸血症","囊性纤维化","高雪病","尼曼-匹克病","黏多糖贮积病","淀粉样变性","肝卟啉病","线粒体肝病","非酒精性脂肪性肝炎（肥胖）","沃曼病","胆固醇酯贮积病"]},{"group":"胆道梗阻/胆汁淤积","items":["胆道闭锁","胆总管囊肿","总胆管狭窄","胆汁淤积"]},{"group":"浸润/肿瘤","items":["髓外造血","地中海贫血","转移性肿瘤（神经母细胞瘤、肾母细胞瘤）","肝脏恶性肿瘤（肝母细胞瘤、肝细胞癌）","血管瘤、血管内皮瘤","错构瘤"]},{"group":"血管淤血","items":["充血性心力衰竭","缩窄性心包炎","肝静脉流出道梗阻（布-加综合征、VOD）"]},{"group":"其他","items":["糖尿病母亲所生婴儿","药物毒性（四环素、丙戊酸）","营养不良","肠外营养相关肝病"]}],"by_age":[{"age":"新生儿/婴儿","common":["胆道闭锁等胆汁淤积性肝病","先天性感染（CMV、HSV、梅毒、弓形虫）","α1-抗胰蛋白酶缺乏症","糖原累积病","溶酶体贮积病（高雪病、尼曼-匹克病A、Wolman病）","败血症","GALD（新生儿血色病）"],"uncommon":["线粒体肝病","半乳糖血症、酪氨酸血症"]},{"age":"儿童/青少年","common":["非酒精性脂肪性肝炎（肥胖）","病毒性肝炎","自身免疫性肝炎","威尔逊病","α1-抗胰蛋白酶缺乏症","原发性硬化性胆管炎","肝脏肿瘤"],"uncommon":["药物/毒素性肝损伤","AIDS相关肝胆病变"]}],"red_flags":["急性肝衰竭体征（昏迷、出血）","发育迟缓、生长迟缓","婴儿期长期高胆红素血症史","神经系统/精神症状","既往输血史、静脉吸毒史","肝炎病史、青春期延迟","肝变硬或呈结节状、脾肿大、腹水","明显腹部静脉怒张","杵状指、手掌红斑、蜘蛛痣、Kayser-Fleischer环、扑翼样震颤","凝血酶原时间延长、低血糖、高氨血症、血清白蛋白降低"],"key_history":["黄疸起病时间与持续时间（婴儿期黄疸常为首发）","生长迟缓、发育里程碑","喂养困难、呕吐、腹泻、瘙痒","易瘀斑/出血、尿量改变","旅行史、家族史（威尔逊病、代谢病）","用药/草药/补充剂摄入史"],"key_exam":["肝脏大小、质地、边缘（锐利vs圆钝）、表面（光滑vs不规则/结节）","黄疸、脾肿大、腹水、肝掌、蜘蛛痣","Kayser-Fleischer环、白内障","神经异常（震颤、脑病）","淋巴结肿大、其他部位肿块","肾脏增大、肌张力/肌力"]},{"symptom":"胃肠道出血","department":"胃肠科","summary":"儿童胃肠道出血范围从肛裂/牛奶蛋白过敏的少量便血到门静脉高压/消化性溃疡的危及生命的出血。上消化道（食管、胃、十二指肠）出血占多数。严重出血是医疗急症，必须先稳定血流动力学再诊断。评估依据年龄、出血严重程度及来源（上/下消化道）鉴别。","approach":["先确保血流动力学稳定（建立静脉通路、补液/输血），再诊断检查。","确认是否为真性消化道出血（排除食物/药物模拟，Apt试验鉴别母体血）。","区分上 vs 下消化道：呕血/咖啡渣样/黑便多提示上消化道；鲜红血便多提示结肠/下消化道；鼻胃管抽吸助判。","按年龄与外观分层：婴儿（应激性溃疡、维生素K缺乏、感染、牛奶蛋白过敏）；儿童（肛裂、肠套叠、Meckel憩室、IBD、息肉）。","体格检查：先评估低血容量/休克，再查口咽、鼻、腹部（脾大、Caput medusae）、皮肤血管畸形、肛周。","内镜（EGD/结肠镜）为定位与治疗首选，辅以影像、核素、胶囊内镜。"],"causes":[{"group":"上消化道出血","items":["应激性溃疡","出血性胃炎","维生素K缺乏症","败血症伴DIC","牛奶蛋白过敏","Mallory-Weiss撕裂","反流性食管炎","胃炎（NSAIDs、幽门螺杆菌）","食管静脉曲张","解剖异常（重复畸形）","血管异常（血管瘤/血管畸形、Dieulafoy病变）","胆道出血"]},{"group":"下消化道出血","items":["肛裂","牛奶蛋白过敏/嗜酸性结肠炎","肠套叠","Meckel憩室","幼年性息肉","炎症性肠病（克罗恩病、溃疡性结肠炎）","感染（大肠杆菌O157:H7、弯曲菌、耶尔森菌、志贺菌、阿米巴）","坏死性小肠结肠炎","肠扭转/缺血","Henoch-Schönlein紫癜","痔疮（慢性肝病）"]},{"group":"隐匿性出血","items":["胃食管炎","克罗恩病","溃疡性结肠炎","乳糜泻","嗜酸性胃肠炎","Meckel憩室","血管发育不良/血管扩张","食管胃底静脉曲张","非甾体抗炎药","钩虫、蛔虫、结核","息肉、淋巴瘤"]}],"by_age":[{"age":"婴儿","common":["肛裂","牛奶蛋白过敏","应激性溃疡/出血性胃炎","维生素K缺乏","感染（CMV、疱疹、真菌）","先天巨结肠相关肠炎","肠套叠"],"uncommon":["食管静脉曲张","血管畸形"]},{"age":"儿童","common":["肛裂","幼年性息肉","肠套叠","Meckel憩室","炎症性肠病","牛奶蛋白过敏","Henoch-Schönlein紫癜","感染（O157:H7、弯曲菌、耶尔森、志贺、阿米巴）"],"uncommon":["食管静脉曲张（肝病）","肿瘤（淋巴瘤）"]}],"red_flags":["血流动力学不稳定（心动过速、低血压、休克、体位性变化）","大量或活动性呕血/黑便","门静脉高压征象（脾大、Caput medusae、腹水）","血管畸形/遗传性出血综合征（Osler-Weber-Rendu、蓝色橡胶斑痣、Peutz-Jeghers）","凝血障碍/肝病背景","新生儿/婴儿严重出血（维生素K缺乏、败血症DIC）"],"key_history":["出血形式：呕血、便血、黑便、隐匿性","年龄与起病（婴儿vs年长儿）","持续时间、疼痛有无（无痛性提示Meckel/息肉/AVM；痛性提示肠套叠/缺血）","旅行/抗生素/动物接触史","家族史（息肉、结肠癌、出血性疾病、幽门螺杆菌）","慢性肺病/肾病/肝病史"],"key_exam":["先评估低血容量、贫血、休克征象","口咽、鼻道病变","腹部：脾大、Caput medusae、腹水、压痛/肌紧张","皮肤：紫癜、葡萄酒色斑、蓝色结节、毛细血管扩张","肛周/口腔色素沉着（Peutz-Jeghers、Osler-Weber-Rendu）","直肠指检"]},{"symptom":"腹泻","department":"胃肠科","summary":"腹泻指异常稀薄/水样便，通常每日≥3次，按病程分急性（<2周，多自限）与慢性（>2周）。机制分渗透性、分泌性、运动异常及炎症性（混合）。急性多为感染性；慢性在高收入国家常见功能性、吸收不良（囊性纤维化）、乳糜泻、IBD。评估重点在脱水与电解质丢失，并识别炎症/吸收不良/先天性缺陷的红旗。","approach":["先评估脱水程度与血流动力学，必要时液体复苏。","区分急性vs慢性；急性依病史/粪便特征判断感染源（发热、血便→感染；水样→病毒/细菌/寄生虫）。","区分渗透性vs分泌性（禁食试验、粪便电解质/渗透压）。","慢性腹泻按年龄与警示征象聚焦检查：感染、乳糜泻、IBD、吸收不良、先天性腹泻综合征。","针对性实验室：粪便（血、白细胞、还原物、艰难梭菌、卵虫）、CBC、电解质、白蛋白、钙卫蛋白；疑吸收不良行呼气/脂肪/酶学。","内镜/影像用于IBD、持续或报警病例。"],"causes":[{"group":"急性（多为感染性）","items":["病毒性（轮状病毒、诺如病毒、腺病毒、星状病毒、萨波病毒）","细菌性（沙门菌、志贺菌、弯曲菌、耶尔森菌、大肠杆菌各型、艰难梭菌、霍乱弧菌）","寄生虫（贾第虫、隐孢子虫、溶组织内阿       h += '<div class="sec '+s.cls+'"><h3><span class="dot"></span>'+esc(s.t)+'</h3><ul class="lst">';
      items.forEach(function(it){ h += '<li>'+esc(it)+'</li>'; });
      h += '</ul></div>';
    });
    h += '</div>';
    return h;
  };

  RENDER['ped_symptoms'] = function(s){
    if(!s) return '<div class="empty">请选择条目</div>';
    var h = '<div class="ped-detail">';
    h += '<div class="dhead"><div><h2>'+esc(s.name)+'</h2><span class="tag">'+esc(s.category)+'</span></div><button class="copybtn" onclick="copyDetail()">复制全文</button></div>';
    if(s.summary) h += '<div class="summary">'+esc(s.summary)+'</div>';
    if(s.approach && s.approach.length){
      h += '<div class="sec"><h3><span class="dot"></span>诊断思路 / 评估步骤</h3><ol class="steps">';
      s.approach.forEach(function(it){ h += '<li>'+esc(it)+'</li>'; });
      h += '</ol></div>';
    }
    if(s.causes && s.causes.length){
      h += '<div class="sec"><h3><span class="dot"></span>病因分类 / 鉴别诊断谱</h3>';
      s.causes.forEach(function(g,i){
        h += '<div class="cgroup"><div class="cglabel g'+(i%3)+'">'+esc(g.group||'病因')+'</div><div class="cgitems"><ul class="lst">';
        (g.items||[]).forEach(function(it){ h += '<li>'+esc(it)+'</li>'; });
        h += '</ul></div></div>';
      });
      h += '</div>';
    }
    if(s.by_age && s.by_age.length){
      h += '<div class="sec"><h3><span class="dot"></span>年龄相关病因</h3><table class="ageTbl"><tr><th>年龄段</th><th>常见</th><th>少见</th></tr>';
      s.by_age.forEach(function(a){
        h += '<tr><td class="age">'+esc(a.age)+'</td><td>'+esc((a.common||[]).join('、'))+'</td><td>'+esc((a.uncommon||[]).join('、'))+'</td></tr>';
      });
      h += '</table></div>';
    }
    if(s.red_flags && s.red_flags.length){
      h += '<div class="sec emergency"><h3><span class="dot"></span>红旗症状 / 急诊指征</h3><ul class="lst">';
      s.red_flags.forEach(function(it){ h += '<li>'+esc(it)+'</li>'; });
      h += '</ul></div>';
    }
    if(s.key_history && s.key_history.length){
      h += '<div class="sec"><h3><span class="dot"></span>关键病史</h3><ul class="lst">';
      s.key_history.forEach(function(it){ h += '<li>'+esc(it)+'</li>'; });
      h += '</ul></div>';
    }
    if(s.key_exam && s.key_exam.length){
      h += '<div class="sec"><h3><span class="dot"></span>关键查体</h3><ul class="lst">';
      s.key_exam.forEach(function(it){ h += '<li>'+esc(it)+'</li>'; });
      h += '</ul></div>';
    }
    h += '</div>';
    return h;
  };

})();
renderSide(); renderChips(); renderList(); renderDetail();
</script>
