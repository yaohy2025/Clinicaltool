<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临床小工具</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#eef2f7;color:#1f2937;
  font-size:14px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden}
a{color:inherit}
.topbar{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:10px 18px;flex:none;
  display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:5}
.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
.topbar .v{font-size:11px;opacity:.85;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:999px}
.topbar .gswrap{margin-left:auto;position:relative}
.topbar input#gs{width:280px;max-width:42vw;padding:7px 12px;border:none;border-radius:9px;font-size:13px;outline:none}
.gsbox{position:absolute;top:42px;right:0;width:380px;max-width:80vw;max-height:60vh;overflow:auto;
  background:#fff;color:#1f2937;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:none;z-index:30}
.gsbox.show{display:block}
.gsitem{padding:9px 12px;border-bottom:1px solid #eef;cursor:pointer}
.gsitem:hover{background:#eff6ff}
.gsitem .t{font-weight:600}
.gsitem .m{font-size:11px;color:#2563eb;background:#eef2ff;border-radius:6px;padding:1px 7px;margin-right:6px}
.body{flex:1;display:flex;min-height:0}
.side{width:148px;min-width:148px;background:#0f2257;color:#cdd6f4;overflow:auto;flex:none;padding:8px 0}
.side .mi{padding:11px 14px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px;
  border-left:3px solid transparent;user-select:none}
.side .mi:hover{background:#16285f}
.side .mi.active{background:#16285f;border-left-color:#60a5fa;color:#fff}
.side .mi .ic{font-size:16px}
.side .mi .ct{margin-left:auto;font-size:11px;background:#1e3a8a;color:#cbd5e1;border-radius:999px;padding:0 7px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#f5f7fb}
.toolbar{flex:none;padding:10px 14px;border-bottom:1px solid #e5e7eb;background:#fff;display:flex;flex-direction:column;gap:8px}
.toolbar .row{display:flex;gap:10px;align-items:center}
.toolbar input{border:1px solid #d1d5db;border-radius:9px;padding:8px 12px;font-size:14px;outline:none;flex:1;min-width:0}
.toolbar input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}
.cat-select{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:8px 12px;font-size:14px;outline:none;background:#fff;color:#1f2937;cursor:pointer}
.cat-select:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}
.chip{font-size:12px;padding:4px 11px;border-radius:999px;background:#eef2ff;color:#3730a3;cursor:pointer;border:1px solid transparent;user-select:none;display:inline-block}
.chip:hover{background:#e0e7ff}
.chip.active{background:#2563eb;color:#fff}
.content{flex:1;display:flex;min-height:0}
.list{width:320px;min-width:320px;overflow:auto;background:#fff;border-right:1px solid #e5e7eb}
.item{padding:11px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.item:hover{background:#f0f6ff}
.item.active{background:#e8f0ff;border-left:3px solid #2563eb;padding-left:11px}
.item .n{font-weight:600}
.item .s{font-size:12px;color:#6b7280;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{flex:1;overflow:auto;padding:0}
.empty{color:#9ca3af;text-align:center;padding:40px;font-size:14px}
.dheader{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dtitle{font-size:20px;font-weight:700}
.badge{font-size:12px;background:#eef2ff;color:#3730a3;border-radius:6px;padding:2px 9px;margin-top:3px}
.copybtn{margin-left:auto;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px}
.copybtn:hover{background:#1d4ed8}
.summary{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 14px;margin-bottom:14px;color:#9a3412}
.sec{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.sec-t{font-weight:700;color:#1e3a8a;border-left:4px solid #2563eb;padding-left:9px;margin-bottom:8px;font-size:15px}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.sec pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:13.5px;line-height:1.7}
.muted{color:#9ca3af}
.case{border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fafafa}
.case-name{font-weight:700;color:#1e3a8a;margin-bottom:8px;font-size:14px}
.tpl-block{margin-bottom:10px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.tpl-block:last-child{margin-bottom:0}
.tpl-name{display:flex;justify-content:space-between;align-items:center;background:#f3f4f6;padding:6px 10px;font-size:13px;font-weight:600;color:#374151;border-bottom:1px solid #e5e7eb}
.cp-mini{background:#fff;border:1px solid #d1d5db;border-radius:5px;padding:2px 8px;font-size:12px;color:#4b5563;cursor:pointer}
.cp-mini:hover{background:#f9fafb;border-color:#9ca3af}
.warnbox{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;color:#991b1b;margin-bottom:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;
  padding:10px 20px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;z-index:100;pointer-events:none}
.toast.show{opacity:.95}
.dback{display:none}
.dbody{padding:18px 22px}
@media(max-width:760px){
  .side{width:100%;display:flex;overflow-x:auto;padding:4px 0}
  .side .mi{border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  .side .mi .ct{display:none}
  .body{flex-direction:column}
  .main{flex:1;min-height:0}
  .content{flex-direction:column;flex:1;min-height:0}
  .list{width:100%;min-width:0;flex:1;min-height:0;overflow:auto;
    transition:filter .28s ease, transform .28s ease, opacity .28s ease}
  .detail{position:fixed;inset:0;z-index:60;background:#f5f7fb;transform:translateX(100%);
    transition:transform .28s ease;overflow:auto;padding:0}
  .detail.open{transform:translateX(0)}
  .dback{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5;
    background:#1e3a8a;color:#fff;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .dback .arr{font-size:18px;line-height:1}
  .dbody{padding:16px 16px 48px}
  .list.dim{filter:blur(4px);transform:translateY(16px) scale(.97);opacity:.35;pointer-events:none}
  .topbar input#gs{width:150px}
}

:root{--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--brand-soft:#eff6ff;--warn:#dc2626;--chip:#eef2ff}
#list .ci{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;color:var(--ink);transition:.1s}
#list .ci:hover{background:var(--brand-soft)}
#list .ci.active{background:var(--brand-soft);border-left:3px solid var(--brand);padding-left:11px}
#list .cg{padding:8px 14px;font-size:12px;color:var(--muted);font-weight:600;background:#f8fafc;position:sticky;top:0}
#list .empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px}
.calc-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:14px}
.calc-disp{background:#0f2438;color:#eaf6ff;border-radius:10px;padding:16px;margin-bottom:14px;text-align:right;min-height:78px}
.calc-disp .ex{font-size:13px;min-height:18px;opacity:.65;word-break:break-all}
.calc-disp .rs{font-size:30px;font-weight:700;word-break:break-all;margin-top:4px}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.calc-keys button{padding:14px 0;font-size:17px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;color:var(--ink);transition:.1s;font-weight:600}
.calc-keys button:hover{background:var(--brand-soft);border-color:var(--brand)}
.calc-keys button.op{background:#e7f0fb;color:#1e40af}
.calc-keys button.eq{background:var(--brand);color:#fff;border-color:var(--brand)}
.calc-keys button.fn{background:#fdeaea;color:var(--warn)}
.calc-form label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.calc-form input,.calc-form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;outline:none;box-sizing:border-box;background:#fff}
.calc-form input:focus,.calc-form select:focus{border-color:var(--brand)}
.calc-form .fld{margin-bottom:14px}
.calc-out{margin-top:6px;background:#f1f6fb;border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:15px}
.calc-out .big{font-size:24px;font-weight:700;color:#1e40af}
.calc-out .muted{color:var(--muted)}
.calc-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.7}
.calc-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.cchk{display:flex;align-items:center;gap:6px;cursor:pointer;margin:8px 0;font-size:13.5px}
.ph{padding:60px 20px;text-align:center;color:var(--muted)}
.calc-out .chip{display:inline-block;padding:1px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:#fff;color:var(--ink)}
.calc-out .chip.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.calc-out table.kz{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.calc-out table.kz th,.calc-out table.kz td{border:1px solid var(--line);padding:7px 8px;text-align:center}
.calc-out table.kz th{background:var(--panel);font-weight:700;color:var(--ink)}
.calc-out table.kz tr:nth-child(even) td{background:#fafcff}
@media(max-width:760px){
  #detail .calc-card{max-width:none;margin:14px 16px 18px;padding:18px}
  #detail .calc-form input,#detail .calc-form select{font-size:16px;padding:12px 14px}
  #detail .calc-form .cchk{font-size:14px;margin:10px 0}
}
</style>
</head>
<body>
<div class="topbar">
  <h1>临床工具</h1><span class="v">仅供参考yaohy2025</span>
  <div class="gswrap">
    <input id="gs" placeholder="跨模块检索（中文/拼音，如 xz / 肺炎）">
    <div class="gsbox" id="gsbox"></div>
  </div>
</div>
<div class="body">
  <div class="side" id="side"></div>

        <div class="dbody" id="dbody"><div class="empty">请选择左侧模块与条目</div></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

function val(id){const v=parseFloat($('#'+id).value);return isNaN(v)?0:v;}
function ival(id){const v=parseInt($('#'+id).value);return isNaN(v)?0:v;}
function bval(id){return $('#'+id).checked?1:0;}
function sex(id){return $('#'+id).value;}
let calcState={id:null,q:''};
function parseParams(p){ if(!p) return []; try{ return typeof p==='string'?JSON.parse(p):p; }catch(e){ return []; } }
function formulaToJS(raw, varNames){
  let expr=raw||'';
  let idx=expr.toLowerCase().indexOf('if(');
  while(idx!==-1){ let depth=1,i=idx+3,parts=[],cur='';
    while(i<expr.length && depth>0){ const ch=expr[i];
      if(ch==='('){depth++;cur+=ch;} else if(ch===')'){ if(depth===1){parts.push(cur);cur='';depth--;} else {depth--;cur+=ch;} }
      else if(ch===',' && depth===1){parts.push(cur);cur='';} else cur+=ch; i++; }
    if(parts.length===3){ const repl='('+parts[0]+' ? '+parts[1]+' : '+parts[2]+')'; expr=expr.substring(0,idx)+repl+expr.substring(i); }
    idx=expr.toLowerCase().indexOf('if(', idx+1); }
  expr=expr.replace(/\bsqrt\b/g,'Math.sqrt').replace(/\bln\b/g,'Math.log').replace(/\bexp\b/g,'Math.exp')
    .replace(/\bmin\b/g,'Math.min').replace(/\bmax\b/g,'Math.max').replace(/\{([^}]+)\}/g,'$1').replace(/\^/g,'**');
  return {expr:expr, names:varNames};
}
function fmtNum(n){ if(n===null||n===undefined||!isFinite(n)) return ''; if(Number.isInteger(n)) return String(n); return parseFloat(n.toPrecision(6)).toString(); }
function renderCalcList(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const groups={};
  CALCS.forEach(c=>{
    if(q){ const hay=((c.CalcName||'')+(c.PinyinCode||'')+(c.PinyinFull||'')+(c.Description||'')+(c.Category||'')).toLowerCase(); if(!hay.includes(q)) return; }
    (groups[c.Category]=groups[c.Category]||[]).push(c);
  });
  let html='';
  for(const cat of Object.keys(groups)){
    html+='<div class="cg">'+esc(cat)+'</div>'+groups[cat].map(c=>'<div class="ci '+(String(c.CalcId)===String(calcState.id)?'active':'')+'" onclick="calcOpen(\''+String(c.CalcId)+'\')">'+esc(c.CalcName)+'</div>').join('');
  }
  document.getElementById('list').innerHTML = html || '<div class="empty">未找到匹配的计算器</div>';
  const total=CALCS.length; let shown=0; for(const k in groups) shown+=groups[k].length;
  document.getElementById('cnt').textContent = q ? ('匹配 '+shown+' / '+total) : ('共 '+total+' 个计算器');
}
function calcOpen(id){ calcState.id=id; renderCalcList(); renderCalcDetail(); openDetail(); window.scrollTo(0,0); }
function renderCalcDetail(){
  const dbody=document.getElementById('dbody');
  const c=CALCS.find(x=>String(x.CalcId)===String(calcState.id));
  if(!c){ dbody.innerHTML='<div class="empty">从左侧选择一个计算器</div>'; return; }
  if(c.Custom==='kdz'){ dbody.innerHTML=renderKDZ(); kdzRun(); return; }
  dbody.innerHTML='<div class="calc-detail">'+buildFormulaDetail(c)+'</div>';
  wireFormula(c);
}
function buildFormulaDetail(c){
  const params=parseParams(c.InputParams);
  let html='<div class="det" id="det">'
    +'<h2>'+esc(c.CalcName)+'</h2>'
    +(c.Category?'<div class="cat">'+esc(c.Category)+'</div>':'')
    +(c.Description?'<div class="desc">'+esc(c.Description)+'</div>':'')
    +'<div class="sec-title">计算公式</div><div class="formula">'+esc(c.Formula||'')+'</div>'
    +(params.length?'<div class="vars">'+params.map(p=>'<span><b>{'+esc(p.name)+'}</b> = '+esc(p.label)+'</span>').join('')+'</div>':'')
    +'<div class="sec-title">输入参数</div><div class="inputs">'+params.map((p,i)=>'<div class="inp"><label>'+esc(p.label)+(p.unit?'<em>'+esc(p.unit)+'</em>':'')+'</label><input type="number" step="any" data-i="'+i+'" placeholder="'+(p.unit||'请输入')+'"></div>').join('')+'</div>'
    +'<div class="result" id="result"><div class="lab">计算结果</div><div class="num" id="rnum">—</div>'+(c.ResultUnit?'<div class="unit" id="runit">'+esc(c.ResultUnit)+'</div>':'<div class="unit" id="runit"></div>')+'<div class="warn" id="rwarn"></div></div>'
    +(c.RefRange?'<div class="ref"><b>参考范围：</b>'+esc(c.RefRange)+'</div>':'')
    +'<button class="copybtn" id="copybtn">复制全文</button>';
  return html;
}
function wireFormula(c){
  const det=document.getElementById('dbody');
  const params=parseParams(c.InputParams);
  const inputs=det.querySelectorAll('.inp input');
  const rnum=det.querySelector('#rnum'), runit=det.querySelector('#runit'), rwarn=det.querySelector('#rwarn');
  function compute(){
    if(!params.length){ rnum.textContent='无需参数'; return; }
    const vals=[]; let ok=true;
    inputs.forEach(function(inp){ const v=parseFloat(inp.value); if(inp.value===''||isNaN(v)) ok=false; vals.push(isNaN(v)?NaN:v); });
    if(!ok){ rnum.textContent='—'; rwarn.textContent='请完整填写所有参数'; return; }
    const r=formulaToJS(c.Formula, params.map(p=>p.name));
    let res=null;
    try{ const fn=new Function(...r.names,'with(Math){ return ('+r.expr+'); }'); const out=fn.apply(null,vals); res=(typeof out==='number'&&isFinite(out))?out:null; }catch(e){ res=null; }
    if(res===null){ rnum.textContent='—'; rwarn.textContent='计算异常，请检查公式或参数'; } else { rnum.textContent=fmtNum(res); rwarn.textContent=''; }
  }
  inputs.forEach(function(inp){ inp.addEventListener('input',compute); }); compute();
  const copybtn=det.querySelector('#copybtn');
  if(copybtn) copybtn.onclick=function(){
    let txt=c.CalcName+'\n分类：'+(c.Category||'')+'\n'+(c.Description?('说明：'+c.Description+'\n'):'')+'公式：'+(c.Formula||'')+'\n';
    params.forEach(function(p,i){ const v=inputs[i]?inputs[i].value:''; txt+=p.label+'('+(p.unit||'')+')：'+v+'\n'; });
    txt+='结果：'+rnum.textContent+(runit.textContent||'')+'\n';
    if(c.RefRange) txt+='参考范围：'+c.RefRange+'\n';
    copyText(txt);
  };
}

    if(seg5>0)out.seg5={z:(seg5-(3.1747*Math.pow(bsa,0.36008)-0.2887))/(0.304+0.1514*bsa),mid:null};
    if(seg6>0)out.seg6={z:(seg6-(2.6108*Math.pow(bsa,0.37893)-0.2852))/(0.1465+0.1996*bsa),mid:null};
  } else if(method==='7'){
    if(seg1>0)out.seg1={z:(Math.log(seg1/10)+1.46115-0.3787*Math.log(bsa))/Math.sqrt(0.040172),mid:null};
    if(seg5>0)out.seg5={z:(Math.log(seg5/10)+1.31625-0.37442*Math.log(bsa))/Math.sqrt(0.028467),mid:null};
    if(seg6>0)out.seg6={z:(Math.log(seg6/10)+1.50927-0.41164*Math.log(bsa))/Math.sqrt(0.033031),mid:null};
  } else if(method==='8'){
    if(seg1>0)out.seg1={z:(seg1+0.3039-2.7521*Math.sqrt(bsa))/(0.1626+0.2881*Math.sqrt(bsa)),mid:null};
    if(seg5>0)out.seg5={z:(seg5+0.1817-2.9238*Math.sqrt(bsa))/(0.1801+0.253*Math.sqrt(bsa)),mid:null};
    if(seg6>0)out.seg6={z:(seg6+0.1502-2.2672*Math.sqrt(bsa))/(0.1709+0.2293*Math.sqrt(bsa)),mid:null};
    if(seg11>0)out.seg11={z:(seg11+0.2716-2.3458*Math.sqrt(bsa))/(0.1142+0.3423*Math.sqrt(bsa)),mid:null};
  }
  return out;
}
/* ---------- Kawasaki coronary Z-score (faithful port of cals.medlive.cn/calc/show/2?id=calc-1303) ---------- */
function kdzMethodName(m){return {1:'LMS（日本 布施2009）',2:'Zorji 1998',3:'Kurotobi 2002',4:'Tan 2006',5:'AHA 2004/2017',6:'McCrindle 2007',7:'Olivieri 2009',8:'Dallaire 2011'}[m]||m;}
function renderKDZ(){
  const sexOpts=[{v:'1',t:'男'},{v:'2',t:'女'}];
  const methodOpts=[{v:'1',t:'LMS（日本 布施2009）'},{v:'2',t:'Zorji 1998'},{v:'3',t:'Kurotobi 2002'},{v:'4',t:'Tan 2006'},{v:'5',t:'AHA 2004/2017'},{v:'6',t:'McCrindle 2007'},{v:'7',t:'Olivieri 2009'},{v:'8',t:'Dallaire 2011'}];
  const body=
    `<div class="calc-grid2">${num('kdzH','身高 (cm)','110','kdzRun()')}${num('kdzW','体重 (kg)','20','kdzRun()')}</div>
     <div class="calc-grid2">${sel('kdzSex','性别',sexOpts,'kdzRun()')}${sel('kdzMethod','计算方法',methodOpts,'kdzRun()')}</div>
     <div class="calc-note" style="margin:2px 0 6px">冠状动脉内径（mm，舒张末、内膜缘→内膜缘，至少填一项）。LMS 法按性别 + BSA 查表。</div>
     ${num('kdzRCA','Seg1 右冠脉 RCA (mm)','','kdzRun()')}
     ${num('kdzLMCA','Seg5 左主干 LMCA (mm)','','kdzRun()')}
     ${num('kdzLAD','Seg6 前降支 LAD (mm)','','kdzRun()')}
     ${num('kdzLCX','Seg11 回旋支 LCX (mm)','','kdzRun()')}
     ${out('kdzOut','<span class="muted">输入身高、体重、性别及冠脉内径后自动计算 Z 值</span>')}`;
  return card('川崎病 冠脉 Z 值（8 种方法）', body)+
    `<div class="calc-note">忠实移植自 cals.medlive.cn/calc/show/2?id=calc-1303。BSA 用 Haycock（0.024265×体重^0.5378×身高^0.3964）。8 种方法的回归系数与原网页逐一核对。
Z 值分类：Z&lt;2.0 正常；2.0–2.5 扩张；2.5–4.99 小动脉瘤；5.0–9.99 中型动脉瘤；≥10 巨大动脉瘤（AHA 2017）。
LMS 法显示该 BSA 下的中位数内径；其余方法仅给出 Z 值与分类（原网页亦如此）。仅作辅助评估，需结合超声技术与临床判断。</div>`;
}
function kdzRun(){
  const h=val('kdzH'),w=val('kdzW');const o=$('#kdzOut');
  if(!(h>0&&w>0)){o.innerHTML='<span class="muted">请输入身高与体重</span>';return;}
  const sx=sex('kdzSex')==='2'?2:1;
  const method=document.getElementById('kdzMethod').value||'6';
  const seg1=val('kdzRCA'),seg5=val('kdzLMCA'),seg6=val('kdzLAD'),seg11=val('kdzLCX');
  if(seg1<=0&&seg5<=0&&seg6<=0&&seg11<=0){o.innerHTML='<span class="muted">请至少填写一项冠脉内径（RCA / LMCA / LAD / LCX）</span>';return;}
  const r=kdzZ(sx,h,w,seg1,seg5,seg6,seg11,method);
  const segNames={seg1:'RCA 右冠脉',seg5:'LMCA 左主干',seg6:'LAD 前降支',seg11:'LCX 回旋支'};
  const segVal={seg1:seg1,seg5:seg5,seg6:seg6,seg11:seg11};
  let rows='';
  ['seg1','seg5','seg6','seg11'].forEach(k=>{
    const d=r[k]; if(!d) return;
    const z=d.z;
    const cls=z>=2.0?'warn':'';
    const txt=z<2.0?'正常':z<=2.5?'扩张':z<5?'小动脉瘤':z<10?'中型动脉瘤':'巨大动脉瘤';
    rows+=`<tr><td>${segNames[k]}</td><td>${segVal[k].toFixed(2)}</td><td>${d.mid!=null?d.mid.toFixed(2):'—'}</td><td><b style="color:var(--brand)">${z.toFixed(2)}</b></td><td><span class="chip ${cls}">${txt}</span></td></tr>`;
  });
  if(r.lmsOOR) rows+=`<tr><td colspan="5" style="color:#b45309">LMS 法：BSA 超出常模范围（0.139–3.37 m²），无法查表</td></tr>`;
  o.innerHTML=`<div style="font-size:13px;margin-bottom:6px">BSA = <b>${r.bsa.toFixed(2)}</b> m²（Haycock） · 方法：${kdzMethodName(method)}</div>
    <table class="kz"><tr><th>节段</th><th>实测(mm)</th><th>中位(mm)</th><th>Z 值</th><th>分类</th></tr>${rows}</table>`;
}

function esc(s){ s = String(s==null?'':s); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function recText(r){
  let out=[];
  (function walk(x){
    if(x==null) return;
    if(typeof x==='string'){ out.push(x); return; }
    if(Array.isArray(x)){ x.forEach(walk); return; }
    if(typeof x==='object'){ for(const k in x){ if(k==='py')continue; walk(x[k]); } }
  })(r);
  return out.join(' ').toLowerCase();
}
function catsOf(id){
  const s=new Set();
  DB[id].forEach(r=>{ if(r.category) s.add(r.category); });

}

  const q = state.q.trim().toLowerCase();

}

/* ---------- section helpers ---------- */
function listHTML(v){ const a=asArr(v); if(!a.length) return '<p class="muted">—</p>';

function preHTML(v){ if(v==null||v===''||(Array.isArray(v)&&!v.length)) return '<p class="muted">—</p>';
  return '<pre>'+esc(Array.isArray(v)?v.join('\n'):v)+'</pre>'; }
function asArr(v){ if(Array.isArray(v)) return v.map(String); if(typeof v==='string') return v.split('\n').map(s=>s.trim()).filter(Boolean); return []; }
function sec(t,f,r,mode){ const v=r[f]; if(mode==='list') return '<div class="sec"><div class="sec-t">'+t+'</div>'+listHTML(v)+'</div>';
  return '<div class="sec"><div class="sec-t">'+t+'</div>'+preHTML(v)+'</div>'; }
function templateCasesHTML(cases){

          '<pre id="'+id+'">'+esc(tpls[k])+'</pre>'+

}

/* ---------- generic renderer for extra drug-reference modules ---------- */
function genRender(fieldMap){

  return function(r){
    let h = header(r, r.category||'');
    fieldMap.forEach(([label, field, mode])=>{
      if(r[field]==null || r[field]==='' || (Array.isArray(r[field])&&!r[field].length)) return;
      const m = mode || (Array.isArray(r[field]) ? 'list' : 'pre');
      h += (m==='list' ? sec(label, field, r, 'list') : sec(label, field, r, 'pre'));
    });
    return h;
  };
}

/* ---------- copy ---------- */
function copyDetail(){
  const html = document.getElementById('dbody').innerText;
  copyText(html);
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>fallback(t));
  } else fallback(t);
}
function copyPreText(id){
  const el = document.getElementById(id);
  copyText(el ? el.innerText : '');
}
function fallback(t){
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败'); }
  document.body.removeChild(ta);
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }
/* ---------- detail open/close (mobile fullscreen) ---------- */

function closeDetail(){ const d=document.getElementById('detail'), l=document.getElementById('list'); if(d)d.classList.remove('open'); if(l)l.classList.remove('dim'); }
/* ---------- global search ---------- */
const gs = document.getElementById('gs'); const gsbox=document.getElementById('gsbox');
gs.oninput = ()=>{
  const q=gs.value.trim().toLowerCase();
  if(!q){ gsbox.classList.remove('show'); return; }
  let res=[];
  MODULES.forEach(m=>{ DB[m.id].forEach(r=>{

    renderSide(); renderChips(); const arr=listOf(state.mod);

};

const PED_DISEASES = [{"name":"儿童低血糖症","category":"儿科-代谢","summary":"血浆葡萄糖浓度过低导致大脑功能障碍的症状体征。较大儿童以Whipple三联征确诊。高胰岛素血症是婴儿和儿童持续性低血糖最常见的原因。低血糖可致发育迟缓、学习障碍及癫痫等长期后遗症。","symptoms":["自主神经症状：出汗、震颤、心悸、焦虑（β阻滞剂治疗者减轻）","神经低血糖症状：意识改变、行为异常、抽搐、昏迷","新生儿及婴儿：发绀、呼吸暂停、体温过低、肌张力低下、易怒、不安、进食不良、嗜睡、抽搐（常无明显症状）","较大儿童需符合Whipple三联征：症状+血浆葡萄糖低+补糖后症状消失"],"diagnosis":["关键样本（血糖<50 mg/dL时）：胰岛素、C肽、皮质醇、GH、乳酸、β-羟基丁酸、游离脂肪酸、血氨、酰基肉碱谱、尿有机酸","胰高血糖素刺激试验：血糖<50 mg/dL时静注/肌注胰高血糖素1 mg，血糖上升>30点提示胰岛素过量","高胰岛素血症标准：可测胰岛素/C肽+低脂肪酸血症+低酮血症+对胰高血糖素血糖反应不当","ABCC8/KCNJ11/GLUD1/GCK/HNF4A/HNF1A等基因检测","局灶性HI术前18F-DOPA PET定位"],"infusion":["急性治疗（有症状或无法口服）：2 mL/kg 10%葡萄糖水（D10W）静推","随后持续静脉输注葡萄糖：婴儿5-6 mg/kg/min，较大儿童2-3 mg/kg/min","二线药物奥曲肽2-20 μg/kg/天每6小时皮下（新生儿及2个月以下婴儿禁用，与坏死性小肠结肠炎相关）"],"oral_medication":["Diazoxide（高胰岛素血症首选）：5-15 mg/kg/天每12小时口服","兰瑞肽长效类似物60-90 mg每28天皮下（适用于>1岁）","急性轻症可口服15g快速作用碳水化合物（如4盎司果汁）","餐后低血糖：阿卡波糖12.5-50 mg随餐"],"treatment":["维持血浆葡萄糖>70 mg/dL，促正常发育，监测药物副作用","高胰岛素血症：Diazoxide→奥曲肽/兰瑞肽→局灶性病灶切除或弥漫性近全胰腺切除术（98%）","胰高血糖素、皮质醇等激素缺乏者相应替代（GH 0.3 mg/kg/wk；氢化可的松8-12 mg/m²/天）","GSD用玉米淀粉1-2 g/kg/次；胰岛素瘤手术切除并可治愈","避免连续喂养/强制喂食作为低血糖常规治疗方法"],"management":["所有低血糖障碍儿童家庭血糖监测（尤其生病期间）","血糖监测每15-20分钟一次直至>70 mg/dL，稳定后延长时间间隔","医院监督下禁食评估（置静脉导管备采关键样本）","新生儿的评估不应在出生后48-72小时内进行（过渡性低血糖期）"],"notes":["主要长期后遗症：发育延迟、学习障碍、癫痫、行为问题","26-48%的短暂性和持续性低血糖患儿存在神经发育异常","糖尿病母亲婴儿及围产期应激性高胰岛素血症多在3-6个月内缓解","KATP-HI对Diazoxide常无反应；局灶型（父系隐性变异+母体11p15缺失）可手术治愈"],"emergency":["低血糖昏迷/惊厥：有症状或无法口服者立即2 mL/kg D10W静脉推注，防吸入及意识水平下降","严重或反复低血糖、无法维持血糖>50 mg/dL（出生后48h内）或>60 mg/dL（48h后）者需排查持续性低血糖","严重低血糖或需静脉葡萄糖者不得延迟治疗等待诊断"],"pinyin":"ertongdixuetangzheng"},{"name":"糖原贮积病I型（von Gierke病）","category":"儿科-代谢","summary":"常染色体隐性遗传，因肝脏、肾脏、肠黏膜葡萄糖-6-磷酸酶（Ia型，G6PC）或转位酶（Ib型，SLC37A4）缺陷致空腹低血糖。常见于3-4个月起病。","symptoms":["新生儿期或3-4个月起低血糖、乳酸酸中毒、低血糖性癫痫发作","肝肿大致腹部突出，娃娃脸（脸颊丰满、四肢瘦弱、身材矮小）","肾脏增大，脾脏和心脏不受累","易瘀伤、鼻出血（血小板聚集黏附受损致出血时间延长）","生化：低血糖、乳酸酸中毒、高尿酸血症、高脂血症（血浆乳白外观）","间歇性腹泻（Ib型，可伴中性粒细胞减少、口腔黏膜溃疡、牙周病、IBD样结肠炎）","青春期延迟，女性可有多囊卵巢样超声表现"],"diagnosis":["低血糖+乳酸酸中毒+高尿酸血症+高脂血症提示GSD I型","胰高血糖素或肾上腺素刺激后血糖几乎无升高而乳酸显著上升","G6PC（Ia）及SLC37A4（Ib）基因检测为首选诊断方法","肝活检酶学检测（基因检测前时代）","Ib型可见中性粒细胞减少"],"infusion":["急性低血糖：静脉葡萄糖输注（手术前24-48小时持续输注以缩短出血时间）","DDAVP（1-脱氨基-8-D-精氨酸血管加压素）减少出血并发症（警惕液体过载及低钠血症）","术中应避免含乳酸不含葡萄糖的乳酸林格液，用10%葡萄糖维持正常血糖"],"oral_medication":["未煮熟玉米淀粉（缓释葡萄糖）：<2岁1.6 g/kg每4小时；较大儿童1.6-2.5 g/kg每4-6小时，与水或不含蔗糖果糖乳糖饮料同服","别嘌醇（黄嘌呤氧化酶抑制剂）控制高尿酸血症","他汀类及贝特类降脂药控制高脂血症","ACE抑制剂治疗微量白蛋白尿；柠檬酸盐补充剂预防肾钙质沉着症（勿与玉米淀粉同服）","噻嗪类利尿剂减少尿钙排泄；Ib型G-CSF（最低有效剂量）及维生素E改善中性粒细胞功能"],"treatment":["核心：维持正常血糖——夜间经鼻胃管持续输注葡萄糖或未加工玉米淀粉，白天频繁进食高复合碳水化合物","饮食限制蔗糖、果糖、乳糖及山梨醇摄入","补充钙和维生素D防止营养缺乏","原位肝移植：肝恶性肿瘤、多发肝腺瘤、药物无效的代谢紊乱及肝衰竭者",">2 cm或快速生长的肝腺瘤可行部分肝切除或经皮乙醇注射/动脉栓塞"],"management":["频繁指尖血糖监测（进食前、运动前后、夜间）；可用连续葡萄糖监测系统","定期监测尿酸、血脂、肾功能（蛋白尿、微量白蛋白尿）","监测肝腺瘤（可行AFP/CEA，但恶变时多正常，识别困难）","生长激素仅用于明确GHD者并密切监测代谢及腺瘤"],"notes":["第二/第三个十年可能发生肝腺瘤，可出血并恶变；部分患者出现肺动脉高压","大多数20岁以上患者出现蛋白尿，可进展为肾衰竭需透析移植","Ib型易反复细菌感染及口腔疾病","基因治疗（AAV8介导G6PC）正在3期临床试验"],"emergency":["低血糖性癫痫发作及严重低血糖需立即静脉葡萄糖处理","代谢危象（感染、手术等应激时）易诱发低血糖及酸中毒"],"pinyin":"tangyuanzhujibingixing（von gierkebing）"},{"name":"苯丙酮尿症（PKU）","category":"儿科-代谢","summary":"常染色体隐性遗传的苯丙氨酸羟化酶缺乏症，未经治疗血浆苯丙氨酸>20 mg/dL必致经典PKU的体征症状。美国发病率约1/14,000-20,000活产。","symptoms":["出生时正常，未经治疗逐渐出现严重智力障碍（50-70%智商<35）","婴儿期呕吐（严重者可能误诊为幽门狭窄）","肤色较兄弟姐妹浅、脂溢性/湿疹样皮疹","体味呈霉味或鼠味（苯乙酸气味）","约25%出现癫痫发作，伴痉挛、反射亢进、震颤、运动障碍","超过50%脑电图异常；小头畸形、上颌突出、牙齿间距宽、釉质发育不全、生长迟缓","骨矿物质密度低、骨质减少"],"diagnosis":["新生儿筛查：串联质谱法（苯丙氨酸/酪氨酸比值提高特异性）","血浆苯丙氨酸浓度>20 mg/dL（>1200 μmol/L）确诊经典PKU","PAH基因分子检测确认致病变异","所有高苯丙氨酸血症者检测血/尿蝶呤以排除四氢生物蝶呤（BH4）缺乏","BH4负荷试验（20 mg/kg口服）鉴别BH4反应型"],"infusion":[],"oral_medication":["沙丙蝶呤（sapropterin二盐酸盐，BH4合成型）：对剩余PAH活性者降低苯丙氨酸水平（血苯丙氨酸下降≥30%提示有反应）","BH4缺乏者：BH4 5-20 mg/kg/天口服，并长期补充L-dopa（联合卡比多巴）及5-羟色氨酸、叶酸（DHPR缺乏者）","大剂量中性氨基酸（LNAAs）：酪氨酸、色氨酸、亮氨酸、异亮氨酸、缬氨酸、甲硫氨酸、组氨酸、苯丙氨酸竞争转运减少苯丙氨酸入脑"],"treatment":["低苯丙氨酸饮食（血苯丙氨酸>10 mg/dL应立即开始；持续>6 mg/dL的婴儿亦推荐）","治疗目标：终生维持血苯丙氨酸2-6 mg/dL（120-360 μmol/L）","饮食需提供足够苯丙氨酸及酪氨酸以防缺乏（缺乏可致嗜睡、生长迟缓、贫血、腹泻甚至死亡）","注射用PEG化重组苯丙氨酸氨裂解酶（pegvaliase）适用于治疗仍>600 μmol/L的成年患者"],"management":["由代谢专家、营养师、心理学家组成的多学科团队长期管理（地区治疗中心）","成年后停止治疗可致神经认知功能下降（执行功能、注意力、情绪调节问题）","育龄女性患者孕前及孕期严格控制苯丙氨酸2-6 mg/dL（部分专家主张<4 mg/dL）"],"notes":["未经治疗者不到5%智商达平均水平","即使早期治疗者仍可能出现执行功能障碍","母体PKU未控制者后代智力障碍、小头畸形、生长迟缓、先天畸形及先心病风险高","1%-3%高苯丙氨酸血症由BH4缺乏引起，误诊为PKU虽控制苯丙氨酸仍会神经功能恶化"],"emergency":[],"pinyin":"benbingtongniaozheng（pku）"},{"name":"过敏性紫癜（亨-舒综合征）","category":"儿科-风湿免疫","summary":"亨诺-舍恩莱因紫癜是最常见的儿童期血管炎，特征为白细胞碎裂性血管炎及免疫球蛋白A在皮肤、关节、胃肠道和肾脏小血管中的沉积，又称IgA血管炎；约90%发生于儿童（多3-10岁），总体预后良好，多数病情急性且自限，平均持续约4周。","symptoms":["典型皮疹：初为粉红色斑点或风团，后发展为瘀点、隆起性紫癜或更大出血点，对称分布于重力依赖区（下肢）、上肢伸侧及臀部（压力点），成群出现持续3-10天，可复发","皮下水肿：手背、足背、眼周、嘴唇、阴囊或头皮","肌肉骨骼受累常见（高达75%）：关节炎/关节痛，多为少关节型大关节（膝、踝），自限，约2周内缓解，不导致畸形","胃肠道症状见于80%患儿：腹痛、呕吐、腹泻、麻痹性肠梗阻、黑便；肠套叠、肠系膜缺血和肠穿孔虽罕见但为严重并发症","肾脏受累见于30%：镜下血尿、蛋白尿、高血压、明显肾炎、肾病综合征及急性/慢性肾衰竭；肾症状可于初发后数月才显现","神经系统症状（由高血压或中枢神经系统血管炎引起）：头痛、癫痫发作、脑出血、意识水平下降、行为改变","少见表现：炎症性眼病、心炎、肺出血、睾丸炎和睾丸扭转"],"diagnosis":["诊断基于临床表现，出现典型皮疹时诊断通常简单；但至少25%病例皮疹出现在其他症状之后","EULAR/PRES分类标准：必须存在可触及紫癜（且无凝血功能障碍或血小板减少症），并满足以下一项或多项：腹痛、关节炎或关节痛、肾脏受累","实验室无特异性表现：白细胞增多、血小板增多、轻度贫血、ESR/CRP升高；HSP患者血小板计数正常（与血小板减少性紫癜鉴别要点）","评估肾脏受累：血压、尿液分析和血清肌酐","皮肤和肾脏活检显示白细胞碎裂性血管炎且受累组织有IgA沉积（非典型或严重病例需要）","胃肠症状时超声检查观察肠壁水肿或罕见肠套叠；钡剂灌肠可用于肠套叠诊断和治疗","需排除其他小血管白细胞碎裂性血管炎、感染、急性链球菌感染后肾小球肾炎、HUS、凝血障碍、SLE等"],"infusion":["严重病例使用静脉注射甲基泼尼松龙（替代口服泼尼松），持续1-2周后逐渐减量","严重病例有时使用静脉免疫球蛋白和血浆置换（数据不足以证明有效性）"],"oral_medication":["口服泼尼松1-2mg/kg/d，持续1-2周后逐渐减量（用于严重胃肠道症状或其他危及生命并发症）","慢性HSP肾炎可用的免疫抑制剂：硫唑嘌呤、环磷酰胺、环孢素和霉酚酸酯"],"treatment":["轻度且自限性HSP以支持性治疗为主：确保充足水分、营养和镇痛","皮质类固醇用于严重胃肠道症状或其他危及生命的并发症，可减轻腹部和关节疼痛，但不改变整体预后","不推荐使用皮质类固醇预防肾炎等并发症","快速减药可能导致HSP症状加重","急性严重胃肠道受累（肠套叠、肠穿孔）导致显著发病率和死亡率"],"management":["建议HSP患儿在诊断后至少6个月内持续监测血压和尿液，以监测肾炎的发展","肾脏疾病可能发生在诊断后6个月内；初次尿液检查正常者很少发生，但需随访"],"notes":["总体预后良好，大多数患儿病情急性且自限，平均持续4周","15-60%患儿在诊断后4-6个月内出现一次或多次复发，复发症状通常比初次发病轻","1-2%的HSP患儿发展为慢性肾病，其中不到5%的HSP肾炎患者进展为终末期肾病","初始病情较重者复发风险更高；长期预后通常取决于胃肠道或肾脏受累的严重程度和持续时间","肾移植后HSP复发和移植器官丧失风险在10年后估计为7.5%","约90%HSP病例发生在儿童（3-10岁），男性多于女性（1.2-1.8:1）；冬季和春季更常见，许多病例与上呼吸道感染有关"],"emergency":["急性严重胃肠道受累（肠套叠、肠穿孔）需急诊评估和处理","肠套叠可通过钡剂灌肠诊断和治疗","高血压、急性肾衰竭或急进性肾病表现需紧急评估","神经系统症状如惊厥、意识水平下降需警惕颅内出血或中枢神经系统血管炎"],"pinyin":"gmxzd（h-szhz）"},{"name":"中枢性性早熟","category":"儿科-内分泌","summary":"下丘脑-垂体-性腺轴提前激活导致青春期发育早于正常年龄（女性8岁前、男性9岁前）。女性发病率是男性5-10倍，90%以上女性为特发性，男性25-75%伴中枢神经系统结构异常。","symptoms":["女性8岁前出现乳房发育；男性9岁前睾丸增大（体积≥4mL）、阴囊变薄","身高、体重及身高增长速度加快","骨骼成熟加快、骨骺过早闭合，影响成年身高","女性早期月经可早至5.5岁出现，初潮周期不规则且多为无排卵","情绪行为波动常见，智力发育与实际年龄相符"],"diagnosis":["GnRH激动剂（亮丙瑞林皮下）刺激试验：LH峰值>5 IU/L提示青春期反应","血清LH、睾酮或雌二醇达青春期水平（女性低LH反应者可在刺激后20-24h测雌二醇>50 pg/mL）","骨龄超过实际年龄2-3个标准差","女性盆腔超声示卵巢、子宫增大至青春期大小","脑及垂体MRI排除中枢神经系统病变（尤其男性、<6岁或快速进展女性）"],"infusion":[],"oral_medication":["GnRH激动剂纳法瑞林鼻内给药800μg每日两次（对无法耐受注射者，依从性及吸收限制疗效）"],"treatment":["GnRH激动剂长效制剂为首选：醋酸亮丙瑞林0.2-0.3 mg/kg每28天肌注","长效亮丙瑞林11.25或30 mg每3个月肌注；或45 mg每24周皮下注射","组胺瑞林皮下植入剂（作用≥12个月）；曲普瑞林22.5 mg每24周肌注","快速进展性CPP、6岁前发病者几乎均适合治疗；可联合生长激素改善成年身高"],"management":["治疗有效指标：生长速率降至年龄相应水平、骨成熟减慢、性激素降至青春期前（睾酮<10-20 ng/dL、雌二醇<5-10 pg/mL）","血清LH/FSH多数降至<1 IU/L，GnRH刺激反应<2-3 IU/L","治疗通常持续至青春期年龄，停药后青春期迅速恢复（女性停药后平均18个月初潮）","治疗期间及结束后无严重不良反应报道，个别女性骨密度可逆性下降、BMI升高"],"notes":["未经治疗约30%女性及更大比例男性成年身高低于第五百分位","遗传性病因：MKRN3、DLK1基因父系遗传型占5-10%","下丘脑错构瘤是导致CPP最常见的脑病变","长期未治疗重度甲减患儿可出现VanWyk-Grumbach综合征（甲减伴性早熟）"],"emergency":[],"pinyin":"zhongshuxingxingzaoshu"},{"name":"儿童1型糖尿病与酮症酸中毒","category":"儿科-内分泌","summary":"1型糖尿病是自身免疫介导的胰岛β细胞破坏致胰岛素绝对缺乏，约占儿童糖尿病的大部分；约20-40%新发患儿以糖尿病酮症酸中毒（DKA）起病。DKA为高血糖、酮血症、代谢性酸中毒急症，治疗关键是审慎补液、静脉胰岛素和纠正电解质，脑水肿是主要致死原因。","symptoms":["多尿、多饮、多食、体重下降（分解代谢状态）；年幼儿童常表现为夜间遗尿","疲劳、虚弱、全身不适；女性可因慢性糖尿患外阴阴道念珠菌病","DKA表现：脱水、恶心、呕吐、腹痛、嗜睡、精神状态改变，极端情况昏迷","严重酮症酸中毒：Kussmaul深大急促非费力呼吸、呼气果味（丙酮）、QT间期延长、神经认知功能下降","婴儿期发病时出现酮血症可能性更大；应激（并发疾病、创伤）加速症状发展","症状按规律进展：早期间歇性多尿→持续性多尿和体重下降→DKA（多在数周内）"],"diagnosis":["非空腹血糖>200mg/dL（11.1mmol/L）伴典型症状即可诊断1型糖尿病，无论是否酮体阳性","血糖仪测毛细血管血快速确定高血糖；尿糖和酮体用尿试纸检测","确诊高血糖后测静脉血碳酸氢盐和pH评估DKA；即使脱水迹象轻微也应检查","基线HbA1c帮助估计高血糖持续时间（溶血性贫血、输血后等可致假性偏低）","DKA分类：轻度HCO3 16-20mEq/L、pH 7.25-7.35；中度HCO3 10-15、pH 7.15-7.25；重度HCO3<10、pH<7.15（校正钠>150mEq/L也属重度）","无法区分1/2型时检测糖尿病自身抗体；筛查乳糜泻（组织转谷氨酰胺酶IgA和总IgA）及自身免疫性甲状腺功能减退（TSH、甲状腺素）","10岁以上儿童血糖控制稳定后行空腹血脂；肥胖儿童需考虑2型糖尿病","不建议对健康无症状儿童常规筛查（血糖或OGTT检出率低）"],"infusion":["初始液体复苏：无葡萄糖等渗钠盐（林格乳酸盐或0.9%NaCl）10-20mL/kg，1-2小时内输注","随后用0.45%或0.9%NaCl，24-48小时补剩余液体不足+维持量（约1.5倍维持），估算按5-10%体重或85mL/kg","血糖降至约300mg/dL以下时输液加5%葡萄糖，<200mg/dL时用10%葡萄糖（双袋系统便于调整0-10%葡萄糖浓度）","静脉胰岛素0.05-0.1单位/kg/hr持续输注（不给予初始大剂量），滴定使血糖每小时下降75-100mg/dL","血清钾<5.5mEq/L时开始补钾（氯化钾或醋酸钾与磷酸钾1:1，40mEq/L）；血钾<3mEq/L时暂时停止胰岛素输注","脑水肿处理：甘露醇0.5-1g/kg（或3%高渗盐水）静脉，抬高床头，减少输液速度，转ICU","碳酸氢盐不常规使用（增加低钾血症和脑水肿风险）；仅在极少数严重酸中毒对标准管理无反应时考虑","非酮症高渗性昏迷：生理盐水迅速补血管内不足（液体不足约12-15%体重），最初12小时补50%并非常缓慢纠正高渗，0.45%NaCl输注，血糖近300mg/dL时换5%葡萄糖+0.45%NaCl，每升加约20mEq/L氯化钾"],"oral_medication":["1型糖尿病需终身胰岛素治疗，通常无常规口服降糖药","二甲双胍可作伴显著胰岛素抵抗1型患者（肥胖、胰岛素需求>1.2U/kg/天、黑棘皮病）的辅助用药，但通常不在诊断时开始；可减少胰岛素剂量和体重指数"],"treatment":["DKA治疗同时针对胰岛素缺乏及继发紊乱：审慎补液（警惕脑水肿）、持续静脉胰岛素、纠正钾磷等电解质丢失","监测：重度DKA每小时测血糖、每2小时测电解质（轻中度每3-4小时）、持续ECG监测（T波改变）直至明显缓解","血糖正常化通常先于酸中毒纠正；血糖恢复正常后仍需胰岛素抑制脂肪酸释放和酮症","DKA缓解标准：总碳酸氢盐>15mEq/L、pH>7.30、钠稳定在135-145mEq/L、阴离子间隙消失、无呕吐→过渡至口服饮食和皮下胰岛素（给长效或开始CSII，约30分钟后停静脉胰岛素滴注）","皮下胰岛素：诊断时开始，起始TDD约0.4-1.2U/kg/天（无DKA青春期前0.4-0.6U/kg/天；伴DKA超重青春期青少年1-1.2U/kg/天；婴儿变异大）","基础-餐时方案：长效胰岛素约50%TDD（睡前），餐时速效胰岛素（碳水化合物比例=450/TDD，胰岛素敏感因子=1800/TDD）；可用每日多次注射或胰岛素泵（CSII）","连续葡萄糖监测（CGM）减少指尖血糖需求，目标范围内时间（70-180mg/dL）；混合闭环系统（泵+CGM联动）改善血糖控制","快速起效胰岛素类似物（利斯普、阿司帕特、格卢利辛）优于普通胰岛素；长效类似物（甘精、地特、德谷）提供更平稳基础水平"],"management":["基础与高级糖尿病自我管理教育（监测血糖、血/尿酮体、正确注射、识别处理低血糖、饮食计划），由经验丰富的糖尿病护理人员和营养师提供","营养管理：热量按年龄性别体型和活动量；约55%碳水、30%脂肪、15%蛋白；复合碳水化合物为主，限制蔗糖和精炼糖，避免含糖饮料","碳水化合物计数和阅读食品标签，按摄入碳水化合物灵活调整胰岛素剂量","掌握运动活动和生病期间的胰岛素调整与血糖监测技能；引入CGM或胰岛素泵时需糖尿病教育者进一步培训","目标血糖个体化（通常90-180mg/dL），兼顾年龄、病程、低血糖史、身体活动；定期监测HbA1c和CGM时间范围","教育家庭认识DKA诱因（感染、依从性差、创伤）"],"notes":["脑水肿是儿童DKA发病和死亡的重要原因；早期快速注射胰岛素和大量输液被认为是风险因素，必须频繁神经系统检查（意识改变、头痛加重、心动过缓、瞳孔变化、癫痫）","DKA患者全身钾不足但初始血清钾正常或升高，治疗后血清钾可显著下降；需密切监测","持续酮尿不一定代表治疗失败：尿试纸只测乙酰乙酸，DKA时β-羟基丁酸为主（比例可升至8:1），酸中毒缓解后转化为乙酰乙酸经尿排出","血清肌酐可因酮体干扰假性升高；脂肪酶不升高的淀粉酶升高可能非特异或源自唾液","血糖下降>100mg/dL/小时增加脑水肿风险；液体补充时应避免渗透压快速下降","20-40%新发糖尿病儿童在确诊前发展DKA，美国数据示发病率上升","85%新诊断1型糖尿病无家族史；同胞患病率约8%，单卵双生共病率30-65%","DKA时静脉液体中葡萄糖浓度管理（双袋系统）为优选方法"],"emergency":["DKA为急症：休克、意识减退/昏迷、脱水>5%、持续呕吐需紧急处理并联系上级医生","脑水肿警示（严重或进行性头痛、心率减慢、易激惹、意识下降、失禁、特定神经系统体征）→立即甘露醇0.5-1g/kg或3%高渗盐水、减慢输液、转ICU；仅稳定后考虑颅脑影像","非酮症高渗性昏迷（血糖>800mg/dL、血清渗透压≥350mOsm/kg、无或轻微酮症、严重脱水、昏迷）需缓慢纠正高渗，警惕血栓","血清钾<3mEq/L必须暂时停止静脉胰岛素输注","DKA患儿应排查诱因：感染、依从性差、创伤等"],"pinyin":"et1xtnbytzszd"},{"name":"先天性甲状腺功能减退症","category":"儿科-内分泌","summary":"甲状腺激素在组织水平作用不足的状态，多为甲状腺发育不良（占80-85%）或甲状腺激素合成缺陷（约30%）。发病率约1/2000-1/4000，多数经新生儿筛查发现。","symptoms":["出生时体重身长正常，但前囟后囟开放宽大","长期黄疸（间接高胆红素血症）、嗜睡、哭声少、喂养困难","巨舌、便秘、脐疝、腹部膨隆","体温低于35°C、皮肤冰冷斑驳、四肢水肿","脉搏缓慢、心脏杂音、心脏肥大、心包积液","皮肤干燥鳞屑、毛发粗糙稀疏、面色苍白伴胡萝卜素血症黄染","3-6个月后生长发育迟缓、智力发育延迟（未经治疗时）"],"diagnosis":["新生儿筛查：足跟采血测TSH/T4（出生1-5天）","血清T4及游离T4降低，TSH升高（严重可>100 mU/L）","甲状腺球蛋白水平（发育不全者低，异位及合成缺陷者升高）","骨龄X线：骨化中心延迟、骨骺缺失","123I闪烁显像或超声明确病因（异位/无甲状腺/甲状腺肿）"],"infusion":[],"oral_medication":["左旋甲状腺素（L-T4）片剂：初始剂量10-15 μg/kg/天（足月婴儿37.5-50 μg/天），重度者高剂量起始，轻度者8-10 μg/kg/天","不与大豆蛋白配方、浓缩铁或钙剂同服（影响吸收）"],"treatment":["确诊后立即口服L-T4治疗，理想在2周内使甲状腺功能恢复正常","治疗目标：血清TSH维持在年龄相应参考范围，游离T4/总T4维持在参考范围上半部"],"management":["定期监测血清T4/游离T4及TSH：前6个月每1-2个月一次，6个月-3岁每2-4个月一次","避免过度治疗（可致智商下降及不良神经发育结局）","约35%甲状腺位置正常者可能为暂时性，可于3岁后行4周L-T4停药试验评估","早产、低出生体重及21三体/心脏缺陷婴儿风险高，需二次筛查"],"notes":["前2-3周及时诊断治疗可防止不可逆脑损伤，预后良好","最严重者（T4最低、骨成熟最延迟）即使早期治疗仍可能有智商下降及神经心理问题","约10%患儿存在神经感觉性听力障碍"],"emergency":["新生儿筛查阳性者应立即召回评估并开始治疗，诊断或治疗延误可致不可逆神经发育障碍","母亲妊娠期未治疗的TSHR阻断抗体所致甲减，患儿可有发育延迟"],"pinyin":"xiantianxingjiazhuangxiangongnengjiantuizheng"},{"name":"先天性肾上腺皮质增生症（21-羟化酶缺乏症）","category":"儿科-内分泌","summary":"常染色体隐性遗传病，超过90%的CAH由21-羟化酶（CYP21A2）缺乏引起，导致皮质醇和/或醛固酮合成不足及雄激素过多。典型发病率约1/14,000-18,000，约70%为失盐型。","symptoms":["失盐型（约70%）：体重下降、食欲不振、呕吐、脱水、虚弱、低血压、低血糖、低钠血症、高钾血症，约10-14天发病","女性胎儿产前雄激素过多：出生时外生殖器男性化（阴蒂增大、唇部部分或完全融合）","产后雄激素过多：生长加速、骨成熟提前、阴毛腋毛早现、痤疮、声音低沉","男性阴茎、阴囊增大而睾丸发育正常；可伴睾丸肾上腺残留肿瘤","非典型型：多毛、痤疮、月经紊乱、不孕，或无症状"],"diagnosis":["17-羟孕酮（17-OHP）明显升高（基础及ACTH刺激后均显著升高）","失盐型：低钠血症、高钾血症、代谢性酸中毒、低血糖、血浆肾素升高","ACTH兴奋试验（静脉0.125-0.25mg cosyntropin后测17-OHP）为最可靠确诊方法","CYP21A2基因分型（需父母双方分型确认变异）","新生儿筛查：滤纸血测17-OHP（基于胎龄阈值，可加串联质谱二级筛查）"],"infusion":["失盐危象急性期需静脉补液纠正脱水、电解质紊乱并给予糖皮质激素（原文明确强调需紧急处理，未列具体静脉药物剂量）"],"oral_medication":["氢化可的松：12-15 mg/m²/24h，分三次口服（应激时加倍或三倍）","氟氢可的松：婴儿0.1-0.3 mg/天分两次（可达0.4 mg/天），较大儿童0.05-0.1 mg/天","氯化钠补充：婴儿8 mmol/kg"],"treatment":["糖皮质激素替代并抑制过多雄激素，首选短效氢化可的松","盐皮质激素（氟氢可的松）替代治疗失盐型","女性明显阴蒂肥大：2-6个月行阴蒂缩小术及阴道成形术","产前治疗：高危妊娠母体地塞米松20 μg/kg母体体重分2-3次（妊娠6周前开始，仅对受累女性胎儿）"],"management":["监测线性生长：身高百分位上升提示治疗不足，下降提示糖皮质激素过量","定期检查17-OHP及雄烯二酮（清晨用药前或固定时间），骨龄X线","监测生命体征：心动过速、高血压提示盐皮质激素过量；血浆肾素活性应保持正常或近正常","控制不佳者（多毛、肥胖、闭经）可考虑双侧腹腔镜肾上腺切除并激素替代"],"notes":["女婴出生时外生殖器男性化、内生殖器正常；男婴出生时外观正常，多因肾上腺功能不全症状才被诊断，死亡率高于女婴","未治疗或治疗不足者骨骺过早闭合致成年身高受限","母体TSHR阻断抗体是约2%先天性甲减的病因，但与本症无直接关系"],"emergency":["失盐危象：低钠血症、高钾血症、低血压、休克、心律失常，数天或几周内可死亡，常由胃肠炎诱发","头2年因并发疾病（多为胃肠炎）需住院的危象风险高，需急诊补液及激素处理"],"pinyin":"xiantianxingshenshangxianpizhizengshengzheng（21-qianghuameiquefazheng）"},{"name":"尿崩症（中枢性及肾源性）","category":"儿科-内分泌","summary":"以多尿、多饮为特征，中枢性尿崩症因血管加压素缺乏所致，肾源性尿崩症因肾脏对血管加压素不敏感所致，可为先天性遗传缺陷或获得性原因。","symptoms":["病理性多尿、多饮（每日液体摄入>2 L/m²/24h）","婴儿出现易怒、生长迟缓、间歇性发热","肾源性NDI婴儿常表现为发热、呕吐、脱水","长期大量饮水可致非梗阻性肾积水、输尿管积水及巨大膀胱（NDI）","生长迟缓可因大量饮水致热量摄入不足"],"diagnosis":["血清渗透压>300 mOsm/kg H2O且尿渗透压<300 mOsm/kg可诊断尿崩症","copeptin>20 pmol/L提示肾源性尿崩症","禁水试验或高渗盐水（3%）输注刺激后测copeptin区分中枢性与肾源性","特发性/未解释性尿崩症需连续MRI并定量检测AFP及β-hCG排除生殖细胞瘤","评估其他垂体激素缺乏及视觉、中枢神经系统功能"],"infusion":["中枢性DI合并颅内肿瘤大量输液时：低剂量持续输注血管加压素以维持尿浓缩、允许>1 L/m²/天液体输入"],"oral_medication":["DDAVP口服片剂25-300 μg每8-12小时（中枢性DI；剂量约为鼻内剂量的10倍）","肾源性NDI：噻嗪类利尿剂减少总尿量","NDI：吲哚美辛和阿米洛利可与噻嗪类联合进一步减少多尿"],"treatment":["中枢性DI首选DDAVP（鼻内制剂或片剂），按所需抗利尿时间及患者偏好调整","NDI治疗重点为去除根本原因（致病药物、高钙血症、低钾血症、输尿管阻塞）","先天性NDI：摄入热量与渗透压负荷比例最高的食物以促生长并减少尿量","某些NDI患者高剂量DDAVP联合吲哚美辛有效"],"management":["两次用药之间每天至少留1小时尿液排泄时间，仅在口渴时饮水以防水中毒","DDAVP用于儿童尿床仅作临时措施，现不批准用于该适应症（低钠血症风险）","NDI需确保足够热量、避免严重脱水"],"notes":["约10%中枢性DI为特发性，35%随时间进展为其他激素缺乏或找到病因","中枢性DI常见原因：AVP基因变异、颅脑创伤/手术、生殖细胞瘤、松果体瘤、朗格汉斯细胞组织细胞增生症、淋巴细胞性垂体炎","Wolfram综合征（DI+糖尿病+视神经萎缩+耳聋）由WFS1/WFS2变异引起","术后三相反应：短暂DI（12-48h）→SIAD（可达10天）→可能永久性DI"],"emergency":["严重脱水及高钠血症需急诊纠正","术中/术后中枢性DI高渗状态（血清渗透压>300）伴稀释尿（>200 mL/m²/hr）需鉴别处理","DDAVP治疗期间低钠血症/水中毒（过度饮水时）"],"pinyin":"niaobengzheng（zhongshuxingjishenyuanxing）"},{"name":"生长激素缺乏症（孤立型）","category":"儿科-内分泌","summary":"垂体生长激素分泌不足致出生后生长严重受损。孤立型GHD由生长激素释放激素受体、GH1基因及X染色体基因异常引起；获得性原因常见于颅脑放疗、脑膜炎、组织细胞增生症及创伤。","symptoms":["出生后生长障碍、身材矮小（1岁时身高低于平均值4个标准差以上）","生长速度减慢，青春期发育可延迟","GHRHR缺陷者前叶垂体体积小、出生后生长严重受损","X连锁GHD可伴低丙种球蛋白血症或智力障碍","继发于放疗者生长在放疗期间即减慢，1-2年后随GHD发展而下降"],"diagnosis":["GH刺激试验示生长激素反应低下；IGF-1水平低","头颅MRI：垂体发育不良、垂体柄缺失、异位后叶垂体","GH1、GHRHR及相关垂体转录因子基因检测","全垂体功能评估（TSH、LH、FSH、ACTH、催乳素）排除多垂体激素缺乏"],"infusion":[],"oral_medication":[],"treatment":["重组人生长激素替代治疗（多数GH1基因缺失患儿反应良好）","合并其他垂体激素缺乏者同步替代（甲状腺激素、性激素、皮质醇等）"],"management":["定期随访生长速度、身高、IGF-1","放疗相关GHD者同时监测TSH、ACTH缺乏及放射性早熟","脊柱放疗所致轴向生长受限无法经GH治疗改善"],"notes":["部分GH1基因缺失儿童会产生抗GH抗体而停止生长","视神经发育不全综合征患儿约5%合并尿崩症","严重早发多垂体激素缺乏（含ACTH）常伴三联征：垂体发育不良、垂体柄缺失、异位后叶垂体，多见于男性"],"emergency":[],"pinyin":"shengzhangjisuquefazheng（gulixing）"},{"name":"甲状腺功能亢进症（Graves病）","category":"儿科-内分泌","summary":"儿童甲状腺功能亢进最常见原因，自身免疫性疾病，TRS抗体刺激TSH受体致甲状腺激素过量及弥漫性增生。患病率约0.02%（1:5000），高峰11-15岁，男女比约1:5。","symptoms":["震颤、头痛、情绪不稳、行为异常、睡眠困难、注意力下降、多动、学习成绩下降","食欲增加但体重下降或明显消瘦","心动过速、心悸、收缩压升高、脉压增大","弥漫性甲状腺肿（多表面光滑无结节）","眼部症状：眼球突出、眼睑红斑、结膜充血、复视、视力减退","皮肤温暖湿润、过度出汗，近端肌无力，多尿、排便次数增多","青春期前发病者生长加快、骨骼成熟提前；月经后期女性可继发闭经"],"diagnosis":["血清TSH降低，游离T4和/或T3升高","TRAb检测（功能检测TSI或竞争性结合TBII）对诊断高度敏感特异","123I放射性碘摄取升高且呈弥漫性（甲状腺炎等则摄取低）","甲状腺功能减退相关自身免疫病筛查（1型糖尿病、乳糜泻、炎症性肠病）"],"infusion":["甲状腺风暴：丙硫氧嘧啶400mg q8h（PO/IV/NGT）","甲状腺风暴：饱和碘化钾溶液3滴/8小时","甲状腺风暴：普萘洛尔20-40mg q4-6h或1mg缓慢静脉注射（哮喘及非心率相关心衰者禁用）","甲状腺风暴：泼尼松20mg bid；静脉输液（葡萄糖、电解质、多种维生素）"],"oral_medication":["甲巯咪唑（首选抗甲状腺药）：初始剂量0.5-1.0 mg/kg/24h（最大40 mg/天），每日1-2次","丙硫氧嘧啶可致肝衰竭，不推荐用于儿童（仅极少数严重病例短期使用）","普萘洛尔或阿替洛尔作为ATD辅助缓解心血管症状"],"treatment":["儿童首选抗甲状腺药物治疗（缓解率30-50%，长期治疗4-10年可提高）","放射性碘131I消融（>10岁，严重者先用甲巯咪唑恢复功能并术前停药3-5天）","甲状腺切除术（全切/近全切，术前用甲巯咪唑达正常甲状腺功能并加SSKI 1-3滴每日2-3次共7-14天）","药物治疗失败、依从性差或出现严重不良反应时行根治性治疗"],"management":["ATD治疗前3个月内密切监测不良反应（发热、咽炎、口腔溃疡时停用并查中性粒细胞计数）","严重不良反应（粒细胞缺乏、肝炎、血管炎等）者改行放射性碘或手术","Graves眼病通常随甲功正常自行缓解，活动性眼病用CAS评分评估，避免吸烟"],"notes":["甲巯咪唑与胎儿皮肤发育不全、脐膨出等先天畸形相关，丙硫氧嘧啶与头颈泌尿畸形相关","粒细胞减少症发生率0.1-0.5%，可致致命感染","Graves病暂时性无症状粒细胞减少（<2000/mm³）不是停药指征"],"emergency":["甲状腺风暴：高热（≥104°F）、心动过速、心衰、精神状态改变、谵妄、昏迷，诱因为创伤、感染、放射性碘或手术，成人评分≥45高度提示","未经治疗的甲状腺风暴可迅速发展为谵妄、昏迷甚至死亡"],"pinyin":"jiazhuangxiangongnengkangjinzheng（gravesbing）"},{"name":"儿童社区获得性肺炎","category":"儿科-呼吸","summary":"肺炎是肺实质的炎症，是全球5岁以下儿童死亡的主要传染病原因。病原体按年龄分层：1月龄以上5岁以下儿童以呼吸道病毒最常见，肺炎链球菌是3周以上儿童最常见的细菌病原，肺炎支原体和肺炎衣原体是5岁及以上儿童最常见的细菌病原。治疗根据年龄、免疫状况和临床表现选择抗生素，肺炎链球菌仍是核心靶点。","symptoms":["常先有数天上呼吸道感染症状（鼻炎和咳嗽），呼吸急促是最典型的临床表现","呼吸做功增加：肋间、胸骨下和胸骨上凹陷，鼻翼扇动及辅助肌肉使用，严重感染伴发绀和嗜睡（尤其婴儿）","成人和较大儿童细菌性肺炎通常突然起病，表现为高热、咳嗽和胸痛","下叶肺炎可致腹痛（但无压痛），或疼痛放射至同侧肩膀","严重肺炎风险因素：体温超过38.5°C、呼吸急促、凹陷、鼻翼扇动、呻吟、毛细血管充盈时间超过2秒、发绀、心动过速及进食不良","细菌性肺炎外周血白细胞计数15,000-40,000/mm³以多形核细胞为主；病毒性一般不超过20,000/mm³且以淋巴细胞为主"],"diagnosis":["胸部X光片浸润影（前后位和侧位）支持诊断，并可发现胸腔积液或脓胸等并发症","无并发症肺炎无需复查胸片确认治愈；PIDS-IDSA指南不建议对可门诊治疗的疑似肺炎患儿常规行胸片检查","床旁肺部超声检测实变、空气支气管征或积液，具有高度敏感性和特异性（但依赖操作者）","血培养仅对病情无改善/恶化、复杂性肺炎或需住院的儿童推荐（仅10%肺炎链球菌肺炎患儿血培养阳性）","病毒性感染诊断基于呼吸道分泌物病毒基因组或抗原检测（多种PCR方法可用，包括RSV、流感、偏肺病毒、SARS-CoV-2等）","肺炎支原体：呼吸道拭子PCR或IgG血清转换可确诊；冷凝集素（滴度>1:64）非特异，约一半患者阳性","CRP、降钙素原、ESR等生物标志物可辅助区分细菌与病毒，但可靠性尚不足以支持常规临床使用","复发性肺炎（1年内≥2次或不同时≥3次发作）需评估基础疾病（囊性纤维化、免疫缺陷、纤毛运动障碍、异物等）"],"infusion":["住院患儿符合条件者（肺炎链球菌无严重耐药地区、已完全接种Hib和肺炎球菌疫苗且病情不重）：氨苄西林或青霉素G","不符合上述条件的住院患儿：头孢曲松或头孢噻肟","怀疑肺炎支原体或肺炎衣原体感染时加用大环内酯类抗生素","临床特征提示葡萄球菌肺炎（如气肿、肺脓肿）时初始抗菌治疗加用万古霉素或克林霉素","流感-耐甲氧西林金黄色葡萄球菌共感染伴呼吸衰竭时联合万古霉素和具有MRSA抑制作用的第二种抗生素（如克林霉素）"],"oral_medication":["门诊轻症疑似细菌性肺炎首选阿莫西林；除非当地耐药率低，否则应使用高剂量阿莫西林90mg/kg每日两次","替代方案：头孢呋辛、阿莫西林/克拉维酸","学龄儿童及青少年，或怀疑肺炎支原体、肺炎衣原体感染时，大环内酯类是门诊治疗合适选择，通常首选阿奇霉素","8岁及以上儿童可选用克拉霉素或多西环素作为替代","青少年在其他药物有禁忌时可选用氟喹诺酮类（左氧氟沙星、莫西沙星）","低收入和中等收入国家中口服锌剂（12月以下10mg/天，12月以上20mg/天，连用7天）可能降低重症肺炎死亡率"],"treatment":["轻症门诊患儿使用阿莫西林；怀疑非典型病原体（支原体、衣原体）时使用大环内酯类","住院患儿治疗基于当地流行病学、免疫状况和临床表现选择抗生素","抗生素疗程：通常建议持续至体温正常后72小时；5-7天短疗程对门诊患儿可能同样有效","对轻症、有病毒感染证据且无呼吸窘迫的学龄前儿童，暂不给予抗生素是合理的，但已知病毒感染者（尤其流感）高达30%可合并细菌病原体，病情恶化时应开始抗生素","住院患儿需支持性治疗：静脉输液、补充氧气、持续气道正压通气、机械通气，低血压或败血症时使用血管活性药物","Bubble CPAP相比标准氧疗能降低低氧血症导致的肺炎死亡率","疫苗接种预防：13价肺炎球菌结合疫苗显著降低儿童肺炎住院率，6月龄以上所有儿童应接种流感疫苗"],"management":["预防以疫苗接种为核心：PCV13、流感疫苗、Hib疫苗，保持对b型流感嗜血杆菌、百日咳和麻疹的高接种率","6月龄以下婴儿的家庭接触者和其他主要照顾者应接种流感疫苗","完全接种Hib和肺炎链球菌疫苗的儿童患相应病原体肺炎的可能性较低"],"notes":["病毒性病原体是1月龄以上5岁以下儿童下呼吸道感染最常见的病因，RSV和鼻病毒最常见（尤其2岁以下）","肺炎链球菌是3周以上儿童最常见的细菌病原体，金黄色葡萄球菌和A组链球菌也是重要病原","抗生素治疗无效时需考虑：并发症（胸腔积液/脓胸）、细菌耐药、非细菌性病因（病毒/真菌/吸入）、支气管阻塞、基础疾病及其他非感染原因","通常无并发症细菌性肺炎在开始抗生素后48-72小时内临床症状改善，但影像学改善滞后于临床症状","胸片示病毒性肺炎常为双肺间质性浸润和支气管周围阴影，肺炎球菌肺炎表现为肺叶实变，但仅凭影像无法准确判断病因","复发性肺炎需评估囊性纤维化、镰状细胞病、HIV、免疫缺陷、纤毛运动障碍、解剖异常等基础疾病"],"emergency":["住院指征：年龄<6个月、免疫抑制状态、中毒外貌、中重度呼吸窘迫（凹陷、鼻翼扇动、呻吟）、发绀/低氧血症（海平面吸空气血氧饱和度<90%）、休克（心动过速、低血压、毛细血管充盈延长）、复杂性肺炎、镰状细胞贫血伴急性胸综合征、呕吐或不能耐受口服、严重脱水、口服抗生素无反应、社会因素、高危病原体","复杂性肺炎包括胸腔积液、脓胸、脓肿、支气管胸膜瘘、坏死性肺炎、ARDS、肺外感染（脑膜炎、关节炎、心包炎、骨髓炎、心内膜炎）、溶血性尿毒综合征或败血症"],"pinyin":"etsqhdxfy"},{"name":"囊性纤维化","category":"儿科-呼吸","summary":"囊性纤维化（CF）是一种常染色体隐性遗传的多系统疾病，由CFTR基因功能障碍导致，是白种人最常见的致命性隐性遗传病，也是儿童严重慢性肺病和胰腺功能不全的最常见原因。","symptoms":["呼吸道：最早症状为咳嗽，后期慢性咳嗽、痰液增多、运动不耐受、呼吸急促、喘息，最终发展为支气管扩张","常感染金黄色葡萄球菌、铜绿假单胞菌、伯克霍尔德菌复合体等","15-20%新生儿出现胎粪性肠梗阻（腹部膨胀、呕吐、无法排出胎粪，出生24-48小时内）",">85%患儿外分泌胰腺功能不全：频繁大量油腻粪便、体重增长困难、生长迟缓、腹部隆起","鼻息肉、鼻塞、流涕、嗅觉丧失、全鼻窦炎","盐分丢失：汗液咸味、低钠血症、低氯性碱中毒（尤其温暖天气或胃肠炎时）","直肠脱垂、便秘和远端肠梗阻综合征（较大儿童腹部绞痛、腹胀）","男性无精子症，女性生育能力降低；后期杵状指、发绀"],"diagnosis":["汗液氯化物>60 mmol/L（毛果芸香碱离子渗透法，分次两次升高）+临床特征/新生儿筛查阳性可诊断","新生儿筛查：血清免疫反应性胰蛋白酶原（IRT）+DNA（检出1个致病变异为阳性）或IRT/IRT复测","DNA检测：检出两个CF致病基因变异（最常见F508del，87%患者至少携带一个）","粪弹性蛋白酶-1降低提示胰腺功能不全；10岁后每年口服葡萄糖耐量试验筛查CF相关糖尿病","胸部X光/CT：肺过度膨胀、支气管周围增厚、支气管扩张（上叶先受累）、黏液堵塞","肺功能：FEV1是最能反映死亡率的指标，儿童期每年平均下降2-3%","汗液检测对胎龄<36周且体重<2kg婴儿难以达到足量出汗；注意假阳/假阴情况（表454.3）"],"infusion":["静脉抗生素（表454.6）：妥布霉素8-12 mg/kg/24h每日1次、阿米卡星15-30 mg/kg/24h、头孢他啶150 mg/kg/24h分3次、哌拉西林300-400 mg/kg/24h、美罗培南60-120 mg/kg/24h、万古霉素40 mg/kg/24h、奈夫西林100-200 mg/kg/24h，疗程通常至少14天","铜绿假单胞菌感染常需两种静脉药物联合，必要时加第三种药物对抗金黄色葡萄球菌","急性加重时早期静脉输液补充水分（尤其温暖天气或急性胃肠炎时）","雾化抗生素（非静脉）：吸入妥布霉素300mg/剂每日2次、吸入氨曲南75mg每日3次"],"oral_medication":["口服抗生素（表454.6）：双氯西林25-50 mg/kg/24h分4次、头孢氨苄50 mg/kg/24h分4次、克林霉素10-30 mg/kg/24h、阿莫西林克拉维酸25-45 mg/kg/24h、环丙沙星20-30 mg/kg/24h（铜绿假单胞菌）、甲氧苄啶-磺胺甲噁唑、阿奇霉素10 mg/kg第1天/5 mg/kg第2-5天","慢性铜绿假单胞菌感染每周3次阿奇霉素长期治疗（抗炎作用）","CFTR调节剂（口服）：ivacaftor、lumacaftor/ivacaftor、tezacaftor/ivacaftor、elexacaftor/tezacaftor/ivacaftor（90%患者适用，可改善FEV1并降低汗液氯化物）","胰酶替代：肠溶包衣pH敏感酶微球，每次摄入脂酶剂量应低于2500 IU/kg，随餐服用","脂溶性维生素A、D、E、K补充；维生素D3推荐400-500 IU/日（0-12月龄）、800-1000 IU/日（1-10岁）、800-2000 IU/日（≥10岁）；婴儿期需补充盐分","乌尔酮脱氧胆酸治疗胆汁性肝硬化相关肝功能异常；聚乙二醇治疗便秘/远端肠梗阻综合征","食欲刺激剂（如赛庚啶）改善摄入；支气管扩张剂用于可逆性气道阻塞","过敏性支气管肺曲霉病：口服皮质类固醇、口服抗真菌药、难治性用奥马珠单抗"],"treatment":["综合护理包括肺部治疗（气道清理+控制感染）和营养治疗两大核心","气道清理：胸部叩击/体位引流、高频胸部振动装置、振荡式正压呼吸设备，每天2-4次，急性加重期增加频次","吸入治疗：重组人Dnase（2.5mg单次雾化/日）、7%高渗盐水雾化每天2-4次改善黏液清除","抗生素是控制肺部感染进展的主要手段，依据呼吸道培养病原体及药敏选择，急性加重（发热、呼吸急促、FEV1急剧下降）应使用全身抗生素","营养：高热量饮食、体重和BMI维持与长期肺功能相关，必要时夜间鼻胃管/胃造口喂养","支气管扩张剂治疗可逆性气道阻塞；大环内酯类抗炎；不推荐常规长期全身皮质类固醇（副作用重）","肺不张：积极静脉抗生素+针对性胸部物理治疗，5-7天无改善需支气管镜","终末期肺病可行肺移植；elexacaftor/tezacaftor/ivacaftor治疗后部分慢性肺病患者已无需移植"],"management":["多学科团队（护士、物理治疗师、呼吸治疗师、社会工作者、营养师）定期评估，每1-3个月随访","每次就诊评估肺部病史和体检，无法取得痰液时采集下咽拭子培养及药敏","每年胸部X光、定期肺功能检查；对MRSA、铜绿假单胞菌等耐药菌采取接触隔离及吸入设备严格清洁","每年对患者及看护者进行焦虑和抑郁筛查","监测并发症：糖尿病（10岁后每年OGTT）、肝脏疾病、胰腺炎、维生素D缺乏"],"notes":["预防接触MRSA、铜绿假单胞菌、伯克霍尔德菌复合体及其他耐药革兰氏阴性菌至关重要","静脉抗生素治疗调整应基于病情无改善而非培养结果；无效时应考虑右心衰竭、哮喘/ABPA、非结核分枝杆菌感染","女性患者预后较差；社会经济状况显著影响死亡率、营养和肺功能","气道分泌物水分不足，需重视口腔补水，早期静脉输液补充水分是必要的","睡眠呼吸障碍及夜间低氧血症可加速肺动脉高压和右心衰竭"],"emergency":["大量咯血：24小时内失血量≥250ml，需密切监测并迅速补充失血，支气管动脉栓塞控制持续严重咯血","气胸：常伴胸痛、肩痛、呼吸急促或咯血，放置胸管（±胸膜固定术）为初始治疗，持续漏气考虑VATS","急性呼吸衰竭：需氧气、通气支持，右心衰竭应积极治疗","慢性呼吸衰竭伴PaO2<50mmHg：需低流量氧疗将PaO2提高至≥55mmHg，考虑肺移植转诊","肺心病/右心衰竭：限制盐、利尿剂、肺血管扩张剂，心脏衰竭预后较差"],"pinyin":"nangxingxianweihua"},{"name":"小儿急性上呼吸道感染","category":"儿科-呼吸","summary":"普通感冒是急性上呼吸道感染，典型表现为流鼻涕和鼻塞，全身症状通常不存在或轻微，可由200余种鼻病毒等多种病毒引起。治疗以支持性护理和预期指导为主，不建议给4岁以下儿童使用非处方止咳感冒药，抗菌治疗无益。","symptoms":["婴儿以发热和鼻分泌物为主要表现，较大儿童和成人发热罕见","首发症状常为咽喉痛或干燥感，随后出现鼻塞和流涕，发病第2-3天鼻塞占主导","约2/3患儿出现咳嗽，常始于鼻塞之后，可在其他症状缓解后持续1-2周","可有头痛、声音嘶哑、易怒、睡眠困难或食欲下降，呕吐和腹泻较罕见","流感病毒、RSV、人偏肺病毒和腺病毒较HRV或冠状病毒更常伴发热及全身症状；HRV更常与喘息相关","病程通常约1周，10%的病例持续2周"],"diagnosis":["临床诊断，最重要的任务是排除其他更严重或需要治疗的疾病（过敏性鼻炎、鼻窦炎、异物、链球菌感染、百日咳等）","常规实验室检查对诊断和治疗并无帮助；怀疑过敏性鼻炎可行鼻嗜酸性粒细胞涂片（Hansel染色）","病毒病原检测（PCR、培养、抗原、血清学）通常不必要，仅在考虑抗病毒治疗（如流感）时才需明确病因","细菌培养、PCR或抗原检测仅在怀疑A组链球菌或百日咳时才有意义","流涕或白天咳嗽持续至少10-14天无好转、症状随时间恶化或出现发热/面部疼痛/肿胀时，应考虑细菌性鼻窦炎"],"infusion":[],"oral_medication":["流感确诊或疑似且症状出现48小时内可用奥司他韦、扎那米韦、帕拉米韦或巴洛沙韦","第一代抗组胺药可将鼻溢液减少25-30%（与其抗胆碱能特性有关），第二代抗组胺药对感冒症状无效","局部抗胆碱能药溴化异丙托品治疗鼻漏，疗效与抗组胺药相当且无镇静作用","局部肾上腺素能减充血剂（苄沙唑林、氧甲唑林、苯肾上腺素）用于较大儿童，不建议用于6岁以下","伪麻黄碱口服治疗鼻塞，其效果在治疗头一天最明显","生理盐水鼻滴剂可改善鼻腔症状，适用于所有年龄段","对乙酰氨基酚或NSAIDs缓解咽喉痛、头痛或肌肉痛，不应给予阿司匹林（雷耶综合征风险）","蜂蜜对缓解1岁以上儿童夜间咳嗽有效，1岁以下应避免（肉毒杆菌中毒风险）"],"treatment":["治疗主要为支持性护理和预期指导，抗菌治疗无益且应避免","保持适当口腔水分以防脱水，局部生理盐水冲洗鼻腔有助于减轻症状","不建议给4岁以下婴儿和儿童使用非处方止咳感冒药，较大儿童使用须权衡利弊","锌含片在症状出现后24小时内使用可缩短感冒持续时间，但不能减轻严重程度，副作用常见（味觉减退、恶心）","第一代抗组胺药可能有助于缓解鼻后滴流相关的咳嗽；止咳糖或硬糖对6岁以下儿童暂时有效","无效治疗方法：维生素C、愈创甘油醚、吸入温湿空气、紫锥菊、抗生素","发热通常不是单纯性感冒症状，一般不需退烧药；NSAIDs可缓解头痛或肌肉疼痛","对支气管扩张剂或短效β2受体激动剂有反应者提示病毒诱发的反应性气道疾病"],"management":["向护理人员进行预期指导，确保护理人员了解药物作用机制和正确剂量，仔细阅读标签避免多药过量","频繁洗手、避免触摸口鼻眼、使用含酒精手消毒剂以减少传播","针对流感的疫苗接种或化学预防可预防由该病原体引起的感冒","建议高风险婴儿使用帕利珠单抗或尼瑞塞马布预防严重RSV下呼吸道感染（不能预防上呼吸道感染）"],"notes":["最常见并发症为急性中耳炎，5%-30%的感冒儿童发生，幼婴和集体托儿所儿童发病率较高","0.5%-9%的儿童病毒性上呼吸道感染并发急性细菌性鼻窦炎，鼻分泌物颜色变化不代表细菌继发感染","细菌性肺炎是较少见并发症，哮喘加重是感冒可能的严重并发症，多数儿童哮喘加重与感冒病毒有关","呼吸道感染儿童不应给予阿司匹林，因流感患儿有雷耶综合征风险","WHO建议不要使用蒸汽或冷却喷雾疗法治疗感冒；冷却喷雾加湿器每次使用后必须清洁","锌至少服用5个月可能降低感冒发生率，但因长期使用和不良反应不适合儿童"],"emergency":["出现持续至少10-14天的流涕或咳嗽无好转、症状恶化、发热或面部疼痛/肿胀时，提示细菌性鼻窦炎需就医评估","咳嗽持续数天到数周伴喘息、或有哮喘病史者感冒后出现严重呼吸症状时需警惕哮喘加重"],"pinyin":"xejxshxdgr"},{"name":"急性喉炎（声门下喉炎）","category":"儿科-呼吸","summary":"急性喉炎为常见疾病，多由病毒引起，累及声门下区域，表现为声音嘶哑、犬吠样/金属样咳嗽和吸气性喘鸣（哮吼）。治疗核心是气道管理和低氧血症处理，雾化外消旋肾上腺素用于中重度，口服皮质类固醇（地塞米松）显著有效且能减少住院和干预需求。","symptoms":["发病时通常表现为上呼吸道感染，伴咽喉痛、咳嗽和声音嘶哑，声音嘶哑和失声程度可能与其全身症状不成比例","阻塞的主要部位通常是声门下区域，环状软骨是10岁以下儿童上气道最狭窄的部分","哮吼（喉气管支气管炎）：犬吠样或金属样咳嗽、声音嘶哑、吸气性喘鸣，常先有1-3天流涕、咽炎、轻微咳嗽和低烧","夜间症状加重，一周内症状完全消失；烦躁和哭泣会严重加剧症状","呼吸窘迫可表现为呼吸频率增加、鼻翼扇开、胸骨上/胸骨下及肋间隙凹陷、持续的喘鸣声","痉挛性哮吼常在傍晚或夜间发作，可有轻中度鼻塞和声音嘶哑，通常无发热，症状在几小时内减轻","缺氧和血氧饱和度降低仅在上呼吸道完全阻塞时出现；出现缺氧、发绀、苍白或意识模糊的儿童需立即气道管理"],"diagnosis":["急性喉炎是临床诊断，不需要进行颈部X光检查","颈部X光可显示典型声门下狭窄或尖塔征，但与疾病严重程度相关性差，仅非典型表现或需与会厌炎鉴别时考虑","鉴别诊断：细菌性气管炎（最重要，气道阻塞风险高）、白喉、麻疹性哮吼、异物吸入、咽后/扁桃体周围脓肿、喉部狭窄、血管环、声门下血管瘤、喉乳头状瘤、血管性水肿","会厌炎：急性发热、咽喉痛、流口水、吞咽困难、三脚架姿势，侧位X光可见拇指征，为紧急情况","复发性哮吼患儿需评估哮喘、过敏和胃食管反流，<9%在支气管镜检查中发现临床显著异常"],"infusion":["会厌炎：头孢曲松100mg/kg/天分两次+万古霉素15mg/kg每8小时一次，非口服给药，直到培养和耐药性报告结果","细菌性气管炎经验性治疗：万古霉素或克林霉素联合第三代/第四代头孢菌素（如头孢曲松或头孢匹胺）","过敏因素引起的急性喉部肿胀：肌注肾上腺素0.01mL/kg（1mg/mL，最大0.5mL/次）"],"oral_medication":["口服地塞米松0.6mg/kg（最大16mg）为大多数研究证实的有效剂量，0.15mg/kg剂量也可能同样有效","泼尼松1mg/kg与标准剂量或低剂量地塞米松效果相当","口服皮质类固醇对轻度喉炎也有效，表现为2小时后症状改善、复诊减少、住院缩短及后续干预需求降低","会厌炎接触者预防：家中儿童<4岁未完成免疫接种、<12个月未完成初次疫苗接种或免疫受损时，利福平20mg/kg/天口服连续4天（最大600mg）","插管后上呼吸道水肿：拔管前6-12小时用地塞米松0.5mg/kg（最大16mg）"],"treatment":["治疗儿童哮吼的主要方法是气道管理和低氧血症的处理，呼吸窘迫的治疗应优先于任何检查","大多数急性痉挛性哮吼或感染性哮吼患儿可在家中安全治疗","雾化外消旋肾上腺素（0.25-0.5mL 2.25%溶液溶于3mL生理盐水，可每20分钟使用一次）用于休息时中重度喘鸣、可能需要插管、呼吸窘迫和/或低氧血症","观察2-3小时后无休息时喘鸣、已接受类固醇治疗、呼吸正常、脉搏血氧正常且意识清醒者可安全出院","口服皮质类固醇在治疗病毒性喉炎方面具有显著疗效，通过抗炎作用减轻喉黏膜水肿","哮吼不建议使用抗生素；6岁以下儿童不应使用非处方止咳感冒药物","需要插管治疗的严重哮吼患儿可考虑氦氧混合气（heliox），但证据并不充分","会厌炎为紧急医疗状况：应在手术室或重症监护室等受控环境中放置人工气道，所有患者接受氧气治疗，外源性肾上腺素和皮质类固醇无效"],"management":["Cochrane综述未发现冷雾治疗哮吼在急诊室中的有效性证据","外消旋肾上腺素活性持续时间小于2小时，使用后必须密切观察患者状况，症状可能再次出现","大多数哮吼引起的死亡由喉部阻塞或气管造口并发症导致，出院标准需严格掌握"],"notes":["副流感病毒（1、2、3型）约占哮吼病例的75%，其他病原包括甲型和乙型流感、腺病毒、RSV、COVID-19及麻疹","大多数哮吼患者年龄在3个月到5岁之间，发病高峰在2岁，男性更多见，好发于秋末和冬季","约15%的病毒性喉炎患者出现并发症，最常见为感染扩散到中耳、终末细支气管或肺实质","细菌性气管炎可能是病毒性喉炎的并发症而非独立疾病，与产毒金葡菌或化脓性链球菌相关时可引发中毒性休克综合征","使用皮质类固醇唯一不良反应是接受1mg/kg/24h剂量连续8天的患者出现白色念珠菌喉气管炎","水痘或结核病患者不应使用皮质类固醇，除非正在接受适当的抗结核治疗","雾化肾上腺素慎用于心动过速、法洛四联症等心脏疾病及心室出口阻塞患者","未经治疗的会厌炎死亡率6%，若早期诊断并适当治疗则预后非常好；急性喉气管支气管炎、喉炎和痉挛性哮吼的预后也很好"],"emergency":["出现缺氧、发绀、面色苍白或意识模糊的儿童需要立即进行气道管理","住院指征：进行性喘鸣、休息时严重喘鸣、呼吸窘迫、低氧血症、发绀、精神状态恶化、口腔进食困难、雾化肾上腺素和全身性糖皮质激素后4小时内仍持续有中度哮吼症状（休息时仍有喘鸣和/或凹陷）、需要多次雾化肾上腺素治疗、需要可靠观察","会厌炎（高热、流口水、吞咽困难、中毒样表现）为紧急医疗状况，需立即在受控环境建立人工气道","气管插管或气管造口需保持原位直至水肿和痉挛消退，通常应在几天内尽快拔除"],"pinyin":"jxhy（smxhy）"},{"name":"急性支气管炎","category":"儿科-呼吸","summary":"急性支气管炎是常继发于病毒性上呼吸道感染的临床综合征，以咳嗽为主要症状，病程通常约2周，很少超过3周。无特异性治疗方法，可自行缓解，抗生素不能加速好转，治疗以支持性护理为主。","symptoms":["患儿最初表现为非特异性上呼吸道感染症状如鼻炎，3-4天后出现频繁咳嗽，可有痰或无痰","几天后痰液可能变得浑浊，提示白细胞聚集但不一定意味着细菌感染","许多幼儿吞咽痰液可导致呕吐，较大儿童可能出现胸痛且咳嗽加剧","痰液逐渐变稀（5-10天内），咳嗽随之减轻，整个病程约2周，很少超过3周","早期可无发热或低热，伴鼻咽炎、结膜炎和鼻炎等上呼吸道症状","随着病情进展，呼吸音粗糙，可出现粗厉的哮鸣音和散在的喘鸣声"],"diagnosis":["临床诊断，主要目标是排除需要抗生素治疗的细菌性疾病（肺炎、百日咳或细菌性气管炎）","生命体征正常以及胸部检查无异常可降低患肺炎的可能性","胸部X光片可能正常，也可能显示支气管纹理增多","通常不建议痰液培养（细菌分离不一定意味着感染），除囊性纤维化等特殊疾病外","持续或反复出现的症状应促使考虑以咳嗽为主的其他疾病（哮喘、囊性纤维化、百日咳、支原体肺炎、异物吸入等）"],"infusion":[],"oral_medication":[],"treatment":["急性支气管炎无特定治疗方法，是病毒感染反应，可自行缓解","抗生素虽然常被推荐，但不能加速病情好转，应避免不必要使用","频繁改变体位有助于婴儿的肺部排痰","较大儿童在湿度较高环境中可能感到舒适，但这并不会缩短病程","止咳药对最年幼的儿童是禁忌，可能增加继发感染风险，应谨慎使用；抗组胺药和祛痰剂也不适用","4岁以下儿童不应使用非处方止咳感冒药物，4-11岁儿童使用时应谨慎"],"management":["以支持性护理和预期指导为主，告知家长病程通常约2周、可自行缓解"],"notes":["急性支气管炎通常继发于病毒性上呼吸道感染，冬季呼吸道病毒综合征常见时更为常见","气管支气管上皮可能受损或过度敏感，导致持续1-3周的咳嗽","需与以咳嗽为突出表现的其他疾病鉴别，包括哮喘、胃食管反流、异物吸入、囊性纤维化、百日咳等","急性气管支气管炎指气管受到明显影响的状况（如百日咳、副流感或白喉时使用的术语）"],"emergency":[],"pinyin":"jxzqgy"},{"name":"支气管哮喘","category":"儿科-呼吸","summary":"哮喘是儿童最常见的慢性疾病，以反复发作的喘息、咳嗽、气促和胸闷为特征，由气道慢性炎症、气道高反应性和气流阻塞引起。管理依据年龄和严重程度/控制水平进行阶梯治疗，ICS为持续性哮喘的一线控制药物，2022 GINA/NAEPP EPR4指南推荐ICS-福莫特罗SMART疗法作为学龄儿童中重度持续哮喘首选。","symptoms":["反复出现的间歇性干咳和呼气时喘息，较大儿童和成人症状类似","白天症状通常与体力活动或玩耍有关（运动诱发），夜间症状在呼吸道感染或吸入过敏原诱发的长时间加重时更明显","儿童的其他哮喘症状可能轻微且缺乏特异性，包括自我限制体力活动、全身疲劳","年幼儿童可能报告间歇性的、无特定部位的胸痛、胸闷、堵塞和紧绷感","急性发作时听诊可闻呼气相喘鸣和延长的呼气阶段；局部呼吸音减弱提示气道阻塞所致通气不足","严重发作时气道阻塞明显，表现为吸气和呼气相喘鸣、胸骨上/肋部凹陷、鼻翼扇动和辅助呼吸肌使用；极严重时气流受限以致喘鸣消失（无声胸）","5岁及以上肺功能异常：FEV1降低、FEV1/FVC比值低于正常下限、吸入短效β2激动剂后FEV1改善>9%-12%或预测FEV1增加>10%"],"diagnosis":["诊断主要依赖病史：反复喘息发作、过敏性鼻炎/结膜炎/特应性皮炎/食物过敏史、父母哮喘等支持证据","门诊吸入短效β受体激动剂（沙丁胺醇）后10分钟内症状迅速缓解或明显改善有助于确诊","肺功能测定（spirometry）是客观评估气流受限的标准方法，通常4-5岁以上儿童可完成","可逆性标准：吸入SABA后FEV1改善>9%-12%或预测FEV1增加>10%；运动试验FEV1下降≥15%；日间/昼夜PEF变异≥20%","过敏测试（皮肤点刺或特异性IgE）和外周血嗜酸性粒细胞计数评估2型炎症，辅助管理和预后判断","哮喘控制评估量表：ACT（≥12岁，≥20分控制良好）、C-ACT（4-11岁）、TRACK（4岁以下，<80分提示控制不佳）","胸部X光通常正常或仅示过度充气和支气管周围增厚，用于排除异物、血管环、吸入性肺炎等类似疾病","需与声带功能障碍、胃食管反流、鼻窦炎、异物吸入、囊性纤维化、气管支气管软化等鉴别"],"infusion":["急诊或住院急性发作：静脉、注射或口服皮质类固醇；单次口服/静脉/肌注地塞米松0.6mg/kg（最大16mg）可替代泼尼松且呕吐发生率低","严重发作时在SABA治疗后症状无改善者，每6小时加用吸入异丙托溴铵（与沙丁胺醇联合）","极度严重病例可注射肾上腺素或其他β受体激动剂"],"oral_medication":["急性发作家庭管理：口服泼尼松1-2mg/kg/天（不超过40mg/天）持续4天，同时继续吸入β2激动剂","白三烯受体拮抗剂孟鲁司特：1-5岁4mg、6-14岁5mg、15岁及以上10mg，每晚一次（作为ICS替代或辅助控制药）","扎鲁司特：7-11岁10mg每日两次；12岁及以上40mg/天（20mg片剂每日两次）"],"treatment":["阶梯治疗（NAEPP EPR4与GINA 2022指南，按0-4岁、5-11岁、≥12岁三个年龄组）：步骤1间歇性哮喘按需SABA，0-4岁在呼吸道感染开始时可短期加用每日ICS","步骤2轻度持续哮喘：每日低剂量ICS为首选，替代为每日孟鲁司特或色甘酸钠","步骤3中度持续：学龄儿童首选每日+按需低剂量ICS-福莫特罗组合吸入剂（SMART疗法）；替代为中等剂量ICS、低剂量ICS-LABA、低剂量ICS+LTRA等","步骤4：每日+按需中等剂量ICS-福莫特罗；替代为中等剂量ICS-LABA、中等剂量ICS+LTRA、≥12岁可加LAMA","步骤5-6重度持续：每日高剂量ICS-LABA为首选，辅助LTRA或LAMA；避免长期口服全身性皮质类固醇（需控制于隔日不超过20mg）","生物制剂：奥马珠单抗（抗IgE，≥6岁严重过敏性哮喘）、美泊利珠单抗（抗IL-5，≥6岁嗜酸性粒细胞哮喘）、贝那利珠单抗（抗IL-5Rα，≥12岁）、杜普利珠单抗（抗IL-4Rα，≥6岁中度至重度嗜酸表型哮喘）、特泽佩鲁单抗（抗TSLP，≥12岁严重哮喘）","≥5岁且哮喘控制良好的过敏性哮喘患儿，在步骤2-4治疗基础上可加用皮下过敏原免疫疗法（SCIT）","环境控制：减少室内过敏原（尘螨、动物皮屑、蟑螂、霉菌）及烟草烟雾、空气污染物暴露；多组分尘螨干预（防螨罩、热水洗床上用品、移除地毯、湿度<50%）","每日控制药物达良好控制并持续至少3个月时可考虑下调剂量；控制不佳时先评估依从性、吸入技术和合并症再升级治疗","哮喘管理关键要素：定期评估与监测、患者教育（书面哮喘行动计划）、控制诱发因素与合并疾病、合理选药"],"management":["所有哮喘患儿应持有书面哮喘行动计划（绿/黄/红区），含每日维持方案和急性发作应对方案","每2-6周定期复诊直至良好控制，之后每年2-4次复诊；至少每年一次肺功能测定","教育患儿及家属：哮喘是慢性炎症性疾病，需坚持每日控制药物；60%的时间患者未正确使用ICS","评估吸入器使用技术，定期重新评估自我管理技能","处理合并症：过敏性鼻炎、鼻窦炎、胃食管反流、肥胖等","消除环境暴露：戒烟、避免强烈气味、控制尘螨/霉菌/宠物皮屑/蟑螂过敏原暴露，效果可能需要≥6个月"],"notes":["2020年美国超700万儿童被诊断哮喘，是儿童急诊就诊、住院和缺课最常见原因之一","ICS是持续性哮喘治疗的基石，能改善肺功能、减少急性发作和全身皮质类固醇需求；高剂量ICS（儿童每日≥1000μg）可能引起生长抑制和骨量减少，需监测身高和骨质疏松风险","LABA不可单独用于持续性哮喘（无ICS时增加严重发作和死亡风险），必须与ICS联合使用","孟鲁司特具有FDA黑框警告（神经精神不良反应），用于过敏性鼻炎受限","约40%儿童哮喘至青春期转归缓解；长期ICS不改变日后摆脱哮喘的可能性，但可防止肺功能下降","幼儿反复喘息中仅少数发展为持续性哮喘，主要风险因素为父母哮喘、湿疹和吸入过敏原致敏","过度使用SABA增加哮喘死亡或濒死风险，每月使用≥1罐或每年≥3罐提示控制不佳","接受长期全身皮质类固醇或高剂量ICS的患者存在肾上腺功能不全风险，手术等应激情况需补充剂量"],"emergency":["严重急性发作指征：静息时呼吸困难、PEF或FEV<预测值或个人最佳值50%、发绀、精神状态改变、无声胸、气体交换不良、矛盾性胸腹运动","急诊处理：补充氧气+每20分钟吸入短效β2激动剂共1小时，必要时全身性皮质类固醇；首次吸入β2激动剂无效时加用吸入异丙托溴铵","哮喘危象：标准治疗无法缓解的严重发作，需快速评估阻塞严重程度和恶化风险","危及生命征象：极度呼吸困难、无法说话、嗜睡或意识模糊、发绀、呼吸暂停，应立即呼叫急救","有严重发作史或生命威胁性发作史、尤其发作突然的患者，可考虑家中备肾上腺素自动注射器和便携式氧气，必要时立即拨打急救电话","转诊专科医生：4岁以下需第3步以上治疗、5岁以上需第4步以上治疗时建议转诊"],"pinyin":"zqgxc"},{"name":"支气管肺发育不良","category":"儿科-呼吸","summary":"支气管肺发育不良（BPD）是主要见于胎龄<32周早产儿的慢性肺病，特征是肺泡发育不全，常伴气道功能异常和肺血管生长障碍，表现为出生后28天内持续需氧。","symptoms":["进行性呼吸窘迫：呼吸急促、头部上下动、胸廓凹陷，需氧及呼吸支持","基线喘息声或粗糙哮鸣音，慢性呼吸功能不全可有碳酸氢盐升高、高碳酸血症、低氧血症、红细胞增多症","BPD发作：急性气道阻塞表现为突然低氧血症和心动过缓","常见并发症肺动脉高压（严重BPD中可达40%），可发展为右心衰竭","生长迟缓：严重肺病婴儿因呼吸做功和缺氧导致能量消耗增加","病毒性呼吸道感染时肺部加重，喘鸣、呼吸急促和凹陷更明显"],"diagnosis":["诊断标准：出生后前28天内需>21%氧气治疗至少28天（表466.1/127.1）","分级（<32周胎龄在36周PMA或出院时评估）：轻度=可呼吸空气；中度=需<30%氧；重度=需≥30%氧和/或正压支持（PPV或nCPAP）","胸部X光：空气滞留、局部肺不张、间质改变、支气管周围增厚；严重者囊状变化和/或气肿","经胸超声心动图筛查肺动脉高压（15-25%严重BPD婴儿合并）；确诊肺动脉高压需心脏导管插入术","血清脑钠肽（BNP）可监测肺动脉高压治疗效果","血气分析显示CO2升高、碳酸氢盐升高、低氧血症；肺功能呈阻塞性小气道疾病"],"infusion":["利尿剂：呋塞米静脉每次1 mg/kg，每12-24小时一次（可减少肺间质水肿、促进脱机）","急性肺动脉高压危象需紧急处理（可静脉使用抗肺动脉高压药物，原文未列具体静脉用药）"],"oral_medication":["利尿剂：呋塞米口服2 mg/kg每12-24小时一次；氯噻嗪5-10 mg/kg每12小时一次（避免高钙尿症、保护骨骼发育）","支气管扩张剂：沙丁胺醇（β受体激动剂）、溴化异丙托品，可改善肺顺应性（注意高血压、心动过速副作用）","皮质类固醇：地塞米松低累积剂量0.89 mg/kg分10天逐渐减量（用于出生7天后仍依赖呼吸机的高危早产儿促进拔管）","咖啡因：负荷20 mg/kg，24小时后5-10 mg/kg/日维持（降低BPD发生率和严重程度）","肺动脉高压治疗：西地那非等抗肺动脉高压药物","吸入型皮质类固醇（布地奈德、氟替卡松、倍氯米松）；氟替卡松+沙美特罗联合可能有益"],"treatment":["BPD急性期和稳定期治疗均为支持性：适当维持通气+积极营养支持以促进肺部修复","维持氧饱和度≥92%以确保生长和神经认知发育；通过生理测试逐步降低氧浓度（脉搏血氧/多导睡眠监测调整）","保持功能性残气容量：优先非侵入性支持（nCPAP）促进肺部生长，严重囊性异质型需长期机械通气（低频<20-30次/分、长吸气时间、潮气量10-15mL/kg、PEEP通常>6-8cmH2O）","避免机械通气（早期nCPAP+INSURE/MIST/Lisa）+表面活性物质替代+产前皮质类固醇可适度降低BPD发病率","预防呼吸病毒性疾病：洗手、避免接触呼吸道感染人群，RSV季节使用呼吸道合胞病毒免疫预防（帕利珠单抗）","营养支持：充足热量（通常>120-130 kcal/kg/日）促进肺部正常生长，必要时强化配方奶、管饲或胃造口"],"management":["出院后需肺科和耳鼻喉科医生密切随访（通气机调整、撤机、气管切开护理和拔管）","气管切开患儿须由训练有素且清醒的医护人员24小时照护（不良事件风险高，包括死亡）","避免接触二手烟草烟雾、电子烟排放物","反复呼吸道症状或肺炎且无感染原因者，评估误吸风险（吞咽困难、胃食管反流），考虑Nissen胃折叠术或胃空肠吻合术","监测肺动脉高压（尤其需氧且有慢性呼吸功能不全者）、阻塞性睡眠呼吸暂停"],"notes":["严重BPD合并肺动脉高压者发病率和死亡率更高，疾病发作或麻醉时可能出现肺动脉高压危象","死亡率10-25%，持续需呼吸机支持超过6个月者死亡率最高；肺心病、RSV感染是常见死亡原因","预后总体良好：多数婴儿第一年内停止吸氧，早期住院时间较长；儿童期常有类似哮喘症状，可改善或持续至成年","长期机械通气者死亡或需气管切开概率可高达20%，但2-3岁时大多数可成功脱离","常规使用抗生素、吸入支气管扩张剂或利尿剂未被证明可预防BPD；现有证据不支持对急性期/稳定期BPD常规使用任何药物","全身皮质类固醇增加脑瘫和神经发育障碍风险，不推荐常规使用"],"emergency":["BPD发作（突然低氧血症和心动过缓）：可用支气管扩张剂、增加呼气末正压、紧急使用镇静剂缓解","肺动脉高压危象：急性发作时突然恶化，需紧急处理并监测（原发严重BPD死亡率高）","严重RSV感染风险高，必须预防性治疗","因肺功能受损再次住院在前3年内最常见"],"pinyin":"zhiqiguanfeifayubuliang"},{"name":"毛细支气管炎","category":"儿科-呼吸","summary":"急性毛细支气管炎是婴儿和年幼儿童因多种病毒性下呼吸道感染引起的临床综合征，RSV是超过50%病例的病原，特征为呼吸急促、喘鸣、哮鸣音和湿啰音。治疗以支持性治疗为主，沙丁胺醇、皮质类固醇和利巴韦林均不被推荐；预防上尼瑞塞马布（nirsevimab）单剂量长效单克隆抗体已取代帕利珠单抗。","symptoms":["婴儿最初出现上呼吸道感染症状（打喷嚏和清亮流涕），可伴食欲下降和发热","逐渐出现呼吸困难：阵发性咳嗽、气促和易怒，呼吸急促可能影响进食","非常年幼婴儿可能发生呼吸暂停，出生胎龄小于44周的婴儿风险最高，早产是额外风险因素","体格检查常闻及喘鸣声和啰音，呼气时间延长，呼吸做功增加伴鼻翼扩张和凹陷","气流完全受阻时喘鸣声消失，因此没有听到喘鸣声并不令人放心；听不清呼吸音提示严重阻塞","症状通常在咳嗽和呼吸困难开始后72小时内为最高风险期；门诊症状持续时间中位数约14天，10%患儿持续3周"],"diagnosis":["临床诊断：适用于上呼吸道症状后首次出现喘息症状的婴儿","通常不需要胸部X光检查（肺不张影像可能难以与细菌性肺炎区分，导致不必要的抗生素使用）","实验室检测不常用；白细胞计数和分类通常正常，不能预测细菌性继发感染","病毒检测（PCR或快速免疫荧光）不常用，但若可避免更侵入性检查或治疗则有帮助","确诊病毒性细支气管炎可能无需对发热婴儿进行败血症评估；中耳炎可能伴随细支气管炎出现","反复喘息、难治或伴生长迟缓的婴儿需评估囊性纤维化、免疫缺陷等慢性疾病","需与哮喘、解剖异常、异物吸入、囊性纤维化等婴儿喘息病因鉴别"],"infusion":["静脉补液应使用等渗液体，以避免低钠血症的风险"],"oral_medication":[],"treatment":["治疗为支持性治疗：缺氧儿童补充氧气，美国国家指南建议目标氧饱和度90%","严重病例可能需要正压通气；高流量鼻氧管使用普遍但未证明显著缩短住院时间或氧疗时间","液体支持：经鼻胃管持续肠内营养更受青睐，优于静脉输液","频繁清除鼻腔和口腔分泌物可缓解呼吸困难、改善呼吸和进食，但应仅限于鼻孔或口咽部","胸部物理治疗无任何益处","沙丁胺醇和皮质类固醇均不推荐（系统评价与荟萃分析未证明对临床预后有积极影响）","外消旋肾上腺素未证明能改善住院患儿的住院时间或临床预后；利巴韦林因疗效小、费用高且副作用严重不被推荐"],"management":["严格的手部卫生是预防导致毛细支气管炎病毒传播的最佳措施","尼瑞塞马布（nirsevimab）单剂量长效单克隆抗体：RSV流行季节初期，体重<5kg婴儿50mg、≥5kg婴儿100mg；进入第二个RSV流行季节的高风险较大婴儿（8-19月龄）200mg分两次100mg注射","高风险婴儿包括：需长期类固醇/利尿剂或吸氧的慢性肺部疾病早产儿、严重免疫缺陷患儿、伴严重肺疾病或生长不良的囊性纤维化患儿、美国印第安人和阿拉斯加原住民","已获FDA批准的母体疫苗（二价RSV预融合F蛋白）适用于妊娠32-36周的女性，用于预防新生儿和婴儿RSV感染","尼瑞塞马布为ACIP和AAP推荐的预防RSV唯一方法，帕利珠单抗不再推荐使用"],"notes":["RSV是超过50%病例的病原，其他包括人偏肺病毒、鼻病毒、副流感病毒、流感病毒、冠状病毒、博卡病毒和腺病毒","1岁以下无症状患者中超过三分之一可检出呼吸道病毒，质疑核酸扩增测试对活动性感染的特异性","细支气管炎是美国过去几十年1岁以下儿童住院的最常见原因，每年超10万幼儿因此入院","发达国家死亡率低于1%，死亡原因包括呼吸停止和/或衰竭、严重脱水及电解质失衡","大多数死亡发生在有合并症的儿童（支气管肺发育不良、先天性心脏病或免疫缺陷）","细支气管炎在男性、二手烟暴露、未母乳喂养及拥挤环境中生活的婴儿中更常见","早期严重下呼吸道感染是哮喘发展的潜在风险因素，但大多数幼儿期喘息患儿最终不会发展成哮喘"],"emergency":["住院指征：出现缺氧、呼吸窘迫（无法进食、呼吸急促或呼吸做功显著增加）或呼吸暂停的儿童","导致病情严重的风险因素包括年龄较小、早产或存在其他基础疾病","当患儿不再需要补充氧气且临床状况改善时，可停止连续脉搏血氧监测"],"pinyin":"mxzqgy"},{"name":"肺炎支原体肺炎","category":"儿科-呼吸","summary":"肺炎支原体是学龄儿童和青少年呼吸道感染及非典型肺炎（行走性肺炎）的常见病原，占社区获得性肺炎约20%，初中高中学生中亦占约20%。因缺乏细胞壁对β-内酰胺类天然耐药，治疗首选大环内酯类抗生素；潜伏期2-3周，咳嗽可持续长达4周。","symptoms":["起病渐进：头痛、不适、发热和咽喉痛，随后出现声音嘶哑和无痰咳嗽（与大叶性肺炎突然发作不同）","标志性症状为咳嗽，在发病第一周加重，症状通常在两周内缓解，但咳嗽可能持续长达四周并伴喘息","约10%的儿童出现皮肤斑丘疹","胸部检查可能无任何发现或仅有轻微干啰音，临床表现通常比X光片显示的严重程度轻（行走性肺炎）","5岁以下儿童症状通常较轻，表现为上呼吸道症状、呕吐和腹泻","非肺部表现见于11%-26%患儿：中枢神经系统受累（脑炎、ADEM、横贯性脊髓炎、小脑共济失调、无菌性脑膜炎、吉兰-巴雷综合征，总体0.1%、住院者达7%），症状在呼吸道症状后3-23天出现","黏膜皮肤表现（达25%）：斑丘疹、荨麻疹、支原体皮疹和黏膜炎综合征（MIRM）、史蒂文斯-约翰逊综合征、唇部口腔黏膜炎"],"diagnosis":["无特定临床、流行病学或实验室指标可明确诊断；学龄儿童及年轻成人中逐渐发作的肺炎尤其伴咳嗽提示肺炎支原体感染","最佳诊断方法为呼吸道样本PCR检测联合血清学检测（急性期和恢复期）","PCR（NAATs）对鼻咽或咽喉拭子的灵敏度和特异性可达80%至>97%，已取代其他诊断方法","IgG抗体滴度在2-4周间隔的急性期与恢复期血清间增加4倍或以上可作诊断依据","IgM抗体假阳性和假阴性率高，可能在感染后6-12个月仍呈阳性，不一定表示急性感染","冷凝集素在约50%患者中可检出但缺乏特异性，有更佳检测方法时不应使用其诊断","培养需2-3周以上且营养要求高，少有实验室具备能力","肺炎支原体常定植于气道，17%-25%无症状儿童中可检出，需结合临床表现判读"],"infusion":["严重肺外疾病（尤其中枢神经系统受累或皮疹黏膜炎）：皮质类固醇与静脉免疫球蛋白（IVIG）联合使用为最常用治疗","住院患儿按CAP常规给予静脉抗生素（如大环内酯类）及支持治疗"],"oral_medication":["克拉霉素15mg/kg/天分两次口服，持续10天（最大日剂量1g）","阿奇霉素第1天10mg/kg口服（最大500mg），第2-5天每天5mg/kg（最大250mg）","多西环素2-4mg/kg/天分两次，持续7天（最大日剂量200mg），适用于所有年龄段儿童","左氧氟沙星：5岁以下10mg/kg每日两次，5岁以上10mg/kg每日一次（最大日剂量750mg），持续7-10天，有效但MIC高于大环内酯类，不作为首选","怀疑耐大环内酯类肺炎支原体时改用非大环内酯类抗生素（多西环素或左氧氟沙星）"],"treatment":["多数肺炎支原体感染症状较轻，大多数肺炎病例无需住院治疗即可处理","因缺乏细胞壁，对β-内酰胺类抗生素天然耐药；甲氧苄啶、利福平、利奈唑胺也无效","首选大环内酯类抗生素（红霉素、克拉霉素、阿奇霉素），发病后3-4天内开始治疗效果可能更好；大环内酯类在8岁以下儿童中更适用","对住院儿童出现CAP或严重肺外症状的病例，根据临床怀疑进行经验性治疗","治疗开始前48小时内对大环内酯类无反应且病情严重者，应怀疑耐大环内酯类肺炎支原体并改用非大环内酯类药物","严重肺外疾病患者可从抗菌治疗中受益，通常抗生素与免疫调节疗法（皮质类固醇联合静脉免疫球蛋白）联合使用","住院患者建议在症状持续期间采取标准防护措施及飞沫预防措施"],"management":["只要咳嗽持续，即使接受了成功的抗生素治疗，支原体感染仍然具有传染性","使用四环素类或阿奇霉素进行预防可显著降低机构内疫情和家庭密切接触中的二次感染率，但不推荐常规使用","对患有镰状细胞病等严重疾病高风险的患者可考虑抗菌预防","感染后产生的免疫力并不持久，可从反复感染频率看出；无症状携带状态可持续4个月"],"notes":["肺炎支原体在5岁以上儿童和成人CAP中常见，初中和高中学生中约占所有CAP的20%，大学生和新兵中高达50%","潜伏期为2-3周，与其他呼吸道感染不同；家庭内部传播率40%-80%","儿童往往是支原体传播的宿主；2岁以下儿童中高达30%的病例存在病毒合并感染","无细胞壁导致对β-内酰胺类天然耐药、多形性、革兰氏染色难以观察","大环内酯类耐药菌株：亚洲（日本和中国70%-90%）、欧洲各国差异大（荷兰0%-意大利26%）、美国和加拿大2.8%-13%","镰状细胞病或镰状血红蛋白病患儿中，肺炎支原体是常见急性胸综合征的感染性诱因；唐氏综合征患儿也可患严重肺炎支原体肺炎","抗生素治疗可缩短病程但无法彻底清除呼吸道中的病原体","致命的肺炎支原体感染较为罕见"],"emergency":["治疗开始前48小时内对大环内酯类抗生素无反应且病情严重的患者，提示耐大环内酯类肺炎支原体，应改用多西环素或左氧氟沙星","严重肺外疾病（中枢神经系统受累如脑炎、SJS/MIRM）需住院并考虑皮质类固醇联合静脉免疫球蛋白治疗","免疫缺陷、唐氏综合征、慢性心肺疾病和镰状细胞病患者可出现大量胸腔积液和坏死性肺炎，需警惕重症"],"pinyin":"fyzytfy"},{"name":"儿童系统性高血压","category":"儿科-心血管","summary":"儿童高血压通常无症状，但可已出现靶器官损伤（高达40%合并左心室肥厚）；婴幼儿高血压多为继发性（肾脏疾病约占90%），学龄儿童和青少年原发性高血压随肥胖流行而增加。","symptoms":["原发性高血压儿童通常无症状，常在常规体检或运动前评估中发现","继发性高血压可表现为潜在疾病症状（如慢性肾脏病患儿生长障碍）","急性严重高血压：头痛、头晕、恶心/呕吐","高血压急症/危象：视网膜病变、高血压脑病（后部可逆性脑病综合征）、心力衰竭、急性肾损伤、癫痫发作、视觉障碍、共济失调","亚临床靶器官损伤：左心室肥厚、高血压性视网膜病变、颈动脉内膜-中层厚度增加、血管僵硬度升高"],"diagnosis":["儿童血压≥年龄、性别、身高第95百分位为高血压（1级：95百分位~95百分位+11mmHg；2级：≥95百分位+12mmHg或13岁以上≥140/90mmHg）","13岁及以上青少年用绝对标准：正常<120/80，血压升高120-129/<80，1级130-139/80-89，2级≥140/90","测量方法：坐姿安静至少5分钟，测量3次取平均；袖带气囊长度覆盖上臂周长80-100%，宽度≥臂周40%","动态血压监测（ABPM）：确认高血压诊断、识别白大衣高血压和隐匿性高血压、评估治疗效果","肾脏疾病评估：尿液分析、电解质、血尿素氮、肌酐、全血细胞计数；怀疑继发性者行肾脏超声","测量四肢血压筛查主动脉缩窄；血清钾（低钾提示肾血管性或单基因性高血压，高钾提示Gordon综合征）","超声心动图评估左心室肥厚（LVH）；睡眠史筛查阻塞性睡眠呼吸暂停","考虑肾血管性高血压时行磁共振/CT血管造影，肾内狭窄需动脉内血管造影"],"infusion":["高血压危象（伴生命威胁症状，ICU静脉给药）：拉贝洛尔负荷0.20-1.0 mg/kg（最多40mg/剂），输注0.25-3.0 mg/kg/hr；尼卡地平负荷30 μg/kg（最多2mg/剂），输注0.5-4 μg/kg/min；硝普钠0.5-10 μg/kg/min输注（使用>72h或肾功能不全时监测氰化物）","艾司洛尔100-500 μg/kg/min输注、肼苯哒嗪0.2-0.4 mg/kg IV每4小时、芬多帕姆0.2-0.8 μg/kg/min输注","理想情况用动脉导管持续监测血压；前8小时血压降低不超过计划值的25%，24-48小时内逐渐恢复正常"],"oral_medication":["急性严重高血压症状较轻者：可乐定0.05-0.1 mg/剂（总量可重复至0.8mg）、伊拉地平0.05-0.15 mg/kg/剂（最多5mg/剂）、口服肼苯哒嗪0.25 mg/kg/剂（最多25mg/剂）","慢性高血压初始药物：ACE抑制剂、血管紧张素受体拮抗剂、噻嗪类利尿剂（如氢氯噻嗪）、钙通道阻滞剂","糖尿病伴微量白蛋白尿或蛋白尿性肾病者使用ACEI或ARB","治疗目标：血压低于年龄对应第90百分位或低于130/80mmHg（取较低者）；慢性肾脏病患儿用ABPM更低目标（夜间平均血压<第50百分位）"],"treatment":["无症状轻度高血压无靶器官损伤：生活方式干预为主（DASH饮食、减肥、有氧运动30-60分钟/天、减少久坐<2小时/天）","药物治疗适应症：有症状高血压、无可变危险因素的2期高血压、合并糖尿病或慢性肾脏病、非药物措施无效者","单药起始低剂量，逐渐加量至目标血压，达最大剂量或副作用时加用另一类药物","继发性高血压治疗针对病因（肾脏病、甲亢、嗜铬细胞瘤、主动脉缩窄、肾血管性高血压）","肾血管性高血压：降压药、血管成形术或手术；双侧肾血管性或单肾病变时避免RAAS系统药物（可降低GFR致急性肾损伤）","预防：减少肥胖、降低钠摄入、避免烟草、增加体力活动"],"management":["3岁及以上儿童年度预防性检查测量血压；肥胖、慢性肾脏病、糖尿病等高危者每次就诊测量","靶器官损伤筛查：超声心动图（LVH）为高血压儿童最常见靶器官损伤表现","共病筛查：血脂异常（非空腹脂类筛查）、血糖、睡眠呼吸障碍","血压升高者用ABPM确认诊断，识别白大衣高血压（非良性，需随访）","有早产、先天性心脏病、肾脏疾病、器官移植、肿瘤病史、使用升压药物、神经纤维瘤病/结节性硬化症或颅内压升高的3岁以下儿童也应测量血压"],"notes":["高达40%高血压儿童存在左心室肥厚，颈动脉内膜-中层厚度增加为早期动脉粥样硬化标志","血压超过第90百分位的儿童成人后患高血压风险高出2.4倍","儿童期原发性高血压常持续至成年，青少年高血压是中年男性晚期肾病和左室功能障碍的独立预测因素","肾血管性高血压多与纤维肌发育不良、神经纤维瘤病1型、结节性硬化症、Williams综合征等相关","儿童高血压识别率低（不到一半测量结果被识别）","升压药物：NSAIDs、皮质类固醇、中枢兴奋剂、可卡因等滥用药物、口服避孕药、环孢素/他克莫司、重金属"],"emergency":["高血压急症/危象（加速性高血压）：严重高血压伴头痛、头晕、恶心呕吐，更严重时视网膜病变、脑病、心衰、急性肾损伤、癫痫发作，需收入ICU静脉给药","高血压脑病/后部可逆性脑病综合征：头痛、呕吐、体温升高、视觉障碍、共济失调、意识水平下降、癫痫发作","分阶段降压：最初8小时内降压不超过25%，24-48小时内逐渐恢复正常，避免过快降压干扰器官灌注"],"pinyin":"ertongxitongxinggaoxueya"},{"name":"先天性心脏病（概述与管理）","category":"儿科-心血管","summary":"先天性心脏病（CHD）发生率约为活产婴儿的0.6%-1.3%，是儿童先天性畸形导致死亡的主要原因；随矫正和姑息手术进步约90%患儿可存活到成年。建议对所有新生儿出生24-48小时内行常规脉搏氧饱和度筛查以发现严重发绀型CHD；约25%病例可通过遗传学方法检测到基因变异。","symptoms":["许多CHD胎儿期代偿良好，出生后肺血管阻力下降时左向右分流增加、症状显现（如VSD心力衰竭多在1-3月龄首次出现）","婴儿心力衰竭表现：呼吸急促、心动过速、出汗、胸部凹陷、鼻翼扇动、喘息，可伴喂养困难及发育迟滞","大左向右分流患儿因交感激活出现外周血管收缩、出汗和易怒，氧供需失衡致发育迟缓","主动脉缩窄：大龄儿童表现上半身高血压和下肢脉搏减弱；新生儿可表现下肢脉搏减弱至完全循环衰竭，动脉导管闭合后症状明显","差异性发绀（右臂氧饱和度正常而足部较低）是主动脉缩窄特征性表现","严重发绀型病变（肺血流减少型）：发绀程度取决于阻塞程度，肺血流完全依赖动脉导管时导管关闭致严重低氧血症；肺血流增加混合型可伴发绀和心衰","约13%CHD患儿同时伴有其他心脏外畸形"],"diagnosis":["初步评估分两步：根据发绀（体检+脉搏血氧）分两大类，再按胸片肺血管影增多/正常/减少细分；心电图判断心室肥厚，听诊杂音缩小范围","脉搏血氧筛查：出生24-48小时及出院前进行；右臂或任一足部SpO2≥95%且两侧差≤3%为通过；90-94%或差>3%者1小时后复测，第三次异常需紧急心脏超声","最终确诊需超声心动图、心脏CT或MRI及/或心导管检查；新生儿发绀或重症不应延迟检查","遗传学检查：常规核型、FISH（疑22q11.2缺失）、array CGH、基因panel、全外显子/全基因组测序；总体25%CHD可检出基因变异","胎儿超声心动图可提高高风险孕妇CHD检出率，但正常结果不能保证无CHD","筛查目标病变包括：左心发育不良综合征、肺动脉闭锁、法洛四联症、完全性肺静脉异位引流、大动脉转位、三尖瓣闭锁、动脉干、新生儿主动脉缩窄及主动脉弓发育不良/闭锁"],"infusion":[],"oral_medication":[],"treatment":["大多数轻微CHD无需治疗，鼓励正常生活、不限制活动；避免过度保护","中重度CHD不需完全限制体力活动，根据正式运动测试结果个体化调整体育教育","发绀患者：避免脱水（脱水增加血液粘度致卒中风险），急性胃肠炎或过热时可能需减少或暂停利尿剂；避免高海拔和温度突变；积极治疗铁缺乏","细菌感染积极治疗；符合条件者在牙科手术时进行细菌性心内膜炎预防","免疫接种：常规接种、流感疫苗及符合条件的SARS-CoV-2疫苗；未修复CHD伴严重血流动力学异常小婴儿及心肌病心衰患者行RSV预防（帕利珠单抗、尼瑞塞瓦单抗）","术后管理：术后在儿童心血管ICU监护，机械通气、正性肌力药、利尿剂、后负荷减轻药物（儿茶酚胺类、磷酸二酯酶抑制剂、米力农等）；术后肺动脉高压可通过过度通气和吸入一氧化氮控制","少数对药物治疗无反应的严重术后心衰可选用VAD或ECMO机械循环支持，通常2-5天心脏功能改善"],"management":["修复/姑息术后患者需定期儿科心脏病专家随访（年龄足够后转成人CHD专家）；多数左向右分流及轻度梗阻性病变为解剖和生理修正，长期预后良好","单纯性动脉导管未闭修复后被认为真正完全修复，可能无需长期随访；复杂病变（单心室、Fontan术后）需更密切随访","术后尤其是新生儿期手术者，学龄早期关注轻度到中度学习障碍或注意力缺陷，早期干预可改善","心包切开术后综合征可于术后第一周末至数月出现，发热伴心包积液者需超声心动图诊断，警惕心包填塞","中度至重度CHD或心律失常病史者在常规手术或牙科治疗时需密切监测，并咨询有经验处理CHD的麻醉师","严重未修复CHD女性应接受生育相关风险咨询和避孕建议；Fontan循环患者流产率约27-50%"],"notes":["CHD发生率约0.6%-1.3%活产；早产儿约2%；每1000新生儿中2-3名出生第一年出现心脏症状","约90%CHD患儿存活到成年，美国CHD成人数量超过儿童；CHD仍是儿童先天畸形死亡主要原因","40-50%CHD在出生1周内确诊，50-60%在1个月内确诊；约13%合并心脏外畸形","约400个基因变异与CHD相关；21三体40-50%合并心脏病，22q11.2缺失（约1/4000活产）占CHD的2%","2-4%CHD与已知环境或母体状况及致畸因素有关：母体糖尿病、苯丙酮尿症、SLE、先天性风疹综合征，以及锂、乙醇、华法林、沙利度胺、抗代谢药、维生素A衍生物、抗惊厥药等药物","一级亲属（父母或兄弟姐妹）患CHD时风险增加，应进行遗传咨询","Fontan术后长期并发症风险：心律失常、血栓形成、蛋白丢失性肠病、塑形性支气管炎、Fontan相关肝病、肾功障碍和心力衰竭","约25%CHD成人属于轻度类型，无需手术或介入导管即可存活至成年"],"emergency":["新生儿严重发绀或循环衰竭（尤其导管依赖型病变）：不应延迟检查，需紧急超声心动图","脉搏血氧筛查第三次异常（SpO2 90-94%或两侧差>3%）需紧急心脏超声","主动脉缩窄新生儿动脉导管闭合后出现完全循环衰竭为危急情况","术后心包积液迅速积聚需警惕心脏压塞","Eisenmenger综合征及重度肺动脉高压患者预后差，怀孕可对母亲和胎儿极其危险"],"pinyin":"xtxxzb（gsygl）"},{"name":"心律失常","category":"儿科-心血管","summary":"心律失常指心率或节律异常，可导致心输出量急性减少、持续存在可致心肌病，甚至晕厥或猝死；儿科常见类型包括窦性心律失常、期外收缩（PACs/PVCs）、室上性心动过速（SVT）、WPW综合征等。","symptoms":["较大儿童和青少年SVT：心率通常>180次/分，婴儿和幼儿可达220-300次/分，发作和结束突然","患者常感觉心跳过快，可有胸前不适；心率异常快或发作过长可出现心力衰竭","婴儿SVT：进食不良、面色苍白、烦躁不安、呼吸急促、脉搏减弱、肝肿大（发作6-24小时以上可识别心力衰竭）；胎儿心动过速可致胎儿水肿","晕厥或晕厥前兆（AVNRT为少数与晕厥相关的SVT类型之一；WPW综合征患者晕厥为危险症状）","额外心搏（早搏）多数无症状，部分人感觉腹部有'缺失的心跳'","偶发PACs/PVCs在无心脏病儿童中通常无害，运动期间持续或增加者可能具有更大严重性"],"diagnosis":["心电图：识别P波形态、PR间期、QRS宽度和形态、QT间期；SVT心率>230次/分且P波轴异常不太可能是窦性心动过速","WPW综合征特征（无心动过速时）：P-R间期缩短、QRS波群上升缓慢（δ波）","24小时Holter监测、运动试验用于风险分层（尤其WPW）","经食道电生理检查可检出部分新生儿SVT；电生理检查评估晕厥且患WPW者","婴儿和幼儿SVT心率240-300次/分，QRS波群窄（<0.08秒）","区分良性与恶性PVCs：连续≥2次PVCs、多种类型、运动时增加、R-on-T现象、频率极高（>总心跳20%）、存在潜在心脏病/心脏手术史需进一步检查"],"infusion":["急性SVT（血流动力学稳定）：快速静脉注射腺苷为首选，剂量可加至0.2 mg/kg（最多12mg）；因可引发房颤，须有直流电复律手段备用","恶性PVCs：静脉注射利多卡因是首选治疗；胺碘酮用于难治性病例或伴心室功能障碍/血流动力学障碍者","胺碘酮静脉：2.5-5 mg/kg于30-60分钟，可重复3次，后5-20 mg/kg/日持续输注（最大2.2g/日）","同步直流电复律0.5-2 J/kg用于已出现严重心力衰竭症状的紧急情况","结间异位心动过速（术后）：静脉注射胺碘酮","注意：1岁以下婴儿禁用维拉帕米（可致低血压和心脏骤停）"],"oral_medication":["SVT维持治疗（非WPW型）：β-肾上腺素能阻滞剂为主要手段；地高辛对婴儿可能有效但对较大儿童效果较差","WPW患者：用β阻滞剂（地高辛或钙通道阻滞剂会增加旁道前传速度，可能诱发室颤，属禁忌）","β阻滞剂：普萘洛尔1-4 mg/kg/24h分q6h（最大60mg/24h）、阿替洛尔0.5-1 mg/kg/24h每日1次或分q12h、纳多洛尔1-2 mg/kg/24h每日1次","难治性心动过速：氟卡尼、普罗帕酮（150-300 mg/m²/24h分q8h）、索他洛尔、胺碘酮（10-15 mg/kg/日口服）","奎尼丁（SVT、房颤、房扑、VT）：30-60 mg/kg/24h分q6-8h；普鲁卡因胺15-50 mg/kg/日分q3-6h（IV负荷10-15 mg/kg）","氟卡尼和普罗帕酮应仅限于心脏功能正常的患者使用","窦性心动过缓通常无需治疗；良性早搏治疗重点是确认不危及生命"],"treatment":["SVT急性期：迷走刺激（婴儿面部冰袋15-30秒，较大儿童Valsalva操作；禁止眼部压迫）→ 腺苷快速静注 → 必要时同步直流电复律","药物治疗按Vaughan-Williams分类选择（I类钠通道阻滞、II类β阻滞剂、III类延长复极、IV类钙通道阻滞）","经导管消融可治愈危及生命或耐药性心律失常","心动过缓植入心脏起搏器（适用于所有年龄包括早产儿）","恶性室性心律失常高风险者植入ICD（可植入式除颤器）","Wolff-Parkinson-White综合征：晕厥患者行电生理检查并考虑导管消融","术后完全性心脏传导阻滞：常暂时，可起搏器治疗，若持续10-14天需植入永久起搏器"],"management":["大多数儿童心律失常可经一种药物有效控制，但多数药物在儿童属超适应症使用，需儿科心脏病专家经验指导","抗心律失常药物有致心律失常风险并可能降低心脏功能，需监测","WPW风险分层：24小时Holter和运动试验区分高猝死风险者；间歇性预激不能降低风险","药物副作用（如地高辛加剧窦性心律失常）需监测；多数通过运动消除"],"notes":["单发性过早心房和心室跳动（PACs/PVCs）在无心脏病儿童中通常无风险，焦虑、发热、药物或兴奋剂可使其更频繁","SVT发作时心率快且相对固定，与窦性心动过速（随自主神经功能变化）鉴别很重要——窦速应治疗根本原因（败血症、低血容量）而非用抗心律失常药","WPW综合征有较高猝死风险（房颤经旁道快速前传可致室颤）；地高辛和维拉帕米禁用","抗心律失常药物可能诱发新的危险心律失常并降低心功能","术后结间异位心动过速特别难以处理","心脏传导系统损伤可致术后完全性传导阻滞，常为暂时性"],"emergency":["SVT伴心力衰竭/血流动力学不稳定：同步直流电复律（0.5-2 J/kg）作为初始处理","晕厥且患WPW综合征：应行电生理检查并考虑导管消融","恶性室性心律失常（恶性PVCs）：纠正潜在病因（电解质失衡、缺氧、药物毒性、心脏损伤、通道病），静脉利多卡因首选","室颤、猝死：恶性室速/高危患者需ICD","1岁以下婴儿SVT禁用维拉帕米（可致心脏骤停）"],"pinyin":"xinlvshichang"},{"name":"急性心包炎","category":"儿科-心血管","summary":"急性心包炎是心包炎症，常为全身性疾病表现；心包积液超过可扩张限度后心包内压升高可导致心脏压塞，损害心输出量，若不治疗可致休克甚至死亡。","symptoms":["最常见的症状是胸痛：尖锐/刺痛感，与体位有关，吸气时加重，坐直、前倾或俯卧时缓解","非特异性症状：咳嗽、发热、呼吸困难、腹痛、呕吐","全身性疾病时可出现相关器官系统症状","体格检查线索：心音减弱或遥远、心动过速、脉压狭窄、颈静脉扩张、心包摩擦音","奇脉：吸气时收缩压显著下降（>10 mmHg），提示心排血障碍"],"diagnosis":["心电图：QRS波幅降低（心包液积聚）、心动过速、ST段抬高、T波倒置或平坦、PR段异常；肌心包炎时肌钙蛋白升高","胸部X光：无积液时正常，积液时心脏增大、轮廓异常（Erlenmeyer烧瓶状或水瓶状）","超声心动图是识别心包积液大小和位置最敏感的方法；心脏压塞时右心房和/或右心室受压塌陷、舒张期充盈参数异常","诊断不明确时可用CT或心脏MRI（T2和延迟钆增强显示心包急性炎症）","奇脉可经听诊血压（自动血压计不准确）、动脉压力线或脉搏血氧仪监测评估"],"infusion":[],"oral_medication":["非甾体抗炎药（病毒性/特发性心包炎通常足够）","秋水仙碱：治疗及预防复发，降低复发风险（约30%患者复发）","皮质类固醇：持续或复发病例、风湿性/结缔组织病相关心包炎（需注意停用后复发）","阿那白滞素、利洛纳塞普特（IL-1细胞因子抑制剂）：对秋水仙碱无反应的急性或复发性心包炎有效","阿司匹林用于风湿热相关心包炎"],"treatment":["病毒性心包炎病程轻微自限，NSAIDs治疗通常足够","心包穿刺术用于大量积液伴心脏压塞患者","慢性或反复发作者可行心包切除术或创建心包窗口","心包切开术后综合征：阿司匹林、NSAIDs、秋水仙碱，严重时皮质类固醇；出现心脏压塞需心包引流","脓性心包炎需及时识别并治疗感染，否则可迅速恶化导致压塞和死亡","病因明确者针对性治疗（如药物性停药、风湿病抗炎治疗）"],"management":["超声心动图随访监测积液量变化和压塞迹象","对自身免疫/风湿/结缔组织病、尿毒症、甲状腺功能减退、肿瘤患者仔细筛查心包积液","疑似急性心包炎与心肌炎鉴别（心包炎心缩功能正常）"],"notes":["心脏压塞若不治疗可导致休克甚至死亡","高达30%患者心包炎复发，使用秋水仙碱可降低复发风险","脓性心包炎（细菌感染，如肺炎球菌、流感嗜血杆菌）病情严重，不及时处理可迅速恶化","感染病因包括病毒（柯萨奇B、EBV、流感、腺病毒、细小病毒、COVID-19等）、细菌、真菌、寄生虫","非感染病因：特发性、全身炎症性疾病、代谢性（尿毒症、甲减）、创伤、心包切开术后、肿瘤"],"emergency":["心脏压塞（心脏充盈障碍、心输出量受损）：需紧急心包穿刺，可致休克和死亡","奇脉（吸气时收缩压下降>10 mmHg）、右房/右室舒张期塌陷提示压塞","脓性心包炎病情迅速恶化，需及时识别并治疗"],"pinyin":"jixingxinbaoyan"},{"name":"感染性心内膜炎","category":"儿科-心血管","summary":"感染性心内膜炎包括急性及亚急性细菌性心内膜炎及真菌等其他微生物感染，是儿童发病率和死亡率的重要原因；先天性心脏病是主要诱发因素，病原菌多为草绿色链球菌和金黄色葡萄球菌。","symptoms":["长期发热（可持续数月）且无其他症状，可伴体重下降（草绿色链球菌感染时较轻）","金黄色葡萄球菌感染可呈急性严重表现：高热、极度虚弱","非特异性症状：低烧、午后加重、疲劳、肌痛、关节痛、头痛、寒战、恶心呕吐","心脏检查：新的病理性杂音或杂音变化，可伴心力衰竭","<50%患者出现脾肿大和瘀点","皮肤表现（晚期）：奥斯勒结节、詹韦伊病变、刺伤样出血（指甲下线性病变）；视网膜病变见于10-20%病例","严重神经系统并发症：栓塞性中风、脑脓肿、真菌性动脉瘤、出血（常与金葡菌感染相关）"],"diagnosis":["血培养是核心：采集3-5次不同样本，90%病例前两次培养可检出，低度菌血症（<100 CFU/mL）占80%","超声心动图：二维心超识别赘生物大小、形状、位置和移动性，多普勒评估瓣膜功能障碍；儿童经胸超声通常足够（<60kg），人工瓣膜或并发症用经食管超声","改良杜克标准：两个主要标准、或一个主要+三个次要、或五个次要可确诊","心电图：检测新发心律失常、完全性心脏传导阻滞（提示心肌脓肿，危及生命）","实验室：ESR、CRP升高，贫血、白细胞增多、血尿、免疫复合物","赘生物>1cm者栓塞风险高；无赘生物不能排除心内膜炎","培养阴性者：16S/18S rRNA PCR、宏基因组测序、Q热和巴通体血清学"],"infusion":["经验性治疗（无人工瓣膜、高风险金葡菌/肠球菌/草绿色链球菌）：万古霉素加庆大霉素静脉给药","抗生素治疗通常4-6周，感染部位所需浓度应为体外最低抑菌浓度的5-20倍，需维持高血清杀菌水平","抗生素选择、给药方式、疗程与心脏科和传染病专家共同确定"],"oral_medication":[],"treatment":["一旦确诊立即开始抗生素治疗，任何延误都增加严重并发症风险","疗程通常4-6周，根据临床和实验室结果调整，需继续治疗避免复发","治疗调整应依据病原菌和药敏；保持较高血清杀菌水平清除血管外病变细菌","严重并发症需手术干预（瓣膜功能障碍、心肌脓肿、赘生物栓塞风险）"],"management":["牙科等有创操作前进行细菌性心内膜炎预防（高危心脏疾病患者）","保持良好的口腔卫生以减少菌血症频率和程度","对高危儿童（人工瓣膜/材料、未修复发绀型先心病、既往心内膜炎史、风湿性瓣膜病）密切监测"],"notes":["死亡率高达25%，50-60%出现严重并发症，最常见为心力衰竭（主动脉瓣/二尖瓣赘生物致反流加重）","高危人群：人工心脏瓣膜或修复材料、发绀型先心病、修复后6个月内用人工材料、既往心内膜炎史、风湿性瓣膜病","静脉药物使用者易患金葡菌、铜绿假单胞菌、黏质沙雷菌心内膜炎","新生儿主要危险因素是中心静脉导管，表现可与败血症或充血性心力衰竭混淆","抗菌预处理会使血培养成功率降低50-60%","全身栓塞（尤其CNS）是主要威胁；肺栓塞见于VSD或法洛四联症患儿"],"emergency":["心力衰竭（赘生物致瓣膜反流加重、心肌脓肿、中毒性心肌炎）","完全性心脏传导阻滞提示心肌脓肿，可能危及生命","栓塞性中风、脑脓肿、真菌性动脉瘤、出血等严重神经系统并发症","脓毒性心包炎、瓦氏窦破裂、瓣膜阻塞需紧急处理"],"pinyin":"ganranxingxinneimoyan"},{"name":"扩张型心肌病","category":"儿科-心血管","summary":"扩张型心肌病（DCM）是儿童最常见的心肌病类型，以心室扩张和收缩功能异常为特征，是心脏移植的常见适应症；约半数病例与遗传有关，也可由心肌炎、代谢病、肌营养不良、蒽环类药物引起。","symptoms":["临床表现通常为心力衰竭：呼吸急促、喘息、咳嗽、直立性或劳累性呼吸困难","易怒、嗜睡、生长迟缓、恶心、呕吐、腹痛等非特异性症状","心悸、晕厥、猝死","严重者可面色苍白、意识改变、低血压、休克","体格检查：心动过速伴脉压狭窄、肝大、啰音或喘息、心前区搏动增强、心脏增大、奔马律、二尖瓣/三尖瓣反流杂音","低血糖、酸中毒、肌张力低下、肝功能异常提示先天性代谢缺陷"],"diagnosis":["超声心动图通常具诊断意义：左心室扩大、收缩力下降、偶见左室轮廓变形，可评估肺动脉高压和二尖瓣反流","心电图：心房或心室肥厚、非特异性T波异常、心房或心室心律失常","胸部X光：心脏肥大、肺血管突出或胸腔积液","心脏MRI：对超声不佳或疑似急性心肌炎者更有用（可识别心肌炎症）","实验室：全血细胞计数、肝肾功、肌酸磷酸激酶、心脏肌钙蛋白I、乳酸、BNP/pro-BNP、血浆氨基酸、尿有机酸、酰基肉碱谱","基因检测；对特发性/家族性DCM的一级亲属行超声心动图和心电图筛查视为标准","心脏导管和心内膜心肌活检不常规，急性DCM中可能有用"],"infusion":["严重心力衰竭或循环衰竭：静脉注射强心剂和利尿剂（原文未列具体药物），必要时机械通气","机械循环支持：心室辅助装置、全人工心脏、体外膜氧合（ECMO）"],"oral_medication":["血管紧张素转换酶抑制剂或血管紧张素受体拮抗剂（改善心室大小和功能）","β-肾上腺素能阻滞剂：卡维地洛或美托洛尔","沙库巴曲/缬沙坦（ARNI组合，FDA批准1岁以上，可替代单独ACEI/ARB）","呋塞米缓解肺部或全身静脉充血","地高辛可考虑用于部分患者"],"treatment":["仔细评估寻找可治疗病因、对家庭成员进行筛查、严格药物治疗","药物治疗：ACEI/ARB（或沙库巴曲/缬沙坦）±β阻滞剂，可改善生存率、症状并减少住院","心律失常患者给予特定抗心律失常治疗","心脏骤停高风险者考虑植入式心脏除颤器（ICD）；双腔/双心室起搏可改善部分患者","严重心力衰竭者收入重症监护，最终可能需心脏移植"],"management":["一级亲属超声心动图和心电图筛查","家族史采集与基因检测（50%病例为遗传性，常染色体显性为主，杜兴/贝克尔肌营养不良占5-10%）","对接受蒽环类化疗者监测心脏毒性"],"notes":["1年和5年无死亡或无需移植率分别为60-70%和50-60%","诊断时独立风险因素：年龄较大、心力衰竭、左心室缩短分数低、潜在病因","蒽环类（多柔比星）累积剂量>550 mg/m²时高达30%发生DCM，联合放疗毒性风险加剧","DCM是儿童心脏移植最常见原因","婴儿发病率更高；男性和黑人发病率较高"],"emergency":["严重心力衰竭/心源性休克：需重症监护、静脉强心剂、机械循环支持（VAD/ECMO），必要时心脏移植评估","心源性猝死风险：考虑ICD植入","危及生命的室性心律失常需抗心律失常治疗"],"pinyin":"kuozhangxingxinjibing"},{"name":"病毒性心肌炎","category":"儿科-心血管","summary":"心肌炎是心肌的急性或慢性炎症，病毒感染最常见（柯萨奇病毒及其他肠道病毒、腺病毒、细小病毒B19、EBV、流感、CMV等），表现从无症状或非特异性前驱症状到明显充血性心力衰竭、心律失常或猝死；心脏MRI为标准影像学诊断方法，急性期治疗以支持治疗为主（首选米力农、利尿剂，重症需机械循环支持）。","symptoms":["婴幼儿更常出现严重症状：发热、呼吸窘迫、心动过速、低血压、奔马律及心脏杂音","较大儿童和青少年：胸痛、发热、心悸、易疲劳或晕厥/近乎晕厥","心力衰竭表现：心前区冲动增强、奔马律、二尖瓣反流收缩期杂音、肝功能异常、外周水肿、肺部喘鸣或哮鸣音","伴心包疾病时可闻及心包摩擦音","可伴全身性疾病症状及终末器官受累迹象（皮疹、肝损伤或无菌性脑膜炎）","病情可迅速发展为休克、心房或心室心律失常及猝死；也可慢性化，病毒核酸在心肌中持续存在","临床表现与年龄有关：新生儿和婴儿可为严重表现，儿童多为急性心肌炎伴心衰，较大儿童青少年可为急/慢性心衰或胸痛"],"diagnosis":["心电图无特异性：窦性心动过速、心房或心室心律失常、房室传导阻滞、QRS波电压降低、非特异性ST和T波改变（常提示急性缺血）","严重有症状病例胸片示心脏扩大、肺血管突出、明显肺水肿或胸腔积液","超声心动图：心室收缩功能减弱、心腔扩大、二尖瓣反流，偶见心包积液","心脏MRI是诊断心肌炎的标准影像学检查：T2加权水肿、早期钆增强局部充血/毛细血管渗漏、晚期钆增强心肌纤维化或坏死；特征位于心肌中部、心外膜下及非血管区域","心内膜心肌活检可识别炎症浸润或心肌损伤，并经PCR进行病毒分子分析；由经验丰富人员操作","非特异性检查：红细胞沉降率、CPK同工酶、心脏肌钙蛋白I和BNP水平","鉴别诊断：肉碱缺乏、其他能量代谢障碍、遗传性线粒体缺陷、特发性扩张型心肌病、心包炎、心内膜弹力纤维增生症及冠状动脉异常"],"infusion":["米力农（首选强心剂，因其可能诱发心律失常需谨慎使用）","静脉注射免疫球蛋白（IVIG）：可能在急性或暴发性心肌炎治疗中发挥作用（仍有争议）","胺碘酮静脉使用（用于明显心律失常）","儿茶酚胺类、磷酸二酯酶抑制剂等用于术后及重症心肌功能障碍","极端情况：机械通气及VAD植入或ECMO机械循环支持，为恢复或心脏移植做准备"],"oral_medication":["利尿剂（急性期及心衰时常用）","代偿性充血性心力衰竭：β阻滞剂、ACE抑制剂、ARBs","明显心律失常时给予特定抗心律失常药物（如胺碘酮）"],"treatment":["急性心肌炎的主要治疗是支持性治疗","急性期可考虑强心剂（首选米力农）、利尿剂；需监测致心律失常风险","极端情况下需机械通气支持和机械循环支持（VAD或ECMO）以稳定血流动力学，并为恢复或心脏移植做准备","代偿性充血性心衰患者可用利尿剂、β阻滞剂、ACE抑制剂和ARBs；严重心衰和心血管衰竭患者中可能禁忌","明显心房或心室心律失常给予特定抗心律失常药（如胺碘酮），恢复后心律失常仍持续者考虑植入ICD","免疫调节治疗存在争议：IVIG可能获益，皮质类固醇被认为可改善心脏功能但在儿童中仍有争议；接受免疫抑制治疗后停药者出现复发","无可识别病因时不推荐针对心肌炎的特异性抗病毒疗法；如病因为药物应停用并在必要时更换"],"management":["需要入住重症监护室的患者以及出现MIS-C症状的患者必须由儿科心脏病专家随访（包括超声心动图检查）","心肌炎恢复期停止运动3-6个月，恢复正常活动需得到心脏病专家许可"],"notes":["新生儿有症状的急性肠病毒性心肌炎预后不良，死亡率为75%","儿童和青少年预后较好，但仍有心脏功能障碍者往往需要心脏移植；10%-50%患者心室功能有所恢复","病毒性相关炎症的最终结果可能是扩张型心肌病","与COVID-19感染相关的心肌炎预后良好，90天内完全康复","持续病毒感染可改变MHC抗原表达使新抗原暴露，某些病毒蛋白与宿主细胞抗原表位相同导致自身免疫损伤","儿童最常见病毒病原：柯萨奇病毒及其他肠道病毒、腺病毒、细小病毒B19、EBV、帕雷科病毒、流感病毒及巨细胞病毒"],"emergency":["心源性休克、急性严重心力衰竭需紧急重症监护和机械循环支持","室性心律失常、心脏骤停（猝死）需紧急处理","新生儿急性病毒性心肌炎重症表现（发热、呼吸窘迫、低血压）需紧急评估","晕厥、近乎晕厥、明显心悸提示血流动力学不稳定，需及时评估"],"pinyin":"bdxxjy"},{"name":"肥厚型心肌病","category":"儿科-心血管","summary":"肥厚型心肌病（HCM）是异质性、相对常见且可能危及生命的遗传性心肌病，通常由肌节或细胞骨架蛋白致病变异（MYH7、MYBPC3最常见）引起，是美国青少年运动员猝死最常见的原因。","symptoms":["许多患者无症状（50%因杂音或家庭筛查发现）","心悸、胸痛、容易疲劳、呼吸困难、头晕和晕厥","猝死可在体力活动、休息或睡眠时发生","体格检查：前胸冲动过度活跃伴隆起感、主动脉瓣区收缩期杂音、二尖瓣反流致心尖部吹风样杂音","婴儿期（如庞贝病等糖原贮积症）可出现心脏杂音、异常心电图、全身症状、偶发心力衰竭"],"diagnosis":["超声心动图：确定、定位并量化心肌肥厚（常为不对称室间隔肥厚）；多普勒评估左室流出道阻塞（LVOTO）、二尖瓣反流和舒张功能障碍","心电图：左室肥厚伴ST段和T波异常（左前胸导联T波倒置），可有传导延迟和心室预激","胸部X光：心脏大小正常或略增大","基因检测：MYH7、MYBPC3等肌节基因及PRKAG2、Danon病等非肌节基因；庞贝病特征性ECG为明显P波、短PR间期、大QRS电压","心脏导管很少用，怀疑心肌桥或需精确血流动力学评估时有用","一级亲属行心电图和超声心动图筛查；先测家族中受累个体"],"infusion":[],"oral_medication":["β-肾上腺素能阻滞剂：普萘洛尔、阿替洛尔、美托洛尔（减轻LVOTO、改善肥厚和心室充盈、抗心律失常）","钙通道阻滞剂：维拉帕米","选择性肌球蛋白抑制剂马瓦卡门（成人有效）","庞贝病酶替代治疗（出生后即用）"],"treatment":["β阻滞剂或钙通道阻滞剂减轻流出道阻塞、改善左室肥厚和充盈","房性或室性心律失常患者行特定抗心律失常治疗","ICD适应证：心脏骤停史、家族猝死史、室壁舒张末期直径≥3cm、无法解释的晕厥、非持续性室速、心尖部动脉瘤、射血分数≤50%、运动致血压反应减弱或低血压","严重症状且药物无效者：双腔起搏、酒精间隔消融、外科间隔肌瘤切除术、二尖瓣置换术","强烈建议限制竞技体育和剧烈体力活动，休闲运动个体化"],"management":["家族筛查/监测：一级亲属心电图+超声心动图（儿童青少年每1-2年，成人每3-5年）","基因检测阳性但临床正常的儿童需仔细且频繁随访","无明确致病性变异的家庭：高风险个体每年非侵入性心脏筛查至21岁，之后无HCM证据者每3年筛查"],"notes":["HCM是青少年运动员猝死最常见原因，年轻患者每年猝死风险约2%","猝死危险因素：晕厥史、症状、心肌大小、室性心律失常、发病年龄较小；无LVOTO者也有猝死风险","1岁以下儿童、先天性代谢障碍、畸形综合征及HCM合并DCM者预后明显较差","现代早期识别+家族筛查+活动限制+ICD已将HCM死亡率降至每年约0.5%","家族中有猝死史是预测风险的重要因素"],"emergency":["心脏骤停/晕厥：危及生命，考虑ICD植入","室性心动过速、运动性低血压提示高猝死风险","严重LVOTO在瓦尔萨尔瓦动作、体位变化及体力活动时可诱发症状"],"pinyin":"feihouxingxinjibing"},{"name":"肺动脉高压","category":"儿科-心血管","summary":"肺动脉高压（PH）指肺动脉内压力升高，儿童中可导致严重发病率和死亡率，进行性血管病变最终导致右心衰竭；儿童PH约45%为肺动脉高压（PAH，特发性/家族性最多与BMPR2基因变异相关），与先天性心脏病相关的PAH最常见。","symptoms":["主要症状：运动不耐受（呼吸困难）和易疲劳；偶有前胸疼痛、头晕或头痛","约30%儿科患者出现晕厥","外周发绀（运动时或存在卵圆孔未闭等右向左分流时）","疾病晚期：四肢冰冷呈灰色（心输出量减少）","右心衰竭表现：颈静脉压升高、肝肿大、水肿，颈静脉a波、cv波和肝脏收缩期搏动（三尖瓣反流时）","心脏体征：右心室膨出声、喷射性声音、S2明显分裂伴强烈肺音成分、预收缩期S4奔马律、三尖瓣反流全收缩期杂音"],"diagnosis":["胸部X光：肺动脉和右心室明显突出，肺门血管密度明显而外周肺区减少","心电图：右心室肥厚，常伴尖峰P波","超声心动图：筛查先天性心脏畸形、评估右室大小和功能，多普勒估测肺动脉收缩压","心脏导管插入术：肺动脉压升高而肺毛细血管楔压正常且血管阻力高可诊断PAH；楔压升高考虑肺静脉/左房/二尖瓣阻塞；LVEDP升高考虑限制型心肌病","严重PAH患者导管检查风险增加，应在有儿科PAH治疗经验的中心进行","遗传检测：BMPR2（70%家族性、10-20%特发性）、ALK1、ENG、SMAD9、CAV1、KCNK3、SOX17、TBX4"],"infusion":["依普普罗斯特林（前列环素）持续静脉输注：1-2 ng/kg/min起始，按临床过程和耐受加至5-80 ng/kg/min，必须不间断连续输注，可提高生存率","特普罗司汀：1-2 ng/kg/min起始，目标20-80 ng/kg/min，IV或SC持续输注","雾化依洛前列素2.5-5.0 μg每日6-9次"],"oral_medication":["钙通道阻滞剂（如硝苯地平）：用于导管急性血管反应试验阳性者","内皮素受体拮抗剂：波生坦起始0.3-1 mg/kg/剂每日两次口服（美国3岁以上儿童）、安布生坦1.25-10 mg/日（首月半量）","5型磷酸二酯酶抑制剂（如西地那非）、特普罗司汀口服（起始0.125 mg每日3次，目标1-10 mg每日3次）、塞来昔帕50-1600 μg每日两次","利尿剂常用于治疗右心衰竭","抗凝治疗对曾有肺血栓栓塞症者可能有益"],"treatment":["一般治疗：利尿剂、氧气、抗凝、地高辛（图482.3）","急性血管反应试验阳性者口服钙通道阻滞剂并持续评估反应","肺血管扩张剂可缓解症状、改善生活质量并延缓恶化，但无法阻止疾病进展","慢性血栓栓塞性肺高压或特发性肺高压成人可用瑞戈非尼（可溶性鸟苷酸环化酶刺激剂）","姑息性干预：心房分流术或Potts分流术创建右向左分流减轻右室压力","最终治疗手段是肺移植","由左心疾病或肺部疾病引起者先优化基础病情并咨询PH专家后再用肺血管扩张剂"],"management":["所有药物应在肺动脉高压专家指导下使用","治疗目标未达成或恶化者需系列再评估（serial reassessment）","监测右心衰竭体征、晕厥和心律失常倾向"],"notes":["许多类型PAH具有进行性特征，目前尚无治愈方法","严重PH伴心输出量低者结局常突然发生，与致命性心律失常有关","婴儿期诊断尤其伴慢性肺病的早产儿早期死亡风险高，但肺部正常发育且免受感染损伤则PH常随时间改善","肺静脉狭窄引起的PH病情进展迅速，死亡率高","Eisenmenger综合征：肺动脉阻力>12 Wood单位或肺/体循环阻力比值≥1.0，Heath-Edwards分级4-6级为不可逆阻塞性病变","猝死、晕厥、右心衰竭是已知并发症；儿童平均诊断年龄7-10岁"],"emergency":["晕厥（30%儿科患者）需警惕致命性心律失常和猝死","右心衰竭：心输出量减少、四肢冷灰，需积极处理","严重PAH患者心脏导管插入术风险增加，应在经验丰富中心进行","Eisenmenger综合征晚期心力衰竭、咯血、晕厥"],"pinyin":"feidongmaigaoya"},{"name":"传染性单核细胞增多症","category":"儿科-感染","summary":"传染性单核细胞增多症由EB病毒（EBV）原发感染引起，典型三联征为发热、咽痛和全身淋巴结肿大，可伴脾肿大（50%）和肝肿大（10%）；青少年初次感染30-50%出现典型症状，婴幼儿多为无症状或轻微感染。无特异性治疗，以休息、补液和对症为主；最重要并发症为脾破裂，脾肿大期间及病后2-3周应避免接触性运动。","symptoms":["典型三联征：疲劳、发热、喉咙痛、全身淋巴结肿大","青少年潜伏期30-50天；前驱期1-2周：不适、疲劳、急性或持续超过1周的发热、头痛、咽喉痛、恶心、腹痛、肌肉疼痛","全身淋巴结肿大（90%）、脾肿大（50%）、肝肿大（10%）；颈部前后侧、下颌下淋巴结多见，肩胛后淋巴结肿大尤其提示单核细胞增多症","咽喉痛伴中度至重度咽炎，扁桃体明显肿大、偶有渗出；硬腭与软腭交界处常见瘀点","脾肿大通常位于肋缘下2-3cm，严重肿大罕见","斑丘疹皮疹见于3-15%患者；接受氨苄西林/阿莫西林治疗者可出现特征性氨苄西林皮疹（类似麻疹的血管炎性皮疹）","可伴Gianotti-Crosti综合征（面部、四肢、臀部对称性红斑丘疹）","脾脏肿大迅速可致左上腹不适和压痛，可为首发症状"],"diagnosis":["根据外周血出现典型临床症状及非典型淋巴细胞增多初步诊断","异嗜性抗体检测（单核细胞试验）：青少年/成人第二周90%阳性，<4岁儿童仅50%；假阳性率<10%","EBV特异性抗体：VCA IgM在急性期所有病例出现（VCA IgM阳性+EBNA阴性提示急性感染）","VCA IgG终生存在，EBNA IgG于发病后3-4个月出现；EA IgG急性期80%短暂阳性","典型免疫正常患者通常无需检测EBV DNA（PCR主要用于移植后淋巴增殖性疾病监测）","约5%病例咽喉培养A组链球菌阳性（咽部携带）；疑似链球菌咽炎48-72小时无好转应怀疑传单","鉴别诊断：巨细胞病毒、弓形虫、腺病毒、HIV初次感染及血液系统恶性肿瘤"],"infusion":[],"oral_medication":[],"treatment":["无特异性治疗方法，主要为休息、充足液体和营养摄入及针对发热、咽痛和全身不适的症状治疗","仅严重疲劳时需卧床休息；症状明显改善后应鼓励恢复日常活动","脾肿大期间及患病后2-3周内建议避免接触性运动及剧烈体育活动，防止脾破裂","不建议抗病毒治疗（阿昔洛韦/更昔洛韦抑制体外病毒复制并缩短咽部排毒时间，但无持续临床益处）","气道阻塞等并发症时短期使用皮质类固醇可能有益（常规典型症状不支持使用皮质类固醇）"],"management":["症状改善后逐步恢复正常活动；主要症状持续2-4周，2个月内逐渐恢复","颈部淋巴结肿大和疲劳可能恢复较慢；长期疲劳可持续数周至6个月","脾肿大消退前避免剧烈活动（至少病后2-3周）","避免使用氨苄西林或阿莫西林（诱发特征性皮疹）"],"notes":["完全康复的预后非常好；长期严重疲劳虽常见但可逐渐恢复","脾破裂发生率约0.1%，可自发或由轻微外伤引起，很少导致死亡","气道阻塞由口咽淋巴组织肿胀引起，见于不到5%的病例","神经系统并发症：头痛常见，有症状脑膜炎/脑炎罕见；癫痫发作和共济失调见于1-5%病例；爱丽丝梦游仙境综合征可为首发症状","血液系统异常（轻度溶血性贫血、血小板减少、中性粒细胞减少）常见；再生障碍性贫血等罕见","罕见并发症：心肌炎、间质性肺炎、胰腺炎、腮腺炎、睾丸炎","原发性免疫缺陷（如X连锁淋巴增生综合征、MAGT1缺陷等）患者初次感染EBV后可能发生噬血细胞性淋巴组织增生症等危及生命的并发症","无证据表明EBV感染或再激活与慢性疲劳综合征有因果关系","EBV疫苗在研（针对gp350包膜糖蛋白），尚未批准临床应用"],"emergency":["突发左上腹疼痛提示脾破裂（可自发或轻微外伤后发生），需紧急就医","呼吸困难、严重扁桃体肿大、声音嘶哑等气道阻塞征象需急诊处理","出现惊厥、共济失调等神经系统症状需评估","免疫缺陷患者出现持续高热、肝脾明显肿大、血细胞减少需评估噬血细胞性淋巴组织增生症"],"pinyin":"crxdhxbzdz"},{"name":"儿童结核病","category":"儿科-感染","summary":"由结核分枝杆菌引起的慢性传染病，经含菌飞沫核吸入传播，分暴露期、感染期和发病期。1岁以下感染儿童9个月内发病概率达40%，儿童感染常提示近期接触传染性成人。","symptoms":["原发肺结核常无症状；进行性病变：高热、咳嗽、体重下降、夜间盗汗","再激活型（青少年为主）：发热、食欲不振、全身不适、咳嗽有痰、咯血、胸痛","胸膜积液：突发发热、呼吸困难、深呼吸胸痛、呼吸音减弱","瘰疬（浅表淋巴结结核，儿童最常见肺外结核）：无痛、坚实淋巴结肿大，晚期化脓波动","粟粒性结核：食欲不振、体重下降、低热、肝脾肿大、淋巴结肿大、脉络膜结节","结核性脑膜炎：发热、头痛、嗜睡、颈强直、癫痫、颅神经麻痹、分三期进展"],"diagnosis":["结核菌素皮肤试验（TST）：硬结≥5mm（密切接触/免疫抑制）、≥10mm（4岁以下等高危）、≥15mm（无风险因素）","干扰素-γ释放试验（IGRA），与BCG及多数环境分枝杆菌无交叉反应","胸部X光片（原发灶、肺门淋巴结、空洞、粟粒结节）","痰/诱导痰/连续三次晨起胃液抗酸染色及培养","GeneXpert MTB/RIF（PCR，2小时内出结果，同时检测利福平耐药）","结核性脑膜炎：腰椎穿刺（淋巴细胞为主、葡萄糖<40mg/dL、蛋白升高、抗酸染色阳性率可达30%）","胸膜液腺苷脱氨酶（ADA）及胸膜活检（结核性胸膜炎）"],"infusion":[],"oral_medication":["异烟肼（儿童10-15mg/kg/日，最大300mg）","利福平（10-20mg/kg/日，最大600mg）","吡嗪酰胺（30-40mg/kg/日，最大2000mg）","乙胺丁醇","标准方案：初始异烟肼+利福平+吡嗪酰胺+乙胺丁醇，4-6个月（吡嗪酰胺2个月后停，异烟肼+利福平续用2-4个月）"],"treatment":["药物敏感肺结核：4-6个月多药联合治疗，WHO支持符合条件儿童4个月疗程","所有药物建议直接观察治疗（DOT）或视频直接观察治疗","治疗方案根据严重程度、体质及耐药可能性个体化选择","耐药结核（MDR/XDR）：根据药敏选择方案并请专家会诊","结核性脑膜炎：早期诊断+抗结核治疗，皮质类固醇减轻脑水肿","结核性胸膜炎：化疗几周内发热可减轻，必要时皮质类固醇加速缓解"],"management":["对密切接触传染性结核病人的儿童立即进行TST/IGRA检测","免疫抑制治疗前（长期类固醇、TNF-α拮抗剂、器官移植）先做TST/IGRA","从结核高流行地区移民或旅行的儿童进行筛查","培养及药敏检测，传染源不明确或可疑耐药时须取儿童自身标本培养","DOT保证依从性，治疗中监测疗效与副作用"],"notes":["未治疗结核感染成人终生发病风险5-10%，1岁以下儿童9个月内发病风险40%","结核性脑膜炎预后与治疗开始时临床分期密切相关，早期治疗预后好","儿童结核病的重要线索是近期接触患传染性结核的成人","多达40%的播散性结核患者TST阴性；结核瘤出现不代表治疗失败","卡介苗接种不影响TST判读"],"emergency":["结核性脑膜炎第三
