期（昏迷、偏瘫/截瘫、去大脑强直）需紧急抗结核及支持治疗","粟粒性结核伴呼吸窘迫、缺氧、气胸或纵隔气肿需重症监护","严重播散性结核（HIV感染儿童）伴多器官受累需紧急处理","喉部结核合并广泛肺部病变伴气道症状"],"pinyin":"ertongjiehebing"},{"name":"化脓性关节炎","category":"儿科-感染","summary":"细菌感染引起的关节滑膜间隙炎症，若未及早识别并迅速实施医疗和手术治疗，可损害滑膜、邻近软骨及骨骼导致永久性残疾。金黄色葡萄球菌是最常见病原体，50%病例2岁前发病。","symptoms":["新生儿：假性瘫痪、受感染肢体活动受限（如换尿布时哭闹）","较大婴儿/儿童：发热、疼痛、关节局部肿胀、红斑、发热及活动受限","下肢关节占75%（膝、髋最常见），受累时跛行或拒绝行走","髋关节位置深，症状较隐匿，可仅表现为大腿/腹股沟疼痛","多关节受累时考虑血清病、风湿热、胶原血管病、IgA血管炎"],"diagnosis":["关节穿刺滑液分析：白细胞>50,000/μL（常>100,000/μL）提示细菌感染","血液培养（约20%阳性）；怀疑淋球菌时采集宫颈、肛门、咽喉标本","滑液培养+多重PCR（提高K. kingae检出率，将滑液接种血液培养瓶）","超声检查检测关节积液（尤其髋关节，高度敏感）","X光片：关节囊扩张、软组织水肿、脂肪线消失、闭孔征","MRI评估邻近骨髓炎或脓肌炎"],"infusion":["头孢唑林100-150mg/kg/日每8小时或萘夫西林100-200mg/kg/日每6小时（经验性覆盖金葡菌和链球菌）","新生儿：萘夫西林/苯唑西林+广谱头孢（头孢匹胺100-150mg/kg/日）","万古霉素15mg/kg每6小时（重症、疑似菌血症、当地克林霉素耐药>10-15%）","克林霉素30-40mg/kg/日每6-8小时（CA-MRSA替代）","头孢曲松50mg/kg/日（莱姆关节炎重症/难治，14-28天）"],"oral_medication":["莱姆关节炎（8岁以上）：多西环素4.4mg/kg/日每12小时×28天","莱姆关节炎（8岁以下）：阿莫西林50mg/kg/日每8小时或头孢呋辛30mg/kg/日每12小时×28天"],"treatment":["关节镜或关节切开术引流和冲洗，缓解关节压力并清除炎症物质","髋关节感染视为急诊手术（股骨头血供脆弱）","髋以外关节可每天抽吸滑液，通常1-2次即可；4-5天仍积聚则手术","经验性抗菌治疗，病原确定后针对性调整","疗程：链球菌/肺炎球菌10-14天，金黄色葡萄球菌/革兰氏阴性菌约3周，并发骨髓炎4周","体温正常48-72小时且明显好转后可口服抗生素完成治疗","不建议关节内直接注射抗生素（滑膜刺激，全身给药已足够）"],"management":["手术时以无菌生理盐水冲洗关节腔","长期随访关节活动范围和骨骼长度（生长后遗症可能延迟显现）","监测CRP水平评估疗效","怀疑莱姆关节炎需两步法血清学检测（ELISA/IFA+Western blot）"],"notes":["长期后遗症（生长停滞致腿长差异/畸形、关节活动受限、股骨头缺血性坏死）发生率<5%，髋部受累更高","治疗后10%复发或慢性感染","症状出现后1周内开始治疗预后更好","CRP水平不下降提示治疗不充分","约65%病例可确定微生物来源"],"emergency":["髋关节感染为外科急诊，需尽快引流保护股骨头血供","重症或感染快速进展患儿应立即开始经验性抗菌治疗","48-72小时无改善或恶化需重新评估抗生素、手术干预和诊断"],"pinyin":"huanongxingguanjieyan"},{"name":"川崎病","category":"儿科-风湿免疫","summary":"川崎病是一种全球常见的儿童急性发热性系统性血管炎，尤其累及冠状动脉，发病率以亚洲儿童最高；未经治疗约20-25%出现冠状动脉异常（包括动脉瘤），经IVIG治疗者<5%。在大多数发达国家是儿童获得性心脏病的首要原因。","symptoms":["发热程度通常较高（≥38.3°C）且持续不退，对退热药无反应，诊断标准要求发热≥5天","双眼结膜充血，角膜缘未受累；口腔和咽部黏膜发红、草莓舌、嘴唇发红干裂","手部和脚部水肿（硬结）及红斑；急性期会阴部浅表脱屑，2-3周后手指脚趾甲周脱屑","多形性皮疹：斑丘疹、荨麻疹、多形红斑样、猩红热样（极少微脓疱或银屑病样）","颈部淋巴结肿大（>1.5cm），通常单侧","心脏受累是最重要表现：与发热不成比例的心动过速、心肌炎、心包炎、二尖瓣反流，偶为心源性休克（KD休克综合征）",">60%出现呕吐、腹泻或腹痛，至少35%有呼吸道症状；可伴关节炎、无菌性脓尿、易怒（婴儿常由无菌性脑膜炎引起）","1-2%并发巨噬细胞活化综合征（MAS）；未治疗者多达25%在病程第2-3周出现冠状动脉扩张"],"diagnosis":["典型KD：发热≥5天+五个主要临床特征中至少4个；应于发热开始后10天内（理想7天内）诊断","不完全KD：持续发热但主要特征<4个，需借助实验室检查和超声心动图诊断","年龄≤6个月婴儿发热≥7天伴无法解释的全身炎症，应行超声心动图评估冠状动脉","实验室：白细胞增多伴中性粒细胞及未成熟细胞为主、正细胞正色素性贫血、ESR/CRP升高、低白蛋白血症、低钠血症、第1周后血小板增多、无菌性脓尿、转氨酶及NT-proBNP升高","二维超声心动图监测冠状动脉（诊断时、患病1-2周后、6-8周后）；冠状动脉z评分≥2.0提示CAA风险","需排除腺病毒、麻疹、猩红热、sJIA、MIS-C、中毒性休克、药物过敏等；渗出性结膜炎和渗出性咽炎不符合KD"],"infusion":["静脉注射免疫球蛋白（IVIG）2g/kg，单次输注（通常10-12h），发病10天内、诊断后尽快给予","IVIG无反应者再次IVIG 2g/kg；或IVIG+甲泼尼龙2mg/kg/d静脉分q12h至退热","英夫利昔单抗5-10mg/kg单次静脉输注（抗TNF-α，IVIG无反应治疗）","阿那白滞素2-8mg/kg/d皮下注射或静脉输注（IL-1β受体拮抗剂，替代治疗）","环孢素（静脉3mg/kg/d分q12h）或环磷酰胺10-15mg/kg静脉1-2次（严重冠状动脉瘤患者）","血浆置换1-5周期（替代治疗）"],"oral_medication":["阿司匹林中等剂量30-50mg/kg/d，每6h一次口服，直至退热至少48h","退热后降至抗血小板剂量阿司匹林3-5mg/kg/d，每日一次，持续至发病后6-8周（全程冠脉正常者停用）","高风险患儿退热后口服泼尼松龙2mg/kg/d分bid，直至CRP正常，再2-3周逐渐减停","中型冠状动脉瘤：阿司匹林±氯吡格雷1mg/kg/d（最大75mg/d）","巨大冠状动脉瘤：阿司匹林+华法林、低分子量肝素或直接口服抗凝药（如阿哌沙班）","环孢素口服4-8mg/kg/d分q12h（IVIG无反应替代方案）"],"treatment":["标准治疗：IVIG 2g/kg单次输注+中等剂量阿司匹林（30-50mg/kg/d）直至退热，之后降至抗血小板剂量（3-5mg/kg/d）持续6-8周","冠状动脉异常高风险者（<6个月，或基线LAD/RCA z评分≥2.5）：IVIG+阿司匹林+甲泼尼龙2mg/kg/d，退热后口服泼尼松龙至CRP正常后2-3周减停","IVIG无反应（首剂完成后36h-7天内发热持续或复发，约15%患者）：再次IVIG、糖皮质激素、英夫利昔单抗或阿那白滞素","服用阿司匹林期间不应使用其他非甾体抗炎药（可能抑制阿司匹林抗血小板作用）","冠状动脉瘤患者长期抗血小板/抗凝治疗；急性冠脉血栓形成时在儿科心脏病专家指导下及时溶栓","冠脉狭窄伴可诱导缺血者可行CABG或导管介入（首选动脉移植材料，随儿童生长）"],"management":["按AHA风险分层（冠脉z评分/动脉瘤大小）定时心脏超声随访：2周、6周、6月、12月及年度复查，大型或巨型动脉瘤每6月复查并需影像学评估可诱导缺血","急性期并发MAS（1-2%）需更积极的免疫抑制治疗","长期服用阿司匹林者每年接种流感疫苗以降低瑞氏综合征风险；水痘疫苗接种后6周内用另一种抗血小板药物替代阿司匹林","IVIG后麻疹-腮腺炎-风疹疫苗和水痘疫苗推迟至11个月后接种，非活病毒疫苗无需推迟","所有有KD病史者接受心脏健康饮食、适量运动、避免吸烟及定期血脂监测的指导"],"notes":["未治疗者20-25%发生冠状动脉异常，发病10天内IVIG+阿司匹林治疗者降至<5%","巨大冠状动脉瘤（z评分≥10或绝对尺寸≥8mm）与血栓形成、狭窄、心绞痛和心肌梗死风险最高","急性KD复发率1-3%，已发表死亡率通常<1%","约50%CAA患者患病1-2年后冠脉腔径恢复正常，小动脉瘤更易消退；巨大动脉瘤不易恢复且更易血栓或狭窄","CAA患者AHA建议采用低于正常人群的动脉粥样硬化性心脏病风险因素治疗标准","与MIS-C鉴别：MIS-C平均年龄8-12岁、心肌功能障碍更重、淋巴减少、血小板减少、铁蛋白升高、肾受累更常见","以颈部淋巴结为首发表现的KD易与细菌性淋巴结炎混淆而延误诊断，此类患儿CAA发生率较高"],"emergency":["KD休克综合征：低血压、严重心室功能下降，需紧急评估和处理","巨大动脉瘤破裂罕见但多发生在发病后第一个月内，可表现为心包积液和心包填塞","亚急性期为出现动脉瘤患者突发死亡的最高风险期","冠状动脉血栓形成可致心肌梗死、心绞痛和猝死，需及时溶栓治疗","MAS：高铁蛋白血症、凝血功能障碍、血小板减少和休克，需更积极免疫抑制治疗"],"pinyin":"cqb"},{"name":"手足口病","category":"儿科-感染","summary":"手足口病是肠道病毒感染的典型皮疹综合征，最常见病因为柯萨奇病毒A16，亦可由肠病毒A71、柯萨奇A5/A6/A7/A9/A10等引起；多数病例症状较轻、自限，但肠病毒A71（尤其幼儿）可致脑干脑炎、非心源性肺水肿、心肺衰竭甚至死亡。目前无特效抗病毒药物，以支持性护理为主，中国已批准肠病毒A71灭活疫苗预防重症。","symptoms":["最常见病因为柯萨奇病毒A16，也可由肠病毒A71、柯萨奇A5/A6/A7/A9/A10、B2/B5及部分埃可病毒引起","通常症状较轻，可能伴低热","口腔受累时舌头、颊黏膜、后咽部、腭部、牙龈和/或嘴唇出现散在疼痛性水疱，可形成4-8mm浅溃疡，周围有红斑","手、脚及臀部、腹股沟出现斑丘疹、水疱或脓疱性病变；手部病变多见于背部表面，但手掌和脚底也常受累","手、脚部病变为3-7mm水疱，约一周消退；臀部病变一般不发展为水疱","柯萨奇病毒A6致非典型手足口病：发热、全身皮疹、疼痛、脱水、手掌脚底脱屑，可见甲脱落","肠病毒A71手足口病可伴神经和心肺并发症（尤其幼儿）：脑干脑炎表现意识改变、肌阵挛、呕吐、共济失调、眼球震颤、颅神经异常、自主神经功能障碍","重症可迅速发展为非心源性（推测神经源性）肺水肿和出血、心肺衰竭、休克和昏迷"],"diagnosis":["依据典型皮疹综合征（口腔黏膜疹+手足皮疹）、季节性、已知社区疫情及接触史等线索","RT-PCR检测肠道病毒RNA（脑脊液、血清、咽拭子、直肠/粪便、尿液等）灵敏度高、结果快，已取代病毒培养","病毒培养灵敏度50-75%，从多部位采样可提高阳性率","针对特定血清型的PCR（如肠病毒A71、柯萨奇病毒A16）可用于鉴定；A71可从口咽、鼻咽、直肠拭子检出（脑脊液阳性率较低）","血清学检测（中和抗体、特异性IgM）存在交叉反应和灵敏度限制，一般不如培养或核酸检测有效"],"infusion":["静脉免疫球蛋白（IVIG）：用于严重肠病毒A71相关神经/心肺疾病、重症新生儿及慢性肠道病毒脑膜脑炎（含高中和效价者效果更佳）","米林诺酮被建议可用于治疗严重的肠病毒A71引起的心肺疾病"],"oral_medication":[],"treatment":["目前无有效抗病毒药物，支持性护理为主要治疗手段","发热、疼痛对症处理，保证充分液体摄入防止脱水","严重新生儿、肠病毒A71神经/心肺疾病、肠病毒D68呼吸衰竭及急性弛缓性脊髓炎患者可能需要重症心肺支持治疗","疑似细菌感染的新生儿和幼儿常需住院诊断评估并经验性抗感染治疗","低丙种球蛋白血症患者预防性高剂量IVIG替代可降低慢性肠道病毒脑膜脑炎发生率","肠病毒A71灭活疫苗可预防严重手足口病（对重症保护效果>80%，中国已批准三种疫苗）"],"management":["手卫生、避免共用餐具和饮水容器等潜在污染物，对污染表面消毒","医院内采取接触预防措施；呼吸道综合征或疑似A71/D68感染者加用飞沫预防","关注口腔疼痛导致进食不足和脱水，鼓励充分补液"],"notes":["肠病毒A71相关脑干脑炎（rhombencephalitis）为重症，5岁以下尤其1岁以下儿童死亡率较高","幸存者可见中枢性呼吸抑制、延髓功能障碍、神经发育延迟、小脑缺陷、持续性肢体无力及肌肉萎缩等后遗症","柯萨奇病毒A16致手足口病偶尔可并发脑炎、急性弛缓性麻痹、心肌炎、心包炎和休克","大多数手足口病预后良好；发病率和死亡率主要与心肌炎、神经系统疾病、严重新生儿感染及免疫受损宿主感染有关","2020年COVID-19疫情期间手足口病减少，提示戴口罩、保持距离等非药物干预对预防肠道病毒有效","需与疱疹性咽峡炎鉴别（后者病变位于扁桃体前缘、软腭、悬雍垂、咽后壁，1-2mm囊泡扩至3-4mm）"],"emergency":["肠病毒A71感染出现神经系统警示征：意识改变、肌阵挛、共济失调、肢体无力、惊厥，需紧急评估","呼吸急促、发绀、肺水肿征象或心肺衰竭、休克需立即住院并重症监护","幼儿不能进食饮水、明显脱水、持续高热不退需就医","新生儿疑似肠道病毒严重感染（败血症样表现、心肌炎、肝炎、凝血障碍）需紧急评估"],"pinyin":"szkb"},{"name":"水痘","category":"儿科-感染","summary":"水痘由水痘-带状疱疹病毒（VZV）原发感染引起，以发热和向心性分布的瘙痒性皮疹为特征，各期皮损并存最具特征性。儿童多为自限性疾病，但可并发A组链球菌/金黄色葡萄球菌继发细菌感染、肺炎、脑炎、出血性疾病等严重并发症。阿昔洛韦/伐昔洛韦可改变病程，减毒活疫苗可预防，两剂接种效果更佳。","symptoms":["接触后14-16天发病，潜伏期10-21天；皮疹出现前24-48小时发热（通常37.8-38.9°C，可高达41.1°C）","较大儿童和成人可有前驱症状：发热、不适、食欲不振、头痛，偶尔轻微腹痛","皮损首先出现在头皮、面部或躯干：红斑状斑块→丘疹→清澈水疱，24-48小时内变浑浊、脐形凹陷并结痂","同时出现不同发展阶段的皮损是水痘特征；分布呈向心性（躯干和四肢近端明显）","平均皮损约300个（健康儿童可<10个或>1500个），剧烈瘙痒","口咽部和阴道黏膜可见溃疡性皮损；眼睑和结膜可有水疱型皮损，但角膜受累和严重眼病罕见","突破性水痘（接种后）：以斑丘疹为主、水疱少见，病变<50个、症状较轻，约25-30%病例仍可为重度","新生儿水痘（母亲分娩前5天至产后2天感染）：皮疹出生后第一周末至第二周初出现，病情严重、死亡率高"],"diagnosis":["水痘和带状疱疹通常依据临床表现诊断，实验室检测对诊断治疗并非必需","发病率下降后实验室确认日益重要：PCR检测疱疹疱液或痂皮中VZV DNA","异常表现（以丘疹而非水疱为主）给临床和实验室诊断带来挑战","鉴别诊断：单纯疱疹病毒、肠道病毒、猴痘、立克次体痘、金黄色葡萄球菌感染、药物反应、播散性带状疱疹、接触性皮炎、昆虫叮咬","先天性水痘综合征诊断：妊娠期水痘病史+新生儿特征性异常，组织样本PCR检测病毒DNA或脐带血VZV特异性IgM"],"infusion":["静脉阿昔洛韦：重症及免疫受损者10mg/kg或500mg/m²每8小时一次，治疗7-10天或至48小时内无新病变出现","新生儿水痘：静脉阿昔洛韦10-15mg/kg每8小时一次（出现皮损时即应使用）","阿昔洛韦耐药（主要见于HIV感染儿童）：静脉福西卡尼120mg/kg/日每8小时一次；西多福韦也有效（需传染病专家共同决策）","VariZIG/IVIG：用于免疫受损儿童、孕妇及接触水痘的新生儿暴露后预防（VariZIG尽快肌注，接触后最多10天内有效）"],"oral_medication":["口服阿昔洛韦：20mg/kg（最大800mg/次）每日4次，连续5天，治疗无并发症水痘","伐昔洛韦：20mg/kg（最大1000mg/次）每日3次，连续5天，获批用于2-18岁儿童水痘","泛昔洛韦可用于能吞咽药片的较大儿童及成人带状疱疹","健康儿童单纯带状疱疹可能无需抗病毒治疗，部分专家建议口服阿昔洛韦20mg/kg/日（最大800mg/日）缩短病程"],"treatment":["阿昔洛韦或伐昔洛韦抗病毒治疗可改变水痘和带状疱疹病程，对所有儿童、青少年和成人水痘患者均可考虑","治疗应尽早开始，最好在皮疹出现后24小时内；超过72小时开始临床效果较差","高危个体尤其建议治疗：12岁以上、慢性皮肤/肺部疾病、接受间歇/雾化皮质类固醇、长期服用水杨酸类、家庭接触继发病例","静脉治疗用于重症病例和免疫受损患者，即使皮疹出现后超过72小时也应开始；播散性VZV（肺炎、严重肝炎、血小板减少、脑炎）应立即治疗","新生儿水痘及伴肺炎、肝炎、脑炎等并发症者使用静脉阿昔洛韦","无需常规预防性抗菌治疗；继发细菌感染（GAS/金葡菌）时针对性治疗，儿童带状疱疹不推荐使用皮质类固醇","服用抗病毒药物期间充分补水，长期使用应监测肾功能和白细胞计数（尤其中性粒细胞）"],"management":["瘙痒对症处理，避免抓破皮肤导致继发感染","传染期隔离：皮疹出现前24-48小时至疱疹结痂（通常皮疹后4-7天）均具传染性","突破性水痘儿童应视为潜在传染者，病变结痂或无新病变前应排除在校外","暴露后预防：接触后3-5天内接种疫苗可有效预防或减轻水痘发作","母亲围产期水痘的新生儿、<28周早产儿、妊娠≥28周早产儿（母无免疫力）、无水痘免疫力孕妇及免疫低下者接触后使用VariZIG"],"notes":["皮肤继发细菌感染（A组链球菌/金黄色葡萄球菌）可致脓疱病、蜂窝织炎、坏死性筋膜炎、中毒性休克综合征，是健康儿童水痘发病率和死亡率的重要原因","初次皮疹消退后3-4天再次发热提示继发细菌感染","神经系统并发症：脑炎（约1/50000例）和小脑共济失调（约1/4000例）；小脑共济失调表现为步态障碍、眼球震颤、言语不清，通常24-72小时内完全恢复","进展性水痘：内脏受累、凝血功能障碍、出血、7天后仍持续出现新水疱；高危者包括细胞免疫缺陷、恶性肿瘤、高剂量皮质类固醇治疗儿童（未治疗死亡率近7%）","水痘是A组链球菌严重侵袭性感染最常见风险因素","未接种者原发性水痘死亡率2-3/10万；婴儿死亡风险为普通儿童的4倍，成人为25倍","疫苗安全性良好；MMRV疫苗在12-23月龄儿童首剂后5-12天内发热性惊厥风险略增（约1/2500）","雷耶综合征与水痘及水杨酸盐使用相关，应避免用水杨酸类退热"],"emergency":["免疫受损儿童、孕妇、新生儿患水痘属高危，需尽早抗病毒治疗并评估暴露后预防","出现肺炎症状（咳嗽、呼吸困难、发绀、胸壁痛、咯血）需紧急处理","脑炎征象（颈部僵硬、意识改变、惊厥）、出血性水疱或严重出血需立即就医","严重的腹痛可能提示肠系膜淋巴结或肝脏受累（进展性水痘）","新生儿水痘（母亲围产期感染）需住院静脉阿昔洛韦治疗，及时治疗预后良好"],"pinyin":"sd"},{"name":"流行性感冒（儿童）","category":"儿科-感染","summary":"流感病毒（甲型、乙型）引起儿童急性呼吸道感染，季节性流行期间造成严重发病率和死亡率；2岁以下幼儿及慢性疾病儿童为并发症高危人群。诊断需结合流行病学与实验室检查，RT-PCR为首选；抗病毒治疗应在发病后48小时内尽早开始，首选神经氨酸酶抑制剂奥司他韦。每年流感疫苗接种是最佳预防手段。","symptoms":["起病突然，以全身症状为主：发热、肌肉痛、寒战、头痛、不适和食欲不振","呼吸道表现：咳嗽、咽炎、干咳；可为孤立性上呼吸道疾病（如哮吼）或下呼吸道疾病（细支气管炎、肺炎）","儿童可能出现腹痛、呕吐和腹泻（A型H1N1pdm09更常致腹泻）","年幼儿童和婴儿症状不明显，可仅表现体温升高且病情严重外观","发热典型持续2-4天；咳嗽可持续更长时间，气道功能障碍可持续数周","并发症：急性中耳炎（可达25%）、病毒性或细菌性肺炎（如金黄色葡萄球菌）、急性肌炎或横纹肌溶解（小腿疼痛、肌红蛋白尿）、急性肾衰竭、心肌炎、败血症","中枢神经系统并发症：脑炎、脊髓炎、吉兰-巴雷综合征，儿童中较成人常见","流感期间使用水杨酸盐可能导致雷耶综合征"],"diagnosis":["依据流行病学、临床及实验室检查；疫情期典型症状可临床诊断","临床表现与其他呼吸道病毒（SARS-CoV-2、RSV、副流感、人偏肺病毒、腺病毒、鼻病毒）难以区分，特殊情况下需实验室确认","RT-PCR或其他快速分子检测为首选（灵敏度约95-100%）","快速抗原检测灵敏度仅50-70%，假阴性常见，尤其在社区流感活动高峰期","高风险患者快速抗原检测阴性不能排除流感，仍应尽早对症治疗并考虑进一步检测","诊断测试结果不应延迟抗病毒治疗决策"],"infusion":["帕拉米韦静脉输注：获批用于2岁及以上流感治疗（单次给药）；不推荐用于化学预防"],"oral_medication":["奥司他韦口服：无并发症流感每日2次×5天；足月婴儿每剂3mg/kg每日2次（AAP建议3.5mg/kg每日2次），获批用于2周龄及以上","早产儿奥司他韦按月经后年龄调整：<38周1mg/kg/日，38-40周1.5mg/kg/日，>40周3mg/kg/日","扎那米韦吸入：每日2次×5天；慢性呼吸疾病（哮喘、COPD）患者不建议使用（支气管痉挛风险）","巴洛沙韦马博西尔口服：单次剂量，获批用于12岁及以上、体重≥40kg、发病后2天内无并发症流感","金刚烷胺和利姆烷胺因甲型流感病毒广泛耐药，目前不推荐使用"],"treatment":["抗病毒治疗应在流感发病后48小时内尽早开始，发病2天内开始可减少疾病持续时间、中耳炎风险和住院可能","住院患者、严重复杂或进展性疾病患者、流感并发症高风险患者（2岁以下、慢性肺部/心血管/肾脏/肝脏/血液/代谢疾病、神经肌肉疾病、免疫抑制、孕妇、长期水杨酸治疗者）均建议抗病毒治疗，即使超过48小时也可能有益","无并发症流感：奥司他韦或扎那米韦×5天，或单次静脉帕拉米韦/口服巴洛沙韦","住院及严重/复杂流感：推荐口服或肠道奥司他韦；严重病例可考虑更长疗程（如10天）","支持性护理：充足液体摄入和休息；细菌性继发感染应适当使用抗生素","发热再次出现、发热时间延长或临床状况恶化时，应怀疑细菌性继发感染并评估"],"management":["发热和肌痛对症处理，避免儿童使用阿司匹林/水杨酸盐（预防雷耶综合征）","无并发症流感症状出现后48-72小时开始好转；完全恢复到正常活动水平并摆脱咳嗽可能需要数周","流感高传染性，感染者自症状出现前1天至病后5-7天具传染性，注意家庭及学校传播控制","高危儿童及其密切接触者（家庭成员、照护者）应完成年度流感疫苗接种"],"notes":["流感疫苗在完全接种儿童中降低实验室确诊流感风险的有效率为40-60%","建议所有6个月及以上人群每年接种流感疫苗；6个月至8岁首次接种者需2剂（间隔至少4周）","灭活流感疫苗（IIV肌注）和减毒活流感疫苗（LAIV鼻喷）均可选择，自2020-2021季节起美国所用疫苗均为四价","抗病毒药物化学预防不常规推荐；仅用于高危未接种者、疫苗禁忌者或机构爆发（奥司他韦或扎那米韦，接触后48小时内开始，持续7天）","奥司他韦耐药以A(H1N1)型最为常见；使用前参考CDC年度建议","严重流感可致住院甚至死亡，即使在既往健康的儿童中","几乎所有流感相关死亡儿童中近一半无已知基础疾病"],"emergency":["高危儿童（<2岁、慢性疾病、免疫抑制）疑似流感应尽早就诊并启动抗病毒治疗，不等待实验室确认","呼吸急促、呼吸困难、发绀、嗜睡、惊厥、脱水征象需紧急就医","病程中发热再次升高或临床状况恶化提示细菌性继发感染（如金葡菌肺炎），需急诊评估","急性肌炎伴明显肌肉无力、深色尿（肌红蛋白尿）需评估横纹肌溶解"],"pinyin":"lxxgm（et）"},{"name":"猩红热","category":"儿科-感染","summary":"猩红热是由产红疹毒素（链球菌热原外毒素A、C等）的A组链球菌（GAS）引起的咽炎伴特征性皮疹，表现为砂纸样弥漫性红斑、Pastia线和草莓舌。青霉素或阿莫西林为首选治疗，及时完成抗生素疗程可预防急性风湿热等并发症；GAS对青霉素高度敏感、无耐药菌株。","symptoms":["皮疹在咽部症状出现后24-48小时内出现，从颈部开始向躯干和四肢扩散","皮疹为弥漫性、细小的丘疹状红斑，皮肤呈鲜红色，按压时褪色；皮肤粗糙呈砂纸样","皮疹在肘部、腋窝、腹股沟皱褶处尤为明显（Pastia线）","脸颊红斑，口周区域可苍白","3-4天后皮疹消退，随后脱屑（最初在面部，向尾部蔓延，似轻微晒伤）；指甲边缘、手掌和脚底可有片状脱屑","咽部表现与GAS咽炎相似（咽痛、扁桃体渗出）；舌苔+舌乳突肿胀为白色草莓舌，脱屑后红色草莓舌","流行病学与GAS咽炎相同：5-15岁儿童多见，冬季和早春高发，潜伏期2-5天"],"diagnosis":["典型猩红热临床诊断不难；咽部检出GAS可确诊","咽喉拭子培养：灵敏度90-95%，是确认GAS咽炎的标准方法","快速抗原检测：特异性>95%（阳性可放心开始治疗），灵敏度70-90%（阴性需培养确认）","分子检测（PCR、等温扩增）：部分灵敏度达100%、特异性>96%，结果<10分钟","不典型或咽部表现不明确的病例需与病毒性皮疹、川崎病、药物疹及葡萄球菌感染鉴别","近期GAS接触史有助于诊断；链球菌抗体（ASO、抗DNase B）可回顾性诊断"],"infusion":["严重侵袭性GAS感染（链球菌中毒性休克综合征、坏死性筋膜炎）：静脉克林霉素+青霉素联合治疗（直至确定克林霉素敏感性）","链球菌中毒性休克综合征需快速积极液体复苏，处理呼吸/心脏衰竭及多器官衰竭","静脉免疫球蛋白（IVIG）：有限数据显示可作为链球菌中毒性休克综合征的辅助治疗"],"oral_medication":["青霉素V：250mg每日2次或3次（体重≤60磅）或500mg每日2次或3次（>60磅），连续10天","阿莫西林：50mg/kg（最大1000mg）每日一次，连续10天（依从性好，可替代多剂量口服）","青霉素过敏者：窄谱口服头孢菌素10天，或口服克林霉素，或大环内酯类（红霉素、克拉霉素）、阿奇霉素","阿奇霉素：第1天12mg/kg，第2-5天6mg/kg/日（疗程5天）","苄星青霉素G肌注（体重≤60磅60万单位，>60磅120万单位）：用于不能完成口服疗程者","磺胺类及四环素类不推荐用于GAS咽炎"],"treatment":["及时抗生素治疗可预防急性风湿热、缩短病程、减少感染传播并避免化脓性并发症","典型猩红热患者应立即开始抗生素治疗；症状不典型者应在实验室确认后开始","GAS对青霉素和头孢菌素类药物高度敏感，从未发现耐药菌株，青霉素/阿莫西林为首选","必须完成10天全程治疗（症状可能在2-3天改善，仍需继续用药），强调依从性","仅在少数持续有症状、症状复发或患风湿热/风湿性心脏病的患者中进行治疗后咽喉培养复查","静脉克林霉素用于严重侵袭性GAS感染（较青霉素疗效更佳），与青霉素联用直至明确敏感性；坏死性筋膜炎需立即手术探查清创"],"management":["接受适当抗生素治疗24小时后儿童通常不再具有传染性","向家长强调完成全程抗生素疗程的重要性","注意学校、家庭等密切接触场所的传播防控"],"notes":["化脓性并发症：颈部淋巴结炎、扁桃体周围脓肿、咽后脓肿、中耳炎、乳突炎和鼻窦炎（原发疾病未及时发现或治疗不足时发生）","非化脓性并发症：急性风湿热（仅由上呼吸道感染引起）和急性链球菌感染后肾小球肾炎（上呼吸道或皮肤感染均可引起）","症状出现后9天内开始并完成抗生素治疗几乎总能预防急性风湿热","未经治疗的急性咽炎患儿通过唾液飞沫和鼻腔分泌物传播GAS；慢性咽部携带者很少传播","水痘是儿童侵袭性GAS感染最常见的风险因素","近几十年侵袭性GAS感染（菌血症、肺炎、TSS、坏死性筋膜炎等）发生率增加，非常年幼和年老人群最明显","猩红热皮疹由链球菌热原外毒素引起；抗毒素抗体只提供对皮疹的免疫，不防止其他链球菌感染"],"emergency":["低血压伴肾功能损害、凝血病、肝脏受累、ARDS、全身红斑皮疹、软组织坏死提示链球菌中毒性休克综合征，需急诊处理","怀疑坏死性筋膜炎需立即手术探查和清创","扁桃体周围脓肿、咽后脓肿致吞咽困难或气道受累需急诊","水痘、糖尿病、免疫抑制等侵袭性感染高危儿童出现高热、全身毒血症征象需紧急评估"],"pinyin":"xhr"},{"name":"百日咳","category":"儿科-感染","summary":"由百日咳博德特氏菌引起的急性呼吸道感染，传染性极强（易感者近距离接触感染率可高达100%）。典型表现为阵发性剧烈咳嗽，病程分卡他期、发作期、恢复期。","symptoms":["卡他期（1-2周）：鼻塞、流涕、低热、打喷嚏、结膜充血","发作期（2-6周）：连续剧烈阵发性咳嗽、鸡鸣样吸气声、咳嗽后呕吐、极度疲劳","3个月以下婴儿表现不典型：呼吸暂停、喘息、发绀、四肢抽搐（可无典型咳嗽）","青少年/成人：突然窒息感后持续咳嗽、呕吐，常>21天","结膜出血、上半身瘀点、偶发气胸/皮下气肿、舌系带撕裂"],"diagnosis":["临床：咳嗽≥14天+阵发性咳嗽/喘息/咳嗽后呕吐（敏感性81%）","鼻咽拭子PCR检测（首选实验室方法）","培养（Regan-Lowe活性炭琼脂+头孢氨苄），卡他期及发作早期阳性率最高","血清学：单次IgG>90IU/mL提示近期症状性感染","白细胞增多伴绝对淋巴细胞增多（15,000-100,000/μL）为发作期特征","婴儿中位白细胞计数（致命病例94,000/μL vs 非致命18,000/μL）及血小板增多与死亡相关"],"infusion":[],"oral_medication":["阿奇霉素（所有年龄段首选，治疗及暴露后预防），2个月以下婴儿获益远大于风险","复方磺胺甲噁唑（2个月以上婴儿、大环内酯类过敏或耐药时替代）","红霉素（新生儿幽门狭窄风险高于阿奇霉素，慎用于出生<14天婴儿）"],"treatment":["怀疑或确诊即用抗菌剂（阿奇霉素）降低传染性并可能带来临床益处","3个月以下疑似婴儿通常住院，评估疾病进展及危及生命状况","住院监测心率、呼吸频率及脉搏血氧饱和度，记录咳嗽、喂养、呕吐、体重变化","呼吸暂停/危及生命事件/呼吸衰竭的婴儿需加强呼吸支持、插管和药物诱导麻痹","喂养策略：避免大量喂养，发作后喂养可能更有效"],"management":["所有家庭成员及密切接触者（含日托工作人员）无论年龄、免疫史或症状立即给予阿奇霉素预防","医院内飞沫隔离（咳嗽者限制探视和移动直至治疗满5天）","妊娠27-36周孕妇接种Tdap（预防新生儿百日咳有效性80-91%）","DTaP/Tdap疫苗接种及加强","出院标准：48小时后病情稳定或减轻、发作不需干预、营养良好、家长能做家庭护理","安静、光线昏暗、不受干扰的环境"],"notes":["4个月以下婴儿占致命百日咳病例的90%，早产和低龄母亲是危险因素","疫苗诱导免疫力迅速减弱（DTaP第五剂后8.5年保护率仅10%）","进行性肺动脉高压和继发性细菌性肺炎是严重并发症和常见死因","婴儿肥厚性幽门狭窄与出生<14天婴儿使用红霉素相关","百日咳后很少出现支气管扩张，但2岁前患病者成年后肺功能可能异常"],"emergency":["婴儿呼吸暂停、发绀、呼吸衰竭需插管和通气","进行性肺动脉高压和心源性休克可能致命，应行心脏超声检测肺动脉高压并尽早干预","无法机械通气者ECMO死亡率>80%，换血/白细胞分离术可显著降低淋巴细胞和血小板计数","癫痫发作多由低氧血症引起，警惕低钠血症"],"pinyin":"bairike"},{"name":"脑膜炎球菌病（流行性脑脊髓膜炎）","category":"儿科-感染","summary":"脑膜炎奈瑟菌引起的侵袭性感染，可表现为脑膜炎、脑膜炎球菌血症（败血症）等。易感个体发病可在数小时内迅速进展，死亡率高（5-10%），尤其伴脓毒性休克者。","symptoms":["早期非特异性症状：发热、烦躁、嗜睡、呼吸道症状、拒饮、呕吐","瘀点/紫癜性皮疹（>80%病例出现不褪色皮疹），暴发性紫癜","脑膜炎：发热、头痛、颈强直、畏光、囟门膨出、呕吐","脑膜炎球菌血症：脓毒性休克、手脚冰冷、毛细血管充盈延长、意识改变、昏迷","约10%病例初期出现斑丘疹样皮疹；7%主诉四肢疼痛或拒绝行走","慢性脑膜炎球菌血症：间歇性发热、关节痛、头痛、脾肿大、斑丘疹/瘀点（平均6-8周）","隐匿性菌血症：单纯发热，可自行消退但约60%进展为脑膜炎"],"diagnosis":["确诊：从血液、脑脊液或滑膜液等无菌体液分离脑膜炎奈瑟菌","PCR检测（ctrA基因）高度敏感特异，可提高确诊率40%以上","瘀点/紫癜皮损革兰氏染色和/或培养","脑脊液：急性细菌性脑膜炎特征，高达75%病例见革兰氏阴性双球菌","CRP升高（发热伴瘀点时有助于诊断）","实验室常见白细胞减少或增多、血小板减少、贫血、代谢性酸中毒、乳酸升高","腰椎穿刺禁忌：脓毒性休克、凝血障碍、血小板减少、呼吸窘迫、癫痫、颅内压升高"],"infusion":["头孢曲松75-100mg/kg/日（首选，每日1-2次）","头孢噻肟180-225mg/kg/日（新生儿推荐）","青霉素G 30-40万单位/kg/日（确诊β-内酰胺敏感菌后可选，但不能清除携带）","万古霉素（β-内酰胺耐药肺炎球菌高发地区经验性联合）","氯霉素50-100mg/kg/日或美罗培南60-120mg/kg/日（β-内酰胺严重过敏替代）"],"oral_medication":["利福平（预防）：婴儿<1月5mg/kg每12小时×4剂；≥1月及成人15-20mg/kg每12小时×4剂（最大600mg）","环丙沙星（预防）：≥1个月20mg/kg单剂（最大500mg）","头孢曲松（预防）：<15岁125mg肌注单剂，≥15岁250mg肌注单剂","阿奇霉素（预防，不常规推荐）：10mg/kg单剂"],"treatment":["怀疑侵袭性感染且在留取培养后立即开始经验性抗菌治疗（第三代头孢菌素）","疗程通常5-7天；瘀点皮疹儿童可先予头孢曲松再评估（避免>90%非脑膜炎球菌患儿不必要用药）","支持性护理：气道评估（意识下降）、补充氧气、低血容量时液体复苏+增强心输出量","40mL/kg液体复苏后仍代偿性休克→气管插管和通气","监测并纠正葡萄糖、钾、钙、镁、磷酸盐、凝血及贫血","脑膜炎球菌败血症不常规使用皮质类固醇；难治性休克可补充类固醇（Waterhouse-Friderichsen综合征）","密切接触者尽早抗生素预防（头孢曲松、环丙沙星或利福平）"],"management":["住院患者开始有效治疗后24小时内执行飞沫隔离","所有确诊或疑似病例按国家/地区规定向公共卫生部门报告","密切接触者（家庭成员、亲吻者、托儿所接触者）化学预防","非B群荚膜菌感染后筛查补体缺乏（X/Y/W群>1/3与补体缺乏有关）","疫苗接种（结合疫苗、B群疫苗）用于预防及疫情控制","瘀点皮疹儿童按流程评估，必要时住院密切监测生命体征"],"notes":["总死亡率5-10%，多数死亡发生在住院后48小时内","预后不良因素：低体温或高热、低血压/休克、暴发性紫癜、癫痫、白细胞减少、血小板减少、酸中毒","耳聋是最常见神经系统后遗症（5-10%儿童）","暴发性紫癜幸存者约2%需截肢，应延迟进行以允许组织愈合","抗生素治疗无法清除鼻咽部携带，出院前需化学预防","≤50%病例培养阴性（尤其院前使用抗生素后），PCR可提高确诊率"],"emergency":["休克和颅内压升高是致命特征，延迟支持治疗导致不良预后","暴发性紫癜、瘀点扩散、脑膜炎/败血症征象、患儿状态差时立即静脉头孢曲松","急性并发症：肾上腺出血/衰竭、心肌炎、肾功能衰竭需透析、DIC","局部皮肤梗死需皮肤移植；远端组织坏死可能需截肢"],"pinyin":"naomoyanqiujunbing（liuxingxingnaojisuimoyan）"},{"name":"脓毒症/脓毒性休克","category":"儿科-感染","summary":"脓毒性休克是疑似或确诊感染患儿中危及生命的心血管功能障碍，死亡风险高于无休克败血症。儿童败血症采用Phoenix Sepsis Score评估（≥2分），脓毒性休克要求心血管子评分≥1分。","symptoms":["婴儿/幼儿典型'寒性休克'：心动过速、毛细血管充盈延迟、四肢冷、外周脉搏减弱、脉压降低","较大儿童/青少年'温性休克'：心动过速、毛细血管充盈快、四肢温暖、脉搏增强、脉压升高","发热或低体温伴系统性或局部感染证据","低血压为晚期表现，尤其在婴幼儿，并非休克诊断标准","精神状态改变、少尿、呼吸窘迫、意识模糊、昏迷","高铁蛋白血症（铁蛋白>3000ng/mL预示不良预后，需ICU）"],"diagnosis":["临床诊断基于详细病史和体格检查（灌注减少体征、皮肤病变、生命体征）","血乳酸：动脉乳酸≥2mmol/L预示更差预后","抗生素前至少采集一次血液培养及其他相关标本","实验室：全血细胞计数、肾功能、肝功能、凝血功能（纤维蛋白原、D-二聚体）","CRP、降钙素原升高；中性粒细胞增多伴未成熟细胞","所有脓毒性休克患者测定铁蛋白；高铁蛋白血症者加做HLH/MAS相关检测","床旁超声（POCUS）评估血管内容量状况及心脏/肺部"],"infusion":["晶体液（0.9%生理盐水或平衡液）10-20mL/kg/次，首小时最多40-60mL/kg","肾上腺素0.05-2.0μg/kg/min（液体难治性脓毒性休克首选一线血管活性药物）","去甲肾上腺素0.05-2.0μg/kg/min（血管麻痹/低SVR时一线）","血管加压素、多巴胺、多巴酚丁胺、米力农（二线血管活性药物）","出血性休克：红细胞、血浆、血小板1:1:1复苏","应激剂量氢化可的松（绝对肾上腺功能不全患者）","高铁蛋白血症性脓毒症：甲基泼尼松龙、IVIG、阿那白滞素（IL-1受体拮抗剂）"],"oral_medication":[],"treatment":["识别后第一小时内六项措施：建立IV/IO通路、采集血培养、经验性广谱抗生素、测乳酸、液体复苏、休克持续则开始血管活性药物","液体复苏后持续休克→血管活性药物（肌功能障碍用强心剂，血管麻痹用缩血管剂）","恢复氧供：确保气道通畅、SpO₂<92-94%时补充氧气","插管和机械通气（氯胺酮优先，禁用依托咪酯）","纠正低血糖、低钙等电解质异常","难治性休克：评估非典型/可逆病因、二线血管活性药物、应激剂量皮质类固醇、ECMO"],"management":["频繁评估对初始治疗的反应（心率、血压、毛细血管充盈、外周脉搏、四肢温度）","监测液体过载迹象（哮鸣音、奔马律、肝肿大），过载后转为血管活性药物","中心静脉/动脉导管监测血流动力学及连续乳酸","气道和机械通气管理减少呼吸做功","营养支持、避免低血糖、抗生素管理（antimicrobial stewardship）"],"notes":["低血压是失代偿休克的晚期表现，尤其在婴幼儿，其存在提示更高发病率和死亡率","无重症监护条件的医疗系统中无低血压时不推荐液体快速输注（与死亡率增加相关）","使用羟乙基淀粉和明胶等合成胶体可致肾损伤和凝血功能障碍，不推荐","肾上腺素作为一线血管活性药物比多巴胺更能降低死亡率","正压通气可能降低静脉回流导致心血管衰竭，需备好液体和血管活性药"],"emergency":["所有类型休克（低血容量、心源性、分布性、梗阻性、分离性）均为医疗急症","难治性休克（血管活性支持需求高、乳酸>8mmol/L、心肌功能障碍）考虑VA/VV ECMO","儿童出现休克警示信号（低血压、循环不良、意识改变、紫癜/红皮病皮疹）立即急诊评估治疗","心脏骤停后或难治性休克应排查心包填塞、气胸、肺栓塞等梗阻原因"],"pinyin":"nongduzheng/nongduxingxiuke"},{"name":"骨髓炎","category":"儿科-感染","summary":"骨骼感染，分急性（症状出现后4周内）和慢性。金黄色葡萄球菌是各年龄组最常见病原体，4岁以下儿童第二常见病原体为金氏金氏菌（Kingella kingae）。","symptoms":["新生儿：假性瘫痪或活动肢体时疼痛，一半患儿无发热","较大婴儿/儿童：疼痛、发热、局部肿胀、红斑、局部发热","下肢受累时约半数跛行或拒绝行走","长骨最常见受累（股骨25%、胫骨24%）；骨盆骨髓炎可仅表现为髋/大腿/腹股沟/腹部疼痛","脊柱骨髓炎：背部疼痛伴或不伴棘突压痛","约30%患者发病前有轻微闭合性创伤史"],"diagnosis":["抗生素治疗前血液培养（约30%阳性）","骨/骨膜下脓肿抽吸或活检：革兰氏染色、培养、K. kingae PCR及组织学（约60%可确定病原）","MRI（T2加权+脂肪抑制）为评估骨髓水肿和软组织脓肿的主要手段","X光片：早期见深层肌肉平面移位，溶骨性变化在感染后7-14天才出现","CRP升高并连续监测评估疗效；全血细胞计数评估严重程度","三阶段骨扫描（99mTc）用于多灶病变排查（敏感性84-100%）"],"infusion":["头孢唑林100-150mg/kg/日每6小时或萘夫西林100-200mg/kg/日每6小时（MSSA首选/经验性基石）","克林霉素30-40mg/kg/日每6-8小时（CA-MRSA经验性治疗）","万古霉素40-60mg/kg/日每6-8小时（MRSA，克林霉素耐药地区）","新生儿：萘夫西林/苯唑西林+广谱头孢（如头孢匹胺100-150mg/kg/日）","沙门氏菌/耐药肺炎球菌：头孢噻肟或头孢曲松"],"oral_medication":["头孢氨苄75-100mg/kg/日每8小时（口服延续治疗，敏感葡萄球菌/链球菌）","克林霉素30-40mg/kg/日每6-8小时（CA-MRSA对克林霉素敏感或严重过敏者）","利奈唑胺（MRSA且耐克林霉素时口服延续）"],"treatment":["儿科、骨科、介入放射科协作治疗","重症患者立即经验性抗菌治疗，轻症可先完成培养再用药","病原确定后针对性治疗，选择最窄谱、不良反应最低的抗生素","无并发症急性骨髓炎抗生素21-28天；恢复慢或CRP未正常者4-6周","骨膜下或干骺端明显脓液、穿透伤、残留异物时行手术引流","症状改善、体温正常、菌血症消退后由静脉转口服","慢性骨髓炎：手术切除窦道和骨赘，长期口服抗菌治疗"],"management":["物理治疗：患肢保持伸展位（沙袋、夹板、临时石膏），2-3天后开始被动关节活动度练习","长期随访关节活动范围和骨骼长度（生长后遗症可能数月/数年才显现）","并发静脉血栓形成者在血液科监督下抗凝至血栓消退","治疗7-10天内CRP降至2mg/dL以下提示疗效，不符合规律提示治疗不足"],"notes":["治疗后<10%复发或转为慢性感染","症状出现后1周内开始医疗和手术治疗预后更好","约20%金黄色葡萄球菌感染儿童可有多灶性骨髓炎；新生儿近半累及两个以上骨骼","镰状细胞病患儿最常见病原为沙门氏菌和金黄色葡萄球菌","铜绿假单胞菌感染几乎总与足部穿刺伤相关"],"emergency":["重症（脓毒症/脓毒性休克体征）应立即经验性抗菌治疗","48-72小时症状无改善或恶化需重新评估抗生素、手术干预及诊断","金黄色葡萄球菌骨髓炎可并发深静脉血栓及感染性肺栓塞（病情危重）"],"pinyin":"gusuiyan"},{"name":"麻疹","category":"儿科-感染","summary":"麻疹是高度传染性病毒性疾病，以发热、咳嗽、流涕、结膜炎、科普利克斑及红色斑丘疹为特征；美国通过两剂MMR疫苗接种已消除地方性传播，但输入性病例可在未接种人群中引起疫情。目前无特异性抗病毒治疗，以支持治疗为主；WHO和CDC建议所有急性麻疹患儿补充维生素A以降低发病率和死亡率。","symptoms":["潜伏期8-12天；发病始于轻微发热，继而结膜炎伴畏光、流鼻涕、剧烈咳嗽及持续升高的体温","科普利克斑为特异性体征：皮疹出现前1-4天，位于颊内侧前臼齿位置的红色斑块中心蓝白色斑点，50-70%病例可见","皮疹首先出现在额头（发际线附近）、耳后及颈上部，为红色斑丘疹，向下蔓延至躯干和四肢，约50%波及手掌和脚底","面部和上半身皮疹常融合成斑块；皮疹约7天内逐渐消退，留轻微皮肤脱屑","咳嗽持续时间最长，可达10天；严重者可有全身淋巴结肿大（颈部和枕部明显）","变异型麻疹（被动获得抗体者、部分接种者）：皮疹不明显或短暂，甚至完全缺如，传染性不高"],"diagnosis":["诊断几乎总是基于临床和流行病学表现（典型前驱症状+科普利克斑+皮疹）","急性期实验室：总白细胞计数下降，淋巴细胞减少程度大于中性粒细胞；无细菌并发感染时ESR和CRP正常","血清IgM抗体：皮疹出现后1-2天出现，可持续检测约1个月；皮疹后72小时内采集阴性者应再采集样本","PCR检测鼻咽吸出物、咽喉拭子或尿液；建议同时采集咽喉拭子PCR+血清IgM，并送当地州公共卫生实验室或CDC基因分型","急性期与康复期（间隔2-4周）IgG抗体四倍升高可血清学确认","鉴别诊断：风疹、腺病毒/肠道病毒/EBV感染、传染性红斑、肺炎支原体、A组链球菌、川崎病（无科普利克斑和严重前驱咳嗽，且有血小板增多）、药物疹"],"infusion":["静脉输液：严重脱水时用于补液治疗","静脉注射免疫球蛋白（IVIG）400mg/kg：用于严重免疫抑制及无麻疹免疫力证据的孕妇的暴露后预防（接触后6天内）","免疫受损麻疹患者可经验性使用利巴韦林联合静脉γ球蛋白（轶事报告显示可能有益）"],"oral_medication":["维生素A：≥12月龄200,000IU/日，6-11月龄100,000IU，<6月龄50,000IU；出现维生素A缺乏症状者2-4周后再给一剂","利巴韦林15-20mg/kg/日分两次口服：用于<12月龄儿童、需呼吸支持的>12月龄肺炎患者及严重免疫抑制者的麻疹肺炎（5-7天疗程）","退热药：缓解不适和控制体温","SSPE治疗：异普林索+干扰素联合（临床试验缓解率30-34%）；卡马西平对早期肌阵挛有效"],"treatment":["治疗以支持性为主：维持水分、氧气供给和舒适度，目前无获批的特异性抗病毒药物","退烧药缓解不适和控制体温","呼吸道受累时气道湿润化和补充氧气；喉炎或肺炎致呼吸衰竭需呼吸支持","口服补液在多数情况下有效，严重脱水时需静脉输液","无需预防性抗菌治疗；继发细菌感染（肺炎链球菌、流感嗜血杆菌、金葡菌）时针对性使用抗生素","免疫受损患者感染麻疹高度致命，可考虑利巴韦林±IVIG","WHO和CDC建议所有急性麻疹患儿补充维生素A（发展中国家RCT显示降低发病率和死亡率）"],"management":["隔离：皮疹出现前3天至出疹后4-6天具传染性；医院内标准预防+空气传播预防","免疫低下者整个病程排出病毒，应全程隔离","暴露后预防：接触后72小时内接种疫苗可有效预防或减轻麻疹；接触后6天内可注射免疫球蛋白（免疫正常儿童0.5ml/kg肌注，最大15ml/kg）","免疫球蛋白适用于麻疹患者的易感家庭成员，尤其<6月龄婴儿、孕妇和免疫受损者","接种活疫苗前或同时进行结核病皮肤试验（麻疹抑制结核菌素反应）"],"notes":["肺炎是最常见死亡原因，可为病毒性巨细胞性肺炎或细菌叠加感染（常见病原体肺炎链球菌、流感嗜血杆菌、金葡菌）","急性中耳炎是最常见并发症；喉炎、气管炎、细支气管炎可致需插管的严重并发症","麻疹后脑炎：约1-3/1000例，青少年和成人发生率更高；15%死亡，20-40%遗留认知障碍、运动功能障碍和耳聋","SSPE（亚急性硬化性全脑炎）：麻疹后7-13年出现，几乎总是致命，预防关键在于疫苗接种","免疫低下者MIBE（麻疹包涵体脑炎）几乎均死亡；出血性麻疹（黑麻疹）也常致命","妊娠期麻疹致母亲高发病率、胎儿死亡和死产率升高，3%活产婴儿出现先天性畸形","维生素A水平低与麻疹发病率和死亡率增加相关；麻疹感染降低血清视黄醇浓度","严重营养不良、<5岁（尤其<1岁）和>20岁人群发病率与死亡率最高"],"emergency":["呼吸急促、呼吸困难、发绀等肺炎征象需紧急处理","惊厥、嗜睡、昏迷、易怒提示脑炎，需急诊评估","严重腹泻呕吐伴脱水，尤其婴幼儿，需补液治疗","免疫低下或孕妇接触麻疹后需紧急暴露后预防（IVIG 400mg/kg）","出血性皮疹（黑麻疹）为严重类型，往往致命"],"pinyin":"mz"},{"name":"坏死性小肠结肠炎","category":"儿科-新生儿","summary":"新生儿时期胃肠道最常见的危及生命的紧急情况，特点为肠道黏膜或肠壁不同程度坏死并继发局部和全身炎症，主要风险因素为早产、肠道细菌定植和肠内喂养。","symptoms":["非特异性起病：嗜睡、体温不稳定","胃肠道表现：腹部压痛和膨胀、进食困难、血便、胃排空延迟、呕吐、腹泻、腹部包块、腹壁红斑","全身表现：呼吸暂停/呼吸窘迫、代谢性和/或呼吸性酸中毒、血糖不稳、灌注不良/休克、血小板减少、弥散性血管内凝血","实验室异常：中性粒细胞减少、贫血、血小板减少、凝血功能障碍、代谢性酸中毒","低血压和呼吸衰竭常见；病情可快速进展，但通常在72小时后不会由轻度发展为重度"],"diagnosis":["对早产风险婴儿高度警惕，临床诊断结合症状与放射学表现","腹部X光片：肠气肿具诊断意义（开始治疗时50-75%存在），门静脉气体提示病情严重，腹腔积气提示穿孔","超声检查评估游离液体、脓肿、肠气肿及肠壁厚度、蠕动和血流","多普勒血流监测评估肠上动脉和门静脉血流","鉴别诊断包括感染性肠梗阻、胃肠道阻塞、肠扭转、孤立性肠道穿孔；多例发病时考虑诺如病毒、肠道病毒、轮状病毒等病毒病因"],"infusion":["静脉输液（晶体液或血液制品）补充血管内容量","广谱抗生素（留取血培养后立即开始，覆盖革兰氏阴性菌为主）","甲硝唑、克林霉素（补充厌氧菌覆盖）","强心剂（必要时）"],"oral_medication":[],"treatment":["确诊或疑似NEC需迅速开始治疗：停止喂养、鼻胃管减压、静脉输液和抗生素","呼吸暂停或腹部膨胀致缺氧和高碳酸血症时给予通气支持","心血管支持（输液和/或强心剂）、纠正血液学、代谢和电解质异常","确诊后移除脐动脉导管（其减少肠系膜血管血流）","外科手术：气腹是唯一绝对指征；最大程度医疗下持续恶化、连续X光片见固定肠袢或腹壁红斑时考虑剖腹探查","手术方式包括原发性腹膜引流或剖腹探查切除坏死肠管并建造口；确诊肠坏死时剖腹探查更可能降低死亡或神经发育障碍风险"],"management":["在NICU中通过频繁体格检查密切监测病情","定期前后位及侧位X光检查以检测肠道穿孔","持续监测血液学、电解质和酸碱平衡状况","治疗初期尽早咨询外科医生","维持可靠静脉通路以持续进行血液动力学支持和给药"],"notes":["约20-40%肠气肿患者药物治疗无法控制需手术；手术患者中20-50%死亡","后期并发症：肠道狭窄（约25-35%）、短肠综合征、中心静脉导管相关并发症（败血症、血栓形成）、胆汁性黄疸","约16%明确NEC于诊断后72小时内伴细菌血症（多为革兰氏阴性菌），需手术和死亡风险更高","最有效预防策略为使用人乳（母乳或捐赠母乳）；避免抑制胃酸药物、高渗肠内液体及新生儿早期长期抗生素","需要手术的早产NEC患儿生长和神经发育不良后果风险更高"],"emergency":["肠道穿孔（气腹）——手术唯一绝对指征","病情持续恶化、固定肠袢、腹壁红斑提示需剖腹探查","伴细菌血症者需手术干预和死亡风险更高"],"pinyin":"huaisixingxiaochangjiechangyan"},{"name":"新生儿呼吸窘迫综合征（NRDS）","category":"儿科-新生儿","summary":"呼吸窘迫综合征（RDS）主要发生于早产儿，发病率与胎龄和出生体重成反比（<28周60-80%，32-36周15-30%，>37周很少发病），由肺表面活性物质缺乏致肺泡表面张力升高、进行性肺不张、缺氧及通气-灌注失衡所致。预防关键是产前皮质类固醇（妊娠<37周），治疗核心为鼻持续正压通气（nCPAP）+外源性表面活性物质替代及必要的机械通气，目标维持PaO2 50-70 mmHg、SpO2 91-95%；死亡率已降至约10%。","symptoms":["症状通常出生后几分钟内出现；较大早产儿可数小时后出现呼吸急促变浅并伴发绀","典型表现：呼吸急促、明显的呼气性呻吟、肋间和肋下凹陷、鼻翼扩张及发绀","呼吸音正常或减弱，带粗糙管状音；深吸气时可闻细微爆裂音","未经治疗时发绀和呼吸困难进行性加重，血压下降、发绀和苍白加剧、呻吟减少或消失","呼吸暂停和不规则呼吸是需要立即干预的危险信号","未经治疗可发展为呼吸-代谢性酸中毒伴缺氧，进而呼吸衰竭和多系统器官功能障碍","症状多在3天内达高峰后逐渐好转（自发性利尿、低FiO2下血气改善或呼吸机支持降低）"],"diagnosis":["临床病程、胸部X光片结果及血气值共同确定临床诊断","胸片特征（非特异）：肺容积降低、实质弥漫性细网状颗粒状结构（“玻璃样外观”）及气支气管征；初次X光可正常，典型表现第一天出现","血气：初始低氧血症，后进展为进行性低氧血症、高碳酸血症及不同程度的代谢性酸中毒","早发败血症（尤其GBS肺炎）与RDS难以区分：母亲GBS携带且缺乏分娩期间抗生素预防、母亲发热（>38.5℃）或绒毛膜羊膜炎、胎膜破裂>18小时提示感染可能","对表面活性物质替代治疗无反应的婴儿行彩色多普勒超声心动图，排除发绀型先天性心脏病（尤其完全性肺静脉异位引流）、确定动脉导管通畅及评估肺血管阻力","罕见遗传病可致RDS：表面活性蛋白B/C基因、ABCA3基因异常，先天性肺泡蛋白沉积症（足月及近足月严重致命）；非典型病例可行气管抽吸物卵磷脂:鞘磷脂比例和磷脂酰甘油测定","鉴别诊断：新生儿暂时性呼吸急促（TTN，病程短而轻、通常不需吸氧）、PPHN、胎粪/羊水吸入综合征、自发性气胸、胸腔积液、先天性异常（膈疝、肺叶气肿等）"],"infusion":[],"oral_medication":[],"treatment":["治疗基本缺陷是肺部O2-CO2交换不足；在建立并维持肺容量的前提下提供基础支持性护理（体温调节、循环、液体、电解质和呼吸）","氧疗：温度适宜、湿度适宜的氧气，维持动脉PaO2 50-70 mmHg（91-95%饱和度），降低氧毒性风险","nCPAP（5-8 cm H2O）：严重呼吸窘迫（明显凹陷和呼气呻吟）或FiO2≥40%仍无法维持SpO2>90%时使用；对高风险早产儿产房早期nCPAP稳定是理想治疗方式，可减少机械通气需求","表面活性物质替代治疗：nCPAP无法维持氧合（吸入40%氧气仍SpO2<90%）或需插管机械通气者气管内给药；满足临床标准立即给予（延迟预后更差）；每次间隔6-12小时，共2-4次；INSURE/MIST（Lisa，细喂食管微创给药）减少气管插管及支气管肺发育不良风险","机械通气指征：动脉血pH<7.20、PaCO2≥60 mmHg、40%氧浓度+nCPAP下SaO2<90%、持续或严重呼吸暂停；目标PaO2 50-70 mmHg、PaCO2 45-65 mmHg、pH 7.20-7.35；潮气量4-6 mL/kg、初始频率约40次/分、PEEP 4-6 cm H2O","容积目标通气可能是常规通气中最保护肺功能的方法；高频通气（HFV）用于传统通气无效者及严重RDS、间质性气肿、反复气胸、胎粪吸入性肺炎","允许性高碳酸血症：耐受相对较高PaCO2（>60-70 mmHg）限制呼吸机相关肺损伤；推荐氧饱和度目标91-95%（低目标85-89%增加死亡率）","经验性抗生素：因难与GBS或其他细菌感染区分，血培养结果前使用青霉素或氨苄西林+氨基糖苷类（依当地细菌敏感性）","产前皮质类固醇（倍他米松/地塞米松）：妊娠<37周使用可显著降低RDS发病率和死亡率；妊娠24-34周早产推荐，34-36周未用者可用一次，距上次>14天且<34周可考虑重复；不推荐多次重复"],"management":["治疗最好在新生儿重症监护室（NICU）进行，由具有新生儿复苏和呼吸管理资质的人员实施","持续监测生命体征、复查胸部X光片及血气值；连续脉搏血氧仪评估氧合，脐/外周动脉导管监测血气参数和平均动脉血压","避免不必要或时机不当的早产（妊娠39周以下）剖宫产或引产；高危妊娠适当管理（产前皮质类固醇、产前孕酮、宫颈长度监测及宫颈环扎、抗生素/宫缩抑制剂/镁剂）","如无法避免早产，将母亲转至具备适当新生儿护理能力的医疗机构以改善早期治疗","拔管：nCPAP可防拔管后肺不张并减少再插管；NIPPV可进一步降低再插管需求（尤其联合NAVA）；足月及近足月儿拔管后HFNC（1-8 L/min）效果与nCPAP相当","产前和分娩过程中的胎儿监测可降低胎儿窒息风险（窒息增加RDS发生率和严重程度）"],"notes":["RDS发病率与胎龄和出生体重成反比：<28周60-80%，32-36周15-30%，>37周很少发病","风险增加因素：母亲糖尿病、多胎妊娠、剖宫产、急产、窒息、寒冷应激、既往婴儿患RDS病史","降低风险因素：慢性或妊娠相关高血压、母亲使用阿片类药物、羊膜破裂时间过长、产前使用皮质类固醇","表面活性物质替代治疗并发症：暂时性缺氧、高碳酸血症、心动过缓、低血压、气管插管堵塞及肺部出血","产前皮质类固醇+产后表面活性物质+改进通气使RDS死亡率降至约10%；胎龄越小死亡率越高","肺漏气（气胸、纵隔气肿、肺间质性肺气肿）见于3-9%极早早产儿；过高吸气压力（潮气量过大）为常见风险因素","RDS早产儿可发展为慢性肺病（支气管肺发育不良，BPD）","全身性皮质类固醇（主要地塞米松）滥用会增加脑瘫和神经发育障碍风险；吸入一氧化氮在早产儿RDS未显示显著效果","插管并发症：呼吸机相关性肺炎、人工气道暂时性阻塞、长期反复插管致声门下狭窄"],"emergency":["呼吸暂停和不规则呼吸是需要立即干预的危险信号","呼吸衰竭指征（需机械通气）：动脉血pH<7.20、PaCO2≥60 mmHg、40%氧浓度+nCPAP下SaO2<90%、持续或严重呼吸暂停","出生时即需复苏治疗者（分娩窒息或严重呼吸窘迫，尤其出生体重<1000g）需紧急处理","肺漏气（气胸、肺间质性气肿、纵隔气肿）需及时识别和处理","未经治疗发展为呼吸衰竭和多系统器官功能障碍者需NICU强化管理"],"pinyin":"xsehxjpzhz（"},{"name":"新生儿持续性肺动脉高压","category":"儿科-新生儿","summary":"主要发生于足月及过期产婴儿，因出生后肺血管阻力过高致胎儿循环模式（经动脉导管和卵圆孔右向左分流）持续存在，造成严重低氧血症，多继发于窒息、胎粪吸入综合征、败血症、膈疝等，也可为特发性。","symptoms":["通常在分娩过程中或出生后12小时内出现症状","严重发绀和呼吸窘迫；特发性或与多血症、低血糖、低体温、窒息相关者发绀明显","与胎粪吸入、B组链球菌肺炎、膈疝或肺发育不全相关者可见发绀、呻吟、呼吸急促、凹陷、心动过速和休克","心肌缺血、二尖瓣和三尖瓣反流、双心室功能障碍可致心源性休克","低氧血症不稳定且与胸部X光片结果不符（特发性及窒息相关者胸片多正常）"],"diagnosis":["所有出现发绀的足月婴儿都应怀疑PPHN，低氧血症对100%氧气治疗反应差","导管前（右桡动脉）与导管后（脐动脉）血样间PaO2或SaO2梯度提示经动脉导管右向左分流","超声心动图联合多普勒血流：室间隔收缩期变平、三尖瓣反流峰值速度定量右室收缩压、房间隔分流方向及速度、严重时右向左或双向分流","鉴别诊断：紫绀型心脏病、特发性肺静脉狭窄、先天性表面活性蛋白缺乏、肺动脉血栓形成、先天性肺腺发育障碍"],"infusion":["吸入一氧化氮（iNO）20ppm起始，可将ECMO需求减少约40%","强心剂：肾上腺素（常为首选）、多巴胺、米林诺酮（心肌收缩力减弱时）","氢化可的松（肾上腺功能不足时作为激素替代）","吸入或静脉前列腺素I2（改善氧合）、伊洛前列素（吸入）、曲前列尼尔（皮下/静脉）","前列腺素E1（PGE1，限制性动脉导管或右心衰竭时）","米力农（心肌功能下降时静脉用）"],"oral_medication":["西地那非（5型磷酸二酯酶抑制剂，安全性和有效性仍在研究中）","波生坦（口服，三线治疗，起效慢、吸收不可靠）"],"treatment":["纠正诱因（低血糖、红细胞增多症），给予氧疗并纠正酸中毒、低血压和高碳酸血症","持续低氧血症需插管和机械通气；采用正常或适度高二氧化碳的温和通气、避免低氧血症","通常不需要过度通气或碱化治疗","使用镇静剂；肌肉松弛剂仅适用于单靠镇静剂无法治疗者（可能增加死亡风险）","维持血压和血流常需强心剂治疗","iNO治疗：6-24小时后可逐渐过渡至5ppm，FIO2<0.6且iNO降至1ppm时缓慢减停，避免突然中断致反弹性肺动脉高压","ECMO：氧合指数>40且对iNO无反应（死亡率>80%）时应考虑"],"management":["减少噪音、光线和触觉刺激等非药物措施","通过超声引导的心脏功能评估选择合适的强心剂","避免多巴胺（增加外周血管阻力）","ECMO禁忌：已有颅内出血或高风险（体重<2kg、妊娠周数<34周）、不可逆肺病、全身出血、严重窒息或致命畸形、通气超过10天"],"notes":["总体存活率约90%（取决于基础疾病）","约25%长期存活者存在神经发育障碍和感音神经性耳聋","接受ECMO者超过80-90%存活，60-75%幸存者在1-3.5岁时表现正常","对iNO反应不佳者可能提示肺发育不全、先天性心脏病或先天性心脏缺陷","ECMO并发症包括血栓栓塞、空气栓塞、出血、中风、癫痫、肺不张、血小板减少、溶血、感染等","新生儿期长期依赖iNO罕见，iNO最大安全持续时间尚不清楚"],"emergency":["肺泡-动脉氧分差在8-12小时内超过600且氧合指数>40对iNO无反应者预后差（死亡率>80%），应考虑ECMO","5-10%患儿对100%氧气、机械通气及药物反应差，许多可通过ECMO改善"],"pinyin":"xinshengerchixuxingfeidongmaigaoya"},{"name":"新生儿溶血病","category":"儿科-新生儿","summary":"胎儿和新生儿溶血病（HDFN）指任何因母体抗体通过胎盘传递而引发同种免疫性溶血的胎儿或新生儿，临床上显著者多与ABO血型或Rh抗原不相容有关，抗RhD引起者最严重。","symptoms":["黄疸通常在出生后24小时内出现，高胆红素血症迅速进展","贫血轻重不一，从轻度溶血到严重贫血伴代偿性红细胞生成组织增生及肝脾肿大","严重溶血可致血小板减少、凝血障碍、心脏扩大、呼吸窘迫、水肿及循环衰竭，围产期血红蛋白可低至3-4g/dL","胎儿水肿（皮肤、胸膜、心包、胎盘、腹膜、羊水等两处以上异常液体积聚），可致宫内或出生后不久死亡","低血糖常见（抗RhD抗体刺激胰腺致胰岛细胞肥大和胰岛素分泌过多）","ABO不相容所致者症状较轻，多为出生第一天出现黄疸，水肿、严重贫血或肝脾肿大罕见"],"diagnosis":["确诊需证实母婴血型不兼容且母亲抗体能结合于婴儿红细胞","直接抗球蛋白试验（Coombs试验）：Rh病阳性，ABO病可阳性或阴性","网织红细胞计数升高，外周血涂片示有核红细胞、多色性红细胞和球形红细胞","产前：母亲抗RhD IgG滴度（≥1:16需密切监测胎儿贫血）、胎儿基因分型（母血分离胎儿细胞或无细胞胎儿DNA）、大脑中动脉多普勒超声峰值流速预测胎儿贫血、经皮脐血采样评估血红蛋白","监测血清胆红素（按小时龄）及血清白蛋白水平"],"infusion":["静脉注射免疫球蛋白：每次0.5-1.0克/千克，间隔12小时重复给药，用于同种免疫性溶血病所致高胆红素血症（胆红素接近换血阈值、光疗无效时）","红细胞输注（严重贫血，小剂量输注部分纠正，大量输血可能加重心脏衰竭）","双体积交换输血（间接胆红素迅速升高，尤其超过20mg/dL时）"],"oral_medication":[],"treatment":["光疗是标准一线治疗","强化光疗无效且Coombs阳性持续溶血时给予静脉注射免疫球蛋白","胆红素快速升高或达换血阈值时行换血治疗（核黄疸症状体征是明确指征）","产前：Rh免疫球蛋白预防致敏（Rh阴性母亲妊娠28周、32周及Rh阳性婴儿分娩后72小时内）、宫内输血、必要时提前分娩","迟发性贫血可予铁补充剂或促红细胞生成素，必要时多次红细胞输注直至自身造血恢复"],"management":["存在HDFN风险的妊娠由母胎专科医生管理，自妊娠16-24周起监测","分娩由熟悉婴儿产前情况的熟练新生儿复苏团队负责","出院后门诊监测血液和网织红细胞计数（在专业血液科医生监督下）","对ABO溶血病新生儿进行门诊监测（溶血可持续数周直至母体抗体清除）"],"notes":["RhD同种免疫是最严重形式，占Rh抗原相关溶血病的90%；严重程度通常随后续妊娠恶化","极高未结合胆红素增加胆红素脑病（核黄疸）风险，合并缺氧或酸中毒时更严重","迟发性贫血可于出生4-6周后出现（持续溶血或低再生性贫血）","换血治疗后可出现门静脉血栓形成和门静脉高压（多见于脐静脉导管留置过久、创伤或败血症者）","严重水肿胎儿即便干预仍有脑瘫、发育迟缓和耳聋风险，需儿科血液科密切随访","2周龄后仍持续溶血性贫血或球形红细胞症者应考虑遗传性球形红细胞增多症等其他诊断"],"emergency":["胎儿水肿（常致宫内或出生后不久严重并发症或死亡）","严重溶血性贫血致心血管系统迅速恶化时需紧急干预","胆红素脑病（核黄疸）症状和体征是换血治疗明确指征"],"pinyin":"xinshengerrongxuebing"},{"name":"新生儿窒息（缺氧缺血性脑病HIE）","category":"儿科-新生儿","summary":"缺氧缺血性脑病是全球新生儿脑损伤、发病率和死亡率的主要原因之一，发达国家发生率为1-8/1000活产，发展中国家高达26/1000；20-30%的HIE婴儿在新生儿期死亡，存活者33-50%留下永久性神经发育障碍。核心治疗为出生后6小时内开始、持续72小时的亚低温治疗（核心温度维持33.5℃），可降低18个月时的死亡率和严重神经发育障碍；诊断依靠Sarnat分级、MRI（3-5天扩散加权序列）及EEG/aEEG监测。","symptoms":["出生时羊水中含胎粪提示胎儿窘迫；出生时面色苍白、发绀、呼吸暂停、心率缓慢、对刺激无反应","出生后数小时内出现低张力，或由低张力转为高张力，或肌张力看似正常","出生后24小时内可出现脑水肿致脑干功能严重受损，伴癫痫发作，可对常规抗惊厥药物无效","Sarnat分期：轻度=过度警觉、对最小刺激有反应、肌张力正常、预后好；中度=嗜睡、局灶或广泛低张力或高张力、惊厥常见；重度=木僵或昏迷、去脑姿势、肌张力松软或僵硬","高达80%受影响新生儿出现全身器官功能障碍：心肌功能障碍和心源性休克、持续性肺动脉高压、呼吸窘迫综合征、胃肠道穿孔、急性肾脏和肝脏损伤","HIE相关癫痫发作也可由血管事件（出血、动脉缺血性卒中、静脉窦血栓）、代谢紊乱（低钙血症、低血糖）、CNS感染及脑发育缺陷或遗传病引起"],"diagnosis":["MRI是检测新生儿缺氧性脑损伤最敏感的成像方式；疑似事件后3-5天的扩散加权序列最有效","严重HIE的MRI表现为丘脑、内囊后肢和海马体等中央区域受损，最严重者累及整个大脑皮层","出生后24小时内行磁共振波谱（MRS）可准确评估损伤严重程度；第一天乳酸/肌酸比率升高预示不良神经学预后，乳酸正常预示预后良好","CT仅用于排除局部出血性病变或大动脉缺血性中风（难以发现细微损伤且辐射暴露显著）；超声用于排除出血或脑积水，是评估早产儿的首选","多通道EEG（带视频）是监测新生儿大脑功能的金标准，建议至少监测24小时；低温治疗婴儿72小时最佳；无癫痫发作也建议24小时记录","aEEG作为多通道EEG替代：正常电压5-10 μV，异常电压为下边界<5 μV且上边界>10 μV","脑电图不良预后特征：第1天即重度异常（连续低电压、平坦波形、爆发抑制）、任何一天优势间歇期>20秒、等电曲线、第12天后仍有轻度或更重抑郁","不良预测因素：10分钟Apgar 0-3、产房需CPR、自主呼吸延迟≥20分钟、惊厥发作≤12小时或难治、EEG爆发抑制约7天、MRI基底节/丘脑显著病变、少尿/无尿>24小时、神经检查异常≥14天"],"infusion":["苯巴比妥（HIE相关惊厥）：静脉注射20 mg/kg负荷，必要时追加5-10 mg/kg至总量40-50 mg/kg；静注后24小时内监测血药水平并开始维持5 mg/kg/24h，理想治疗水平20-40 μg/mL","二线抗惊厥：左乙拉西坦（药代动力学提示负荷剂量可能接近60 mg/kg，因新生儿体水分高分布容积大）、苯妥英（20 mg/kg负荷）或劳拉西泮（0.1 mg/kg）","其他二/三线药物：咪达唑仑、托吡酯、利多卡因；难治性惊厥且脑电图严重异常者试用吡哆醇"],"oral_medication":[],"treatment":["治疗性低温（亚低温）疗法：出生后6小时内开始，通过头部或全身冷却，伺服控制将核心直肠/食道温度维持在33.5℃，持续72小时，可降低18个月时死亡率和严重神经发育障碍","全身低温可能比选择性头部冷却更均匀地冷却大脑和CNS结构；基础临床试验排除了<35-36周、体重<1800g及严重先天性畸形婴儿","预防高热：高热与神经发育障碍有关，尤其在初次复苏与开始降温之间的时间段","支持性护理：密切关注通气、血氧饱和度、血压、血流动力学状态、酸碱平衡及可能感染；必须防止HIE并发症引起的继发性缺氧或低血压","积极治疗癫痫发作，可能需要持续EEG监测；癫痫持续状态、多灶性发作及低温期间需多种抗惊厥药提示不良预后","避免高氧血症、低碳酸血症和低血糖（均与不良预后相关），仔细管理复苏过程、通气及血糖稳态","对出生后6小时外开始低温、或更深度/更长时间冷却的研究：>6h开始低温疗效轻微且非决定性，深/长冷却短期结果未证实改善，不应使用"],"management":["对HIE患儿的器官系统功能障碍行支持性护理，并监测各系统恢复情况","早期多通道EEG或aEEG与MRI联合用于预测预后：EEG基线特征（波形、电压、反应性、状态变化）及MRI指标（损伤位置、扩散度、MRS代谢物比例）","低温治疗获益在18-22个月评估并持续至儿童期，需进行神经发育随访","即使无肉眼可见癫痫发作，也建议24小时多通道EEG记录以评估脑损伤演变与恢复","诱发低温并发症监测：血小板减少（通常无出血）、心率减慢、皮下脂肪坏死（可伴高钙血症）、过冷及寒冷损伤综合征"],"notes":["20-30%的HIE婴儿在新生儿期死亡，存活者33-50%遗留永久性神经发育障碍（脑瘫、智商下降、学习/认知受损）","胎儿酸中毒严重（pH<6.7）或基础氧不足>25 mmol/L者死亡率达72%","出生1小时内脐血或血液pH<6.7者18个月时90%死亡或严重神经发育障碍风险","10分钟Apgar每降低1分，死亡或残疾风险增加45%；10分钟Apgar 0-2的HIE婴儿76-82%死亡或严重残疾","20分钟大时无自主呼吸、2周大时神经症状仍异常预示死亡或严重认知/运动缺陷","严重基底节/丘脑损伤伴内囊后肢异常信号预示最差认知和运动预后；正常MRI和EEG提示预后良好","亚低温并发症包括血小板减少、心率减慢、皮下脂肪坏死、过冷；理论上可改变药物代谢、延长QT间期并影响血气结果，但临床实践中少见","即使积极治疗（包括低温），最高风险婴儿仍可能死亡或严重残疾；中危婴儿可能从治疗获益"],"emergency":["中重度HIE婴儿应在出生后6小时内尽快启动亚低温治疗（治疗性低温窗口关键）","难治性癫痫发作或癫痫持续状态需积极抗惊厥治疗并考虑持续EEG监测","严重脑病（昏迷、呼吸暂停、无眼头反射、反复惊厥）预后不良，需NICU强化管理","出生后初期及降温前务必预防高热，避免加剧神经损伤","多器官功能障碍（心源性休克、持续性肺动脉高压、肾衰、DIC）需强化器官支持治疗"],"pinyin":"xsezx（qyqxxnbH"},{"name":"新生儿败血症","category":"儿科-新生儿","summary":"新生儿败血症为新生儿严重全身性感染；早发性败血症（早产儿0.5/1000、晚期早产儿1/1000，死亡率2-3%）最常见病原为B群链球菌（40-45%），其他包括大肠杆菌及其他革兰阴性杆菌、粪肠球菌、金黄色葡萄球菌和单核细胞增生李斯特菌。诊断依靠无菌部位培养（血液、脑脊液等）及炎症指标，不单独依赖实验室检测；早发败血症经验性治疗为氨苄西林+庆大霉素，晚发败血症为万古霉素或抗葡萄球菌青霉素+氨基糖苷类，建议症状出现1小时内开始抗生素以增加生存机会。","symptoms":["体温不稳定：<35℃或>38.5℃；发热或低体温可为唯一初期表现，但仅约50%感染新生儿体温>37.8℃","呼吸系统：呻吟、呼吸急促、鼻翼煽动、发绀、呼吸暂停及进行性呼吸衰竭；肺炎早期可仅表现为进食不良、嗜睡、易怒、发绀和整体病态感","心血管：心动过速常见但非特异，亦可心动过缓；灌注不良和低血压是更敏感的指标，但往往属晚期表现","全身表现：进食不良、嗜睡、易激惹；40%败血症新生儿需补充液体治疗，29%需血管加压素支持","局部感染表现：脐炎、蜂窝织炎、乳腺炎、皮下脓肿；脓疱提示葡萄球菌感染（脐周较大脓疱，需与HSV头皮小水疱区分）","瘀点及紫癜可为全身性或病毒感染表现；鲑鱼色小丘疹提示单核细胞增生李斯特菌感染","早发性肺炎（常与GBS相关）：出生后最初几小时或几天内迅速发展的循环衰竭和呼吸功能衰竭"],"diagnosis":["培养是金标准：血培养从两个部位各取>1 mL全血；脑脊液培养为细菌性脑膜炎金标准（临床可行时行腰椎穿刺）；尿液培养>72小时用于晚发败血症评估","脑脊液行革兰染色、常规培养、细胞计数及蛋白质/葡萄糖浓度测定","表面拭子、血液和脑脊液用于HSV培养或PCR检测","I/T比值≥0.2是中性粒细胞指标中预测新生儿败血症的最佳敏感指标；中性粒细胞减少比白细胞增多更佳预测因子","CRP、降钙素原和铁蛋白对严重细菌感染有合理敏感性和特异性；可定期监测CRP评估治疗反应，但2018年AAP早期败血症指南重申不应仅依靠实验室检测诊断","血小板减少见于细菌、真菌或病毒感染；可出现低钠血症、酸中毒及其他电解质异常；血清转氨酶升高提示HSV、肠道病毒或病毒感染","经胎龄<37周分娩、胎膜破裂≥18小时、产时体温≥38.0℃、GBS定植等产时风险因素辅助判断","48小时内适当采集的血培养无细菌生长则婴儿不太可能患有败血症"],"infusion":["早发败血症经验性治疗（足月或晚早产）：氨苄西林+庆大霉素（长期标准方案，覆盖GBS和大肠杆菌等）","疑似耐药大肠杆菌或出院后再次感染：氨苄西林+头孢噻肟（或头孢匹胺）替代庆大霉素","脑膜炎或高度怀疑革兰阴性重症：考虑第三代头孢菌素或碳青霉烯类","晚发败血症：万古霉素或抗葡萄球菌青霉素（萘夫西林、苯唑西林）+氨基糖苷类；革兰阳性覆盖应基于当地流行病学、MRSA定植、凝固酶阴性葡萄球菌风险及临床表现","怀疑HSV感染（结果回报前）：阿昔洛韦（采集表面拭子、血液和脑脊液行HSV培养/PCR后）","念珠菌全身感染高风险人群（中心静脉导管、曾用抗生素和类固醇的极早早产儿）及特定临床症状：经验性抗真菌治疗（两性霉素）","头孢曲松新生儿期通常不用（与静脉钙剂结合、竞争胆红素结合位点可致高胆红素血症；部分观点认为头孢菌素类死亡率高于氨苄西林+庆大霉素）","抗生素疗程：菌血症10天；GBS及无并发症脑膜炎14天；复杂感染延长至21-28天；新生儿肺炎通常7-14天且经非口服途径给药"],"oral_medication":[],"treatment":["无局部感染具体迹象时经验性治疗，基于发热、体温过低、无精打采、易怒或呼吸暂停等症状启动","抗生素选择覆盖GBS、革兰阴性菌、李斯特菌和肠球菌；因后两者对头孢菌素内在耐药，氨苄西林通常纳入经验性方案","建议症状出现1小时内开始使用抗生素，能增加患者生存机会","确定性治疗基于致病微生物识别及药敏，选择对该微生物活性最窄谱的抗生素","治疗持续时间取决于微生物种类与感染部位：培养证实败血症通常7-10天；脑膜炎、骨髓炎、化脓性关节炎等特定部位需更长疗程","48小时血培养阴性且临床状况良好者可考虑停用经验性抗生素；培养阴性但临床仍有全身炎症者应排查其他病因及潜在局部感染灶","IVIG在疑似或确诊败血症中无降低死亡证据（10项RCT不支持）；G-CSF/GM-CSF作为治疗或预防均无充分证据支持","分娩期间抗生素预防可显著减少GBS垂直传播（美国早期GBS感染率从1.7/1000降至0.25/1000），但不能降低晚发GBS疾病或其他非GBS病原感染","新生儿肺炎治疗：立即开始经验性广谱抗生素，氨苄西林+氨基糖苷类（庆大霉素）一线，脑膜炎风险或疑似耐药时改头孢曲松或美罗培南"],"management":["妊娠36周7天-37周6天对所有孕妇行阴道直肠GBS培养筛查，并采取选择性分娩期间抗生素预防策略（GBS预防通常用青霉素）","分娩期间发热的孕妇需使用广谱抗生素降低上行性感染风险","对绒毛膜羊膜炎孕妇积极抗生素治疗并迅速分娩，可降低新生儿早发败血症风险","CDC建议产前筛查：HIV（首次产检，高危者晚期复查）、梅毒血清学、HBsAg、沙眼衣原体、淋球菌、HCV抗体（高危者）等","新生儿护理强调脐带护理卫生，预防脐炎及其所致败血症","需要机械通气且呼吸窘迫进行性加重的婴儿行气管吸引培养评估"],"notes":["早发败血症发生率：早产儿0.5/1000、晚期早产儿1/1000；死亡率为2-3%","最常见病原为B群链球菌（40-45%），其他包括大肠杆菌及其他革兰阴性杆菌（10-15%）、粪肠球菌、金黄色葡萄球菌和单核细胞增生李斯特菌","约10%的大肠杆菌菌株同时对氨苄西林和庆大霉素耐药","感染风险因素：早产或生长受限、男性、母亲GBS感染、母亲发热、胎膜破裂>18小时","全血细胞计数对早发败血症诊断既不敏感也不特异，但明显中性粒细胞减少与风险增加相关","分娩期间抗生素减少早期GBS败血症病例，但革兰阴性菌（尤其大肠杆菌）感染发生率可能增加","发热可源于环境温度升高、保温箱故障、脱水、CNS疾病等非感染因素；单次体温升高很少与感染相关","疑似败血症的呼吸窘迫早产儿（尤其GBS肺炎）与RDS难以区分，应在血培养结果前给予经验性抗生素"],"emergency":["疑似败血症（发热、低体温、嗜睡、呼吸暂停、灌注不良、低血压）需急诊评估，并在症状出现1小时内开始抗生素","败血症休克（需液体复苏或血管加压素支持者）需紧急处理；40%败血症新生儿需补充液体，29%需血管加压素","进行性呼吸衰竭（尤其GBS相关早发性肺炎伴迅速循环衰竭）需紧急呼吸支持","脐炎伴腹壁蜂窝织炎或坏死性筋膜炎（金葡菌和革兰阴性菌常见）伴随败血症和高死亡率，需及时诊断和治疗","疑似脑膜炎（临床可行时）尽早行腰椎穿刺，脑脊液异常者按脑膜炎延长疗程"],"pinyin":"xsebxz"},{"name":"新生儿高胆红素血症（黄疸）","category":"儿科-新生儿","summary":"高胆红素血症是新生儿常见且多数为良性的问题，约60%足月儿和80%早产儿出生后第一周内出现黄疸；未结合（间接）胆红素升高可能具有神经毒性，最大风险是胆红素引起的神经功能障碍（核黄疸）。治疗目标为预防核黄疸，主要手段为光疗，效果不佳时采用换血疗法；22版采用2022年AAP修订指南（≥35周），按胎龄、小时龄及高胆红素血症神经毒性风险因素确定光疗阈值。","symptoms":["黄疸通常从头部蔓延至尾部（面部→腹部→脚底），皮肤黄疸程度约面部5 mg/dL、腹部中部15 mg/dL、脚底20 mg/dL，但临床检查无法可靠估计血清胆红素","间接胆红素沉积呈鲜黄色或橙色；梗阻性（直接胆红素）黄疸呈绿色或泥黄色","出生时或出生后24小时内出现黄疸视为病理性，需立即处理","生理性黄疸：第二或第三天显现，峰值2-4天（5-6 mg/dL），第五至七天降至<2 mg/dL","严重高胆红素血症婴儿可出现嗜睡和进食不良；若不治疗可发展为急性胆红素脑病（核黄疸）","核黄疸急性期：初期吸吮不良、嗜睡、肌张力低下、惊厥；进而伸肌张力过高、角弓反张、发热","母乳性黄疸：约2%足月母乳喂养儿第七天后未结合胆红素显著升高（10-30 mg/dL），2-3周达峰，可维持3-10周","母乳摄入不足型黄疸：出生后第一周内，乳汁分泌前摄入不足致脱水、排便减少、肠肝循环增加"],"diagnosis":["全面评估包括风险评估、直接/间接胆红素测定、血红蛋白、网织红细胞计数、血型检测、直接抗球蛋白试验（Coombs试验）及外周血涂片","出院前普遍筛查总血清胆红素或经皮胆红素；经皮值≥15 mg/dL、皮肤颜色深或已接受光疗时经皮准确性降低，应以总血清胆红素确认","按胎龄≥35周新生儿的每小时血清胆红素标准曲线图（第95/75/40百分位）判断风险分区","生理性黄疸诊断需排除病理性原因：黄疸出现于出生后24-36小时内、胆红素上升速度>5 mg/dL/24h、足月儿>12 mg/dL（无风险因素时）或早产儿>10-14 mg/dL、黄疸持续>10-14天、直接胆红素任何时间>2 mg/dL","溶血评估：血清胆红素迅速升高（>0.5 mg/dL/小时）、贫血、苍白、网织红细胞增多、肝脾肿大及阳性家族史","遗传因素：吉尔伯特综合征、克里格勒-纳贾尔综合征、G6PD缺乏症、丙酮酸激酶缺乏症、球形红细胞增多症、半乳糖血症等","出现核黄疸风险时需查间接胆红素水平、暴露持续时间、黄疸原因及婴儿健康状况（早产、窒息、败血症、脑膜炎、溶血者低胆红素也可能损伤）"],"infusion":[],"oral_medication":[],"treatment":["治疗目标：防止与间接反应性胆红素相关的神经毒性，同时避免造成不必要的伤害","光疗：胆红素在蓝色波长（420-470 nm）吸收最强；接近光疗阈值时采用最高强度（LED灯和/或光纤光疗毯增加暴露面积），深色皮肤不影响疗效","光疗阈值（2022 AAP指南，胎龄≥35周）：按胎龄（35至≥40周）和小时龄查图137.6（无神经毒性风险因素）或图137.7（有风险因素）；使用总血清胆红素，不从总胆红素中减去直接/结合胆红素","高胆红素血症神经毒性风险因素：胎龄<38周、白蛋白<3.0 g/dL、同种免疫性溶血病/G6PD缺乏或其他溶血病、败血症、过去24小时内显著临床不稳定","早产儿（按出生体重）最大间接胆红素阈值：<1000g 12-13、1000-1250g 12-14、1251-1499g 14-16、1500-1999g 16-20、2000-2500g 20-22 mg/dL；光疗通常从最大间接胆红素水平的50-70%开始","换血治疗：胆红素水平远超过光疗阈值、光疗未能降低最高胆红素水平或出现核黄疸症状时进行；光疗需6-12小时才见效，应在胆红素低于换血所需水平时开始","治疗潜在病因：败血症用抗生素、纠正酸中毒和脱水；母乳性黄疸继续母乳喂养，胆红素逐渐下降，光疗可能有助于改善","胆红素暴露时间越短越好；婴儿越不成熟核黄疸风险越大（出生第1天比第4天风险更高）"],"management":["出生后48小时前出院的新生儿应在出院后2-3天内随访；胎龄<38周者早期随访尤为重要，某些情况需24小时内随访","指导家长在24小时内哺乳8-12次，避免通过补充水或葡萄糖水补水补热（与较高胆红素水平相关）","家长应及早且频繁沟通婴儿皮肤颜色和行为活动的担忧，接受相关风险与神经毒性教育","整个新生儿期持续提供哺乳促进、教育、支持及随访服务","出院随访按图137.5算法：根据与光疗阈值的差值及出院时年龄/时间安排复查，差值小者延迟出院或测TSB并考虑光疗"],"notes":["核黄疸（胆红素脑病）主要发生于胆红素>20 mg/dL（更常见>25-30 mg/dL）的婴儿，90%之前身体健康且主要为母乳喂养的足月或近足月婴儿","核黄疸风险增加因素：早产、窒息、败血症、脑膜炎、脑室内出血、溶血，或药物（如磺胺异噁唑、莫沙洛尔）竞争白蛋白结合位点释放胆红素","神经毒性加重因素：低蛋白血症、酸中毒、低血糖、饥饿或低温导致游离脂肪酸升高","导致核黄疸的可预防原因：过早出院（<48h）未早期随访、首次黄疸未测胆红素、未识别溶血风险、视觉评估低估黄疸程度、黄疸明显仍延迟测血清或延迟光疗、未回应家长担忧","新生儿胆红素生成率6-8 mg/kg/24h（成人3-4）；足月儿间接胆红素出生后10-14天降至成人水平（1 mg/dL）","6-7%足月儿间接胆红素超过13 mg/dL，<3%超过15 mg/dL；无风险因素者很少超过12 mg/dL","早期且频繁喂养可降低血清胆红素水平；摄入不足、脱水、胎便排出延迟（肠肝循环）会增加水平","黄疸持续超过2周或伴白陶土色粪便、深色尿液提示胆道闭锁，需立即测定直接胆红素"],"emergency":["出生时或出生后24小时内出现的黄疸视为病理性，需立即处理（可能的诊断包括胎儿红细胞增多症、隐匿性出血、败血症或先天性疾病）","24小时前出现黄疸的婴儿需测定总胆红素和直接胆红素，若升高需评估溶血性或原发性肝脏疾病","严重高胆红素血症伴嗜睡、进食不良、呼吸暂停、莫罗反射消失、角弓反张、发热、高音调哭声等核黄疸征象需紧急处理并考虑换血","黄疸持续超过2周伴白陶土色粪便和深色尿液提示胆道闭锁，需立即进行诊断评估（测定直接胆红素）","第三天后一周内出现的黄疸可能提示细菌性败血症或尿路感染，需进一步评估"],"pinyin":"xsegdhsxz（hd）"},{"name":"儿童尿路感染","category":"儿科-泌尿","summary":"尿路感染（UTI）常见于各年龄段儿童，1岁以下最常见，主要由结肠细菌引起，大肠杆菌是主要病原体。分为肾盂肾炎和膀胱炎两种基本类型，急性肾盂肾炎可致肾实质损伤和肾脏瘢痕形成。","symptoms":["肾盂肾炎：腹部、背部或腰部疼痛；发热；不适；恶心；呕吐；偶有腹泻","幼儿发热可为唯一症状（体温≥39°C且持续超过48小时者需注意）","新生儿非特异性症状：进食不良、易怒、黄疸或体重下降","膀胱炎：排尿困难、急迫性尿意、尿频、耻骨上疼痛、尿失禁、可能恶臭的尿液（不引起高烧）","急性出血性膀胱炎：血尿（自限性，约持续4天）","肾脓肿/肾周脓肿：发热、腰部疼痛，可有肾脏肿块"],"diagnosis":["确诊：阳性尿分析提示感染（脓尿）+尿培养单一病原体≥50,000 CFU/mL（适当临床情况下≥10,000 CFU/mL即可）","脓尿定义：离心后每高倍视野≥5个白细胞、每mm3≥10个白细胞或试纸检测阳性","亚硝酸盐阳性支持诊断（需4小时将硝酸盐代谢为亚硝酸盐）","2-24个月未如厕儿童采用导尿管采集尿样；已如厕儿童中段尿；无菌密封袋仅限尿检和培养均阴性时","尿路感染概率≥2%时建议尿液检测（可参考在线尿路感染计算器）","诊断尿路感染时不需要影像学检查","发热性UTI：肾脏-膀胱超声初步筛查；超声异常、非典型症状或反复发作时行VCUG；DMSA扫描评估肾瘢痕","怀疑急性大叶性肾炎或肾脓肿时：超声筛查首选，CT更敏感特异","年龄<60天或临床表现异常婴儿开始抗生素前尽可能做血培养"],"infusion":["静脉抗生素：头孢曲松（≥1个月住院儿童，至培养结果后降阶梯）","氨苄西林联合庆大霉素或第三代头孢菌素（新生儿经验性治疗）","脱水、呕吐、无法饮水、感染严重或尿脓毒症的儿童采用静脉治疗","肾脓肿传统方案：10-14天静脉抗生素+2-4周口服抗生素","年龄<1个月疑似发热性UTI通常需住院静脉抗生素"],"oral_medication":["头孢氨苄（窄谱经验性首选，大肠杆菌对第一代头孢菌素耐药低）","头孢克肟等口服第三代头孢菌素（对第一代头孢高耐药地区）","复方磺胺甲噁唑（TMP-SMX，部分地区耐药性增加）","诺氟沙星（治疗膀胱炎，不常规用于发热性UTI，无法达肾脏组织显著浓度）","环丙沙星等氟喹诺酮（铜绿假单胞菌或耐药微生物，幼儿使用需谨慎，可能损害软骨）"],"treatment":["急性膀胱炎迅速治疗以防发展为肾盂肾炎；疗程3-5天","无并发症肾盂肾炎疗程7-10天","门诊口服抗生素可安全有效治疗多数UTI，包括年幼儿童","急性发热性UTI按肾盂肾炎治疗（膀胱炎与肾盂肾炎症状难以区分）","1-2个月婴儿可门诊管理（除非呕吐、脱水等需住院）","急性大叶性肾炎/肾脓肿治疗14-21天，部分需经皮或手术引流","选择经验性抗生素时应考虑当地抗菌素敏感性","开始抗生素后48-72小时内多数儿童临床改善"],"management":["反复UTI者识别诱发因素：肠道膀胱功能障碍、便秘、膀胱排空不完全","行为矫正+便秘治疗（可减少反复尿路感染）","发热性UTI影像学评估（超声、VCUG、DMSA）以识别VUR、后尿道瓣膜等解剖异常","治疗结束后通常不需常规再次尿培养","首次肾盂肾炎且尿路解剖正常者不推荐常规抗生素预防","神经源性膀胱、尿道阻塞、严重VUR、尿结石等可能从长期抗生素预防中获益"],"notes":["肾盂肾炎引起的慢性肾损伤主要后果为动脉高血压和终末期肾功能衰竭","肾脓肿10-20%病例导致肾脏功能丧失","不典型症状需进一步评估：抗生素48-72小时无改善、尿流减少、腹部或腰部/耻骨上肿块、败血症、肌酐升高","RIVUR研究：预防治疗使UTI复发率从30%降至15%，但肾瘢痕发生率相同且耐药菌感染增加","蔓越莓汁、益生菌预防效果证据不足","未割包皮男性发热UTI发生率最高（20%，比已割包皮高8倍）"],"emergency":["年龄<1个月疑似发热性UTI需住院并静脉抗生素","脱水、呕吐、无法饮水、严重感染或疑似尿脓毒症","败血症、菌血症（<60天婴儿最常见）","不典型症状：适当抗生素后48-72小时无改善、尿流减少、腹部/腰部/耻骨上肿块、肌酐升高","肾脓肿或肾周脓肿需经皮或手术引流"],"pinyin":"ertongniaoluganran"},{"name":"尿道下裂","category":"儿科-泌尿","summary":"尿道下裂是尿道开口位于阴茎体腹面的先天性缺陷，影响每200名男性新生儿中的1人，约65%为远端型。常伴包皮背侧发育不全（背侧包皮），近端型可伴阴茎弯曲症，约10%伴隐睾。","symptoms":["尿道开口位于阴茎体腹面，按位置分型：远端型（阴茎头型、冠状型、亚冠状型）、阴茎中部型、近端型","背侧包皮：包皮位于阴茎体两侧和背面，阴茎体腹面发育不足或缺失","阴茎弯曲症：勃起时阴茎出现腹侧弯曲（近端型多见）","约10%的尿道下裂男性存在隐睾；腹股沟疝常见","最严重病例阴囊呈双分状，偶伴阴茎阴囊移位","未经治疗并发症：尿流畸形（尿道向腹侧偏移或严重散开）、性功能障碍、不孕、罕见尿道狭窄"],"diagnosis":["体格检查明确尿道口位置及分型","中阴茎或近端尿道下裂伴隐睾者应进行核型分析（排除性发育障碍）","近端尿道下裂考虑排尿性膀胱尿道造影（5-10%存在扩张的前列腺窝）","鉴别诊断：性发育障碍（混合性性腺发育不全、部分雄激素不敏感症、真两性畸形、先天性肾上腺增生）","除非其他器官系统异常，上尿路异常发生率较低"],"infusion":[],"oral_medication":[],"treatment":["治疗应在新生儿期开始，避免进行包皮环切术（包皮大多用于手术修复）","理想手术年龄为6-12个月（全身麻醉风险与较大儿童相似、术后镇痛需求低）","最常见修复方法：管状化切开板修复术（利用来自包皮的血管化皮瓣覆盖尿道板）","近端尿道下裂可能需要两阶段修复","复杂病例使用口腔颊黏膜移植重建尿道","手术由具有儿科泌尿学专业培训且经验丰富的外科医生进行","阴茎弯曲症建议6-12个月大时于全身麻醉下手术修复"],"management":["随访并发症：尿道皮肤瘘、阴茎狭窄、排尿流异常、阴茎持续或反复弯曲、修复处裂开","并发症率与严重程度成正比：远端5%、中阴茎10%、近端40%"],"notes":["发病率似乎在上升，可能因宫内接触雌激素或抗雄激素类内分泌干扰化学物质（多氯联苯、植物雌激素）","所有阴茎中部及近端尿道下裂建议手术矫正；部分远端型无功能异常可不需要手术","10%的尿道下裂男性存在隐睾，腹股沟疝常见"],"emergency":[],"pinyin":"niaodaoxialie"},{"name":"急性肾小球肾炎","category":"儿科-肾脏","summary":"急性链球菌感染后肾小球肾炎（APSGN）是由某些致肾炎的A组β-溶血性链球菌感染引起的免疫复合物介导疾病，是急性肾炎综合征的典型病例，特征为突然出现肉眼血尿、水肿、高血压和肾功能障碍；5-12岁儿童最常见。","symptoms":["链球菌性咽炎后1-2周或链球菌性脓皮病后3-6周出现急性肾炎综合征","肉眼血尿（儿童最常见肾小球性肉眼血尿原因之一）、水肿（盐和水分滞留所致，<5%发展为肾病综合征）","高血压（约60%）和不同程度少尿","高血压脑病：视力模糊、严重头痛、精神状态改变、新发癫痫（须考虑）","心衰/肺水肿：呼吸窘迫、端坐呼吸、咳嗽","可有轻度正常色素性贫血（血液稀释和轻度溶血）；少数仅有亚临床疾病或初期无尿液异常","急性期通常在6-8周内缓解；蛋白尿和高血压4-6周内恢复，镜下血尿可持续1-2年"],"diagnosis":["尿分析显示红细胞（常伴红细胞管型）、蛋白尿和多形核白细胞","血清C3显著下降（>90%急性患者），发病后8-10周恢复正常；CH50常降低，C4正常或仅轻微降低","链球菌感染血清学证据：ASO滴度（咽部感染后升高，皮肤感染后很少升高）、抗脱氧核糖核酸酶B（皮肤感染最佳指标）、Streptozyme检测","临床诊断三要素：急性肾炎综合征+近期链球菌感染证据+低C3；链球菌血清学证据比感染史或急性期培养更敏感","肾活检指征：急性肾衰竭、肾病综合征、无链球菌感染证据或补体正常；或血尿、蛋白尿、肾功能下降和/或低C3持续>2个月","鉴别诊断：系统性红斑狼疮、心内膜炎、膜性增殖性肾小球肾炎、慢性肾小球肾炎急性发作、IgA肾病等（按图559.6算法）","严重神经系统症状者行脑MRI（T2显示可逆性后部脑病综合征）；心衰或呼吸窘迫者行胸部X光"],"infusion":[],"oral_medication":["降压药物：钙通道拮抗剂、血管扩张剂或血管紧张素转换酶抑制剂（ACEI）治疗高血压","青霉素全身抗生素10天（限制致肾病微生物传播，但不影响APSGN自然病程）","利尿剂用于钠和水潴留所致水肿"],"treatment":["支持治疗为主：治疗肾功能障碍和高血压的急性症状","钠和液体限制、利尿剂；高血压用钙通道拮抗剂、血管扩张剂或ACEI","青霉素10天全身抗生素治疗（限制传播，不影响自然病程）；与持续或慢性感染所致肾小球病变不同","急性肾衰竭可能需要透析治疗","严重持续高血压导致颅内出血风险时需积极控制血压"],"management":["急性肾小球肾炎患者的家属，尤其年幼儿童，视为高风险人群：行A组β-溶血性链球菌培养，阳性者治疗","家养宠物（尤其狗）可为链球菌携带者","急性期6-8周内缓解；需随访尿蛋白、血压（4-6周恢复）及镜下血尿（可持续1-2年）","早期全身抗生素治疗不能消除患肾小球肾炎的风险，需向家属说明"],"notes":["超过95%患儿完全康复，复发极为罕见","适当管理急性肾衰、心衰和高血压可避免急性期死亡；不到2%患儿发生肾小球硬化和慢性肾脏病","急性并发症：高血压（60%，其中10%伴高血压脑病）、心衰、高钾血症、高磷血症、低钙血症、酸中毒、癫痫、尿毒症","持续低补体血症提示慢性APSGN或其他疾病（如膜性增殖性肾小球肾炎）","APSGN也可由凝固酶阳/阴性葡萄球菌、肺炎链球菌及革兰氏阴性菌等其他感染引起（急性感染后肾小球肾炎）","发展中国家占全球97%病例；工业化国家发病率下降（卫生改善、链球菌性脓皮病几近根除）"],"emergency":["高血压脑病（视力模糊、严重头痛、精神状态改变、新发癫痫）：需紧急处理，脑部MRI排除可逆性后脑病综合征","心力衰竭和肺水肿（呼吸窘迫、端坐呼吸、咳嗽）需紧急治疗","急性肾衰竭（少尿、高钾血症、酸中毒）可能需要透析","严重且持续的高血压可能致颅内出血，需积极控制"],"pinyin":"jxsxqsy"},{"name":"肾病综合征","category":"儿科-肾脏","summary":"约90%儿童肾病综合征为特发性，微小病变型（MCNS）占85%，最常见于2-6岁（男:女=2:1）；以大量蛋白尿、低白蛋白血症、水肿、高脂血症为特征。皮质类固醇为主要治疗，约80-90%对激素有反应；治疗依据KDIGO 2021指南。","symptoms":["轻度水肿最初出现在眼周和下肢（眶周肿胀日间减轻，可误诊为过敏），逐渐扩散为全身性：腹水、胸腔积液、生殖器水肿","食欲不振、易怒、腹痛、腹泻","MCNS重要特征：不伴有高血压和肉眼血尿（即无'肾炎特征'）","最常见于2-6岁（男:女=2:1）；也可6个月起病或延至成年","初始发作及复发常由轻微感染诱发（上呼吸道或胃肠道感染），偶尔昆虫叮咬、蜜蜂蜇伤或毒葛接触","严重者血管内容量减少表现：血液浓缩、低血压、心动过速","并发症表现：蜂窝织炎、腹膜炎、菌血症、血栓栓塞"],"diagnosis":["尿分析：蛋白尿3+或4+（20%有镜下血尿）；晨尿蛋白/肌酐比值>2.0","血清白蛋白<2.5g/dL；血清胆固醇和甘油三酯升高","血清补体通常正常；肌酐通常正常（血管内容量收缩致肾灌注减少时可升高）","基线检查：尿常规及镜检、尿白蛋白或蛋白/肌酐比、24小时尿蛋白定量、血清电解质/白蛋白/总蛋白/肾功能/胆固醇","肾活检指征：<1岁或>12岁、持续肌酐升高、显著血尿或肉眼血尿、低补体血症、其他自身免疫病迹象、乙肝/丙肝/HIV/结核感染、高血压、糖皮质激素抵抗","1-12岁发病、无并发症（无严重血尿、持续性高血压、急性肾损伤、低C3、关节炎或皮疹）者可不活检直接开始类固醇治疗","激素治疗前必须排除结核（纯化蛋白衍生物皮肤试验或干扰素释放试验阴性）","疑肾小球肾炎时加查补体C3/C4、免疫球蛋白、ASO、抗DNase B、ANA、抗dsDNA、ANCA；基因检测指征（NS家族史、先天性NS、激素无效、持续肾功能障碍、已知综合征特征）"],"infusion":["严重全身性水肿伴血管内容量减少（血液浓缩、低血压、心动过速）：缓慢静脉注射25%白蛋白0.5-1.0g/kg，随后静脉呋塞米1-2mg/kg（仅在儿科肾病专家指导下并密切监测容量、血压、电解质、肾功能）","呋塞米口服或静脉利尿增加尿量（注意过度利尿可致血管内容量减少→急性肾衰和血栓风险）","自发性细菌性腹膜炎：静脉第三代头孢菌素（覆盖肺炎球菌和革兰氏阴性菌），有足够腹水者先穿刺行细胞计数、革兰氏染色和培养"],"oral_medication":["泼尼松或泼尼松龙：60mg/m²/天或2mg/kg/天（最高每日不超过60mg）持续4-6周，之后隔日40mg/m²或1.5mg/kg持续4-6周","环磷酰胺2mg/kg单次口服，总疗程8-12周（用于频繁复发和激素依赖者；每周监测白细胞，<5,000/mm³时停药）","环孢素或他克莫司：类固醇无效者的初始治疗（监测高血压、肾毒性、多毛症、牙龈增生）","霉酚酸酯：维持类固醇依赖或频繁复发者缓解","利妥昔单抗（抗CD20单抗）：类固醇依赖/难治者效果显著，随机试验示1年无药缓解率约80%","ACEI和ARB：辅助减少类固醇抵抗患者蛋白尿","长期激素（>12周）增加不良反应而不进一步改善疗效"],"treatment":["首发无并发症1-12岁患儿直接口服糖皮质激素（泼尼松/泼尼松龙），80-90%有反应（KDIGO 2021指南）","'反应'定义为激素治疗最初4周内缓解：连续3天尿白蛋白/肌酐<0.2或尿试纸<1+","复发治疗与初发相似，但每日泼尼松疗程缩短；隔日疗程根据复发频率调整","复发定义：连续3天尿蛋白/肌酐>2或尿试纸≥3+；按12个月内复发次数分少发/频发复发及激素依赖","类固醇抵抗（4周激素未缓解）：行肾活检+基因检测；多由FSGS（80%）、膜性肾病或MPGN引起","激素替代药物：环磷酰胺、钙调神经磷酸酶抑制剂（环孢素/他克莫司）、霉酚酸酯、利妥昔单抗（按图567.4分层选择）","对环孢素/他克莫司/霉酚酸酯有效的儿童停药后大多复发"],"management":["水肿：限钠（<1,500mg/天），伴低钠血症时限制水分；阴囊肿胀用枕头抬高利用重力引流","血脂异常：低脂饮食（膳食脂肪<30%热量、饱和脂肪<10%、胆固醇<300mg/天）；尚无充分数据支持儿童常规用他汀","感染：家庭宣教识别蜂窝织炎、腹膜炎、菌血症；疑似感染先血培养再经验性抗生素","血栓栓塞：临床怀疑者行影像学确诊；肝素、低分子肝素、华法林为有效抗凝治疗","疫苗接种：每年接种肺炎球菌疫苗（13价结合+23价多糖）和流感疫苗；泼尼松剂量低于每日1mg/kg或隔日2mg/kg时方可接种活疫苗","环磷酰胺或环孢素等免疫抑制者不宜接种活病毒疫苗；水痘暴露且服免疫抑制剂者可给水痘-带状疱疹免疫球蛋白；健康家庭成员接种活疫苗后3-6周内避免与患儿接触呼吸道/消化道分泌物","门诊治疗可行（轻中度水肿），但需家属教育识别并发症并学会尿试纸监测蛋白尿","肥胖与生长：激素治疗可增加BMI，建议预防性饮食指导；长期激素者采用减激素策略改善线性生长"],"notes":["激素敏感者反复复发但随年龄增长频率降低；激素敏感者很少进展为慢性肾脏病，疾病很少遗传，无长期环磷酰胺治疗者生育力保留","类固醇抵抗者（多由FSGS引起）预后差，进行性肾功能不全最终需透析或肾移植；FSGS移植受者30-50%复发","类固醇抵抗者诊断后5年内未缓解，终末期肾病风险增加50%","过度利尿可致血管内容量减少→急性肾衰和血栓；快速输注白蛋白可致容量过载（高血压、心衰、肺水肿）","MCNS超过95%对皮质类固醇有反应；FSGS仅20%对泼尼松有反应","儿童缓解期应视为正常儿童参与适龄活动和无限制饮食，减轻心理影响","微小病变型肾病可发生于病毒感染和过敏原刺激之后，也与霍奇金淋巴瘤和T细胞淋巴瘤相关"],"emergency":["严重症状性水肿（大量胸腔积液、腹水、严重生殖器水肿）需住院治疗","血管内容量减少征象（血液浓缩、低血压、心动过速）需住院并在肾病专家指导下处理（白蛋白+利尿剂）","疑似严重感染（蜂窝织炎、腹膜炎、菌血症）：血培养后立即经验性抗生素（第三代头孢菌素覆盖肺炎球菌和革兰氏阴性菌）","血栓栓塞事件需及时影像学确认和抗凝治疗","静脉输注白蛋白时警惕高血压、心力衰竭和肺水肿等容量过载并发症"],"pinyin":"sbzhz"},{"name":"膀胱输尿管反流","category":"儿科-泌尿","summary":"膀胱输尿管反流（VUR）指尿液从膀胱逆向流回输尿管和肾脏，影响1-2%的儿童，通常为先天性且常有家族遗传性。VUR增加肾盂肾炎风险，可导致反流相关肾损伤或反流性肾病，严重程度采用国际反流研究分类法分为I-V级。","symptoms":["多在评估尿路感染时发现（80%为女性，平均诊断年龄2-3岁）","发热性尿路感染，或仅发热，或伴腹痛、排尿困难","产前超声肾积水时发现（此人群80%为男性，VUR程度通常更重）","约50%的反流患者同时患有膀胱-肠道功能障碍（便秘）","严重肾脏瘢痕可致肾素介导的高血压、肾功能不全或终末期肾病"],"diagnosis":["确诊需膀胱导管插入术行排尿性膀胱尿道造影（VCUG）或放射性核素膀胱造影","VUR分级基于对比剂VCUG表现，采用国际反流研究分类I-V级","低剂量辐射VCUG提供详细解剖信息；放射性核素膀胱造影辐射暴露低，适合随访","评估上尿路：肾脏超声和/或肾脏闪烁扫描（DMSA）判断肾瘢痕及尿路异常","评估膀胱-肠道功能障碍（尿急、尿频、昼夜失禁、排尿次数少）","诊断后测量并监测身高、体重、血压；有肾瘢痕者查血清肌酐","评估尿液是否存在感染和蛋白尿","有VUR患者兄弟姐妹：超声显示皮质异常、肾脏大小不对称或发热性UTI史者建议VCUG筛查"],"infusion":[],"oral_medication":["抗生素预防（III-IV级VUR、合并BBD或监测中发生发热性UTI者等高风险儿童）","抗胆碱能药物（合并膀胱过度活动症者，偶尔使用）","膀胱造影前口服或鼻用咪达唑仑（镇静和防止记忆丧失）或丙泊酚"],"treatment":["治疗目的：预防肾盂肾炎、与VUR相关的肾脏损伤及其他并发症","观察+行为调整（适用于I-II级VUR及持续反流但肾脏正常的较大儿童）：白天定时排尿、确保定期排便、增加液体摄入、定期评估膀胱排空、及时诊断治疗UTI","抗菌预防（AUA建议：1岁以下患儿、合并膀胱肠道功能障碍患儿、监测中出现发热性UTI患儿）","手术：开放输尿管再植入术（成功率>95-98%）、腹腔镜或机器人辅助再植入术、内镜输尿管口下方注射填充剂（Dx-HA，成功率约70-80%）","反流肾脏功能不佳者行肾切除术或肾输尿管切除术","合并膀胱过度活动症者：定时排尿、治疗便秘、偶尔使用抗胆碱能药物"],"management":["测量并监测身高、体重和血压","评估尿液感染和蛋白尿；有肾瘢痕者监测血清肌酐","BBD评估与治疗（定时排尿、治疗便秘）","随访VCUG或放射性核素膀胱造影评估VUR缓解情况","对无症状兄弟姐妹可选择性进行超声或VCUG筛查"],"notes":["低级别VUR缓解率高：I-II级缓解可能性相似；III级年轻诊断+单侧缓解率高；双侧IV级缓解可能性远低于单侧；V级很少缓解","VUR缓解的平均年龄为6岁","BBD和III-V级VUR是反复发热性尿路感染及新发肾脏瘢痕的最常见风险因素","开放式输尿管再植入术对I-IV级原发性VUR成功率超过95-98%","内镜注射成功率约70-80%，VUR复发几率约10-20%","反流性肾病曾是儿童及年轻成人终末期肾病的15-20%，现已不常见，但仍为儿童高血压常见原因","抗生素预防可降低复发率，但增加耐药细菌风险且不减少肾瘢痕（RIVUR研究）"],"emergency":["高级别VUR伴发热性尿路感染：急性或复发性肾盂肾炎及新发肾脏瘢痕风险高","后尿道瓣膜、神经源性膀胱、非神经源性神经源性膀胱等高压力VUR可致严重肾脏损害","巨膀胱-巨输尿管综合征严重上尿路受累时需考虑输尿管再植术"],"pinyin":"pangguangshuniaoguanfanliu"},{"name":"隐睾症","category":"儿科-泌尿","summary":"隐睾症是男性中最常见的先天性泌尿生殖系统疾病，出生时约4.5%男性存在隐睾（早产儿30%，足月儿3.4%），前3个月内多达50%自行下降，6个月时降至1.5%。潜在后果包括睾丸发育不良、不孕、睾丸恶性肿瘤、相关疝气和隐睾扭转。","symptoms":["阴囊内无法触及睾丸，分型：不可触及型、可窥见型、腹股沟型、可滑动型、异位型","多数未降睾丸可在腹股沟管远端、耻骨结节处触及","双侧睾丸无法触及且为表型男性新生儿，应怀疑性发育障碍（如先天性肾上腺增生女性化男孩）","一侧阴囊发育不全（提示隐睾）","对侧睾丸肥大提示睾丸缺失","隐睾患者腹股沟疼痛或肿胀应怀疑腹股沟疝或隐睾扭转"],"diagnosis":["体格检查（放松青蛙腿姿势），使用肥皂测试减少摩擦帮助触诊","双侧不可触及或伴中阴茎/近端尿道下裂者行核型分析（排除性发育障碍）","超声检查很少改变临床处理（无法识别腹部或萎缩睾丸）；仅对肥胖且睾丸无法触及者有助于手术规划","CT辐射暴露大、MRI常需镇静，且影像学不100%准确，不建议常规使用","无法触及睾丸者在麻醉下重新检查，仍不可触及则行诊断性腹腔镜检查","鉴别可回缩睾丸（可轻松推入阴囊，每6-12个月体检监测）"],"infusion":[],"oral_medication":[],"treatment":["6个月（按胎龄调整）时仍未下降的先天性隐睾，应在接下来12个月内进行手术治疗","睾丸固定术：腹股沟切口、移动睾丸和精索、矫正间接腹股沟疝，门诊进行，成功率高达98%","前阴囊睾丸固定术（睾丸靠近阴囊者）：经阴囊大切口完成，手术时间更短、术后不适较少","腹腔内睾丸可经腹腔镜处理，复杂或萎缩者考虑两阶段睾丸固定术或睾丸切除术","年龄较大儿童和青少年可植入睾丸假体（FDA批准生理盐水植入物或实心硅胶植入物）","无睾症（双睾丸缺失）建议儿童早期植入睾丸假体"],"management":["可回缩睾丸者每6-12个月体检监测（可能发展为后天性未降睾丸，需睾丸固定术）","青少年应接受睾丸自我检查指导","随访生育能力：单侧隐睾治疗后85%保持生育能力，双侧睾丸固定术后仅50-65%"],"notes":["未降睾丸发生生殖细胞恶性肿瘤的风险是普通人群的4倍（单侧约1/80，双侧约1/40-50）","10岁前进行睾丸固定术可降低睾丸肿瘤发生率；2岁前手术发生率更低","青少年或成人未降睾丸最常见肿瘤是精原细胞瘤（65%）","1岁以上的可回缩睾丸男性中，多达三分之一发展为需睾丸固定术的后天性未降睾丸（<7岁诊断者风险最高）","先天性未降睾丸通常伴随间接腹股沟疝，但很少出现症状"],"emergency":["隐睾导致睾丸扭转和梗死（未降睾丸活动度过大所致）：腹股沟疼痛或肿胀需急诊评估","双侧无法触及睾丸的新生儿需排查性发育障碍（如先天性肾上腺增生）"],"pinyin":"yingaozheng"},{"name":"儿童幽门螺杆菌感染","category":"儿科-消化","summary":"幽门螺杆菌是人类最常见细菌感染之一，为革兰氏阴性S形杆菌，可产脲酶；所有感染儿童均发展成组织学慢性活动性胃炎，但通常无症状。WHO将其归类为I类致癌物，长期携带显著增加十二指肠溃疡、胃癌（腺癌）和MALT淋巴瘤风险。检测到幽门螺杆菌即使无症状也应给予根除治疗，根除可治愈消化性溃疡病且复发风险极低。","symptoms":["多数感染儿童无症状（组织学慢性活动性胃炎）","可表现为腹痛或呕吐","较少见：难治性缺铁性贫血或生长迟缓","罕见：慢性自身免疫性血小板减少症","合并消化性溃疡时可出现呕血或黑便（高达一半患者）、上腹痛和恶心、进食困难、哭闹","胃外表现报道：贫血、特发性血小板减少性紫癜、身材矮小"],"diagnosis":["确诊靠组织活检样本中发现病原体；有症状的疑似患儿推荐初始上消化道内镜检查评估并确认","无论内镜表现如何（可正常/非特异性胃炎/结节/溃疡），始终从胃体和胃窦取样活检","13C-尿素呼气试验和粪便抗原检测为有效非侵入性方法（用于不需内镜者）","检测前2周停用质子泵抑制剂（可致假阴性）","不推荐在临床环境使用抗体检测（血清、全血、尿液、唾液）","根除疗效监测：停抗生素后4-6周、停PPI后至少2周，通过13C-尿素呼气试验或粪便抗原确认","内镜还可提供止血治疗机会（夹闭、注射、热凝固）"],"infusion":["疑似消化性溃疡出血者予高剂量静脉PPI以降低再出血风险；部分机构使用奥曲肽减少内脏血流和胃酸分泌","血流动力学稳定后行内镜确定出血源并止血（夹闭、注射稀释肾上腺素1:10000、加热探针）"],"oral_medication":["根除三联疗法（14天，PPI+2种抗生素）：阿莫西林+克拉霉素+PPI，或阿莫西林+甲硝唑+PPI，或克拉霉素+甲硝唑+PPI","PPI：1 mg/kg/次每日两次，疗程1个月","阿莫西林：15-24 kg给500 mg bid；25-34 kg给750 mg bid；>35 kg给1000 mg bid（14天）","克拉霉素：15-24 kg给250 mg bid；25-34 kg给500 mg（早）+250 mg（晚）；>35 kg给500 mg bid（14天）","甲硝唑：15-24 kg给250 mg bid；25-34 kg给500 mg（早）+250 mg（晚）；>35 kg给500 mg bid（14天）","耐药或补救：基于铋盐的四联疗法，或序贯治疗（前5天PPI+阿莫西林 bid，后5天PPI+克拉霉素+甲硝唑），或按年龄用左氧氟沙星、利福布汀或呋喃唑酮+阿莫西林+铋盐","抑酸治疗可选PPI或H2受体拮抗剂（法莫替丁1-2 mg/kg/d分两次；雷尼替丁/尼扎替丁2020年因NDMA撤市）"],"treatment":["检测到幽门螺杆菌即使无症状也应根除治疗","根除可治愈消化性溃疡病，复发风险极低","PPI联合克拉霉素、阿莫西林或甲硝唑2周治疗耐受良好且为推荐方案；三联疗法比双联治愈率更高","儿童根除率68-92%，溃疡愈合率91-100%","了解社区克拉霉素/甲硝唑耐药情况有助于选择初始或补救方案","根除失败者应接受补救治疗","特发性（H.pylori阴性）溃疡：单用抑酸治疗（PPI或H2RA），停用后复发率高，需密切监测、复发时重新抑酸"],"management":["治疗失败最常见原因是依从性差或细菌对抗生素耐药","5岁以下儿童可能再次感染","根除成功者须在停抗生素4-6周、停PPI至少2周后确认疗效","感染患者家庭成员（家族史）影响患病率，低社会经济地位为危险因素"],"notes":["WHO将幽门螺杆菌归类为I类致癌物；长期携带显著增加十二指肠溃疡、胃癌和MALT淋巴瘤风险","感染成年人患胃癌的相对风险是未感染者的2.3-8.7倍","传播方式最可能为粪口或口口途径，可从粪便或呕吐物培养出活菌","治疗失败最常见原因是依从性差或细菌耐药（克拉霉素/甲硝唑耐药性增加）","有报道与婴儿死亡相关，但尚无证据表明其在发病机制中起作用","继发性消化性溃疡还可见于NSAIDs、应激（库欣/柯林溃疡）、巨细胞病毒、单纯疱疹、克罗恩病等"],"emergency":["消化性溃疡出血：监测脉搏、血压和血细胞比容，生理盐水复苏，明显贫血时红细胞输注","需血型鉴定和交叉配型，插入大口径导管补液或输血，鼻胃管监测出血是否停止","急性上消化道出血予静脉PPI；成人保守输血阈值（<7 g/dL）可提高生存率并减少再出血","手术指征：无法控制的出血、穿孔和阻塞"],"pinyin":"etymlgjgr"},{"name":"儿童消化性溃疡病","category":"儿科-消化","summary":"胃和十二指肠中细胞保护因子与细胞毒性因子失衡导致的炎症结果，表现为不同程度的胃炎或明显溃疡；原发性溃疡多与幽门螺杆菌感染相关，继发性多与应激、NSAIDs等药物相关。","symptoms":["呕血或黑便（高达一半的消化性溃疡病患者出现）","学龄儿童和青少年：上腹疼痛及恶心","婴儿和年幼儿童：进食困难、呕吐、哭闹、呕血或黑便","较大儿童：消化不良、上腹疼痛或饱胀感、脐周定位不明确的腹痛","较大儿童夜间疼痛导致醒来；仅<33%儿童有典型溃疡疼痛史且服抗酸药后迅速缓解","严重并发症：急性腹痛（穿孔）、休克、贫血、腹膜炎、胰腺炎或胃出口阻塞"],"diagnosis":["食管胃十二指肠镜检查为确诊首选方法，须从食管、胃和十二指肠取活检并检测幽门螺杆菌","幽门螺杆菌检测：组织活检、13C-尿素呼气试验、粪便抗原检测（检测前2周应停止PPI以防假阴性）","特发性溃疡：无NSAID使用史、幽门螺杆菌阴性的消化性溃疡占儿科病例15-20%","需排除功能性胃肠病（肠易激综合征、非溃疡性/功能性消化不良）","需考虑克罗恩病、巨细胞病毒、佐林格-埃利森综合征等罕见原因"],"infusion":["疑似溃疡出血者使用高剂量静脉质子泵抑制剂（泮托拉唑、埃索美拉唑为美国唯一静脉制剂）","奥曲肽（部分机构用于减少内脏血流和胃酸分泌）","生理盐水复苏（血管内容量不足者）；明显贫血时红细胞输注","内镜下止血：夹闭、注射稀释肾上腺素1:100,000、热凝固（加热探针）"],"oral_medication":["质子泵抑制剂（一线）：奥美拉唑1.0-3.3mg/kg/天、兰索拉唑0.8-4mg/kg/天、雷贝拉唑、泮托拉唑、埃索美拉唑等","H2受体拮抗剂：法莫替丁1-2mg/kg/天（分两次）；雷尼替丁、尼扎替丁已撤市","幽门螺杆菌根除（14天）：PPI（1mg/kg/次每日两次，疗程1个月）+阿莫西林（按体重500-1000mg每日两次）+克拉霉素或甲硝唑；铋剂四联疗法","细胞保护剂（存在黏膜损伤时作为辅助治疗）","特发性溃疡：单用抑酸治疗（PPI或H2受体拮抗剂）有效，停药后复发率高"],"treatment":["两个治疗目标：促进溃疡愈合和消除病因","抑制胃酸：PPI促进溃疡愈合效果优于H2受体拮抗剂，餐前服用效果最佳","根除幽门螺杆菌（双联或三联14天，儿童根除率68-92%）可治愈消化性溃疡且复发风险极低","活动性出血或可见血管的溃疡采用内镜下止血（夹闭、注射、热凝固）","手术指征（现已极罕见）：无法控制的出血、穿孔和阻塞","高剂量静脉PPI方案：先80mg单次剂量，随后8mg/小时持续输注3天，或每日40mg口服2-4次"],"management":["急性出血管理：持续监测脉搏、血压和血细胞比容，确保血液动力学稳定","鼻胃管监测出血是否停止","血液动力学稳定后进行内镜检查确定出血源并治疗","根除治疗结束后4-6周（停抗生素）及停PPI至少2周后，通过13C-尿素呼气试验或粪便抗原确认疗效","特发性溃疡需密切监测，症状复发重新开始抑酸治疗"],"notes":["雷尼替丁和尼扎替丁因不可接受的N-亚硝基二甲胺（NDMA）含量于2020年4月撤出市场","预防性使用PPI可能增加呼吸机相关肺炎和艰难梭菌相关疾病风险","幽门螺杆菌被WHO归类为I类致癌物，感染者患胃癌相对风险为无感染者的2.3-8.7倍","感染幽门螺杆菌的儿童即使无症状也应给予根除治疗","治疗失败最常见原因是依从性差或细菌对抗生素耐药（克拉霉素、甲硝唑耐药率上升）","保守输血阈值（<7g/dL血红蛋白）在成人中可提高生存率并减少再出血"],"emergency":["活动性消化道出血（呕血、黑便）、失血性休克→急诊内镜及高剂量静脉PPI","穿孔（急性腹痛）、腹膜炎、急性胃出口阻塞需外科评估","血液动力学不稳定者在液体复苏后仍持续失血需紧急处理"],"pinyin":"ertongxiaohuaxingkuiyangbing"},{"name":"克罗恩病","category":"儿科-消化","summary":"特发性慢性透壁性炎症性肠病，可累及从口腔到肛门消化道任何部位，炎症通常呈偏心性且与正常组织区域间隔分布，儿童以回肠结肠受累最常见。","symptoms":["腹痛（小肠型最常见右下腹疼痛伴梗阻症状）或腹泻、出血、腹痛（结肠型）","发热、不适、容易疲劳等系统症状比溃疡性结肠炎更常见","生长迟缓、骨骼成熟延迟及性发育延迟，可早于其他症状1-2年（88%青春期前患者出现身高增长速度下降）","肛周病变常见：瘘管、深裂口、脓肿、肛周皮赘","肠外表现：口腔阿弗他溃疡、外周关节炎、结节性红斑、指端杵状、巩膜外层炎、静脉血栓、肾结石","狭窄所致部分小肠阻塞：餐后腹痛、肠鸣、间歇性腹部膨胀"],"diagnosis":["食管胃十二指肠镜检查及回结肠镜检查（阿弗他溃疡、线性溃疡、结节状病变、狭窄；非结块性肉芽肿是最典型组织学特征）","小肠影像评估：上消化道造影+小肠随访、CT/MR肠成像、小肠超声（MR/超声无电离辐射，CT/MR可评估腹腔内脓肿）","粪便钙卫蛋白和乳铁蛋白是更敏感且特异的肠道炎症标志物，通常升高","全血细胞计数常示贫血伴铁缺乏、血小板增多；ESR/CRP常升高；低白蛋白提示小肠炎症或蛋白质丢失性肠病","有狭窄性疾病时不宜行视频胶囊内镜检查","需排除感染（耶尔森菌、结核）、乳糜泻、淋巴瘤等"],"infusion":["英夫利昔单抗（抗TNF-α嵌合单抗，静脉输注，最初3次间隔6周，之后每8周维持）","乌司奴单抗（IL-12/IL-23单抗，初始静脉负荷后每8周皮下维持）","瑞桑奇珠单抗（抗IL-23A单抗，用于诱导和维持）"],"oral_medication":["美沙拉嗪50-100mg/kg/天（最大3-4g），远端结肠炎症用直肠给药","甲硝唑5mg/kg/次每日三次（最高250mg/次），肛周疾病一线治疗","泼尼松1-2mg/kg/天（最大40-60mg），用于急性加重期并尽快减量","布地奈德（轻度至中度回肠/回盲部疾病，成人剂量每日9mg）","硫唑嘌呤2.0-2.5mg/kg/天或6-巯基嘌呤1-1.5mg/kg/天（类固醇依赖或反应不佳者）","甲氨蝶呤（每周一次，皮下或口服，成人15mg/m²每周25mg）+叶酸，给药前可用昂丹司琼预防恶心"],"treatment":["治疗目的：缓解症状、预防并发症（贫血、生长障碍）、防止复发、减少皮质类固醇使用并尽可能实现黏膜愈合","逐步升级或由下到上治疗策略（中重度早期使用更强效药物，儿科证明可改善缓解和生长）","exclusive肠内营养（全部热量由配方奶提供）：临床症状改善与泼尼松相似，黏膜愈合优于类固醇","生物制剂：英夫利昔单抗（改善生长、治疗肛周瘘管、预防术后复发）、阿达利姆单抗等","手术仅限特定情况：对药物无反应的局部病变、肠穿孔、症状性纤维性狭窄、难控出血；狭窄成形术可保留肠道长度","肛周脓肿通常需引流；腹腔/肝脓肿可经皮导管引流+静脉抗生素"],"management":["心理社会支持：社会支持、个体心理辅导、持续的疾病教育","长期营养不良及频繁使用高剂量皮质类固醇者监测骨量减少（双能X射线吸收测定法），补充维生素D和钙、负重运动","生长障碍者持续夜间鼻胃管喂养有效（并发症风险远低于肠外营养）","术后常使用美沙拉嗪、甲硝唑、硫唑嘌呤及英夫利昔单抗降低复发","长期克罗恩结肠炎患病8-10年后进行筛查性结肠镜检查"],"notes":["肠切除术后复发率高（5年内超过50%），每次手术后再次手术风险增加","克罗恩结肠炎患结肠癌风险与溃疡性结肠炎相当","使用英夫利昔单抗前应行纯化蛋白衍生物或γ干扰素检测评估结核病","TNF阻断剂增加感染风险（尤其结核）及淋巴瘤、白血病等恶性肿瘤风险","约70%患儿在诊断后第一年内需调整药物治疗方案","硫嘌呤相关副作用包括肝炎、胰腺炎、淋巴增生性疾病、感染及淋巴瘤风险增加"],"emergency":["肠穿孔、难以控制的出血、腹腔内/腹膜后脓肿、伴症状性部分小肠梗阻的纤维性狭窄→需手术处理","肠膀胱瘘（尿路感染、气尿、粪尿）等穿透性疾病需及时评估"],"pinyin":"keluoenbing"},{"name":"功能性便秘（儿童）","category":"儿科-消化","summary":"功能性便秘（特发性便秘或粪便滞留症）通常可通过病史和体格检查与器质性疾病区分，多在新生儿期之后起病，常存在有意识或无意识的粪便保留行为。罗马IV标准按年龄组定义诊断。治疗包括患者教育、行为干预、清除粪便嵌塞和长期软化粪便的维持治疗，目标是实现无痛排便。","symptoms":["每周排便次数≤2次","有大便滞留史（憋便行为：绷腿收缩臀部、抓家具、安静蹲角落等）","排便疼痛或困难史，大便坚硬、粗大甚至堵塞马桶","直肠内可触及较大粪便团块","如厕训练后每周至少1次失禁（粪便污染内裤，家长常误认为腹泻）","腹部或直肠疼痛、食欲下降可致生长迟缓","日间或夜间尿失禁、反复尿路感染","常伴肛裂、排便后粪便带血"],"diagnosis":["罗马IV标准（≤4岁，至少1个月，≥2条）：每周排便<2次、大便滞留史、排便疼痛/困难史、粗大粪便史、直肠内大粪便团块；如厕训练后加：每周≥1次失禁、可堵塞马桶的粗大粪便史","罗马IV标准（≥4岁发育年龄，≥2条且持续≥2个月，且不满足IBS）：每周如厕排便≤2次、每周≥1次失禁、潴留姿势/主动憋便史、排便疼痛或困难、直肠大粪便团块、粗大粪便史","体检：耻骨上区大量粪便，直肠检查见直肠穹隆扩张充满粪便（赫希施普龙病直肠为空）","体检无异常的儿童通常不需放射学检查","难治性便秘考虑排除：甲状腺功能减退、低钙血症、铅中毒、乳糜泻及神经肌肉胃肠疾病","必要时结肠传输研究、脊柱MRI、肛门直肠测压（排便时外括约肌异常收缩）、结肠运动检查、造影灌肠","新生儿48小时内未排胎便、出生第一个月起病的便秘需警惕赫希施普龙病"],"infusion":[],"oral_medication":["清除嵌塞：灌肠+缓泻剂（聚乙二醇、乳果糖、镁、矿物油）；番泻叶和比沙可啶等刺激性泻药也有帮助","维持治疗（长期）：聚乙二醇3350（MiraLAX，>1岁）0.7 g/kg/d","镁乳（>1月）1-3 mL/kg/d分1-2次；矿物油（>12月）1-3 mL/kg/d分1-2次；乳果糖/山梨醇（>1月）1-3 mL/kg/d分1-2次","短期治疗：番泻叶（Senokot）1-5岁早餐5 mL（1片），最大15 mL/d；5-15岁早餐2片，最大3片/d","推荐每日渗透性泻药而非刺激性泻药"],"treatment":["治疗包括患者教育、行为干预、缓解粪便堵塞和软化粪便","向护理人员解释污秽行为是正常感觉丧失而非故意，不应报复或惩罚","强调定期餐后如厕和均衡饮食的重要性，积极奖励健康排便习惯，避免权力斗争","初次体检发现嵌塞时：先灌肠清除，同时开始缓泻剂维持治疗","维持治疗持续至建立正常排便习惯且疼痛-排便关联消失","通常建议推迟如厕训练，直到症状缓解且孩子表现出兴趣或愿意开始","有行为/心理问题者由心理学家或行为管理专家进行行为疗法和/或生物反馈干预","药物无效时新方法：神经刺激（经皮或骶骨植入）、盆腔物理治疗；严重病例可考虑直肠肉毒杆菌素注射、造口术等手术"],"management":["护理人员教育：污秽行为因感觉丧失而非故意，避免惩罚，积极奖励健康排便","定期餐后如厕、均衡饮食","对压力与焦虑为主要诱因者：放松训练、压力缓解、自信训练及一般压力管理，行为健康专家参与","注意维持治疗依从性，依从性下降时需更积极干预"],"notes":["功能性便秘通常在新生儿期之后开始，与赫希施普龙病（出生即发病）不同","粪便滞留可致昼夜尿失禁、尿潴留、尿路感染、巨膀胱，极罕见情况下发生毒性巨结肠","强制性或过早如厕训练、进入托儿所/学校、同胞出生等急性事件可诱发","便秘性失禁儿童因体臭可致学业表现不佳和出勤率下降","需与赫希施普龙病鉴别：后者出生即发病、罕见失禁、直肠空、肛门直肠测压内括约肌不松弛、活检无神经节细胞且AChE染色阳性","引起便秘的急性事件常为饮食变化（转配方奶、加泥状/固体食物）或社会压力因素"],"emergency":["警示特征（提示需进一步检查/转诊）：足月新生儿胎便排出>48小时、出生第一个月开始便秘、家族性赫希施普龙病病史、无肛裂但便血、生长迟缓、胆汁性呕吐、严重腹部膨胀","其他警示：甲状腺异常或新生儿筛查异常、肛门位置异常、缺乏肛门或提睾反射、下肢力量/张力/反射减弱、骶骨凹陷、下脊柱毛发丛、臀裂偏移、肛门疤痕"],"pinyin":"gnxbm（et）"},{"name":"婴儿肠绞痛","category":"儿科-消化","summary":"婴儿肠绞痛是一种正常的发育过程，表现为哭闹、易怒及难以安抚，发生于<5月龄婴儿，诱因无法确定。通常4-6周达高峰，约12周后自行缓解消失。治疗核心是照顾者支持、安慰与教育，益生菌系统综述未显示有益效果，应避免不必要的饮食调整和药物使用。","symptoms":["反复长时间哭泣、烦躁或易怒，无明显原因，护理无法预防或解决","症状开始和停止时婴儿年龄小于5个月","无婴儿生长迟缓、发热或疾病迹象","哭闹发作多在下午或晚上","伴随表现（非诊断依据）：面部表情异常、腹部膨胀、气体增多、皮肤发红、双腿蜷缩到腹部"],"diagnosis":["罗马IV诊断标准（表389.3）：症状开始和停止时婴儿<5个月；护理者报告反复长时间哭泣、烦躁或易怒且无明显原因，护理无法预防或解决；无生长迟缓、发热或疾病迹象","临床研究附加标准：护理者报告7天内≥3天每天哭泣或烦躁≥3小时；且通过至少1份持续24小时的行为日记确认总哭闹/烦躁≥3小时","与Fussing（间歇性痛苦发声）难以严格区分，婴儿常在哭泣和烦躁间交替"],"infusion":[],"oral_medication":["益生菌已被研究作为可能治疗方法，但系统综述未显示任何有益效果"],"treatment":["治疗方法多样，取决于照顾者状况：通过示范让照顾者了解轻轻摇晃或抱着婴儿可使其平静","记录哭闹和其他行为","确保照顾者得到休息和支持","为照顾者提供安慰、教育以及足够的应对能力和支持至关重要","避免不必要的饮食调整和药物使用（患儿常被误诊为胃食管反流、气体问题或过敏而接受治疗）","婴儿肠绞痛最终会自行缓解"],"management":["对照顾者的支持与教育是管理核心，强调其为正常发育过程、会自行缓解","建议记录哭闹日记和行为观察","鼓励照顾者轮流休息、寻求家庭支持"],"notes":["婴儿肠绞痛是正常发育过程而非疾病","约在4-6周达到高峰，约12周后完全消失","常导致不必要的饮食调整和药物使用（误诊为GER、气体问题或过敏）","无法确定诱因，会给照顾者带来很大压力","常促使家长就医怀疑腹痛问题，需儿科/小儿胃肠病评估","益生菌经系统综述未显示有益效果"],"emergency":["诊断前提是无生长迟缓、发热或疾病迹象；若存在这些表现需评估其他疾病","若哭闹同时出现发热、生长迟缓、频繁喷射性呕吐、便血或腹胀明显，需及时就医排除器质性疾病"],"pinyin":"yecjt"},{"name":"婴儿胃食管反流","category":"儿科-消化","summary":"胃食管反流是胃内容物通过下食管括约肌进入食管的生理现象，婴儿期4个月达高峰，88%在12个月消失、几乎所有在24个月消失。当出现不适症状、食管炎相关症状或食管外症状（呼吸道、营养、生长迟缓）时转变为病理性胃食管反流病（GERD）。治疗以保守疗法和生活方式调整为基础，药物治疗适用于有症状的婴儿和儿童。","symptoms":["反流（尤其餐后）是最常见表现，多数婴儿症状12-24个月内自行缓解","食管炎症状：易怒、弓背、呛咳、进食厌恶，可致生长迟缓","拒食/进食障碍/厌食、持续呃逆、呕吐","异常姿势/颈部扭曲（Sandifer综合征）","呼吸道症状：咳嗽、喘息、声音嘶哑、喉软化、喘鸣、阻塞性呼吸暂停或喘鸣","中耳炎、鼻窦炎、淋巴组织增生、声带结节、喉部水肿","较大儿童：烧心、胸痛、上腹痛、吞咽困难；牙齿侵蚀","呕血、贫血、黑便（食管炎出血）"],"diagnosis":["多数典型症状的较大儿童，详细病史和体格检查即可诊断","问卷（婴儿胃食管反流问卷I-GERQ及其衍生版I-GERQ-R）可简化和规范病史采集并定量评分","警惕警示症状（提示其他疾病）：呕吐/频繁喷射性呕吐、胃肠道出血、嗜睡、器官肿大、腹部膨胀、吞咽困难、囟门膨隆、癫痫发作等","钡剂造影用于评估贲门失弛缓、食管狭窄、食管裂孔疝及胃出口/肠道梗阻（敏感性特异性低）","食管远端pH监测已非诊断必需，用于评估酸抑制效果、结合肺通气图/阻抗评估呼吸暂停及非典型症状","内镜诊断糜烂性食管炎、狭窄、Barrett食管；活检诊断组织学反流性食管炎并排除过敏和感染","多通道腔内阻抗可记录酸性（pH<4）、弱酸性（pH 4-7）和弱碱性（pH>7）反流，对呼吸症状患者重要","较大儿童可行高剂量PPI限时试验的实证抗反流治疗，无效或需长期治疗者应正式诊断评估"],"infusion":[],"oral_medication":["抗酸药：中和酸迅速但短暂缓解，因腹泻（镁）和便秘（铝）副作用及长期严重副作用，不推荐长期规律使用","H2受体拮抗剂（西咪替丁、法莫替丁、尼扎替丁）治疗轻中度反流性食管炎有效；法莫替丁1-2 mg/kg/d分两次（雷尼替丁2020年因NDMA被FDA召回）","PPI（奥美拉唑、兰索拉唑、泮托拉唑、雷贝拉唑、埃索美拉唑）阻断氢钾ATP酶，治疗严重和糜烂性食管炎优于H2RA；儿童所需剂量高于成人","促动力药（甲氧氯普胺、贝他胆碱、红霉素）可增加LES压力或改善胃排空，但对照试验未显示对GERD显著疗效；甲氧氯普胺有FDA黑框警告（长期>3个月与迟发性运动障碍相关）","巴氯芬：中枢作用GABA激动剂，通过减少TLESR降低反流，对少数神经功能障碍儿童有效"],"treatment":["保守疗法和生活方式调整是GERD治疗基础，通过对家长教育和安抚有效实施","纠正异常喂养方式、喂养量及频率；食物浓缩（每盎司配方奶加1汤匙米/燕麦粥，30 kcal/oz）可减少反流次数、提高体重增长（早产儿慎用黄原胶浓缩剂，与NEC相关）","药物治疗前可进行2周低过敏性饮食试验排除牛奶或大豆蛋白过敏","调整喂养量、水解配方奶、正确体位、避免烟草烟雾可改善24-59% GERD患儿症状","体位调整：婴儿睡眠采用仰卧位（AAP及NASPGHAN推荐，降低SIDS风险）；清醒观察时可用俯卧位或直立抱持；避免坐姿、餐后平躺仰卧及半坐姿势（汽车座椅、婴儿背带）","较大儿童避免酸性/诱发食物（番茄、巧克力、薄荷）及饮料（果汁、碳酸/含咖啡因饮料、酒精）；肥胖者减重、避免烟草烟雾","较大儿童睡眠时左侧卧位和头部抬高可能有益，抬高床头而非使用过多枕头","PPI用于严重和糜烂性食管炎；但疑似婴儿GERD时PPI并不比安慰剂有明显优势（哭闹、弓背行为）","难治性病例手术（胃底折叠术）：顽固性食管炎/狭窄或慢性肺病高风险者；复发率高达14-20%，许多情况下倾向长期药物治疗","多次功能性手术失败的重症患者行全食管胃分离术"],"management":["对家长进行教育并安抚，强调生理性反流的良性性质，避免不必要的H2RA/PPI处方","神经功能障碍儿童风险更高，需较低临床阈值早期识别并及时治疗","非典型GERD（呼吸道/耳鼻喉症状）：治疗更强烈（常需PPI）且更长（至少3-6个月），需耳鼻喉科、肺科、胃肠科多学科协作","长期严重食管炎/生长迟缓时可能需要肠内（鼻胃/鼻空肠/经皮胃或空肠）或肠外喂养","Barrett食管需定期活检监测和积极药物治疗，进展性病变行胃底折叠术"],"notes":["生理性反流高峰3-4个月，多数婴儿12-24个月内自行缓解；88%在12个月消失，几乎所有在24个月消失","超过一半的儿童GERD症状不会完全消失，呈慢性、时好时坏","症状性婴儿中使用PPI与安慰剂相比无明显优势（系统评价），且多数RCT未证实严重副作用","雷尼替丁2020年因含潜在致癌物NDMA被FDA召回；西沙必利因心脏副作用（QT延长、心律失常）仅限有限获取","约12%有GERD症状的儿童患侵蚀性食管炎；男孩、较大儿童、神经受损儿童、严重慢性肺病及食管裂孔疝者更易患病","长期严重食管炎可致狭窄、Barrett食管（食管腺癌前兆）；儿童Barrett食管少见（患病率约0.12%）","多数出现呼吸暂停/BRUE的婴儿GERD并非其病因；由反流引起的呼吸暂停多为喉痉挛致阻塞性呼吸暂停","胃底折叠术长期失败率高（尼森式复发率高达14%，松束式高达20%），需权衡相对风险和收益"],"emergency":["警示症状需排除其他严重疾病：频繁喷射性呕吐、胃肠道出血、嗜睡、器官肿大、腹部膨胀、吞咽困难、囟门膨隆、癫痫发作","阻塞性呼吸暂停、BRUE（短暂不明原因事件）伴近期进食后及仰卧/屈曲坐姿时需评估反流相关性（多为喉痉挛致阻塞性呼吸暂停）","呕血、黑便、贫血提示食管炎出血，需内镜评估","进食厌恶、摄入不足致生长迟缓时需要营养支持评估"],"pinyin":"yewsgfl"},{"name":"小儿腹泻病（急性感染性腹泻）","category":"儿科-消化","summary":"急性胃肠炎（AGE）占所有感染性腹泻病例的绝大部分，常见症状为腹泻和呕吐，可伴腹痛和发热，2019年致约50万5岁以下儿童死亡，为全球5岁以下儿童死亡第三大原因。轮状病毒是全球最常见病因，美国在引入轮状病毒疫苗后诺如病毒成为主要病因。治疗核心为口服补液（低渗ORS）、继续喂养和锌补充，而非抗生素。","symptoms":["腹泻（每日≥3次异常稀或液态粪便），可伴呕吐、腹痛和发热","呕吐常先于腹泻出现（尤其轮状病毒：先呕吐、后水样无血便，可伴发热）","痢疾：频繁排出含血的小便，伴发热、里急后重和腹痛","细菌性腹泻线索：高热>40℃、明显便血、腹泻前无呕吐、每日排便>10次","脱水体征：毛细血管再充盈>2秒、皮肤弹性异常、呼吸深快（提示酸中毒）、黏膜干燥、无泪液","重度脱水：心动过速、意识水平改变、四肢冰冷，可伴低血压","原虫性腹泻：病程长（可达2周或更久），水样便可伴恶心、腹部绞痛和腹胀"],"diagnosis":["大多数病例无需实验室检测，重点评估脱水程度与电解质状况","粪便检查黏液、血液、中性粒细胞或粪便乳铁蛋白；未母乳喂养婴儿>5个白细胞/HPF提示细菌性病原体（STEC和阿米巴通常阴性）","粪便培养限于：具有细菌性AGE特征、中重度病情、免疫力低下、疑似HUS爆发或高度可疑流行病学史者","所有血便样本接种E.coli 0157:H7培养基或检测志贺样毒素","需电解质检测：严重脱水、需静脉输液、频繁水样便但皮肤松软（提示高钠血症）、无法饮水、家庭补液不当","1岁以下不常规检测C.difficile（高比例无症状携带）；1-2岁排除其他原因后方检测；≥2岁持续或恶化腹泻且有风险因素/暴露史可检测","怀疑HUS时查全血细胞计数、外周血涂片、血清电解质及肾功能；3个月以下发热且/或便血婴儿做血培养"],"infusion":["重度脱水：20-30 mL/kg静脉等渗晶体液（如乳酸林格液或生理盐水），30-60分钟内推注，必要时重复直至灌注恢复，随后70 mL/kg于2.5-5小时输注（婴儿用较慢输注时间）","重度脱水的营养不良婴儿可给较小容量多次推注5-10 mL/kg（心脏输出代偿能力有限）","无法静脉输液时：经鼻胃管给予ORS 20 mL/kg/小时×6小时","静脉补液用于重度脱水或无法耐受口服液体的少数儿童，口服补液是首选方式"],"oral_medication":["低渗透压口服补液盐（WHO：钠75 mEq/L、氯64 mEq/L、钾20 mEq/L、葡萄糖75 mmol/L，总渗透压245 mOsm/L），可用于所有年龄及高/低钠血症（除水肿外）","部分脱水：ORS 75 mL/kg于3-4小时内；<2岁每次腹泻或呕吐补50-100 mL，≥2岁补100-200 mL","锌补充：6个月以上急性腹泻患儿口服锌10-14天（多数指南建议20 mg/天；5 mg/天、10 mg/天更易耐受且效果相同）","昂丹司琼口溶片（超说明书止吐）：8-15 kg给2 mg、16-30 kg给4 mg、>31 kg给8 mg，可减少呕吐利于口服补液","痢疾（志贺菌）：环丙沙星20 mg/kg/d PO bid×3天（最大1.5 g/d）；或阿奇霉素首日12 mg/kg，第2-4天6 mg/kg/日；或头孢曲松50-100 mg/kg/d IV或IM×3天","C.difficile：口服万古霉素或甲硝唑7-14天（甲硝唑7.5 mg/kg/次tid/qid×10天，最大500 mg/次）","洛哌丁胺在痢疾患者中禁用，对儿童急性水样腹泻可能无效"],"treatment":["管理基本原则：补充水分和维持电解质平衡，纠正脱水后继续母乳喂养并尽快给予适合年龄、无限制的食物","4-6小时内根据脱水程度及每日所需量纠正脱水；呕吐者可用滴管/茶匙/注射器从小量（5 mL）起始给予ORS","恢复饮食：重新引入复杂碳水化合物食物（大米、小麦、土豆、面包、谷物）、新鲜水果、瘦肉、酸奶和蔬菜，能量密度约1千卡/克，至少100千卡/kg/d和2-3 g/kg/d蛋白质","避免高脂肪或高简单糖食物（果汁、碳酸饮料）；除非乳糖吸收不良，否则不应稀释或更换为无乳糖配方奶","发展中国家儿童推荐锌补充（减少腹泻持续时间和严重程度，可降低46%全因死亡率）","抗生素仅用于：严重感染、预防高风险人群并发症或限制传播；大多数AGE在健康儿童中自限","STEC感染避免使用抗生素（可增加HUS风险并延长NTS排泄时间）","口服补液禁忌：休克、意识水平下降、肠梗阻、肠套叠、碳水化合物不耐受（罕见）、严重呕吐、大便排出量>10 mL/kg/小时"],"management":["无脱水（Plan A）：家庭给予液体和食物；部分脱水（Plan B）：ORS补液并继续母乳喂养","持续14天以上腹泻（持续性腹泻）：评估营养状况，补充维生素、矿物质2周，5天后随访","评估尿量（换尿布次数、末次排尿）、眼窝凹陷、活动水平、饮水情况及体重变化","预防：前6个月纯母乳喂养、轮状病毒口服减毒活疫苗（RotaTeq/Rotarix等）、补充维生素A、肥皂洗手、改善水和卫生设施","益生菌效果证据不一，不常规推荐所有病例（鼠李糖乳杆菌GG在轮状病毒腹泻可能更有效）"],"notes":["大部分病毒性AGE自限，几天内自行缓解；主要并发症为脱水及电解质/酸碱失衡","STEC感染5-10%发生HUS（儿童获得性肾衰竭最常见原因），多在腹泻开始后2-14天诊断；腹泻缓解2-3天无溶血则不大可能发生","HUS风险因素：6个月-4岁、血便、发热、白细胞升高、使用抗生素和止泻药","反复或长期腹泻与营养不良、发育迟缓、微量营养素缺乏及心理运动认知发育滞后有关","抗生素耐药性增加限制了使用；STEC用抗生素可能增加HUS风险","益生菌制剂（乳酸杆菌）两项大规模RCT未降低加拿大AGE儿童的临床严重程度评分","昂丹司琼可减少静脉输液需求和住院率；止吐药（吩噻嗪类）几乎无效且可致嗜睡、肌张力障碍和恶性高热"],"emergency":["重度脱水体征（嗜睡/昏迷、深陷眼窝、不能喝水或喝水差、皮肤皱褶回缩>2秒、脉搏微弱）需紧急静脉补液或按WHO Plan C处理并尽快转诊","心动过速、四肢冰冷伴低血压提示重度脱水","大便排出量过多（>10 mL/kg/小时）需静脉补液","持续14天以上的腹泻伴脱水（重度持续性腹泻）需先处理脱水并转诊","怀疑HUS（血便、发热、白细胞升高）需急诊血液和肾功能检查","3个月以下发热且/或粪便带血的婴儿需血培养评估侵袭性细菌感染"],"pinyin":"xefxb（jxgrxfx）"},{"name":"急性胰腺炎","category":"儿科-消化","summary":"儿童最常见的胰腺疾病，因胰蛋白酶原提前激活引发胰腺自消化；常见病因为钝性腹部损伤、多系统疾病、胆石症或微结石症及药物毒性。","symptoms":["中度至重度持续性上腹痛（上腹部或两侧上腹部），患儿采取屈髋屈膝、坐直或侧卧等缓解疼痛姿势","持续呕吐，可能伴发热","腹部膨胀且触痛，可触及肿块","严重者：休克、高烧、黄疸、腹水、低钙血症、胸腔积液","严重者可出现脐周蓝紫色（库伦征）或侧腹部变色（格雷-特纳征）"],"diagnosis":["诊断标准（三项中满足两项）：腹痛；血清淀粉酶和/或脂肪酶活性≥正常上限3倍；影像学显示符合急性胰腺炎的特征","血清脂肪酶为诊断首选指标（特异性高于淀粉酶），发病4-8小时开始升高、24-48小时达峰","CT：胰腺肿大、液体积聚、脓肿，坏死范围及增强显影缺失可预测严重程度","超声对胆石诊断比CT更敏感；MRCP/ERCP用于复发性及与胆道病变相关的胰腺炎","可伴血液浓缩、白细胞增多、高血糖、低钙血症、γ-谷氨酰转移酶升高及高胆红素血症"],"infusion":["静脉输液使用乳酸林格液，纠正低血容量（液体不足及毛细血管渗漏所致）","阿片类镇痛药物，以适当剂量给予缓解疼痛"],"oral_medication":["质子泵抑制剂（抑制胃酸分泌）","广谱抗生素（用于胰腺坏死区域感染的治疗；不推荐预防性使用）"],"treatment":["医疗管理目标：缓解疼痛（通常需阿片类药物）并恢复代谢平衡","恢复并保持液体、电解质和矿物质平衡；避免过量输液，剂量以改善生命体征和肾功能为调整目标","呕吐者鼻胃管吸痰有用；不呕吐者不应停止口服营养","早期进食可减少并发症发生率和住院时间，重症可经口服、鼻胃管或鼻空肠管肠内营养"],"management":["轻度急性胰腺炎最常见，通常发病后第一周内自行缓解，4-7天完全康复","轻度炎症性胰腺炎儿童预后良好，通常4-5天内康复","非创伤性炎症性胰腺炎很少需要手术治疗，必要时清除坏死组织或脓肿、引流液体积聚"],"notes":["儿童药物性胰腺炎最常见原因：丙戊酸、L-天冬酰胺酶、6-巯基嘌呤和硫唑嘌呤；青少年应考虑酒精因素","发病24小时内血清脂肪酶超过正常上限7倍可能预示病情严重","严重急性胰腺炎死亡率约20%，与全身炎症反应综合征、多器官功能障碍、休克、肾衰竭、ARDS等相关","初期10-15%患者血清淀粉酶水平正常；唾液淀粉酶升高可能误导诊断"],"emergency":["严重急性胰腺炎：胰腺衰竭伴其他器官（肺、心脏、肾）功能障碍持续超过48小时，需密切监护","出现休克、肾衰竭、急性呼吸窘迫综合征、弥散性血管内凝血、胃肠道出血等并发症时需紧急处理"],"pinyin":"jixingyixianyan"},{"name":"急性阑尾炎","category":"儿科-消化","summary":"儿童最常见的急性外科疾病，多由阑尾腔阻塞引发腔内压力增高、缺血、细菌繁殖与坏死直至穿孔，发病高峰在10-18岁，3岁以下极为罕见。","symptoms":["腹痛：早期脐周模糊绞痛，24小时内转移并固定于右下腹（经典描述）","恶心和呕吐（超过一半患者，多在腹痛出现几小时后）","厌食（典型症状，但偶尔患者仍感饥饿）","发热（通常低烧，除非穿孔）、心动过速","右下腹局部压痛、腹肌僵硬、反跳痛、Dunphy征（咳嗽诱发疼痛）","腰大肌征（回盲部位置）、闭孔肌征（盆腔位置）、右下腹可触及炎性肿块","腹泻和排尿症状（尤其阑尾位于盆腔时）"],"diagnosis":["病史+体格检查+实验室+风险评分：儿科阑尾炎评分（PAS）≤4提示可能性极低，≥8诊断高度敏感特异，4-7为不确定需进一步影像检查","阑尾超声为首选影像学：阑尾壁厚度>6mm、管腔扩张、壁不可压缩、靶征，敏感性和特异性约90%","CT为金标准：敏感性97%、特异性99%（超声无法观察阑尾或结果不确定时使用）","实验室：白细胞计数升高（11,000-16,000/mm³）伴左移；CRP与炎症程度成正比","尿液分析排除尿路感染/肾盂肾炎（阑尾炎时尿中无细菌）","MRI在超声结果不明确时可用于青少年女性（无电离辐射）"],"infusion":["广谱抗生素静脉：哌拉西林/他唑巴坦或等效药物（术前及非手术治疗阶段，单纯性持续2-3天至体温正常、能耐受饮食）","历史三联方案：氨苄西林+庆大霉素+克林霉素；头孢西丁也显示相当有效性","术前静脉输液纠正低血容量和电解质异常，退烧药控制体温"],"oral_medication":["出院后口服抗生素（穿孔性/非手术病例）：环丙沙星/甲硝唑或阿莫西林克拉维酸7-10天"],"treatment":["标准治疗：阑尾切除术（腹腔镜为首选），确诊后12-24小时内进行","非手术性单纯性阑尾炎（抗生素±经皮引流）选择标准：症状<48小时、年龄>7岁、影像确认为单纯非穿孔、阑尾直径<1.2cm、无阑尾结石/脓肿/蜂窝织炎、WBC 5000-18000/μL","穿孔性阑尾炎：抗生素+经皮引流初始非手术治疗（成功率>80%），失败则紧急阑尾切除术","间隔期阑尾切除术：非手术治疗后4-6周决策，权衡复发风险（5-20%）与麻醉及合并症风险","偶发阑尾结石无症状者观察随访，与家属个性化讨论择期切除术"],"management":["术前支持治疗：静脉补液纠正低血容量和电解质异常、退热、广谱抗生素，确保麻醉安全","观察单元策略：静脉输液+连续监测生命体征+计划复查，12-24小时观察期后决定出院或进一步处理","低风险患者可不做影像学出院，告知如24小时内无改善应返院复查","合理使用吗啡镇痛不影响诊断准确性或手术决策，应提供足够疼痛控制"],"notes":["3岁以下儿童穿孔率接近90%，婴儿常被误诊为败血症且多处于疾病晚期","诊断延迟超过48小时，发生穿孔的可能性很大（>65%）","无腹部手术史的儿童中小肠梗阻最常见原因是漏诊阑尾炎","青少年女性阑尾切除术阴性率高达30-40%，应更广泛使用超声/CT/MRI或诊断性腹腔镜","非手术治疗1年内复发率10-30%，晚期复发风险持续存在","儿童多系统炎症综合征（COVID-19相关）可表现为类似阑尾炎"],"emergency":["穿孔性阑尾炎、弥漫性腹膜炎、败血症及感染性休克征象（低血压、少尿、酸中毒、高热）→紧急阑尾切除术或经皮引流","生理复苏后需紧急控制严重腹腔内感染且介入放射经皮引流不可行者需紧急手术","阑尾结石伴腹痛确认阑尾炎时需立即手术咨询并行阑尾切除术"],"pinyin":"jixinglanweiyan"},{"name":"溃疡性结肠炎","category":"儿科-消化","summary":"特发性慢性炎症性肠病，主要累及结肠而不影响上消化道，通常始于直肠并向近端扩散，约50-80%儿科患者为广泛型结肠炎，以缓解与复发交替为特征。","symptoms":["腹泻时粪便中出现血液、黏液和脓液，以及腹痛（典型症状）","里急后重感、排便紧迫感、腹部绞痛（尤其排便时）、夜间排便","厌食、体重下降、生长迟缓","暴发性结肠炎：发热、严重贫血、低白蛋白血症、白细胞增多，连续5天每天超过5次便血","肠外表现较常见：坏疽性脓皮病、硬化性胆管炎、慢性活动性肝炎、强直性脊柱炎"],"diagnosis":["结肠镜+组织学检查确认（始于直肠，红斑、水肿、血管结构消失、黏膜颗粒化；典型组织学为隐窝炎、隐窝脓肿、隐窝分支状结构）","粪便培养排除肠道病原体、艰难梭菌、寄生虫，并做阿米巴血清学检查","粪便钙卫蛋白通常升高，比常规实验室指标更敏感且特异于胃肠道炎症","实验室可显示贫血、低白蛋白血症；ESR/CRP常升高（暴发性结肠炎中也可能正常）","症状出现少于2-3周且未排除感染前不应轻易诊断","疑似暴发性结肠炎时不进行结肠镜检查（有引发毒性巨结肠或穿孔的风险）"],"infusion":["重症结肠炎静脉注射皮质类固醇（可每日两次给药）","住院重症患者静脉类固醇治疗3-5天症状持续者考虑调整方案或手术"],"oral_medication":["美沙拉嗪（5-ASA）50-100mg/kg/天","柳氮磺胺吡啶30-100mg/kg/24小时（分2-4次，每日通常不超过2-4g）","巴沙唑2.25-6.75g/天","泼尼松1-2mg/kg/24小时（最大40-60mg），每日一次或重症分两次","硫唑嘌呤2.0-2.5mg/kg/天或6-巯基嘌呤1-1.5mg/kg/天（需超过6个月治疗者）","5-ASA灌肠剂或栓剂、氢化可的松灌肠剂（直肠炎）、布地奈德（轻度至中度）","甲硝唑或环丙沙星口服（回肠袋袋炎）；洛哌丁胺（术后改善排便频率）"],"treatment":["目前无治愈疗法，治疗旨在控制症状、降低复发风险并尽量减少类固醇使用","轻度至中度结肠炎首选5-ASA类（美沙拉嗪等），活动期治疗并预防复发，缓解期建议继续使用","中度至重度泛结肠炎或对5-ASA无反应者使用皮质类固醇（口服泼尼松，重症可静脉）","类固醇依赖或频繁使用者换用免疫调节剂（硫唑嘌呤、6-巯基嘌呤）","英夫利昔单抗、阿达利姆单抗等抗TNF生物制剂用于中重度疾病诱导与维持","结肠切除术适用于难治性疾病、并发症及对药物治疗无反应的急性重症疾病"],"management":["患病8-10年后开始每1-2年结肠镜检查及活检筛查结肠癌","心理社会支持：疾病教育与讨论、心理辅导、社会工作者或家庭咨询、患者互助小组","鼓励参与适合年龄的活动，病情加重期间减少活动量","全结肠切除+回肠袋肛管吻合术后需预防袋炎（口服甲硝唑或环丙沙星、益生菌）"],"notes":["患病8-10年后结肠癌风险开始上升，此后每年增加0.5-1%","约5%患者对5-ASA过敏（皮疹、发热和血便，与发作难以区分）","约25%重症患儿诊断后5年内需结肠切除术，轻度病例仅5%","脂溶性维生素（叶酸）缺乏在使用柳氮磺胺吡啶的儿童中可能加重（药物干扰叶酸吸收）","重症结肠炎肠管扩张（成人X光直径>6cm）提示可能为毒性巨结肠"],"emergency":["暴发性结肠炎：发热、严重贫血、低白蛋白血症、白细胞增多、连续5天每天>5次便血","疑似毒性巨结肠时禁止结肠镜检查及钡灌肠，需紧急评估手术可能"],"pinyin":"kuiyangxingjiechangyan"},{"name":"肠套叠","category":"儿科-消化","summary":"消化道一部分套入相邻肠段，是5个月至3岁儿童肠梗阻最常见原因，也是2岁以下儿童最常见的腹部急症，未经治疗可致肠道梗死、穿孔、腹膜炎甚至死亡。","symptoms":["突发严重阵发性绞痛，伴双腿和膝盖弯曲、用力挣扎及大声哭喊","疼痛发作间歇期孩子可能状态良好，未缓解则逐渐虚弱、昏昏欲睡","呕吐（早期次数多，后期呕吐物含胆汁）","葡萄汁状血便（60%婴儿粪便中可见红细胞和黏液）","香肠状腹部肿块（约30%以下患者，常位于右上腹）","阵发性疼痛+呕吐+可触及腹部肿块组合阳性预测值>90%，伴直肠出血时可达约100%"],"diagnosis":["腹部超声：纵向管状肿块、横向环形或靶形图像，敏感性约98-100%、特异性约98%","空气/生理盐水/水溶性对比剂灌肠：可见充盈缺损或杯状结构","腹部X光片可能显示肠套叠区域密度异常","需与胃肠炎、梅克尔憩室出血（无痛）、亨诺希-舍恩莱因紫癜、囊性纤维化远端肠梗阻综合征鉴别"],"infusion":[],"oral_medication":["皮质类固醇可减少复发病例的频率（但很少用于此目的）"],"treatment":["荧光镜或超声引导下放射学复位（空气/生理盐水），成功率约80-95%","肠套叠时间较长且出现休克、腹膜刺激、肠道穿孔或肠气肿者，不应尝试静水压复位","空气复位并发症更少、辐射暴露更低，穿孔率仅0.1-0.2%","难治性休克、疑似坏死或穿孔、腹膜炎、多次复发者行手术复位或肠切除+端对端吻合术","回肠末端型肠套叠常可自行缓解，必要时再次手术"],"management":["复位后观察复发：非手术复位复发率约10%，手术复位2-5%，手术切除后无再发","大多数复发发生在复位后72小时内","多次回肠结肠套叠复发者应怀疑存在病变点，考虑腹腔镜手术","单次复发通常可通过放射学手段复位"],"notes":["未经治疗的婴儿回肠结肠套叠通常导致死亡；24小时内复位大多数可康复，超过后尤其是第二天后死亡率迅速上升","空气复位穿孔率仅0.1-0.2%，钡剂或生理盐水复位为0.5-2.5%","约4-10%患者会自发缓解","轮状病毒疫苗接种后3周内肠套叠发病率略有上升（尤其是首次接种后，属罕见副作用）","2岁以上儿童出现明确病灶（梅克尔憩室、息肉、淋巴瘤等）的风险更高"],"emergency":["休克、腹膜刺激、肠道穿孔或肠气肿患者禁行静水压复位，需急诊处理","难治性休克、疑似肠道坏死或穿孔、腹膜炎→需手术复位"],"pinyin":"changtaodie"},{"name":"肥厚性幽门狭窄","category":"儿科-消化","summary":"婴儿期常见的幽门环形肌肥厚导致胃出口梗阻，在美国每1000名婴儿中2-5例，男性约为女性4倍，以进行性非胆汁性喷射性呕吐为特征。","symptoms":["非胆汁性喷射性呕吐，进食后立即出现，进行性加重，出生后3周左右开始","呕吐后婴儿仍饥饿、渴望再次进食","持续呕吐导致低氯性代谢性碱中毒","高胆红素血症（黄疸性幽门综合征），以非结合型为主","触诊幽门部位可及坚硬、可移动、约2cm的橄榄形肿块（左侧卧位最易触及）","进食后可见胃蠕动波在腹部移动"],"diagnosis":["临床诊断：左侧卧位触诊幽门橄榄形肿块（位于脐右侧中腹部、肝脏边缘下方，呕吐后最易触及）","超声诊断标准：幽门厚度3-4mm、整体幽门长度15-19mm、幽门直径10-14mm，敏感性约95%","上消化道造影：延长的幽门通道（弦状征）、幽门肌肉向胃窦膨出（肩状征）、双通道征","需与胃食管反流（自限性、无血液化学异常）、肾上腺生殖综合征（代谢性酸中毒）、先天性代谢缺陷鉴别"],"infusion":["静脉硫酸阿托品（幽门肌肉松弛剂，保守治疗选择，成功率约80%）","术前静脉输液纠正体液、电解质丢失及酸碱失衡"],"oral_medication":["口服硫酸阿托品（缺乏手术经验时使用，某些研究报道成功率约80%）"],"treatment":["手术治疗为主：幽门切开术（Ramstedt手术），腹腔镜式为当前首选","术前纠正体液和电解质丢失及酸碱平衡紊乱，纠正碱中毒对预防术后呼吸暂停非常重要","大多数婴儿可在24小时内成功恢复水分平衡","保守管理（经鼻十二指肠喂养）仅适用于不适合手术的特殊病例"],"management":["术后12-24小时内开始喂食，36-48小时内过渡到持续口服喂养","术后呕吐发生于一半婴儿，多为手术切口处幽门水肿所致","术后持续呕吐提示幽门切开术不完全者，可考虑内镜下球囊扩张术"],"notes":["手术效果良好，死亡率为0-0.5%","新生儿出生后前两周内使用大环内酯类抗生素（尤其红霉素）可能增加发病率","持续呕吐需考虑幽门切开术不完全、胃炎、胃食管反流病或其他梗阻原因","高结合型胆红素血症提示需调查其他病因（嗜酸性胃肠炎、食管裂孔疝、消化性溃疡等）"],"emergency":[],"pinyin":"feihouxingyoumenxiazhai"},{"name":"胆道闭锁","category":"儿科-消化","summary":"新生儿胆汁淤积的重要病因，也是全球儿童肝移植的主要适应症；以闭塞性胆管病导致胆管系统破坏为特征，若不治疗通常在2岁时出现终末期肝病。","symptoms":["出生后黄疸，婴儿一般状况良好","粪便无色或淡色（无色素粪便/陶土样便）","脂肪及脂溶性维生素的消化吸收受损","脾畸形型胆道闭锁综合征（约15%）可伴内脏转位、先天性心脏病、肠道畸形、多脾症等"],"diagnosis":["持续黄疸超过生命最初几周的婴儿应评估血清总胆红素和结合胆红素水平（结合胆红素升高）","腹部超声：胆囊无法被观察到或缩小、胆总管无法被观察到；三角形索状征为特异性但敏感性可能不足","肝活检特征性表现：胆管增生、胆管堵塞、门静脉基质水肿","术中胆管造影为诊断金标准（胆囊导管插入后造影剂无法填充肝内胆管或流入小肠）","血清生物标志物基质金属蛋白酶7（MMP7）为敏感且特异的标志物","需与肝内疾病（如阿利格尔综合征）鉴别，避免误诊"],"infusion":[],"oral_medication":[],"treatment":["Kasai肝肠吻合术（肝门空肠吻合术）：切除闭锁胆管、Roux-en-Y空肠吻合恢复胆汁流动，为公认手术方法","手术时机与预后密切相关，手术越早预后越好（出生后≤30天进行者4岁保留原肝生存率更高）","进展至终末期肝病者行肝移植"],"management":["两阶段筛查方案：第一阶段出生后60小时前检测结合胆红素，升高者第二阶段2周龄复查；结合胆红素>1mg/dL为阳性","术后3个月内总胆红素<2mg/dL是保留原肝生存的重要预后指标","及时诊断至关重要，Kasai手术越早实施预后越好（台湾实施筛查后60天内手术率由60%升至74%）"],"notes":["历史标准为出生后60天以内行Kasai肝肠吻合术，但更早手术预后更好","肝内胆管扩张并非胆道闭锁的特征性表现","肝内疾病致肝外胆道无法观察时可能被误诊为胆道闭锁，需组织学和放射学专家评估","发病机制假说包括遗传易感性、病毒/毒素/血管损伤、异常免疫反应等"],"emergency":["黄疸持续不退伴陶土样便的婴儿需早期识别并及时转诊外科（Kasai手术窗口期有限，延误直接影响预后）"],"pinyin":"dandaobisuo"},{"name":"儿童癫痫","category":"儿科-神经","summary":"癫痫是大脑存在持续发作倾向并伴神经生物学、认知、心理和社会后果的疾病；两次或更多无诱因发作间隔超过24小时即认为存在癫痫。ILAE按发作类型分为局灶性、全面性、未知及未分类，按病因分为遗传、结构、代谢、免疫、感染和未知。治疗根据发作类型和癫痫综合征选择药物：局灶性首选奥卡西平与左乙拉西坦，失神发作首选乙琥胺，青少年肌阵挛性癫痫用丙戊酸等。","symptoms":["局灶性意识受损发作：反应减弱、凝视、自动动作（咀嚼、手部操作）、先兆（上腹不适、恐惧、似曾相识感、复杂视觉幻觉）","局灶性至双侧强直-阵挛发作：眼球和头部向对侧偏斜，随后全身强直、阵挛，可伴咬舌、失禁、发绀","全身性强直-阵挛发作：突然意识丧失、强直期后阵挛期，持续1-2分钟，发作后嗜睡、虚弱、共济失调、头痛","失神发作：短暂凝视、无反应、眼睑抽动，持续数秒，无发作后恢复期，每日可发生数百次","肌阵挛性发作：肌肉冲击性收缩（<50毫秒）；失张力/强直性发作可致跌倒（跌倒发作）","儿童期失神癫痫伴3Hz尖波-慢波放电；Lennox-Gastaut综合征伴1-2Hz慢尖波、发育迟缓及多种发作类型","婴儿痉挛（West综合征）：反复癫痫性痉挛+发育倒退+高电压节律脑电图"],"diagnosis":["首次发作急性评估：检查气道、呼吸、心脏功能，测体温、血压、血糖；排查脑膜炎、败血症、头部创伤、药物或毒素摄入","所有首次非发热性发作均应行常规脑电图以预测复发风险；睡眠剥夺/睡眠期脑电图可提高检出率，必要时24小时视频脑电图","首次发作后神经功能恢复至基线者通常可门诊处理；局灶性发作、发作后局灶性缺陷、未恢复基线、发作前创伤史或高风险病史者行紧急影像检查","脑部MRI优于CT；临床和脑电图符合遗传性全面性癫痫（如儿童失神癫痫）时可不做MRI","ILAE多级分类：发作类型→癫痫类型→癫痫综合征→综合诊断（病因+合并症）；病因分遗传、结构、代谢、免疫、感染、未知","基因检测适用于特定畸形/代谢/退行性疾病、严重癫痫综合征（West、Dravet、进行性肌阵挛性癫痫）、孟德尔遗传综合征及癫痫脑病","药物难治或新发婴儿癫痫病因不明时行全面代谢检查（氨基酸、有机酸、生物素酶、脑脊液检测等）","局灶性发作患者行脑MRI寻找结构性病因（内侧颞叶硬化、畸形、肿瘤、血管病变等）"],"infusion":["维生素B6静脉注射100mg试验（对AED反应差的婴儿，辅助诊断吡哆醇反应性发作，需防呼吸暂停并最好在持续EEG监测下进行）","静脉丙戊酸、苯妥英、苯巴比妥等可快速起始并调整剂量（需要快速达治疗水平时选用有静脉剂型的药物）","IVIG 2g/kg分2-4天给药，之后每月1g/kg持续6个月（用于West综合征、Lennox-Gastaut综合征、Landau-Kleffner综合征等耐药癫痫）","静脉甲泼尼龙或脉冲类固醇治疗（West综合征等；Landau-Kleffner综合征可口服泼尼松2mg/kg/天1-2个月后渐减）","癫痫持续状态：一线苯二氮卓类（地西泮、劳拉西泮等），超难治性持续状态使用咪达唑仑、戊巴比妥和/或丙泊酚等（见633.8章）"],"oral_medication":["局灶性发作/癫痫首选：奥卡西平（起始8-10mg/kg/天，可每3天增加5mg/kg/天）或左乙拉西坦","失神发作首选乙琥胺（疗效与丙戊酸相当、毒性较低）；合并全面性强直-阵挛发作时选用拉莫三嗪或丙戊酸","青少年肌阵挛性癫痫：丙戊酸（女性因激素及致畸风险使用较少）、左乙拉西坦、拉莫三嗪、佐尼沙胺、托吡酯","局灶性和双侧强直-阵挛发作可用：奥卡西平、左乙拉西坦、卡马西平、苯巴比妥、托吡酯、拉科沙胺、佐尼沙胺、丙戊酸、拉莫三嗪、氯巴占等","West综合征：ACTH或口服类固醇（ACTH每日150单位/m²分两次肌注2周后渐减）；结节性硬化症相关婴儿痉挛首选维加巴林","Lennox-Gastaut综合征：氯巴占、丙戊酸、拉莫三嗪、托吡酯、费尔巴马特、鲁非那米德，FDA批准CBD和芬氟拉明","Dravet综合征：氯巴占、丙戊酸、司替戊醇、生酮饮食；避免拉莫三嗪、卡马西平、奥卡西平、苯妥英等钠通道阻滞剂","急救用药：直肠地西泮或鼻内咪达唑仑用于发作>5分钟或减药期发作","维生素反应性癫痫：吡哆醇（吡哆醇依赖性癫痫每日口服100mg，可达500-600mg/天）、吡哆醛磷酸盐（50mg/kg每6小时）、生物素、亚叶酸等"],"treatment":["首次发作后复发风险低者（神经发育正常、脑电图和MRI正常，复发风险约20%）可不开始治疗；高风险者通常需开始治疗","药物治疗根据发作类型、癫痫综合征及个体因素制定；局灶性首选奥卡西平与左乙拉西坦，失神用乙琥胺，青少年肌阵挛用丙戊酸","首选单药治疗，逐渐加量至完全控制或出现不可耐受副作用；无效时换用或联合第二种药物","药物难治性（≥2种适当药物无效）者重新评估诊断（退行、代谢、炎症疾病），并评估癫痫手术可能性","对2-3种AED无效时进行手术评估（通常发病后2年内）；对3种药物无效者药物控制概率<10%","生酮饮食对GLUT-1缺乏、Dravet综合征、West综合征、结节性硬化症等有效；禁用于肉碱缺乏、β-氧化缺陷、丙酮酸羧化酶缺乏等","免疫调节治疗（ACTH、IVIG、泼尼松、静脉甲泼尼龙）用于West综合征及部分耐药癫痫；免疫介导性癫痫考虑类固醇/IVIG","精准基因治疗：SCN1A（Dravet）避免钠通道阻滞剂、SLC2A1用生酮饮食、功能增强型KCNT1用奎尼丁等"],"management":["向家属和儿童普及疾病、治疗、限制条件（驾驶、游泳、部分体育活动）及应对方法","运动分类指导：大多数运动（第一类）无额外风险；第二类中等风险；第三类高风险（潜水、攀岩、跳伞、赛车等）需个体化评估","定期随访：监测AED副作用（血常规、肝功、行为、学习），按需复查脑电图和药物浓度","按时服药、保证睡眠、避免睡眠剥夺；减少强直-阵挛发作的诱因（饮酒等）","告知SUDEP风险及可改变的风险因素（按时服药、夜间监护、发作检测设备），避免过度保护影响心理健康","长期使用酶诱导型AED者监测维生素D水平并补充维生素D","西综合征激素治疗期间禁用活疫苗，其他疫苗在ACTH和类固醇治疗期间无效；建议H2受体拮抗剂预防溃疡"],"notes":["约4%-10%的儿童在16岁前至少发生一次癫痫发作；30%首次无发热发作后发展为癫痫（正常EEG和影像者约20%）","癫痫终生发病率3%，超过一半始于儿童时期；年度患病率0.5%-1%","突然停药可导致戒断性发作或癫痫持续状态，尤其苯巴比妥和苯二氮卓类；停药应缓慢（通常3-6个月）","停药后复发最重要的风险因素是停药前脑电图异常；无发作≥2年且脑电图正常者多数停药后不复发","SUDEP是癫痫患者死亡最常见原因（占17%）；风险因素包括使用>3种AED、男性、发病年龄小、依从性差、夜间发作、发作控制不佳（尤其每年>3次）","FDA警示抗癫痫药物可能增加自杀念头和行为风险，开始用药前应咨询","丙戊酸肝毒性风险增加见于2岁以下、多药联用或潜在代谢障碍儿童；孕期应尽可能避免丙戊酸（X类）","中国汉族人群HLA-B*1502与卡马西平、奥卡西平、苯妥英或拉莫三嗪引起的严重皮肤反应密切相关，携带者应避免使用","约10%患者服用卡马西平或苯妥英时可出现可逆性、剂量相关的白细胞减少症"],"emergency":["发作持续>5分钟或反复发作：使用急救药物（直肠地西泮或鼻内咪达唑仑）并立即就医","癫痫持续状态（持续或反复发作、间歇不恢复意识）需急诊处理（见633.8章）","强直-阵挛性发作后持续观察直至完全恢复意识；高风险发作（明显发绀、严重心动过缓或呼吸暂停、原有心肺功能障碍）应立即呼叫急救","发作后神经功能未恢复基线、局灶性发作伴局灶性神经功能缺陷，或发作前有创伤史者需紧急影像学检查","SUDEP高风险患者发作（长程强直-阵挛伴明显发绀、复杂部分性发作伴显著肌张力降低、合并心肺疾病）需紧急评估"],"pinyin":"etdx"},{"name":"吉兰-巴雷综合征","category":"儿科-神经","summary":"一种自身免疫性、感染后多神经病变，主要影响运动神经，也可累及感觉及自主神经。无力症状通常在非特异性胃肠道或呼吸道感染后约10天出现。","symptoms":["初期麻木和感觉异常，随后出现进行性无力，通常始于下肢并逐渐蔓延至躯干、上肢及咽喉部肌肉","无力多对称，数天至数周内加重，最严重阶段通常在发病4周内达到","约60%的患儿在病程中失去行走能力，少数发展为四肢弛缓性瘫痪","放射性背部疼痛和肌肉疼痛在初期常见，患儿可变得非常易怒","约50%病例出现咽喉部肌肉受累，可导致呼吸功能不全，吞咽困难及面部无力可能是呼吸衰竭征兆","自主神经受累：血压和心率不稳、体位性低血压、严重心动过缓或心动过速，偶见心脏停搏","肌腱反射通常早期消失，多达10%患儿可保持正常反射","米勒-费舍尔综合征亚型：急性眼外麻痹、共济失调、无反射"],"diagnosis":["脑脊液检查：蛋白质水平超过正常上限约两倍、葡萄糖正常、无白细胞增多（白细胞<10个/mm³），即蛋白-细胞分离","脑脊液特征可在症状出现后第一周内尚不明显","脊髓MRI显示马尾神经和脊神经根增厚伴钆增强","神经传导研究有助于将GBS分类为急性炎症性脱髓鞘性多神经病或急性运动轴索神经病","抗神经节苷脂抗体检测（如GM1、GD1a、GQ1b）支持相关亚型诊断"],"infusion":["静脉注射免疫球蛋白：连续5天每天0.4克/千克，或连续2天每天1克/千克","血浆置换（静脉注射免疫球蛋白无效时）"],"oral_medication":["加巴喷丁（神经性疼痛）","麻醉性镇痛药（疼痛剧烈时）"],"treatment":["早期患者应收住入院观察，因上行性麻痹可迅速导致呼吸功能障碍和自主神经不稳定","病情严重或发展迅速者使用静脉注射免疫球蛋白；无效者采用血浆置换和/或免疫抑制药物","类固醇对肌肉无力无效，但可能有助于缓解疼痛","支持性护理：呼吸支持、预防压疮和便秘、营养支持、疼痛管理、预防深静脉血栓、治疗继发细菌感染","神经性疼痛应积极治疗，必要时使用麻醉性镇痛药，可加用加巴喷丁"],"management":["密切监测呼吸努力，判断是否存在低通气和呼吸功能障碍","心血管监测非常重要，尤其在疾病早期（虚弱、呼吸功能不全及自主神经不稳定可能危及生命）","注意翻身防压疮、防便秘、营养与疼痛管理"],"notes":["未识别和治疗时，严重咽喉部和呼吸肌受累可导致死亡","GBS通常为单相疾病，自发恢复通常在2-3周内开始，也可能需要数月","静脉注射免疫球蛋白可加速恢复但不能改变长期预后；脱髓鞘型通常比轴索型恢复快","少数患者留有残余无力，最常见为踝关节背屈功能受损；疲劳是最常见长期后遗症","约4%的GBS患儿复发，通常对免疫调节治疗有反应"],"emergency":["呼吸功能不全：约50%病例咽喉部受累，需监测并准备呼吸支持","自主神经不稳定（血压/心率波动、心脏停搏）早期可危及生命","吞咽困难及面部无力是呼吸衰竭的征兆"],"pinyin":"jilan-baleizonghezheng"},{"name":"小儿偏头痛","category":"儿科-神经","summary":"偏头痛是具有遗传基础的发作性疾病，是儿童最常见的原发性头痛类型；儿童头痛持续时间较短（18岁以下为2-72小时）、疼痛部位常为双侧额部，伴恶心呕吐、畏光和/或恐声。诊断依据ICHD-3标准，儿童可表现为周期性综合征（周期性呕吐、腹部偏头痛、良性阵发性眩晕等）。治疗需结合急性治疗（NSAIDs、曲普坦类）、预防性治疗（每周头痛≥1次或明显影响生活时）及生物行为疗法三部分。","symptoms":["头痛持续2-72小时（18岁以下，未经治疗或治疗无效；睡眠时间计入持续时间）","头痛具备以下4项中至少2项：单侧或局部性发作、搏动性、中度或重度疼痛、日常体力活动加重或致回避","发作期间至少1项：恶心和/或呕吐、畏光及恐声","儿童头痛常为双侧、以前额部为主；幼儿恶心呕吐可能比头痛更突出","可有先兆：视觉先兆（闪光、锯齿线、暗点，最常见）、感觉先兆（麻木感）、语言先兆（运动性失语）","儿童偏头痛变种：周期性呕吐综合征、腹部偏头痛（无头痛的发作性中腹疼痛）、良性阵发性眩晕、爱丽丝梦游仙境综合征","慢性偏头痛：头痛每月≥15天、持续>3个月","前驱症状：烦躁、疲劳、食欲增加、呵欠等；常见诱因包括不吃早餐、睡眠不足或不规律、脱水、天气变化"],"diagnosis":["无先兆偏头痛诊断需至少5次符合ICHD-3标准的发作（B-D标准）","全面病史和体格检查（包括重点神经系统检查）是判断潜在病因最敏感的方法；用PedMIDAS等工具评估对学业、家庭和社会活动的残疾影响","家族史极为重要：高达90%的患儿有一级或二级亲属反复头痛史；无家族史或类似综合征（运动病、周期性呕吐等）应怀疑其他诊断并进一步检查","神经影像检查指征：神经系统检查异常、导致患儿从睡眠中醒来的头痛或晨起头痛、咳嗽/弯腰诱发的短暂头痛、枕部头痛、非典型先兆（偏瘫型、基底型）、<6岁或无法描述头痛者；首选MRI","头痛在发作瞬间最严重者（雷击样头痛）：行CT排除出血，结果阴性则腰椎穿刺（关注脑脊液血色）","无先兆或典型先兆偏头痛：常规实验室检查和脑电图无益处","排除继发性头痛：鼻窦炎、特发性颅内高压、CADASIL、烟雾病、可逆性脑血管收缩综合征、癫痫伴先兆等"],"infusion":["急诊难治性偏头痛：静脉补液+抗多巴胺能药+NSAIDs联合（疗效93%）","丙氯拉嗪（普鲁氯哌嗪）0.15mg/kg IV（最大10mg）；锥体外系反应时静脉苯海拉明25-50mg","甲氧氯普胺0.13-0.15mg/kg IV（最大10mg，15分钟滴注）；哮喘患者慎用","酮咯酸0.5mg/kg IV（最大15mg）","丙戊酸钠15-20mg/kg静脉推注（10分钟内），4小时内续以口服15-20mg/天","二氢麦角胺（DHE）：<40kg用0.5mg/剂、≥40kg用1.0mg/剂，每8小时一次；用前30分钟先予丙氯哌嗪0.13-0.15mg/kg（最多连用3次，之后改用昂丹司琼）","周期性呕吐急性发作：静脉10%葡萄糖+昂丹司琼+抗组胺药或苯二氮卓类"],"oral_medication":["急性：布洛芬7.5-10mg/kg（首选）；对乙酰氨基酚15mg/kg（NSAIDs禁忌时）；布洛芬无效可试萘普生钠同剂量","曲普坦类：阿莫曲坦12.5mg（12-17岁）、利扎曲普坦<40kg用5mg/≥40kg用10mg（6-17岁）、佐米曲坦鼻喷5mg（≥12岁）、鼻内舒马曲坦（8岁以上中重度）","预防：阿米替林1mg/kg每晚（逐步加量，从小剂量开始，每周加一次）；延长QT综合征患者禁用","预防：托吡酯25-100mg每日两次（青少年50-100mg bid有效；需逐步加量，会降低避孕药效果）","预防：丙戊酸10mg/kg每日两次；普萘洛尔（哮喘、过敏性疾病、糖尿病患儿禁用，青少年注意抑郁风险）","预防：氟桂利嗪5mg睡前、1个月后可增至10mg（钙通道阻滞剂，美国不可获得）；幼儿赛庚啶0.1-0.2mg/kg每日两次","预防营养补充：核黄素（维生素B2）25-400mg、辅酶Q10 1-2mg/kg/天、白头翁50-150mg（避免含吡咯里西啶生物碱制剂）","儿童良性阵发性眩晕反复发作：苯海拉明5mg/kg/天（最大300mg/天）；频繁发作用赛庚啶预防"],"treatment":["治疗目标：减少头痛频率、严重程度、持续时间和致残程度；减少对难以耐受、无效或不必要的急性药物的依赖；提高生活质量；避免急性药物过度使用","治疗计划三部分：急性治疗（尽快终止发作、2小时内恢复功能）+预防性治疗（每周头痛≥1次或严重影响生活、PedMIDAS>20时）+生物行为疗法","急性用药限制：NSAIDs每周≤2-3次（可每3-4小时重复）；曲普坦类每月≤4-6次（可每2小时重复）；任何止痛药每周使用≤3次以防药物过度使用性头痛","难治性急诊治疗：抗多巴胺药（丙氯哌嗪/甲氧氯普胺）+酮咯酸+静脉补液；无效时用DHE或丙戊酸钠","偏头痛持续状态（>72小时）或严重药物过度使用性头痛需住院，静脉综合治疗3-5天（DHE、止吐药、丙戊酸钠等）","预防用药至少4-6个月，并在数周内逐渐减量；目标是每周头痛≤1次、PedMIDAS<10","生物行为疗法：规律进食、充足睡眠（8-9小时）、适量饮水避免咖啡因、定期锻炼、识别诱因；生物反馈辅助放松和认知行为疗法（常与阿米替林联用）","液体补充纳入急性治疗计划（运动饮料等电解质液体）","偏瘫性偏头痛预防可用维拉帕米、乙酰唑胺、拉莫三嗪；急性缓解可用维拉帕米或氯胺酮；避免麦角衍生物、曲普坦类、普萘洛尔等"],"management":["教育患者自我管理：识别前驱症状和诱因，儿童在学校发作时告知老师并获得用药许可","头痛日记记录发作频率、严重程度、持续时间、伴随症状、用药情况及诱因","避免药物过度使用性头痛（简单止痛药>15天/月、曲普坦或复合药>10天/月）","共病管理：筛查焦虑、抑郁等情绪障碍，特别是难治性慢性偏头痛的青少年","无先兆或典型先兆偏头痛不需要常规实验室检查和脑电图；避免不必要的影像检查","青春期女性避免用口服避孕药作为偏头痛预防（有先兆者中风风险增加）"],"notes":["高达75%的儿童在15岁前报告过严重头痛；5-15岁儿童偏头痛患病率10.6%，较大青少年可达28%，慢性偏头痛约1%","偏头痛遗传率约42%；无先兆偏头痛一级亲属相对风险1.9，有先兆者3.8","约34%的青少年偏头痛缓解，近50%持续至成年；早期诊断和治疗有助于减缓疾病进展","曲普坦类禁忌：偏瘫性偏头痛、24小时内用过麦角胺类、使用MAO抑制剂2周内；与SSRI联用可能偶发血清素综合征","无家族偏头痛或类似综合征史、或头痛难治时应怀疑继发性头痛或诊断错误","仅枕部头痛虽可为偏头痛，但更可能由后颅窝异常等直接病因引起，需影像学检查","成人中90%被诊断为鼻窦性头痛者实际为偏头痛；无脓性鼻分泌物、发热或慢性咳嗽时不应诊断为鼻窦性头痛","药物过度使用性头痛可导致慢性每日头痛；无效的药物治疗或误诊可加重病情"],"emergency":["头痛发作瞬间最严重（雷击样头痛、一生中最严重头痛）：立即CT排除蛛网膜下腔出血，结果阴性行腰椎穿刺","每天或几乎每天因头痛或呕吐而醒来、晨起头痛、咳嗽/弯腰/瓦尔萨尔瓦动作诱发或加重→警惕颅内压增高","神经系统检查异常（包括眼底）或非典型先兆（偏瘫型、基底型）、枕部头痛、<6岁头痛需神经影像检查","急性发作门诊治疗无效且头痛严重者转输液中心、急诊室或住院治疗","偏头痛持续状态（>72小时）需住院综合静脉治疗","难治性头痛伴疑颅内压升高（慢性偏头痛治疗困难）可考虑腰椎穿刺测压，但需排除占位性病变后再行穿刺"],"pinyin":"xeptt"},{"name":"急性细菌性脑膜炎","category":"儿科-神经","summary":"急性细菌性脑膜炎（新生儿期以外）主要病原为肺炎链球菌、脑膜炎奈瑟菌和b型流感嗜血杆菌，经鼻咽部定植后入血、突破血脑屏障引发感染；有荚膜菌对缺乏免疫的婴幼儿风险最高。诊断依靠腰椎穿刺获取脑脊液（中性粒细胞增多、蛋白升高、糖降低、革兰染色和培养）及血培养（80-90%阳性）。经验性治疗为头孢曲松联合万古霉素，b型流感嗜血杆菌脑膜炎于6周龄以上儿童用地塞米松；及时识别、尽早抗菌治疗是降低死亡率的关键。","symptoms":["非特异性表现：发热、食欲不振或进食不良、头痛、上呼吸道症状、肌肉痛、关节痛、心动过速、低血压","皮疹：瘀点、紫癜或红斑性皮疹；脑膜炎球菌血症为瘀点样皮疹进展为瘀点和紫癜","脑膜刺激征：颈项强直、背痛、克尼格征、布吕津斯基征（12-18个月以下儿童不常见）","颅内压增高表现：头痛、呕吐、囟门膨出或颅缝分离、动眼神经或外展神经麻痹、高血压伴心动过缓、呼吸暂停或过度通气、去皮质/去大脑姿势、意识障碍、脑疝","20-30%出现癫痫发作（局灶性或全身性）；20-30%有局部神经系统症状","精神状态改变：易激惹、嗜睡、昏睡、意识模糊、昏迷；昏迷者预后差","10-20%出现颅神经病变（眼、动眼、外展、面、听觉神经）","重症暴发型：突然且持续的休克、紫癜、弥散性血管内凝血和意识水平下降，24小时内可进展为昏迷或死亡"],"diagnosis":["腰椎穿刺获取脑脊液行革兰染色和培养是诊断最重要步骤；脑脊液中性粒细胞增多、蛋白升高、糖降低提示细菌性脑膜炎","脑脊液白细胞通常>1000/mm³且以中性粒细胞为主（75-95%）；可低至<250/mm³，伴严重败血症者可能无白细胞增多（预后不良标志）","腰穿禁忌：颅内压升高征象（除囟门膨出外）、严重心肺衰竭需紧急复苏、穿刺部位皮肤感染；血小板减少为相对禁忌","腰椎穿刺前不常规行头部CT（除非视乳头水肿、局灶体征、昏迷、脑积水史或既往神经外科手术）；即使行CT亦不应延迟抗菌治疗","所有疑似患者均应行血培养（80-90%阳性）","已用抗生素者脑脊液2-4小时内革兰染色和培养可转阴，但细胞数、蛋白、糖异常持续数日；多重PCR及16S rRNA PCR可辅助/确定病原","C反应蛋白、血沉、降钙素原升高见于细菌和病毒性脑膜炎，部分临床预测工具用于评估细菌性脑膜炎风险","视乳头水肿更提示慢性病变（颅内脓肿、硬膜下脓胸、硬膜静脉窦阻塞）"],"infusion":["经验性治疗：头孢曲松50mg/kg每12小时一次（第三代头孢菌素）+万古霉素（覆盖耐头孢菌素肺炎链球菌；目标AUC/MIC 400-600mg·h/L或谷浓度15-20mg/L）","怀疑单核细胞增生李斯特菌（婴幼儿或T细胞缺乏）：加用氨苄西林300mg/kg/天每6小时一次（头孢菌素对李斯特菌无效）；替代为静脉复方新诺明","青霉素/头孢菌素过敏者：美罗培南40mg/kg每8小时一次，或氟喹诺酮类、氯霉素","免疫低下怀疑革兰阴性菌脑膜炎：头孢吡肟或美罗培南","地塞米松0.15mg/kg每6小时一次×2天（6周龄以上儿童，b型流感嗜血杆菌脑膜炎；最好在抗生素前1-2小时给药，与首剂抗生素同时或之后不久亦可能有效）","肺炎链球菌脑膜炎（青霉素敏感株）：大剂量静脉青霉素G 30万-40万单位/kg/天每4小时一次","脑膜炎球菌脑膜炎：青霉素（MIC<0.1μg/mL）或头孢曲松（MIC 0.1-1μg/mL）","Hib脑膜炎：β-内酰胺酶阴性株用氨苄西林，阳性株用第三代头孢菌素"],"oral_medication":["脑膜炎球菌密切接触者化学预防：利福平15-20mg/kg/次每12小时（最大600mg），连用2天","脑膜炎球菌接触者替代方案：口服环丙沙星20mg/kg（最大500mg）单剂，或头孢曲松肌注（<15岁125mg、≥15岁250mg）","Hib家庭接触者预防：利福平20mg/kg/天（最大600mg），每日一次×4天（家庭中有<48月龄未完全接种者或任何免疫低下儿童时）"],"treatment":["及时识别、诊断检测并尽早开始适当抗菌治疗；延迟数小时即显著增加不良预后和死亡风险","经验性抗生素：第三代头孢菌素（头孢曲松50mg/kg q12h）+万古霉素；过敏者用美罗培南40mg/kg q8h","怀疑李斯特菌感染（婴幼儿/T细胞缺乏）加用氨苄西林300mg/kg/天q6h","抗生素疗程（经验及专家意见）：无并发症肺炎链球菌脑膜炎10-14天；脑膜炎奈瑟菌5-7天；Hib脑膜炎7-10天；培养阴性但脑脊液异常符合细菌性脑膜炎者头孢曲松7-10天","革兰阴性杆菌脑膜炎治疗3周，或脑脊液无菌化后至少再2周","皮质类固醇（地塞米松）用于6周龄以上儿童Hib脑膜炎：0.15mg/kg每6小时×2天，最好在用抗生素前1-2小时","典型细菌性脑膜炎在停药前不推荐常规复查腰椎穿刺（异常脑脊液参数不能预测停药后再感染）","局部神经症状、视乳头水肿或颅内压升高者：先开始抗生素并处理颅内压，再行CT和腰椎穿刺","发生多系统器官衰竭、休克、急性呼吸窘迫综合征者需入重症监护室治疗","有症状的硬膜下积液经开放囟门抽吸；SIADH所致低钠血症需管理；注意控制颅内压"],"management":["所有细菌性脑膜炎患儿出院前或出院后尽快进行详细听力评估；有听力缺陷者门诊定期复查","出院后定期进行神经学、发育学和听觉评估，关注听力损失、认知障碍、语言延迟、行为问题","支持治疗：维持液体和电解质平衡，监测癫痫发作、脑水肿、SIADH、硬膜下积液","预防：常规接种Hib结合疫苗（2个月起）、肺炎球菌结合疫苗（2个月起）、脑膜炎球菌疫苗（MenACWY 11-12岁及16-18岁，B群疫苗按指征）；高风险儿童加用PPSV23","肺炎球菌性脑膜炎接触者不需要抗生素预防；脑膜炎球菌和Hib接触者需化学预防（见口服用药）","脑膜炎球菌密切接触者应了解疾病早期症状，出现时及时就医"],"n
