<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临床工具 · 整合版（v1.1.0 数据）</</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#eef2f7;color:#1f2937;
  font-size:14px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden}
a{color:inherit}
.topbar{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:10px 18px;flex:none;
  display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:5}
.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
.topbar .v{font-size:11px;opacity:.85;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:999px}
.topbar .gswrap{margin-left:auto;position:relative}
.topbar input#gs{width:280px;max-width:42vw;padding:7px 12px;border:none;border-radius:9px;font-size:13px;outline:none}
.gsbox{position:absolute;top:42px;right:0;width:380px;max-width:80vw;max-height:60vh;overflow:auto;
  background:#fff;color:#1f2937;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:none;z-index:30}
.gsbox.show{display:block}
.gsitem{padding:9px 12px;border-bottom:1px solid #eef;cursor:pointer}
.gsitem:hover{background:#eff6ff}
.gsitem .t{font-weight:600}
.gsitem .m{font-size:11px;color:#2563eb;background:#eef2ff;border-radius:6px;padding:1px 7px;margin-right:6px}
.body{flex:1;display:flex;min-height:0}
.side{width:148px;min-width:148px;background:#0f2257;color:#cdd6f4;overflow:auto;flex:none;padding:8px 0}
.side .mi{padding:11px 14px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px;
  border-left:3px solid transparent;user-select:none}
.side .mi:hover{background:#16285f}
.side .mi.active{background:#16285f;border-left-color:#60a5fa;color:#fff}
.side .mi .ic{font-size:16px}
.side .mi .ct{margin-left:auto;font-size:11px;background:#1e3a8a;color:#cbd5e1;border-radius:999px;padding:0 7px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#f5f7fb}
.toolbar{flex:none;padding:10px 14px;border-bottom:1px solid #e5e7eb;background:#fff;display:flex;flex-direction:column;gap:8px}
.toolbar .row{display:flex;gap:10px;align-items:center}
.toolbar input{border:1px solid #d1d5db;border-radius:9px;padding:8px 12px;font-size:14px;outline:none;flex:1;min-width:0}
.toolbar input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 11px;border-radius:999px;background:#eef2ff;color:#3730a3;cursor:pointer;border:1px solid transparent;user-select:none}
.chip:hover{background:#e0e7ff}
.chip.active{background:#2563eb;color:#fff}
.content{flex:1;display:flex;min-height:0}
.list{width:320px;min-width:320px;overflow:auto;background:#fff;border-right:1px solid #e5e7eb}
.item{padding:11px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.item:hover{background:#f0f6ff}
.item.active{background:#e8f0ff;border-left:3px solid #2563eb;padding-left:11px}
.item .n{font-weight:600}
.item .s{font-size:12px;color:#6b7280;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{flex:1;overflow:auto;padding:0}
.empty{color:#9ca3af;text-align:center;padding:40px;font-size:14px}
.dheader{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dtitle{font-size:20px;font-weight:700}
.badge{font-size:12px;background:#eef2ff;color:#3730a3;border-radius:6px;padding:2px 9px;margin-top:3px}
.copybtn{margin-left:auto;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px}
.copybtn:hover{background:#1d4ed8}
.summary{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 14px;margin-bottom:14px;color:#9a3412}
.sec{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.sec-t{font-weight:700;color:#1e3a8a;border-left:4px solid #2563eb;padding-left:9px;margin-bottom:8px;font-size:15px}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.sec pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:13.5px;line-height:1.7}
.muted{color:#9ca3af}
.case{border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fafafa}
.case-name{font-weight:700;color:#1e3a8a;margin-bottom:8px;font-size:14px}
.tpl-block{margin-bottom:10px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.tpl-block:last-child{margin-bottom:0}
.tpl-name{display:flex;justify-content:space-between;align-items:center;background:#f3f4f6;padding:6px 10px;font-size:13px;font-weight:600;color:#374151;border-bottom:1px solid #e5e7eb}
.cp-mini{background:#fff;border:1px solid #d1d5db;border-radius:5px;padding:2px 8px;font-size:12px;color:#4b5563;cursor:pointer}
.cp-mini:hover{background:#f9fafb;border-color:#9ca3af}
.warnbox{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;color:#991b1b;margin-bottom:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;
  padding:10px 20px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;z-index:100;pointer-events:none}
.toast.show{opacity:.95}
.dback{display:none}
.dbody{padding:18px 22px}
@media(max-width:760px){
  .side{width:100%;display:flex;overflow-x:auto;padding:4px 0}
  .side .mi{border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  .side .mi .ct{display:none}
  .body{flex-direction:column}
  .main{flex:1;min-height:0}
  .content{flex-direction:column;flex:1;min-height:0}
  .list{width:100%;min-width:0;flex:1;min-height:0;overflow:auto;
    transition:filter .28s ease, transform .28s ease, opacity .28s ease}
  .detail{position:fixed;inset:0;z-index:60;background:#f5f7fb;transform:translateX(100%);
    transition:transform .28s ease;overflow:auto;padding:0}
  .detail.open{transform:translateX(0)}
  .dback{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5;
    background:#1e3a8a;color:#fff;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .dback .arr{font-size:18px;line-height:1}
  .dbody{padding:16px 16px 48px}
  .list.dim{filter:blur(4px);transform:translateY(16px) scale(.97);opacity:.35;pointer-events:none}
  .topbar input#gs{width:150px}
}

:root{--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--brand-soft:#eff6ff;--warn:#dc2626;--chip:#eef2ff}
#list .ci{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;color:var(--ink);transition:.1s}
#list .ci:hover{background:var(--brand-soft)}
#list .ci.active{background:var(--brand-soft);border-left:3px solid var(--brand);padding-left:11px}
#list .cg{padding:8px 14px;font-size:12px;color:var(--muted);font-weight:600;background:#f8fafc;position:sticky;top:0}
#list .empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px}
.calc-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:14px}
.calc-disp{background:#0f2438;color:#eaf6ff;border-radius:10px;padding:16px;margin-bottom:14px;text-align:right;min-height:78px}
.calc-disp .ex{font-size:13px;min-height:18px;opacity:.65;word-break:break-all}
.calc-disp .rs{font-size:30px;font-weight:700;word-break:break-all;margin-top:4px}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.calc-keys button{padding:14px 0;font-size:17px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;color:var(--ink);transition:.1s;font-weight:600}
.calc-keys button:hover{background:var(--brand-soft);border-color:var(--brand)}
.calc-keys button.op{background:#e7f0fb;color:#1e40af}
.calc-keys button.eq{background:var(--brand);color:#fff;border-color:var(--brand)}
.calc-keys button.fn{background:#fdeaea;color:var(--warn)}
.calc-form label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.calc-form input,.calc-form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;outline:none;box-sizing:border-box;background:#fff}
.calc-form input:focus,.calc-form select:focus{border-color:var(--brand)}
.calc-form .fld{margin-bottom:14px}
.calc-out{margin-top:6px;background:#f1f6fb;border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:15px}
.calc-out .big{font-size:24px;font-weight:700;color:#1e40af}
.calc-out .muted{color:var(--muted)}
.calc-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.7}
.calc-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.cchk{display:flex;align-items:center;gap:6px;cursor:pointer;margin:8px 0;font-size:13.5px}
.ph{padding:60px 20px;text-align:center;color:var(--muted)}
.calc-out .chip{display:inline-block;padding:1px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:#fff;color:var(--ink)}
.calc-out .chip.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.calc-out table.kz{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.calc-out table.kz th,.calc-out table.kz td{border:1px solid var(--line);padding:7px 8px;text-align:center}
.calc-out table.kz th{background:var(--panel);font-weight:700;color:var(--ink)}
.calc-out table.kz tr:nth-child(even) td{background:#fafcff}
@media(max-width:760px){
  #detail .calc-card{max-width:none;margin:14px 16px 18px;padding:18px}
  #detail .calc-form input,#detail .calc-form select{font-size:16px;padding:12px 14px}
  #detail .calc-form .cchk{font-size:14px;margin:10px 0}
}
</style>
</head>
<body>
<div class="topbar">
  <h1>临床工具</h1><span class="v">v1.1.0 数据</span>
  <div class="gswrap">
    <input id="gs" placeholder="跨模块检索（中文/拼音，如 xz / 肺炎）">
    <div class="gsbox" id="gsbox"></div>
  </div>
</div>
<div class="body">
  <div class="side" id="side"></div>
  <div class="main">
    <div class="toolbar">
      <div class="row"><input id="q" placeholder="本模块检索…"><span id="cnt" style="color:#6b7280;font-size:13px"></span></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="content">
      <div class="list" id="list"></div>
      <div class="detail" id="detail">
        <div class="dback" onclick="closeDetail()"><span class="arr">←</span> 返回列表</div>
        <div class="dbody" id="dbody"><div class="empty">请选择左侧模块与条目</div></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="data/diseases.js"></script>
<script src="data/drugs.js"></script>
<script src="data/labs.js"></script>
<script src="data/symptoms.js"></script>
<script src="data/procedures.js"></script>
<script src="data/documents.js"></script>
<script src="data/templates.js"></script>
<script src="data/guidelines.js"></script>
<script>
/* === 计算器模块 移植自儿科临床工具 === */

/* ================= 计算器模块（移植自临床工具整合版） ================= */
const $=s=>document.querySelector(s);
let calcState={id:'basic',expr:'',res:'',q:''};

const CALCS=[
  {id:'basic',name:'标准计算',cat:'常用',keywords:'calculator'},
  {id:'bmi',name:'BMI 体重指数',cat:'常用',keywords:'body mass index'},
  {id:'bsa',name:'BSA 体表面积',cat:'常用',keywords:'body surface area'},
  {id:'map',name:'MAP 平均动脉压',cat:'常用',keywords:'mean arterial pressure'},
  {id:'anion',name:'阴离子间隙',cat:'常用',keywords:'anion gap'},
  {id:'osmo',name:'血浆渗透压',cat:'常用',keywords:'plasma osmolality'},
  {id:'caca',name:'校正血钙',cat:'常用',keywords:'corrected calcium'},
  {id:'pfr',name:'氧合指数 P/F',cat:'常用',keywords:'pao2 fio2 ards'},
  {id:'rate',name:'输液速度计算',cat:'常用',keywords:'infusion drip'},
  {id:'duedate',name:'预产期计算',cat:'妇产/儿科',keywords:'pregnancy gestational'},
  {id:'pedw',name:'小儿体重估算',cat:'妇产/儿科',keywords:'pediatric weight age'},
  {id:'apgar',name:'Apgar 新生儿评分',cat:'妇产/儿科',keywords:'newborn'},
  {id:'kdz',name:'川崎病 冠脉Z值',cat:'川崎病/冠脉',keywords:'kawasaki coronary z score 川崎 冠脉 动脉瘤 右冠脉 左主干 前降支'},
  {id:'cg',name:'肌酐清除率 C-G',cat:'肾脏',keywords:'creatinine clearance'},
  {id:'egfr',name:'eGFR (CKD-EPI)',cat:'肾脏',keywords:'kidney gfr'},
  {id:'ckdstage',name:'CKD 肾功能分期',cat:'肾脏',keywords:'ckd stage albuminuria'},
  {id:'chadsvasc',name:'CHA2DS2-VASc',cat:'心血管',keywords:'atrial fibrillation stroke'},
  {id:'hasbled',name:'HAS-BLED',cat:'心血管',keywords:'bleeding risk anticoagulation'},
  {id:'wells',name:'Wells-DVT 评分',cat:'心血管',keywords:'deep vein thrombosis'},
  {id:'nyha',name:'NYHA 心功能分级',cat:'心血管',keywords:'heart failure class'},
  {id:'gcs',name:'GCS 昏迷评分',cat:'重症',keywords:'glasgow coma'},
  {id:'qsofa',name:'qSOFA',cat:'重症',keywords:'quick sepsis organ failure'},
  {id:'sofa',name:'SOFA 评分',cat:'重症',keywords:'sepsis organ failure'},
  {id:'apache2',name:'APACHE II 评分',cat:'重症',keywords:'icu mortality'},
  {id:'news',name:'NEWS 早期预警',cat:'重症',keywords:'early warning score'},
  {id:'pews',name:'PEWS 儿童预警',cat:'重症',keywords:'pediatric early warning'},
  {id:'nihss',name:'NIHSS 卒中评分',cat:'神经',keywords:'stroke scale'},
  {id:'vas',name:'VAS 疼痛评分',cat:'神经/精神',keywords:'pain visual analog'},
  {id:'mmse',name:'MMSE 认知评分',cat:'神经/精神',keywords:'mini mental state examination'},
  {id:'moca',name:'MoCA 认知评估',cat:'神经/精神',keywords:'cognitive assessment'},
  {id:'hamd',name:'HAMD 抑郁量表',cat:'神经/精神',keywords:'depression hamilton'},
  {id:'hama',name:'HAMA 焦虑量表',cat:'神经/精神',keywords:'anxiety hamilton'},
  {id:'mmrc',name:'mMRC 呼吸困难',cat:'呼吸',keywords:'dyspnea'},
  {id:'cat',name:'CAT 慢阻肺评估',cat:'呼吸',keywords:'copd assessment test'},
  {id:'curb65',name:'CURB-65 肺炎评分',cat:'呼吸/感染',keywords:'pneumonia'},
  {id:'childpugh',name:'Child-Pugh 分级',cat:'肝脏',keywords:'liver cirrhosis'},
  {id:'meld',name:'MELD 肝病评分',cat:'肝脏',keywords:'liver disease mortality'},
  {id:'gb',name:'Glasgow-Blatchford',cat:'出血',keywords:'gi bleeding'},
  {id:'rockall',name:'Rockall 出血评分',cat:'出血',keywords:'upper gi bleeding'},
  {id:'caprini',name:'Caprini 血栓评分',cat:'血栓',keywords:'venous thromboembolism'},
  {id:'asa',name:'ASA 麻醉分级',cat:'麻醉',keywords:'anesthesia physical status'},
  {id:'ranson',name:'Ranson 胰腺炎',cat:'消化',keywords:'pancreatitis mortality'}
];

const CALC_RENDER={
  basic:renderBasicCalc,bmi:renderBMI,bsa:renderBSA,map:renderMAP,anion:renderAnion,osmo:renderOsmo,caca:renderCaCa,pfr:renderPF,rate:renderRate,
  duedate:renderDueDate,pedw:renderPedW,apgar:renderApgar,kdz:renderKDZ,cg:renderCG,egfr:renderEGFR,ckdstage:renderCKDStage,
  chadsvasc:renderCHA2DS2VASC,hasbled:renderHASBLED,wells:renderWellsDVT,nyha:renderNYHA,
  gcs:renderGCS,qsofa:renderqSOFA,sofa:renderSOFA,apache2:renderAPACHE2,news:renderNEWS,pews:renderPEWS,
  nihss:renderNIHSS,vas:renderVAS,mmse:renderMMSE,moca:renderMoCA,hamd:renderHAMD,hama:renderHAMA,
  mmrc:renderMMRC,cat:renderCAT,curb65:renderCURB65,childpugh:renderChildPugh,meld:renderMELD,
  gb:renderGB,rockall:renderRockall,caprini:renderCaprini,asa:renderASA,ranson:renderRanson
};

/* ---------- layout ---------- */
function onCalcSearch(v){calcState.q=v;renderCalcList();}
function renderCalcList(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const groups={};
  CALCS.forEach(c=>{if(!q||c.name.toLowerCase().includes(q)||c.cat.toLowerCase().includes(q)||(c.keywords&&c.keywords.toLowerCase().includes(q))){
    (groups[c.cat]=groups[c.cat]||[]).push(c);
  }});
  let html='';
  for(const [cat,arr] of Object.entries(groups)){
    html+=`<div class="cg">${esc(cat)}</div>`+arr.map(c=>`<div class="ci ${c.id===calcState.id?'active':''}" onclick="openCalc('${c.id}')">${esc(c.name)}</div>`).join('');
  }
  document.getElementById('list').innerHTML=html||'<div class="empty">未找到匹配的计算器</div>';
  document.getElementById('cnt').textContent='共 '+CALCS.length+' 个计算器';
}
function openCalc(id){calcState.id=id;renderList();renderDetail();openDetail();window.scrollTo(0,0);}
function renderCalcDetail(){
  const fn = calcState.id ? CALC_RENDER[calcState.id] : null;
  document.getElementById('dbody').innerHTML = fn ? fn() : '<div class="ph">从左侧选择一个计算器</div>';
}

/* ---------- helpers ---------- */
function num(id,label,placeholder,run,attrs){
  attrs=attrs||{}; let a=''; for(const [k,v] of Object.entries(attrs)) a+=` ${k}="${v}"`;
  return `<div class="fld"><label>${esc(label)}</label><input id="${id}" type="number" inputmode="decimal" placeholder="${esc(placeholder||'')}" oninput="${run}" onchange="${run}" ${a}></div>`;
}
function sel(id,label,opts,run){
  return `<div class="fld"><label>${esc(label)}</label><select id="${id}" onchange="${run}">${opts.map(o=>`<option value="${o.v}">${esc(o.t)}</option>`).join('')}</select></div>`;
}
function chk(id,label,run){return `<label class="cchk"><input type="checkbox" id="${id}" onchange="${run}"> ${esc(label)}</label>`;}
function out(id,def){return `<div class="calc-out" id="${id}">${def}</div>`;}
function card(title,body){return `<div class="calc-card"><div style="font-size:17px;font-weight:700;margin-bottom:14px">${esc(title)}</div><div class="calc-form">${body}</div></div>`;}
function val(id){const v=parseFloat($('#'+id).value);return isNaN(v)?0:v;}
function ival(id){const v=parseInt($('#'+id).value);return isNaN(v)?0:v;}
function bval(id){return $('#'+id).checked?1:0;}
function sex(id){return $('#'+id).value;}

/* ---------- standard calculator ---------- */
function calcEval(s){
  s=String(s).replace(/%/g,'/100');
  if(!/^[-+*/().\d\s]*$/.test(s))return '错误';
  try{const r=Function('"use strict";return ('+s+')')();if(typeof r!=='number'||!isFinite(r))return '错误';return String(Math.round(r*1e10)/1e10);}catch(e){return '错误';}
}
function calcLive(){if(!calcState.expr)return calcState.res||'0';const r=calcEval(calcState.expr);return r==='错误'?(calcState.res||'0'):r;}
function calcInput(k){
  if(k==='C'){calcState.expr='';calcState.res='';}
  else if(k==='CE'){calcState.expr=calcState.expr.replace(/[\d.()%]+$/,'')}
  else if(k==='BS'){calcState.expr=calcState.expr.slice(0,-1)}
  else if(k==='='){const r=calcEval(calcState.expr);if(r!=='错误'){calcState.res=r;calcState.expr=r;}}
  else{calcState.expr+=k;}
  if(calcState.id==='basic') renderCalcDetail();
}
function renderBasicCalc(){
  return `<div class="calc-card">
    <div class="calc-disp"><div class="ex">${esc(calcState.expr)||'0'}</div><div class="rs">${esc(calcLive())}</div></div>
    <div class="calc-keys">
      <button class="fn" onclick="calcInput('C')">C</button>
      <button class="fn" onclick="calcInput('CE')">CE</button>
      <button class="fn" onclick="calcInput('BS')">⌫</button>
      <button class="op" onclick="calcInput('/')">÷</button>
      <button onclick="calcInput('7')">7</button>
      <button onclick="calcInput('8')">8</button>
      <button onclick="calcInput('9')">9</button>
      <button class="op" onclick="calcInput('*')">×</button>
      <button onclick="calcInput('4')">4</button>
      <button onclick="calcInput('5')">5</button>
      <button onclick="calcInput('6')">6</button>

/* ---------- Kawasaki coronary Z-score (faithful port of cals.medlive.cn/calc/show/2?id=calc-1303) ---------- */
function kdzMethodName(m){return {1:'LMS（日本 布施2009）',2:'Zorji 1998',3:'Kurotobi 2002',4:'Tan 2006',5:'AHA 2004/2017',6:'McCrindle 2007',7:'Olivieri 2009',8:'Dallaire 2011'}[m]||m;}
function renderKDZ(){
  const sexOpts=[{v:'1',t:'男'},{v:'2',t:'女'}];
  const methodOpts=[{v:'1',t:'LMS（日本 布施2009）'},{v:'2',t:'Zorji 1998'},{v:'3',t:'Kurotobi 2002'},{v:'4',t:'Tan 2006'},{v:'5',t:'AHA 2004/2017'},{v:'6',t:'McCrindle 2007'},{v:'7',t:'Olivieri 2009'},{v:'8',t:'Dallaire 2011'}];
  const body=
    `<div class="calc-grid2">${num('kdzH','身高 (cm)','110','kdzRun()')}${num('kdzW','体重 (kg)','20','kdzRun()')}</div>
     <div class="calc-grid2">${sel('kdzSex','性别',sexOpts,'kdzRun()')}${sel('kdzMethod','计算方法',methodOpts,'kdzRun()')}</div>
     <div class="calc-note" style="margin:2px 0 6px">冠状动脉内径（mm，舒张末、内膜缘→内膜缘，至少填一项）。LMS 法按性别 + BSA 查表。</div>
     ${num('kdzRCA','Seg1 右冠脉 RCA (mm)','','kdzRun()')}
     ${num('kdzLMCA','Seg5 左主干 LMCA (mm)','','kdzRun()')}
     ${num('kdzLAD','Seg6 前降支 LAD (mm)','','kdzRun()')}
     ${num('kdzLCX','Seg11 回旋支 LCX (mm)','','kdzRun()')}
     ${out('kdzOut','<span class="muted">输入身高、体重、性别及冠脉内径后自动计算 Z 值</span>')}`;
  return card('川崎病 冠脉 Z 值（8 种方法）', body)+
    `<div class="calc-note">忠实移植自 cals.medlive.cn/calc/show/2?id=calc-1303。BSA 用 Haycock（0.024265×体重^0.5378×身高^0.3964）。8 种方法的回归系数与原网页逐一核对。
Z 值分类：Z&lt;2.0 正常；2.0–2.5 扩张；2.5–4.99 小动脉瘤；5.0–9.99 中型动脉瘤；≥10 巨大动脉瘤（AHA 2017）。
LMS 法显示该 BSA 下的中位数内径；其余方法仅给出 Z 值与分类（原网页亦如此）。仅作辅助评估，需结合超声技术与临床判断。</div>`;
}
function kdzRun(){
  const h=val('kdzH'),w=val('kdzW');const o=$('#kdzOut');
  if(!(h>0&&w>0)){o.innerHTML='<span class="muted">请输入身高与体重</span>';return;}
  const sx=sex('kdzSex')==='2'?2:1;
  const method=document.getElementById('kdzMethod').value||'6';
  const seg1=val('kdzRCA'),seg5=val('kdzLMCA'),seg6=val('kdzLAD'),seg11=val('kdzLCX');
  if(seg1<=0&&seg5<=0&&seg6<=0&&seg11<=0){o.innerHTML='<span class="muted">请至少填写一项冠脉内径（RCA / LMCA / LAD / LCX）</span>';return;}
  const r=kdzZ(sx,h,w,seg1,seg5,seg6,seg11,method);
  const segNames={seg1:'RCA 右冠脉',seg5:'LMCA 左主干',seg6:'LAD 前降支',seg11:'LCX 回旋支'};
  const segVal={seg1:seg1,seg5:seg5,seg6:seg6,seg11:seg11};
  let rows='';
  ['seg1','seg5','seg6','seg11'].forEach(k=>{
    const d=r[k]; if(!d) return;
    const z=d.z;
    const cls=z>=2.0?'warn':'';
    const txt=z<2.0?'正常':z<=2.5?'扩张':z<5?'小动脉瘤':z<10?'中型动脉瘤':'巨大动脉瘤';
    rows+=`<tr><td>${segNames[k]}</td><td>${segVal[k].toFixed(2)}</td><td>${d.mid!=null?d.mid.toFixed(2):'—'}</td><td><b style="color:var(--brand)">${z.toFixed(2)}</b></td><td><span class="chip ${cls}">${txt}</span></td></tr>`;
  });
  if(r.lmsOOR) rows+=`<tr><td colspan="5" style="color:var(--amber)">LMS 法：BSA 超出常模范围（0.139–3.37 m²），无法查表</td></tr>`;
  o.innerHTML=`<div style="font-size:13px;margin-bottom:6px">BSA = <b>${r.bsa.toFixed(2)}</b> m²（Haycock） · 方法：${kdzMethodName(method)}</div>
    <table class="kz"><tr><th>节段</th><th>实测(mm)</th><th>中位(mm)</th><th>Z 值</th><th>分类</th></tr>${rows}</table>`;
}

function meldRun(){let b=val('meldBili'),i=val('meldInr'),c=val('meldCr'),na=val('meldNa');const o=$('#meldOut');if(!(b>0&&i>0&&c>0)){o.innerHTML='<span class="muted">输入参数自动计算 MELD</span>';return;}b=b<1?1:b;c=c<1?1:c;const meld=3.78*Math.log(b)+11.2*Math.log(i)+9.57*Math.log(c)+6.43;let s=`MELD = <span class="big">${Math.round(meld)}</span>`;if(na>0){let n=na;n=n<125?125:n>137?137:n;const mn=meld+1.32*(137-n)-0.033*meld*(137-n);s+=` &nbsp;MELD-Na <span class="big">${Math.round(mn)}</span>`;}o.innerHTML=s;}

});

let state = { mod:'diseases', cat:'__ALL__', q:'', sel:-1 };

function esc(s){ s = String(s==null?'':s); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function recText(r){
  let out=[];
  (function walk(x){
    if(x==null) return;
    if(typeof x==='string'){ out.push(x); return; }
    if(Array.isArray(x)){ x.forEach(walk); return; }
    if(typeof x==='object'){ for(const k in x){ if(k==='py')continue; walk(x[k]); } }
  })(r);
  return out.join(' ').toLowerCase();
}
function catsOf(id){
  const s=new Set();
  DB[id].forEach(r=>{ if(r.category) s.add(r.category); });
  return [...s].sort();
}
function listOf(id){
  const q = state.q.trim().toLowerCase();
  let arr = DB[id];
  if(state.cat!=='__ALL__') arr = arr.filter(r=>r.category===state.cat);
  if(q){
    arr = arr.filter(r=> (r.py&&r.py.includes(q)) || recText(r).includes(q));
  }
  return arr;
}

function renderSide(){
  const el=document.getElementById('side');
  el.innerHTML = MODULES.map(m=>{
    const n = (m.id==='calc') ? (typeof CALCS!=='undefined'?CALCS.length:0) : (DB[m.id]?DB[m.id].length:0);
    return '<div class="mi'+(m.id===state.mod?' active':'')+'" data-mod="'+m.id+'">'
      +'<span class="ic">'+m.icon+'</span><span>'+m.label+'</span><span class="ct">'+n+'</span></div>';
  }).join('');
  el.querySelectorAll('.mi').forEach(d=>d.onclick=()=>{ state.mod=d.dataset.mod; state.cat='__ALL__'; state.q=''; state.sel=-1;
    document.getElementById('q').value=''; renderSide(); renderChips(); renderList(); renderDetail(); });
}
function renderChips(){
  const el=document.getElementById('chips');
  const cats = catsOf(state.mod);
  let html = '<span class="chip'+(state.cat==='__ALL__'?' active':'')+'" data-c="__ALL__">全部</span>';
  html += cats.map(c=>'<span class="chip'+(state.cat===c?' active':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</span>').join('');
  el.innerHTML = html;
  el.querySelectorAll('.chip').forEach(d=>d.onclick=()=>{ state.cat=d.dataset.c; state.sel=-1; renderChips(); renderList(); renderDetail(); });
}
function renderList(){
  if(state.mod==='calc'){ renderCalcList(); return; }
  const el=document.getElementById('list');
  const arr = listOf(state.mod);
  document.getElementById('cnt').textContent = '共 '+arr.length+' 条';
  if(!arr.length){ el.innerHTML='<div class="empty">无匹配结果</div>'; return; }
  el.innerHTML = arr.map((r,i)=>'<div class="item'+(i===state.sel?' active':'')+'" data-i="'+i+'">'
    +'<div class="n">'+esc(r.name)+'</div>'
    +(subText(r)?'<div class="s">'+esc(subText(r))+'</div>':'')+'</div>').join('');
  el.querySelectorAll('.item').forEach(d=>d.onclick=()=>{ state.sel=+d.dataset.i; renderList();
    document.getElementById('dbody').innerHTML = RENDER[state.mod](arr[state.sel]); openDetail(); window.scrollTo(0,0); });
}
function renderDetail(){
  if(state.mod==='calc'){ renderCalcDetail(); return; }
  const el=document.getElementById('dbody');
  const arr = listOf(state.mod);
  if(state.sel<0 || !arr[state.sel]){ el.innerHTML='<div class="empty">请选择左侧模块与条目</div>'; closeDetail(); return; }
  el.innerHTML = RENDER[state.mod](arr[state.sel]); openDetail();
}
/* ---------- section helpers ---------- */
function listHTML(v){ const a=asArr(v); if(!a.length) return '<p class="muted">—</p>';
  return '<ul>'+a.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>'; }
function preHTML(v){ if(v==null||v===''||(Array.isArray(v)&&!v.length)) return '<p class="muted">—</p>';
  return '<pre>'+esc(Array.isArray(v)?v.join('\n'):v)+'</pre>'; }
function asArr(v){ if(Array.isArray(v)) return v.map(String); if(typeof v==='string') return v.split('\n').map(s=>s.trim()).filter(Boolean); return []; }
function sec(t,f,r,mode){ const v=r[f]; if(mode==='list') return '<div class="sec"><div class="sec-t">'+t+'</div>'+listHTML(v)+'</div>';
  return '<div class="sec"><div class="sec-t">'+t+'</div>'+preHTML(v)+'</div>'; }
function templateCasesHTML(cases){
  if(!Array.isArray(cases) || !cases.length) return '<p class="muted">—</p>';
  return cases.map((c, ci)=>{
    const tpls = c.templates || {};
    const keys = Object.keys(tpls);
    return '<div class="case">'+
      '<div class="case-name">'+esc(c.case_name||('病例'+(ci+1)))+'</div>'+
      keys.map((k, ti)=>{
        const id = 'tpl-'+ci+'-'+ti;
        return '<div class="tpl-block">'+
          '<div class="tpl-name">'+esc(k)+'<button class="cp-mini" onclick="copyPreText(\''+id+'\')">复制</button></div>'+
          '<pre id="'+id+'">'+esc(tpls[k])+'</pre>'+
        '</div>';
      }).join('')+
    '</div>';
  }).join('');
}
function header(r,sub){ return '<div class="dheader"><div><div class="dtitle">'+esc(r.name)+'</div>'
  +(sub?'<div class="badge">'+esc(sub)+'</div>':'')+'</div>'
  +'<button class="copybtn" onclick="copyDetail()">复制全文</button></div>'; }

/* ---------- per-module renderers ---------- */
const RENDER = {
  diseases: r=> header(r,r.category)
    + (r.summary?'<div class="summary">'+esc(r.summary)+'</div>':'')
    + sec('临床表现','symptoms',r,'list') + sec('诊断要点','diagnosis',r,'list')
    + sec('静脉用药','infusion',r,'list') + sec('口服用药','oral_medication',r,'list')
    + sec('治疗原则','treatment',r,'list') + sec('护理要点','management',r,'list')
    + sec('注意事项','notes',r,'list') + sec('急诊指征','emergency',r,'list'),
  drugs: r=> header(r, r.category+(r.spec?' · '+r.spec:''))
    + sec('适应证','indication',r,'pre') + sec('用法用量','dose',r,'pre')
    + sec('不良反应','adverse',r,'pre') + sec('禁忌','contraindication',r,'pre')
    + sec('相互作用','interaction',r,'pre') + sec('药理作用','pharmacology',r,'pre')
    + sec('药代动力学','pharmacokinetics',r,'pre') + sec('特殊人群','special_population',r,'pre')
    + sec('注意事项','notes',r,'pre'),
  labs: r=> header(r, r.category+(r.abbr?' · '+r.abbr:''))
    + '<div class="sec"><div class="sec-t">参考范围</div><pre>'+esc((r.normal||'')+(r.unit?' '+r.unit:''))+'</pre></div>'
    + sec('升高意义','high',r,'pre') + sec('降低意义','low',r,'pre')
    + sec('下一步处理','next_step',r,'pre') + sec('备注','notes',r,'pre'),
  symptoms: r=> header(r,r.category)
    + sec('常见病因','common_causes',r,'pre') + sec('鉴别诊断','differential',r,'pre')
    + sec('危险信号','red_flags',r,'pre') + sec('推荐检查','recommended_tests',r,'pre')
    + sec('处理原则','treatment',r,'pre'),
  procedures: r=> header(r,r.category)
    + sec('适应证','indication',r,'pre') + sec('禁忌','contraindication',r,'pre')
    + sec('操作步骤','steps',r,'list') + sec('注意事项','notes',r,'pre')
    + sec('并发症','complications',r,'pre'),
  documents: r=> header(r,r.category) + '<div class="sec"><div class="sec-t">文档内容</div>'+preHTML(r.content)+'</div>',
  templates: r=> header(r,r.category) + '<div class="sec"><div class="sec-t">病例与模板</div>'+templateCasesHTML(r.cases)+'</div>',
  guidelines: r=> header(r,r.category)
    + sec('适用范围','scope',r,'pre') + sec('诊断','diagnosis',r,'pre') + sec('分期 / 分级','staging',r,'pre')
    + sec('关键点','key_points',r,'pre') + sec('药物推荐','drug_recommendations',r,'pre')
    + sec('非药物治疗','non_pharmacological',r,'pre') + sec('并发症','complications',r,'pre')
    + sec('监测','monitoring',r,'pre') + sec('特殊人群','special_populations',r,'pre')
    + sec('参考文献','references',r,'pre')
};
/* ---------- copy ---------- */
function copyDetail(){
  const html = document.getElementById('dbody').innerText;
  copyText(html);
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>fallback(t));
  } else fallback(t);
}
function copyPreText(id){
  const el = document.getElementById(id);
  copyText(el ? el.innerText : '');
}
function fallback(t){
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败'); }
  document.body.removeChild(ta);
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }
/* ---------- detail open/close (mobile fullscreen) ---------- */
function openDetail(){ const d=document.getElementById('detail'), l=document.getElementById('list'); if(d)d.classList.add('open'); if(l)l.classList.add('dim'); }
function closeDetail(){ const d=document.getElementById('detail'), l=document.getElementById('list'); if(d)d.classList.remove('open'); if(l)l.classList.remove('dim'); }
/* ---------- global search ---------- */
const gs = document.getElementById('gs'); const gsbox=document.getElementById('gsbox');
gs.oninput = ()=>{
  const q=gs.value.trim().toLowerCase();
  if(!q){ gsbox.classList.remove('show'); return; }
  let res=[];
  MODULES.forEach(m=>{ DB[m.id].forEach(r=>{
    if((r.py&&r.py.includes(q))||recText(r).includes(q)) res.push({m, r});
  }); });
  res=res.slice(0,60);
  gsbox.innerHTML = res.length? res.map((x,i)=>'<div class="gsitem" data-i="'+i+'"><span class="m">'+x.m.label+'</span><span class="t">'+esc(x.r.name)+'</span></div>').join('')
    : '<div class="gsitem">无匹配</div>';
  gsbox.classList.add('show');
  gsbox.querySelectorAll('.gsitem').forEach(d=>d.onclick=()=>{
    const i=+d.dataset.i; state.mod=res[i].m.id; state.cat='__ALL__'; state.q='';
    document.getElementById('q').value=''; gs.value=''; gsbox.classList.remove('show');
    renderSide(); renderChips(); const arr=listOf(state.mod);
    const idx=arr.findIndex(r=>r===res[i].r); state.sel=idx<0?0:idx;
    renderList(); renderDetail(); openDetail();
  });
};
document.addEventListener('click',e=>{ if(!e.target.closest('.gswrap')) gsbox.classList.remove('show'); });
document.getElementById('q').oninput = e=>{ state.q=e.target.value; state.sel=-1; renderList(); renderDetail(); };
/* ---------- init ---------- */
renderSide(); renderChips(); renderList(); renderDetail();
</script>
</body>
